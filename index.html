  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function randomFloat(min, max, decimals = 2) {
    return parseFloat((Math.random() * (max - min) + min).toFixed(decimals));
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + '亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + '万';
    return amount.toLocaleString();
  }

  // ═══════════════════════════════════════════════
  // 初始化与每日更新
  // ═══════════════════════════════════════════════

  /**
   * 基于子公司当前数据生成历史数据
   * @param {Object} subsidiary - 子公司当前数据
   * @param {string} endDate - 结束日期（游戏当前日期）
   * @param {number} historyDays - 生成多少天历史
   * @returns {Array} 历史数据数组（最新的在前）
   */
  function generateSubsidiaryHistory(subsidiary, endDate, historyDays = 30) {
    const baseDate = endDate || new Date().toISOString().split('T')[0];
    const history = [];

    let revenue = subsidiary.revenue * randomFloat(0.92, 0.98);
    let profit = subsidiary.profit * randomFloat(0.9, 0.97);
    let satisfaction = subsidiary.satisfaction + randomInt(-5, 3);
    let reputation = subsidiary.reputation + randomInt(-3, 2);
    let employees = Math.max(1, subsidiary.employees + randomInt(-15, 5));

    for (let i = historyDays; i >= 0; i--) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];

      const revenueDrift = (subsidiary.revenue - revenue) * 0.08;
      const profitDrift = (subsidiary.profit - profit) * 0.08;
      const satisfactionDrift = (subsidiary.satisfaction - satisfaction) * 0.1;
      const reputationDrift = (subsidiary.reputation - reputation) * 0.1;
      const employeeDrift = (subsidiary.employees - employees) * 0.05;

      revenue = revenue + revenueDrift + revenue * randomFloat(-0.015, 0.015);
      profit = profit + profitDrift + profit * randomFloat(-0.025, 0.025);
      satisfaction = clamp(satisfaction + satisfactionDrift + randomFloat(-1, 1), 0, 100);
      reputation = clamp(reputation + reputationDrift + randomFloat(-0.8, 0.8), 0, 100);
      employees = Math.max(1, Math.round(employees + employeeDrift + randomInt(-3, 3)));

      if (i === 0) {
        revenue = subsidiary.revenue;
        profit = subsidiary.profit;
        satisfaction = subsidiary.satisfaction;
        reputation = subsidiary.reputation;
        employees = subsidiary.employees;
      }

      history.push({
        date: dateStr,
        revenue: Math.round(revenue),
        profit: Math.round(profit),
        employees: employees,
        satisfaction: Math.round(satisfaction),
        reputation: Math.round(reputation)
      });
    }

    return history.reverse(); // 最新的在前
  }

  /**
   * 初始化子公司数据
   * @param {string} startDate - 游戏起始日期 (YYYY-MM-DD)，默认为今天
   * @param {number} historyDays - 生成多少天的历史数据，默认30天
   */
  function initSubsidiaries(startDate, historyDays = 30) {
    const baseDate = startDate || new Date().toISOString().split('T')[0];

    return DEFAULT_SUBSIDIARIES.map(s => {
      const history = generateSubsidiaryHistory(s, baseDate, historyDays);

      return {
        ...s,
        lastUpdated: new Date().toISOString(),
        history: history
      };
    });
  }

  /**
   * 每日更新子公司经营数据
   * @param {Array} subsidiaries - 当前子公司列表
   * @param {Object} gameState - 当前游戏状态
   * @returns {Array} 更新后的子公司列表
   */
  function updateSubsidiariesDaily(subsidiaries, gameState) {
    const today = gameState.gameDate?.current || new Date().toISOString().split('T')[0];
    const heirAbilities = gameState.heir?.abilities || {};
    const activeEffects = gameState.events?.activeEffects || [];

    return subsidiaries.map(sub => {
      // 慈善基金不参与经营波动
      if (sub.type === '公益') {
        return { ...sub, lastUpdated: new Date().toISOString() };
      }

      // 基础增长率（带随机波动）
      let revenueChange = randomFloat(-3, 5);
      let profitChange = randomFloat(-5, 8);
      let satisfactionChange = randomFloat(-2, 2);
      let reputationChange = randomFloat(-1.5, 1.5);

      // 继承人能力影响
      if (heirAbilities.business) {
        revenueChange += (heirAbilities.business - 50) * 0.05;
        profitChange += (heirAbilities.business - 50) * 0.08;
      }
      if (heirAbilities.employeeTrust) {
        satisfactionChange += (heirAbilities.employeeTrust - 50) * 0.03;
      }
      if (heirAbilities.reputation) {
        reputationChange += (heirAbilities.reputation - 50) * 0.02;
      }

      // 子公司自身属性影响
      if (sub.potential === 'high') {
        revenueChange += 1;
        profitChange += 0.5;
      }
      if (sub.risk === 'high') {
        revenueChange += randomFloat(-5, 5);
        profitChange += randomFloat(-8, 8);
      }

      // ═══════════════════════════════════════════
      // 决策效果影响（核心闭环：决策→效果→子公司数据）
      // ═══════════════════════════════════════════
      if (activeEffects.length > 0 && typeof SongEffects !== 'undefined') {
        const modifiers = SongEffects.getSubsidiaryModifiers(activeEffects, sub.id);
        revenueChange += modifiers.revenue || 0;
        profitChange += modifiers.profit || 0;
        satisfactionChange += modifiers.satisfaction || 0;
        reputationChange += modifiers.reputation || 0;
        revenueChange += modifiers.growth || 0;
      }

      // ═══════════════════════════════════════════
      // 集团协同效应与风险传染（子公司联动）
      // ═══════════════════════════════════════════
      if (typeof SongSynergy !== 'undefined') {
        const synergy = SongSynergy.calculateTotalSynergy(sub, subsidiaries);
        revenueChange += synergy.revenue;
        profitChange += synergy.profit;
        satisfactionChange += synergy.satisfaction;
        reputationChange += synergy.reputation;
      }

      // 计算新值
      const newRevenue = Math.max(0, sub.revenue * (1 + revenueChange / 100));
      const newProfit = newRevenue * (sub.profitMargin / 100) * (1 + profitChange / 100);
      const newProfitMargin = newRevenue > 0 ? (newProfit / newRevenue) * 100 : 0;
      const newSatisfaction = clamp(sub.satisfaction + satisfactionChange, 0, 100);
      const newReputation = clamp(sub.reputation + reputationChange, 0, 100);

      // 员工数量小幅波动
      let employeeChange = 0;
      if (revenueChange > 2) employeeChange = randomInt(1, 10);
      else if (revenueChange < -2) employeeChange = -randomInt(1, 8);

      const newEmployees = Math.max(0, sub.employees + employeeChange);

      // 更新历史记录（保留最近30条）
      const newHistory = [
        {
          date: today,
          revenue: Math.round(newRevenue),
          profit: Math.round(newProfit),
          employees: newEmployees,
          satisfaction: Math.round(newSatisfaction),
          reputation: Math.round(newReputation)
        },
        ...(sub.history || [])
      ].slice(0, 30);

      return {
        ...sub,
        revenue: Math.round(newRevenue),
        profit: Math.round(newProfit),
        profitMargin: parseFloat(newProfitMargin.toFixed(1)),
        employees: newEmployees,
        satisfaction: Math.round(newSatisfaction),
        reputation: Math.round(newReputation),
        growthRate: parseFloat(revenueChange.toFixed(1)),
        lastUpdated: new Date().toISOString(),
        history: newHistory
      };
    });
  }

  /**
   * 计算集团整体财务数据
   * @param {Array} subsidiaries - 子公司列表
   * @param {Object} previousState - 之前的公司状态
   * @returns {Object} 集团财务数据
   */
  function calculateGroupFinancials(subsidiaries, previousState = {}) {
    const totalRevenue = subsidiaries.reduce((sum, s) => sum + (s.revenue || 0), 0);
    const totalProfit = subsidiaries.reduce((sum, s) => sum + (s.profit || 0), 0);
    const totalEmployees = subsidiaries.reduce((sum, s) => sum + (s.employees || 0), 0);
    const avgSatisfaction = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.satisfaction || 0), 0) / subsidiaries.length)
      : 0;
    const avgReputation = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.reputation || 0), 0) / subsidiaries.length)
      : 0;

    // 总资产 = 之前总资产 + 利润（简化计算）
    const previousTotalAssets = previousState.totalAssets || 5000000000;
    const previousCashFlow = previousState.cashFlow || 800000000;

    // 每日净收益 = 总利润 / 365（简化）
    const dailyNet = Math.round(totalProfit / 365);
    const dailyRevenue = Math.round(totalRevenue / 365);
    const dailyExpense = dailyRevenue - dailyNet;

    const newCashFlow = Math.max(0, previousCashFlow + dailyNet);
    const newTotalAssets = previousTotalAssets + dailyNet;

    return {
      totalAssets: Math.round(newTotalAssets),
      cashFlow: Math.round(newCashFlow),
      totalRevenue: Math.round(totalRevenue),
      totalProfit: Math.round(totalProfit),
      totalEmployees,
      avgSatisfaction,
      avgReputation,
      dailyRevenue,
      dailyExpense,
      dailyNet,
      profitMargin: totalRevenue > 0 ? parseFloat(((totalProfit / totalRevenue) * 100).toFixed(1)) : 0,
      marketIndex: calculateMarketIndex(subsidiaries, previousState)
    };
  }

  /**
   * 计算松氏市场指数
   */
  function calculateMarketIndex(subsidiaries, previousState) {
    const baseIndex = 1000;
    const previousIndex = previousState.marketIndex || baseIndex;

    // 基于子公司整体表现计算指数变化
    const avgGrowth = subsidiaries.length > 0
      ? subsidiaries.reduce((sum, s) => sum + (s.growthRate || 0), 0) / subsidiaries.length
      : 0;

    // 加入随机波动
    const randomFactor = randomFloat(-0.5, 0.5);
    const change = avgGrowth * 0.3 + randomFactor;

    return parseFloat((previousIndex + change).toFixed(2));
  }

  /**
   * 执行每日财务结算
   * @param {Object} gameState - 当前游戏状态
   * @returns {Object} 更新后的状态
   */
  function dailySettlement(gameState) {
    let subsidiaries = gameState.subsidiaries || [];

    // 如果没有子公司数据，初始化
    if (subsidiaries.length === 0) {
      subsidiaries = initSubsidiaries();
    } else {
      // 每日更新子公司数据
      subsidiaries = updateSubsidiariesDaily(subsidiaries, gameState);
    }

    // 计算集团财务
    const groupFinancials = calculateGroupFinancials(subsidiaries, gameState.company || {});

    // 第四阶段：生成财务三表（传入上一期数据用于勾稽）
    const previousFinancials = gameState.company?.financialStatements || null;
    const financialStatements = generateGroupFinancials(subsidiaries, { ...gameState.company, ...groupFinancials }, previousFinancials);

    // 第四阶段：资产配置分析
    const assetAllocation = analyzeAssetAllocation(
      subsidiaries,
      { ...gameState.company, ...groupFinancials },
      gameState.investments?.portfolio || [],
      gameState.investments?.fundPortfolio || [],
      gameState.stockMarket?.stocks || [],
      gameState.funds || []
    );

    return {
      subsidiaries,
      company: {
        ...gameState.company,
        ...groupFinancials,
        financialStatements,
        assetAllocation
      }
    };
  }

  /**
   * 获取子公司详情
   */
  function getSubsidiaryDetail(subsidiaries, id) {
    return subsidiaries.find(s => s.id === id);
  }

  /**
   * 获取子公司趋势数据
   */
  function getSubsidiaryTrend(subsidiary, days = 7) {
    const history = subsidiary.history || [];
    return history.slice(0, days).reverse();
  }

  /**
   * 格式化财务数据用于展示
   */
  function formatFinancialData(data) {
    return {
      totalAssets: formatMoney(data.totalAssets),
      cashFlow: formatMoney(data.cashFlow),
      totalRevenue: formatMoney(data.totalRevenue),
      totalProfit: formatMoney(data.totalProfit),
      dailyRevenue: formatMoney(data.dailyRevenue),
      dailyExpense: formatMoney(data.dailyExpense),
      dailyNet: formatMoney(data.dailyNet),
      profitMargin: data.profitMargin + '%',
      marketIndex: data.marketIndex?.toFixed(2)
    };
  }

  // ═══════════════════════════════════════════════
  // 第四阶段：财务三表与资产配置
  // ═══════════════════════════════════════════════

  // 行业成本率/费用率参考
  const INDUSTRY_RATES = {
    '金融':   { costRate: 0.30, salesRate: 0.05, adminRate: 0.08, rdRate: 0.00, financialRate: 0.10 },
    '科技':   { costRate: 0.40, salesRate: 0.10, adminRate: 0.06, rdRate: 0.12, financialRate: 0.02 },
    '地产':   { costRate: 0.55, salesRate: 0.04, adminRate: 0.05, rdRate: 0.00, financialRate: 0.08 },
    '奢侈品': { costRate: 0.25, salesRate: 0.20, adminRate: 0.06, rdRate: 0.02, financialRate: 0.01 },
    '公益':   { costRate: 0.00, salesRate: 0.00, adminRate: 0.10, rdRate: 0.00, financialRate: 0.00 },
    '投资':   { costRate: 0.50, salesRate: 0.05, adminRate: 0.08, rdRate: 0.00, financialRate: 0.05 }
  };

  function getIndustryRates(type) {
    return INDUSTRY_RATES[type] || INDUSTRY_RATES['投资'];
  }

  /**
   * 生成利润表（Income Statement）
   */
  function generateIncomeStatement(subsidiaries) {
    const validSubs = (subsidiaries || []).filter(s => s.type !== '公益');
    const totalRevenue = validSubs.reduce((sum, s) => sum + (s.revenue || 0), 0);
    const totalProfit = validSubs.reduce((sum, s) => sum + (s.profit || 0), 0);

    let totalCost = 0, totalSales = 0, totalAdmin = 0, totalRD = 0, totalFinancial = 0;
    validSubs.forEach(sub => {
      const rates = getIndustryRates(sub.type);
      totalCost += sub.revenue * rates.costRate;
      totalSales += sub.revenue * rates.salesRate;
      totalAdmin += sub.revenue * rates.adminRate;
      totalRD += sub.revenue * rates.rdRate;
      totalFinancial += sub.revenue * rates.financialRate;
    });

    const grossProfit = totalRevenue - totalCost;
    const operatingProfit = grossProfit - totalSales - totalAdmin - totalRD - totalFinancial;
    const nonOperatingIncome = totalProfit - operatingProfit;
    const tax = totalProfit > 0 ? totalProfit * 0.25 : 0;
    const netProfit = totalProfit - tax;

    return {
      revenue: Math.round(totalRevenue),
      cost: Math.round(totalCost),
      grossProfit: Math.round(grossProfit),
      grossMargin: totalRevenue > 0 ? parseFloat(((grossProfit / totalRevenue) * 100).toFixed(1)) : 0,
      salesExpense: Math.round(totalSales),
      adminExpense: Math.round(totalAdmin),
      rdExpense: Math.round(totalRD),
      financialExpense: Math.round(totalFinancial),
      operatingProfit: Math.round(operatingProfit),
      nonOperatingIncome: Math.round(nonOperatingIncome),
      totalProfit: Math.round(totalProfit),
      tax: Math.round(tax),
      netProfit: Math.round(netProfit),
      netMargin: totalRevenue > 0 ? parseFloat(((netProfit / totalRevenue) * 100).toFixed(1)) : 0,
      eps: netProfit / 100000000 // 简化：每股收益（亿股）
    };
  }

  /**
   * 生成资产负债表（Balance Sheet）
   * 建立勾稽关系：未分配利润变动 = 净利润 - 分红
   * @param {Array} subsidiaries - 子公司列表
   * @param {Object} company - 公司财务数据
   * @param {Object} incomeStatement - 利润表（用于勾稽）
   * @param {Object} previousBalanceSheet - 上一期资产负债表（期初数）
   */
  function generateBalanceSheet(subsidiaries, company, incomeStatement, previousBalanceSheet) {
    const totalAssets = company?.totalAssets || 5000000000;
    const cashFlow = company?.cashFlow || 800000000;
    const validSubs = (subsidiaries || []).filter(s => s.type !== '公益');
    const totalRevenue = validSubs.reduce((sum, s) => sum + (s.revenue || 0), 0);
    const netProfit = incomeStatement?.netProfit || 0;
    const dividendPaid = Math.round(netProfit * 0.3); // 分红率30%

    // 资产端
    // 现金：如果有期初数，期末现金 = 期初现金 + 现金流量表净变动（后续在现金流表中计算）
    // 这里先用 cashFlow，后续在 generateGroupFinancials 中调整
    let cash = cashFlow;
    if (previousBalanceSheet && previousBalanceSheet.cash !== undefined) {
      // 有期初数时，现金变动由现金流量表决定，这里先占位，后续调整
      cash = previousBalanceSheet.cash; // 先设为期初，后续加净变动
    }

    const accountsReceivable = Math.round(totalRevenue * 0.15);
    const inventory = Math.round(totalRevenue * 0.10);
    const currentAssets = cash + accountsReceivable + inventory;

    // 固定资产：原值 - 累计折旧 = 净值
    const fixedAssetsNet = Math.round(totalAssets * 0.35);
    const fixedAssetsGross = Math.round(fixedAssetsNet * 1.4); // 假设累计折旧占原值约28.6%
    const accumulatedDepreciation = fixedAssetsGross - fixedAssetsNet;

    // 无形资产：原值 - 累计摊销 = 净值
    const intangibleAssetsNet = Math.round(totalAssets * 0.10);
    const intangibleAssetsGross = Math.round(intangibleAssetsNet * 1.2);
    const accumulatedAmortization = intangibleAssetsGross - intangibleAssetsNet;

    const longTermInvestment = Math.round(totalAssets * 0.25);
    const nonCurrentAssets = fixedAssetsNet + intangibleAssetsNet + longTermInvestment;

    const totalAssetsCalc = currentAssets + nonCurrentAssets;

    // 负债端
    const accountsPayable = Math.round(totalRevenue * 0.12);
    const shortTermLoan = Math.round(totalAssets * 0.08);
    const currentLiabilities = accountsPayable + shortTermLoan;

    const longTermLoan = Math.round(totalAssets * 0.15);
    const bondsPayable = Math.round(totalAssets * 0.05);
    const nonCurrentLiabilities = longTermLoan + bondsPayable;

    const totalLiabilities = currentLiabilities + nonCurrentLiabilities;

    // 所有者权益
    const paidInCapital = Math.round(totalAssets * 0.30);
    const capitalReserve = Math.round(totalAssets * 0.05);
    const surplusReserve = Math.round(totalAssets * 0.03);

    // 未分配利润：建立勾稽关系
    let undistributedProfit;
    if (previousBalanceSheet && previousBalanceSheet.undistributedProfit !== undefined) {
      // 有期初数：期末未分配利润 = 期初未分配利润 + 本期净利润 - 分红
      undistributedProfit = previousBalanceSheet.undistributedProfit + netProfit - dividendPaid;
    } else {
      // 没有期初数（新游戏/旧存档）：倒挤方式，确保资产负债表平衡
      undistributedProfit = totalAssetsCalc - totalLiabilities - paidInCapital - capitalReserve - surplusReserve;
    }

    const totalEquity = paidInCapital + capitalReserve + surplusReserve + undistributedProfit;

    // 会计恒等式验证
    const balanceCheck = Math.abs(totalAssetsCalc - totalLiabilities - totalEquity) < 10000;

    return {
      // 资产
      cash: Math.round(cash),
      accountsReceivable,
      inventory,
      currentAssets: Math.round(currentAssets),
      // 固定资产（净值+原值+累计折旧）
      fixedAssets: fixedAssetsNet, // 兼容旧字段
      fixedAssetsNet,
      fixedAssetsGross,
      accumulatedDepreciation,
      // 无形资产（净值+原值+累计摊销）
      intangibleAssets: intangibleAssetsNet, // 兼容旧字段
      intangibleAssetsNet,
      intangibleAssetsGross,
      accumulatedAmortization,
      longTermInvestment,
      nonCurrentAssets: Math.round(nonCurrentAssets),
      totalAssets: Math.round(totalAssetsCalc),
      // 负债
      accountsPayable,
      shortTermLoan,
      currentLiabilities: Math.round(currentLiabilities),
      longTermLoan,
      bondsPayable,
      nonCurrentLiabilities: Math.round(nonCurrentLiabilities),
      totalLiabilities: Math.round(totalLiabilities),
      // 权益
      paidInCapital,
      capitalReserve,
      surplusReserve,
      undistributedProfit: Math.round(undistributedProfit),
      totalEquity: Math.round(totalEquity),
      // 验证
      balanceCheck,
      // 分红（用于勾稽）
      dividendPaid,
      // 期初数（用于对比）
      previousCash: previousBalanceSheet?.cash,
      previousUndistributedProfit: previousBalanceSheet?.undistributedProfit,
      // 关键比率
      debtRatio: totalAssetsCalc > 0 ? parseFloat(((totalLiabilities / totalAssetsCalc) * 100).toFixed(1)) : 0,
      currentRatio: currentLiabilities > 0 ? parseFloat((currentAssets / currentLiabilities).toFixed(2)) : 0,
      equityRatio: totalAssetsCalc > 0 ? parseFloat(((totalEquity / totalAssetsCalc) * 100).toFixed(1)) : 0
    };
  }

  /**
   * 生成现金流量表（Cash Flow Statement）
   * 建立勾稽关系：现金净变动 = 期末现金 - 期初现金
   * @param {Array} subsidiaries - 子公司列表
   * @param {Object} company - 公司财务数据
   * @param {Object} incomeStatement - 利润表
   * @param {Object} previousBalanceSheet - 上一期资产负债表（期初数）
   */
  function generateCashFlowStatement(subsidiaries, company, incomeStatement, previousBalanceSheet) {
    const validSubs = (subsidiaries || []).filter(s => s.type !== '公益');
    const totalRevenue = validSubs.reduce((sum, s) => sum + (s.revenue || 0), 0);
    const netProfit = incomeStatement?.netProfit || 0;
    const totalAssets = company?.totalAssets || 5000000000;
    const dividendPaid = Math.round(netProfit * 0.3); // 分红率30%，与资产负债表一致

    // 经营活动现金流
    const depreciation = Math.round(totalAssets * 0.03);
    const amortization = Math.round(totalAssets * 0.01);
    // 营运资本变动：基于应收、应付、存货的变动（简化为随机波动）
    const workingCapitalChange = Math.round(totalRevenue * 0.03 * (Math.random() > 0.5 ? 1 : -1));
    const operatingCashFlow = netProfit + depreciation + amortization - workingCapitalChange;

    // 投资活动现金流
    const capitalExpenditure = Math.round(totalAssets * 0.04);
    const investmentIncome = Math.round(totalRevenue * 0.02);
    const investingCashFlow = investmentIncome - capitalExpenditure;

    // 筹资活动现金流
    const newBorrowing = Math.round(totalAssets * 0.02 * (Math.random() > 0.5 ? 1 : -1));
    const financingCashFlow = newBorrowing - dividendPaid;

    const netCashChange = operatingCashFlow + investingCashFlow + financingCashFlow;

    return {
      // 经营活动
      netProfit: Math.round(netProfit),
      depreciation,
      amortization,
      workingCapitalChange,
      operatingCashFlow: Math.round(operatingCashFlow),
      // 投资活动
      capitalExpenditure,
      investmentIncome,
      investingCashFlow: Math.round(investingCashFlow),
      // 筹资活动
      newBorrowing,
      dividendPaid,
      financingCashFlow: Math.round(financingCashFlow),
      // 汇总
      netCashChange: Math.round(netCashChange),
      // 期初现金（用于勾稽）
      beginningCash: previousBalanceSheet?.cash,
      // 期末现金（用于勾稽）
      endingCash: previousBalanceSheet?.cash !== undefined ? previousBalanceSheet.cash + netCashChange : undefined,
      // 盈利质量
      cashToProfitRatio: netProfit > 0 ? parseFloat((operatingCashFlow / netProfit).toFixed(2)) : 0
    };
  }

  /**
   * 计算关键财务比率
   */
  function calculateFinancialRatios(incomeStatement, balanceSheet, cashFlowStatement) {
    const revenue = incomeStatement?.revenue || 1;
    const cost = incomeStatement?.cost || 1;
    const netProfit = incomeStatement?.netProfit || 0;
    const totalAssets = balanceSheet?.totalAssets || 1;
    const totalEquity = balanceSheet?.totalEquity || 1;
    const currentAssets = balanceSheet?.currentAssets || 0;
    const currentLiabilities = balanceSheet?.currentLiabilities || 1;
    const totalLiabilities = balanceSheet?.totalLiabilities || 0;
    const operatingCashFlow = cashFlowStatement?.operatingCashFlow || 0;
    const accountsReceivable = balanceSheet?.accountsReceivable || 0;
    const accountsPayable = balanceSheet?.accountsPayable || 0;
    const inventory = balanceSheet?.inventory || 0;

    // 营运资本周转指标
    const dso = revenue > 0 ? parseFloat(((accountsReceivable / revenue) * 365).toFixed(1)) : 0; // 应收账款周转天数
    const dpo = revenue > 0 ? parseFloat(((accountsPayable / revenue) * 365).toFixed(1)) : 0; // 应付账款周转天数
    const inventoryDays = cost > 0 ? parseFloat(((inventory / cost) * 365).toFixed(1)) : 0; // 存货周转天数
    const cashConversionCycle = parseFloat((dso + inventoryDays - dpo).toFixed(1)); // 现金转换周期
    const workingCapital = currentAssets - currentLiabilities; // 营运资本
    const workingCapitalTurnover = workingCapital > 0 ? parseFloat((revenue / workingCapital).toFixed(2)) : 0; // 营运资本周转率

    return {
      // 盈利能力
      roe: totalEquity > 0 ? parseFloat(((netProfit / totalEquity) * 100).toFixed(2)) : 0,
      roa: totalAssets > 0 ? parseFloat(((netProfit / totalAssets) * 100).toFixed(2)) : 0,
      grossMargin: incomeStatement?.grossMargin || 0,
      netMargin: incomeStatement?.netMargin || 0,
      // 偿债能力
      debtRatio: balanceSheet?.debtRatio || 0,
      currentRatio: balanceSheet?.currentRatio || 0,
      quickRatio: currentLiabilities > 0 ? parseFloat(((currentAssets - inventory) / currentLiabilities).toFixed(2)) : 0, // 速动比率
      equityRatio: balanceSheet?.equityRatio || 0,
      // 营运能力
      assetTurnover: totalAssets > 0 ? parseFloat((revenue / totalAssets).toFixed(2)) : 0,
      receivablesTurnover: accountsReceivable > 0 ? parseFloat((revenue / accountsReceivable).toFixed(2)) : 0, // 应收账款周转率
      inventoryTurnover: inventory > 0 ? parseFloat((cost / inventory).toFixed(2)) : 0, // 存货周转率
      dso,
      dpo,
      inventoryDays,
      cashConversionCycle,
      workingCapital,
      workingCapitalTurnover,
      // 现金流
      cashToProfitRatio: cashFlowStatement?.cashToProfitRatio || 0,
      operatingCashFlow
    };
  }

  /**
   * 财务三表勾稽校验
   * 校验资产负债表、利润表、现金流量表之间的勾稽关系
   * @param {Object} incomeStatement - 利润表
   * @param {Object} balanceSheet - 资产负债表
   * @param {Object} cashFlowStatement - 现金流量表
   * @param {Object} previousBalanceSheet - 上一期资产负债表（期初数）
   * @returns {Object} 校验结果
   */
  function validateFinancialStatements(incomeStatement, balanceSheet, cashFlowStatement, previousBalanceSheet) {
    const results = {
      pass: true,
      checks: [],
      warnings: []
    };

    // 校验1：会计恒等式 资产 = 负债 + 所有者权益
    const balanceDiff = Math.abs(balanceSheet.totalAssets - balanceSheet.totalLiabilities - balanceSheet.totalEquity);
    const balancePass = balanceDiff < 10000; // 允许1万元以内的四舍五入误差
    results.checks.push({
      name: '会计恒等式（资产=负债+权益）',
      pass: balancePass,
      diff: balanceDiff,
      formula: `${formatMoney(balanceSheet.totalAssets)} = ${formatMoney(balanceSheet.totalLiabilities)} + ${formatMoney(balanceSheet.totalEquity)}`
    });
    if (!balancePass) {
      results.pass = false;
      results.warnings.push(`会计恒等式不平衡，差额 ${formatMoney(balanceDiff)}`);
    }

    // 校验2：未分配利润变动 = 净利润 - 分红（如果有期初数）
    if (previousBalanceSheet && previousBalanceSheet.undistributedProfit !== undefined) {
      const dividendPaid = cashFlowStatement?.dividendPaid || 0;
      const expectedUndistributedChange = (incomeStatement?.netProfit || 0) - dividendPaid;
      const actualUndistributedChange = balanceSheet.undistributedProfit - previousBalanceSheet.undistributedProfit;
      const undistributedDiff = Math.abs(expectedUndistributedChange - actualUndistributedChange);
      const undistributedPass = undistributedDiff < 100000; // 允许10万元以内误差
      results.checks.push({
        name: '未分配利润变动 = 净利润 - 分红',
        pass: undistributedPass,
        diff: undistributedDiff,
        expected: expectedUndistributedChange,
        actual: actualUndistributedChange,
        formula: `期末未分配利润 - 期初未分配利润 = 净利润 - 分红`
      });
      if (!undistributedPass) {
        results.warnings.push(`未分配利润变动与净利润-分红不符，差额 ${formatMoney(undistributedDiff)}`);
      }
    }

    // 校验3：现金变动 = 现金流量表净变动（如果有期初数）
    if (previousBalanceSheet && previousBalanceSheet.cash !== undefined) {
      const expectedCashChange = cashFlowStatement?.netCashChange || 0;
      const actualCashChange = balanceSheet.cash - previousBalanceSheet.cash;
      const cashDiff = Math.abs(expectedCashChange - actualCashChange);
      const cashPass = cashDiff < 100000; // 允许10万元以内误差
      results.checks.push({
        name: '现金变动 = 现金流量表净变动',
        pass: cashPass,
        diff: cashDiff,
        expected: expectedCashChange,
        actual: actualCashChange,
        formula: `期末现金 - 期初现金 = 经营+投资+筹资现金流`
      });
      if (!cashPass) {
        results.warnings.push(`现金变动与现金流量表净变动不符，差额 ${formatMoney(cashDiff)}`);
      }
    }

    // 校验4：利润表内部勾稽 净利润 = 总利润 - 所得税
    if (incomeStatement) {
      const expectedNetProfit = (incomeStatement.totalProfit || 0) - (incomeStatement.tax || 0);
      const netProfitDiff = Math.abs(expectedNetProfit - (incomeStatement.netProfit || 0));
      const netProfitPass = netProfitDiff < 1000;
      results.checks.push({
        name: '利润表内部勾稽（净利润=总利润-税）',
        pass: netProfitPass,
        diff: netProfitDiff
      });
      if (!netProfitPass) {
        results.pass = false;
        results.warnings.push(`利润表内部勾稽失败，净利润差额 ${formatMoney(netProfitDiff)}`);
      }
    }

    // 校验5：资产负债表内部勾稽 流动资产 = 现金+应收+存货
    if (balanceSheet) {
      const expectedCurrentAssets = (balanceSheet.cash || 0) + (balanceSheet.accountsReceivable || 0) + (balanceSheet.inventory || 0);
      const currentAssetsDiff = Math.abs(expectedCurrentAssets - (balanceSheet.currentAssets || 0));
      const currentAssetsPass = currentAssetsDiff < 1000;
      results.checks.push({
        name: '流动资产内部勾稽',
        pass: currentAssetsPass,
        diff: currentAssetsDiff
      });
    }

    // 输出校验日志
    if (results.warnings.length > 0) {
      console.warn('[SongFinance] 财务三表勾稽校验警告:', results.warnings);
    } else {
      console.log('[SongFinance] 财务三表勾稽校验全部通过 ✓');
    }

    return results;
  }

  /**
   * 生成集团完整三表数据（含勾稽校验）
   * 建立完整勾稽关系：
   * 1. 资产 = 负债 + 权益
   * 2. 未分配利润变动 = 净利润 - 分红
   * 3. 现金变动 = 现金流量表净变动
   */
  function generateGroupFinancials(subsidiaries, company, previousFinancials) {
    const incomeStatement = generateIncomeStatement(subsidiaries);
    const previousBalanceSheet = previousFinancials?.balanceSheet || company?.financialStatements?.balanceSheet || null;

    // 第一次生成资产负债表（现金先设为期初，后续调整）
    let balanceSheet = generateBalanceSheet(subsidiaries, company, incomeStatement, previousBalanceSheet);

    // 生成现金流量表
    const cashFlowStatement = generateCashFlowStatement(subsidiaries, company, incomeStatement, previousBalanceSheet);

    // 调整资产负债表的现金，使其与现金流量表勾稽
    if (previousBalanceSheet && previousBalanceSheet.cash !== undefined) {
      const adjustedCash = previousBalanceSheet.cash + cashFlowStatement.netCashChange;
      const cashDiff = adjustedCash - balanceSheet.cash;

      // 调整现金和流动资产
      balanceSheet.cash = Math.round(adjustedCash);
      balanceSheet.currentAssets = Math.round(balanceSheet.currentAssets + cashDiff);
      balanceSheet.totalAssets = Math.round(balanceSheet.totalAssets + cashDiff);

      // 由于总资产变了，需要重新调整未分配利润，保持会计恒等式
      // 总资产增加 → 未分配利润增加（假设负债和其他权益不变）
      balanceSheet.undistributedProfit = Math.round(balanceSheet.undistributedProfit + cashDiff);
      balanceSheet.totalEquity = Math.round(balanceSheet.totalEquity + cashDiff);

      // 重新验证会计恒等式
      balanceSheet.balanceCheck = Math.abs(balanceSheet.totalAssets - balanceSheet.totalLiabilities - balanceSheet.totalEquity) < 10000;
    }

    const ratios = calculateFinancialRatios(incomeStatement, balanceSheet, cashFlowStatement);

    // 执行勾稽校验
    const validation = validateFinancialStatements(incomeStatement, balanceSheet, cashFlowStatement, previousBalanceSheet);

    return {
      incomeStatement,
      balanceSheet,
      cashFlowStatement,
      ratios,
      validation,
      generatedAt: new Date().toISOString()
    };
  }

  /**
   * 生成子公司简化三表
   */
  function generateSubsidiaryFinancials(subsidiary) {
    if (!subsidiary || subsidiary.type === '公益') {
      return { incomeStatement: null, balanceSheet: null, ratios: null };
    }

    const rates = getIndustryRates(subsidiary.type);
    const revenue = subsidiary.revenue || 0;
    const profit = subsidiary.profit || 0;

    const cost = revenue * rates.costRate;
    const grossProfit = revenue - cost;
    const salesExpense = revenue * rates.salesRate;
    const adminExpense = revenue * rates.adminRate;
    const rdExpense = revenue * rates.rdRate;
    const financialExpense = revenue * rates.financialRate;
    const operatingProfit = grossProfit - salesExpense - adminExpense - rdExpense - financialExpense;
    const tax = profit > 0 ? profit * 0.25 : 0;
    const netProfit = profit - tax;

    // 简化资产负债
    const subAssets = revenue * 2;
    const currentAssets = subAssets * 0.4;
    const fixedAssets = subAssets * 0.4;
    const totalLiabilities = subAssets * 0.4;
    const totalEquity = subAssets - totalLiabilities;

    return {
      incomeStatement: {
        revenue: Math.round(revenue),
        cost: Math.round(cost),
        grossProfit: Math.round(grossProfit),
        grossMargin: revenue > 0 ? parseFloat(((grossProfit / revenue) * 100).toFixed(1)) : 0,
        salesExpense: Math.round(salesExpense),
        adminExpense: Math.round(adminExpense),
        rdExpense: Math.round(rdExpense),
        operatingProfit: Math.round(operatingProfit),
        totalProfit: Math.round(profit),
        tax: Math.round(tax),
        netProfit: Math.round(netProfit),
        netMargin: revenue > 0 ? parseFloat(((netProfit / revenue) * 100).toFixed(1)) : 0
      },
      balanceSheet: {
        currentAssets: Math.round(currentAssets),
        fixedAssets: Math.round(fixedAssets),
        totalAssets: Math.round(subAssets),
        totalLiabilities: Math.round(totalLiabilities),
        totalEquity: Math.round(totalEquity),
        debtRatio: subAssets > 0 ? parseFloat(((totalLiabilities / subAssets) * 100).toFixed(1)) : 0
      },
      ratios: {
        roe: totalEquity > 0 ? parseFloat(((netProfit / totalEquity) * 100).toFixed(2)) : 0,
        roa: subAssets > 0 ? parseFloat(((netProfit / subAssets) * 100).toFixed(2)) : 0,
        grossMargin: revenue > 0 ? parseFloat(((grossProfit / revenue) * 100).toFixed(1)) : 0,
        netMargin: revenue > 0 ? parseFloat(((netProfit / revenue) * 100).toFixed(1)) : 0,
        profitMargin: subsidiary.profitMargin || 0
      }
    };
  }

  /**
   * 资产配置分析
   */
  function analyzeAssetAllocation(subsidiaries, company, portfolio, fundPortfolio, stocks, funds) {
    const totalAssets = company?.totalAssets || 5000000000;
    const cashFlow = company?.cashFlow || 0;
    const validSubs = (subsidiaries || []).filter(s => s.type !== '公益');

    // 按板块分布（子公司资产估算）
    const sectorAllocation = validSubs.map(sub => {
      const estimatedAssets = (sub.revenue || 0) * 2;
      return {
        id: sub.id,
        name: sub.name,
        type: sub.type,
        assets: Math.round(estimatedAssets),
        percentage: totalAssets > 0 ? parseFloat(((estimatedAssets / totalAssets) * 100).toFixed(1)) : 0,
        profit: sub.profit || 0,
        profitMargin: sub.profitMargin || 0,
        roa: estimatedAssets > 0 ? parseFloat(((sub.profit / estimatedAssets) * 100).toFixed(2)) : 0
      };
    });

    // 金融资产（股票+基金）
    const stockValue = (portfolio || []).reduce((sum, p) => {
      const stock = (stocks || []).find(s => s.id === p.stockId);
      return sum + (stock ? stock.price * p.shares : 0);
    }, 0);
    const fundValue = (fundPortfolio || []).reduce((sum, p) => {
      const fund = (funds || []).find(f => f.id === p.fundId);
      return sum + (fund ? fund.nav * p.shares : 0);
    }, 0);
    const financialAssets = stockValue + fundValue;

    // 按资产类型分布
    const typeAllocation = {
      operatingAssets: Math.round(totalAssets * 0.60), // 经营性资产（子公司）
      financialAssets: Math.round(financialAssets),
      cash: Math.round(cashFlow),
      other: Math.round(totalAssets * 0.60 > totalAssets - financialAssets - cashFlow ? 0 : totalAssets - totalAssets * 0.60 - financialAssets - cashFlow)
    };
    typeAllocation.operatingAssets = Math.round(totalAssets - typeAllocation.financialAssets - typeAllocation.cash - typeAllocation.other);
    typeAllocation.operatingPercent = totalAssets > 0 ? parseFloat(((typeAllocation.operatingAssets / totalAssets) * 100).toFixed(1)) : 0;
    typeAllocation.financialPercent = totalAssets > 0 ? parseFloat(((typeAllocation.financialAssets / totalAssets) * 100).toFixed(1)) : 0;
    typeAllocation.cashPercent = totalAssets > 0 ? parseFloat(((typeAllocation.cash / totalAssets) * 100).toFixed(1)) : 0;

    // 效率分析：识别低效资产
    const inefficientAssets = sectorAllocation
      .filter(s => s.roa < 5 && s.profitMargin < 10)
      .sort((a, b) => a.roa - b.roa);

    const highPerformingAssets = sectorAllocation
      .filter(s => s.roa > 15)
      .sort((a, b) => b.roa - a.roa);

    // 配置建议
    const suggestions = [];
    if (typeAllocation.cashPercent > 30) {
      suggestions.push({ type: 'warning', text: `现金占比过高（${typeAllocation.cashPercent}%），建议增加投资或分红，提高资金使用效率` });
    }
    if (typeAllocation.financialPercent < 5 && financialAssets > 0) {
      suggestions.push({ type: 'info', text: `金融资产配置比例较低（${typeAllocation.financialPercent}%），可适当增加证券投资分散风险` });
    }
    if (inefficientAssets.length > 0) {
      suggestions.push({ type: 'danger', text: `发现${inefficientAssets.length}项低效资产（${inefficientAssets.map(a => a.name.replace('松氏', '')).join('、')}），ROA低于5%，建议优化或剥离` });
    }
    if (highPerformingAssets.length > 0) {
      suggestions.push({ type: 'success', text: `${highPerformingAssets.map(a => a.name.replace('松氏', '')).join('、')}表现优异（ROA>${highPerformingAssets[0].roa}%），可考虑加大投入` });
    }
    if (suggestions.length === 0) {
      suggestions.push({ type: 'info', text: '资产配置整体健康，各板块表现均衡，建议维持当前配置并持续监控' });
    }

    return {
      totalAssets,
      sectorAllocation,
      typeAllocation,
      stockValue: Math.round(stockValue),
      fundValue: Math.round(fundValue),
      financialAssets: Math.round(financialAssets),
      inefficientAssets,
      highPerformingAssets,
      suggestions
    };
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    DEFAULT_SUBSIDIARIES,
    initSubsidiaries,
    generateSubsidiaryHistory,
    updateSubsidiariesDaily,
    calculateGroupFinancials,
    dailySettlement,
    getSubsidiaryDetail,
    getSubsidiaryTrend,
    formatFinancialData,
    formatMoney,
    clamp,
    // 第四阶段新API
    generateIncomeStatement,
    generateBalanceSheet,
    generateCashFlowStatement,
    calculateFinancialRatios,
    generateGroupFinancials,
    generateSubsidiaryFinancials,
    analyzeAssetAllocation,
    getIndustryRates,
    validateFinancialStatements
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongFinance = SongFinance;
}


/* ===== js/modules/effects.js ===== */
/**
 * 松氏家族办公室 - 效果队列系统
 * 管理决策的延迟效果、持续影响、连锁反应
 * 建立"决策→效果→数据变化→后续事件"的完整闭环
 */

const SongEffects = (function () {
  'use strict';

  // ═══════════════════════════════════════════════
  // 效果类型定义
  // ═══════════════════════════════════════════════

  const EFFECT_TYPES = {
    // 即时效果
    CASH_FLOW_IMMEDIATE: 'cash_flow_immediate',     // 即时现金流变化
    HEIR_ABILITY: 'heir_ability',                     // 继承人能力变化

    // 持续效果（影响子公司）
    SUBSIDIARY_REVENUE: 'subsidiary_revenue',         // 子公司营收变化（%）
    SUBSIDIARY_PROFIT: 'subsidiary_profit',           // 子公司利润变化（%）
    SUBSIDIARY_SATISFACTION: 'subsidiary_satisfaction', // 子公司员工满意度变化
    SUBSIDIARY_REPUTATION: 'subsidiary_reputation',   // 子公司声誉变化
    SUBSIDIARY_GROWTH: 'subsidiary_growth',           // 子公司增长率变化

    // 持续效果（全局）
    MARKET_SENTIMENT: 'market_sentiment',             // 市场情绪（影响所有股票）
    GROUP_EFFICIENCY: 'group_efficiency',             // 集团整体效率

    // 延迟触发（一次性）
    DELAYED_CASH_FLOW: 'delayed_cash_flow',           // 延迟现金流变化
    DELAYED_EVENT: 'delayed_event',                    // 延迟触发新事件
  };

  // 效果目标
  const EFFECT_TARGETS = {
    GLOBAL: 'global',           // 全局
    ALL_SUBSIDIARIES: 'all',    // 所有子公司
    SPECIFIC: 'specific',       // 指定子公司
  };

  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function generateId() {
    return 'effect_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  }

  function formatDate(date) {
    const d = new Date(date);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function addDays(dateStr, days) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + days);
    return formatDate(d);
  }

  function daysBetween(date1, date2) {
    const d1 = new Date(date1);
    const d2 = new Date(date2);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  // ═══════════════════════════════════════════════
  // 效果创建
  // ═══════════════════════════════════════════════

  /**
   * 创建一个效果
   * @param {Object} config - 效果配置
   * @param {string} config.sourceEventId - 关联的决策事件ID
   * @param {string} config.sourceOption - 选择的选项标签
   * @param {string} config.type - 效果类型
   * @param {string} config.target - 影响目标（子公司ID或'global'/'all'）
   * @param {number} config.value - 影响数值
   * @param {number} config.duration - 持续天数（0=即时）
   * @param {number} config.delay - 延迟生效天数（0=立即）
   * @param {string} config.description - 效果描述
   * @param {string} config.currentDate - 当前游戏日期
   * @returns {Object} 效果对象
   */
  function createEffect(config) {
    const currentDate = config.currentDate || formatDate(new Date());
    const startDate = addDays(currentDate, config.delay || 0);

    return {
      id: generateId(),
      sourceEventId: config.sourceEventId || null,
      sourceOption: config.sourceOption || '',
      type: config.type,
      target: config.target || EFFECT_TARGETS.GLOBAL,
      value: config.value || 0,
      duration: config.duration || 0,
      remainingDays: config.duration || 0,
      delay: config.delay || 0,
      startDate,
      endDate: config.duration > 0 ? addDays(startDate, config.duration) : startDate,
      status: config.delay > 0 ? 'pending' : 'active',
      description: config.description || '',
      createdAt: currentDate,
      applied: false,
      history: []  // 效果应用历史
    };
  }

  /**
   * 从事件选项的 effects 配置批量创建效果
   * @param {Object} optionEffects - 选项的 effects 配置
   * @param {string} sourceEventId - 事件ID
   * @param {string} sourceOption - 选项标签
   * @param {string} currentDate - 当前日期
   * @param {Object} gameState - 当前游戏状态（用于推断目标子公司）
   * @returns {Array} 效果对象数组
   */
  function createEffectsFromOption(optionEffects, sourceEventId, sourceOption, currentDate, gameState) {
    const effects = [];
    if (!optionEffects) return effects;

    // 推断事件关联的子公司
    let targetSubsidiary = optionEffects.targetSubsidiary || null;
    if (!targetSubsidiary && gameState.subsidiaries && gameState.subsidiaries.length > 0) {
      // 如果事件有子公司信息，用事件的；否则随机选一个
      targetSubsidiary = EFFECT_TARGETS.ALL;
    }

    // 即时现金流
    if (optionEffects.cashFlow) {
      effects.push(createEffect({
        sourceEventId,
        sourceOption,
        type: EFFECT_TYPES.CASH_FLOW_IMMEDIATE,
        target: EFFECT_TARGETS.GLOBAL,
        value: optionEffects.cashFlow * 10000000, // 每单位=1000万
        duration: 0,
        delay: 0,
        description: `${sourceOption}：现金流${optionEffects.cashFlow > 0 ? '增加' : '减少'}${Math.abs(optionEffects.cashFlow)}千万`,
        currentDate
      }));
    }

    // 继承人能力
    const abilityMap = {
      business: 'business',
      decision: 'decision',
      influence: 'influence',
      reputation: 'reputation',
      familyTrust: 'familyTrust',
      employeeTrust: 'employeeTrust',
      riskJudgment: 'riskJudgment'
    };

    for (const [key, abilityKey] of Object.entries(abilityMap)) {
      if (optionEffects[key]) {
        effects.push(createEffect({
          sourceEventId,
          sourceOption,
          type: EFFECT_TYPES.HEIR_ABILITY,
          target: abilityKey,
          value: optionEffects[key],
          duration: 0,
          delay: 0,
          description: `${sourceOption}：${getAbilityName(abilityKey)}${optionEffects[key] > 0 ? '+' : ''}${optionEffects[key]}`,
          currentDate
        }));
      }
    }

    // 子公司持续效果（新格式）
    if (optionEffects.subsidiaryEffects) {
      for (const subEffect of optionEffects.subsidiaryEffects) {
        effects.push(createEffect({
          sourceEventId,
          sourceOption,
          type: subEffect.type,
          target: subEffect.target || targetSubsidiary || EFFECT_TARGETS.ALL,
          value: subEffect.value,
          duration: subEffect.duration || 30,
          delay: subEffect.delay || 0,
          description: subEffect.description || `${sourceOption}：${getEffectTypeName(subEffect.type)}${subEffect.value > 0 ? '+' : ''}${subEffect.value}%`,
          currentDate
        }));
      }
    }

    // 延迟现金流
    if (optionEffects.delayedCashFlow) {
      for (const delayed of optionEffects.delayedCashFlow) {
        effects.push(createEffect({
          sourceEventId,
          sourceOption,
          type: EFFECT_TYPES.DELAYED_CASH_FLOW,
          target: EFFECT_TARGETS.GLOBAL,
          value: delayed.value * 10000000,
          duration: 0,
          delay: delayed.delay || 7,
          description: delayed.description || `${sourceOption}：${delayed.delay || 7}天后现金流${delayed.value > 0 ? '增加' : '减少'}${Math.abs(delayed.value)}千万`,
          currentDate
        }));
      }
    }

    return effects;
  }

  // ═══════════════════════════════════════════════
  // 效果名称映射
  // ═══════════════════════════════════════════════

  function getAbilityName(key) {
    const names = {
      business: '商业能力',
      decision: '决策能力',
      influence: '资本影响力',
      reputation: '市场声誉',
      familyTrust: '家族信任度',
      employeeTrust: '员工信任度',
      riskJudgment: '风险判断能力'
    };
    return names[key] || key;
  }

  function getEffectTypeName(type) {
    const names = {
      [EFFECT_TYPES.SUBSIDIARY_REVENUE]: '营收',
      [EFFECT_TYPES.SUBSIDIARY_PROFIT]: '利润',
      [EFFECT_TYPES.SUBSIDIARY_SATISFACTION]: '员工满意度',
      [EFFECT_TYPES.SUBSIDIARY_REPUTATION]: '声誉',
      [EFFECT_TYPES.SUBSIDIARY_GROWTH]: '增长率',
      [EFFECT_TYPES.MARKET_SENTIMENT]: '市场情绪',
      [EFFECT_TYPES.GROUP_EFFICIENCY]: '集团效率'
    };
    return names[type] || type;
  }

  // ═══════════════════════════════════════════════
  // 每日效果结算
  // ═══════════════════════════════════════════════

  /**
   * 每日效果结算：处理效果队列，应用生效中的效果
   * @param {Object} gameState - 当前游戏状态
   * @returns {Object} 包含更新后的状态和今日应用的效果
   */
  function processDailyEffects(gameState) {
    const currentDate = gameState.gameDate?.current || formatDate(new Date());
    const activeEffects = gameState.events?.activeEffects || [];
    const appliedToday = [];
    let stateChanges = {};

    const updatedEffects = activeEffects.map(effect => {
      const e = { ...effect };

      // 检查是否到了生效时间
      if (e.status === 'pending' && e.startDate <= currentDate) {
        e.status = 'active';
        e.applied = false;
      }

      // 处理活跃效果
      if (e.status === 'active') {
        // 即时效果（只应用一次）
        if (e.duration === 0 && !e.applied) {
          const result = applyImmediateEffect(e, gameState);
          stateChanges = { ...stateChanges, ...result };
          e.applied = true;
          e.status = 'expired';
          appliedToday.push({ ...e, appliedDate: currentDate });
        }
        // 持续效果（每天应用）
        else if (e.duration > 0) {
          const result = applyOngoingEffect(e, gameState);
          stateChanges = { ...stateChanges, ...result };
          e.remainingDays = Math.max(0, e.remainingDays - 1);
          e.history.push({ date: currentDate, applied: true });
          appliedToday.push({ ...e, appliedDate: currentDate });

          if (e.remainingDays <= 0) {
            e.status = 'expired';
          }
        }
      }

      return e;
    }).filter(e => e.status !== 'expired' || e.history.length > 0);
    // 保留已过期但有历史的效果（用于追踪），但限制数量
    const expiredWithHistory = updatedEffects.filter(e => e.status === 'expired');
    const activeOrPending = updatedEffects.filter(e => e.status !== 'expired');
    const finalEffects = [...activeOrPending, ...expiredWithHistory.slice(-50)];

    return {
      effects: finalEffects,
      stateChanges,
      appliedToday
    };
  }

  /**
   * 应用即时效果
   */
  function applyImmediateEffect(effect, gameState) {
    const changes = {};

    switch (effect.type) {
      case EFFECT_TYPES.CASH_FLOW_IMMEDIATE:
      case EFFECT_TYPES.DELAYED_CASH_FLOW: {
        const currentCash = gameState.company?.cashFlow || 0;
        changes['company.cashFlow'] = Math.max(0, currentCash + effect.value);
        break;
      }
      case EFFECT_TYPES.HEIR_ABILITY: {
        const abilityKey = effect.target;
        const current = gameState.heir?.abilities?.[abilityKey] || 50;
        changes[`heir.abilities.${abilityKey}`] = Math.min(100, Math.max(0, current + effect.value));
        break;
      }
    }

    return changes;
  }

  /**
   * 应用持续效果（返回对子公司的修正值，由 finance 模块应用）
   */
  function applyOngoingEffect(effect, gameState) {
    // 持续效果不直接修改状态，而是返回修正因子
    // 由 finance 模块在更新子公司时读取并应用
    return {
      _effectModifiers: [{
        type: effect.type,
        target: effect.target,
        value: effect.value,
        effectId: effect.id
      }]
    };
  }

  // ═══════════════════════════════════════════════
  // 效果查询
  // ═══════════════════════════════════════════════

  /**
   * 获取某个事件产生的所有效果
   * @param {Array} effects - 所有效果
   * @param {string} eventId - 事件ID
   * @returns {Array} 该事件的效果列表
   */
  function getEffectsByEvent(effects, eventId) {
    return (effects || []).filter(e => e.sourceEventId === eventId);
  }

  /**
   * 获取当前活跃的效果
   */
  function getActiveEffects(effects) {
    return (effects || []).filter(e => e.status === 'active');
  }

  /**
   * 获取待生效的效果
   */
  function getPendingEffects(effects) {
    return (effects || []).filter(e => e.status === 'pending');
  }

  /**
   * 获取影响某个子公司的所有活跃效果
   */
  function getEffectsForSubsidiary(effects, subsidiaryId) {
    return (effects || []).filter(e =>
      e.status === 'active' &&
      (e.target === subsidiaryId || e.target === EFFECT_TARGETS.ALL)
    );
  }

  /**
   * 计算子公司的效果修正值
   * @param {Array} effects - 所有效果
   * @param {string} subsidiaryId - 子公司ID
   * @returns {Object} 各类型的修正值
   */
  function getSubsidiaryModifiers(effects, subsidiaryId) {
    const modifiers = {
      revenue: 0,
      profit: 0,
      satisfaction: 0,
      reputation: 0,
      growth: 0
    };

    const relevant = getEffectsForSubsidiary(effects, subsidiaryId);

    for (const effect of relevant) {
      switch (effect.type) {
        case EFFECT_TYPES.SUBSIDIARY_REVENUE:
          modifiers.revenue += effect.value;
          break;
        case EFFECT_TYPES.SUBSIDIARY_PROFIT:
          modifiers.profit += effect.value;
          break;
        case EFFECT_TYPES.SUBSIDIARY_SATISFACTION:
          modifiers.satisfaction += effect.value;
          break;
        case EFFECT_TYPES.SUBSIDIARY_REPUTATION:
          modifiers.reputation += effect.value;
          break;
        case EFFECT_TYPES.SUBSIDIARY_GROWTH:
          modifiers.growth += effect.value;
          break;
      }
    }

    return modifiers;
  }

  /**
   * 格式化效果用于展示
   */
  function formatEffectForDisplay(effect) {
    const statusText = {
      pending: '待生效',
      active: '生效中',
      expired: '已结束'
    };

    return {
      id: effect.id,
      description: effect.description,
      type: effect.type,
      typeName: getEffectTypeName(effect.type),
      target: effect.target,
      value: effect.value,
      status: effect.status,
      statusText: statusText[effect.status] || effect.status,
      startDate: effect.startDate,
      endDate: effect.endDate,
      remainingDays: effect.remainingDays,
      sourceOption: effect.sourceOption
    };
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    EFFECT_TYPES,
    EFFECT_TARGETS,
    createEffect,
    createEffectsFromOption,
    processDailyEffects,
    getEffectsByEvent,
    getActiveEffects,
    getPendingEffects,
    getEffectsForSubsidiary,
    getSubsidiaryModifiers,
    formatEffectForDisplay,
    getAbilityName,
    getEffectTypeName
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongEffects = SongEffects;
}


/* ===== js/modules/subsidiary-synergy.js ===== */
/**
 * 松氏家族办公室 - 子公司联动与集团协同效应模块
 * 建立子公司之间的业务往来、资源共享、风险传染机制
 * 实现"集团整体 > 各子公司简单相加"的协同效应
 */

const SongSynergy = (function () {
  'use strict';

  // ═══════════════════════════════════════════════
  // 子公司关联矩阵定义
  // ═══════════════════════════════════════════════

  // 子公司类型ID映射
  const SUBSIDIARY_TYPES = {
    FINANCE: 'finance',        // 金融投资
    TECH: 'tech',              // 科技产业
    REALESTATE: 'realestate',  // 地产与酒店
    LUXURY: 'luxury',          // 艺术与奢侈品
    CHARITY: 'charity',        // 慈善基金
    INCUBATION: 'incubation'   // 新兴企业孵化
  };

  // 关联关系定义：source 对 target 的影响
  // type: 'revenue' | 'profit' | 'satisfaction' | 'reputation' | 'risk'
  // value: 基础影响值（百分比或点数）
  // condition: 影响生效的条件
  const SYNERGY_MATRIX = [
    // ─── 金融投资 → 其他子公司：提供融资，降低资金成本 ───
    {
      source: SUBSIDIARY_TYPES.FINANCE,
      target: 'all',
      effects: [
        { type: 'profit', value: 0.3, condition: 'finance_healthy', description: '金融子公司健康运营，为集团提供低成本融资，提升其他子公司利润率0.3%' }
      ]
    },
    {
      source: SUBSIDIARY_TYPES.FINANCE,
      target: SUBSIDIARY_TYPES.INCUBATION,
      effects: [
        { type: 'revenue', value: 0.5, condition: 'finance_healthy', description: '金融子公司为孵化项目提供资金支持，提升孵化板块营收0.5%' }
      ]
    },

    // ─── 科技产业 → 地产酒店：提供智能化解决方案 ───
    {
      source: SUBSIDIARY_TYPES.TECH,
      target: SUBSIDIARY_TYPES.REALESTATE,
      effects: [
        { type: 'revenue', value: 0.4, condition: 'tech_healthy', description: '科技子公司为地产酒店提供智能化解决方案，提升运营效率和营收0.4%' },
        { type: 'satisfaction', value: 0.5, condition: 'tech_healthy', description: '科技赋能提升酒店客户体验，员工满意度提升0.5点' }
      ]
    },

    // ─── 地产酒店 → 艺术奢侈品：提供展示空间，品牌协同 ───
    {
      source: SUBSIDIARY_TYPES.REALESTATE,
      target: SUBSIDIARY_TYPES.LUXURY,
      effects: [
        { type: 'revenue', value: 0.3, condition: 'realestate_healthy', description: '地产酒店为奢侈品提供高端展示空间和客户渠道，提升营收0.3%' },
        { type: 'reputation', value: 0.3, condition: 'realestate_healthy', description: '高端物业提升奢侈品品牌形象，声誉提升0.3点' }
      ]
    },

    // ─── 艺术奢侈品 → 全集团：提升品牌价值，降低融资成本 ───
    {
      source: SUBSIDIARY_TYPES.LUXURY,
      target: 'all',
      effects: [
        { type: 'reputation', value: 0.2, condition: 'luxury_healthy', description: '奢侈品业务提升集团整体品牌价值，所有子公司声誉提升0.2点' },
        { type: 'profit', value: 0.2, condition: 'luxury_healthy', description: '高端品牌形象降低集团融资成本和营销费用，提升整体利润率0.2%' }
      ]
    },

    // ─── 慈善基金 → 全集团：提升声誉，影响政策风险 ───
    {
      source: SUBSIDIARY_TYPES.CHARITY,
      target: 'all',
      effects: [
        { type: 'reputation', value: 0.3, condition: 'charity_active', description: '慈善基金积极运作提升集团社会形象，所有子公司声誉提升0.3点' },
        { type: 'risk', value: -0.2, condition: 'charity_active', description: '良好社会形象降低政策风险和监管压力' }
      ]
    },

    // ─── 新兴企业孵化 → 科技产业：成功项目反哺技术 ───
    {
      source: SUBSIDIARY_TYPES.INCUBATION,
      target: SUBSIDIARY_TYPES.TECH,
      effects: [
        { type: 'revenue', value: 0.3, condition: 'incubation_success', description: '孵化成功项目为科技子公司带来新技术和新业务，提升营收0.3%' },
        { type: 'profit', value: 0.2, condition: 'incubation_success', description: '孵化项目退出收益提升科技子公司利润率0.2%' }
      ]
    }
  ];

  // ═══════════════════════════════════════════════
  // 风险传染矩阵
  // ═══════════════════════════════════════════════

  // 一个子公司危机对其他子公司的影响
  const RISK_CONTAGION = [
    {
      source: SUBSIDIARY_TYPES.FINANCE,
      target: 'all',
      effects: [
        { type: 'profit', value: -0.5, description: '金融子公司危机导致集团融资成本上升，所有子公司利润率下降0.5%' },
        { type: 'reputation', value: -1.0, description: '金融危机严重影响集团声誉，所有子公司声誉下降1点' }
      ]
    },
    {
      source: SUBSIDIARY_TYPES.REALESTATE,
      target: SUBSIDIARY_TYPES.LUXURY,
      effects: [
        { type: 'revenue', value: -0.8, description: '地产危机导致奢侈品失去高端展示空间，营收下降0.8%' }
      ]
    },
    {
      source: SUBSIDIARY_TYPES.INCUBATION,
      target: SUBSIDIARY_TYPES.TECH,
      effects: [
        { type: 'profit', value: -0.3, description: '孵化项目大面积亏损拖累科技子公司利润，利润率下降0.3%' }
      ]
    },
    {
      source: SUBSIDIARY_TYPES.LUXURY,
      target: 'all',
      effects: [
        { type: 'reputation', value: -0.5, description: '奢侈品负面新闻影响集团高端形象，所有子公司声誉下降0.5点' }
      ]
    }
  ];

  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  /**
   * 根据子公司名称推断类型ID
   */
  function getSubsidiaryTypeId(sub) {
    if (!sub) return null;
    const name = sub.name || '';
    const type = sub.type || '';

    if (type === '金融' || name.includes('金融') || name.includes('投资')) return SUBSIDIARY_TYPES.FINANCE;
    if (type === '科技' || name.includes('科技') || name.includes('技术')) return SUBSIDIARY_TYPES.TECH;
    if (type === '地产' || name.includes('地产') || name.includes('酒店')) return SUBSIDIARY_TYPES.REALESTATE;
    if (type === '奢侈品' || name.includes('艺术') || name.includes('奢侈品')) return SUBSIDIARY_TYPES.LUXURY;
    if (type === '公益' || name.includes('慈善') || name.includes('基金')) return SUBSIDIARY_TYPES.CHARITY;
    if (type === '孵化' || name.includes('孵化') || name.includes('新兴')) return SUBSIDIARY_TYPES.INCUBATION;

    return null;
  }

  /**
   * 检查子公司是否健康（满足协同效应条件）
   */
  function isSubsidiaryHealthy(sub) {
    if (!sub) return false;
    // 慈善基金只要有资金就算active
    if (getSubsidiaryTypeId(sub) === SUBSIDIARY_TYPES.CHARITY) {
      return (sub.revenue || 0) >= 0;
    }
    // 其他子公司：利润>0 且 满意度>50 且 声誉>50
    return (sub.profit || 0) > 0 &&
           (sub.satisfaction || 0) > 50 &&
           (sub.reputation || 0) > 50;
  }

  /**
   * 检查子公司是否处于危机状态（触发风险传染）
   */
  function isSubsidiaryInCrisis(sub) {
    if (!sub) return false;
    if (getSubsidiaryTypeId(sub) === SUBSIDIARY_TYPES.CHARITY) return false;
    // 危机条件：利润<0 或 满意度<40 或 声誉<40
    return (sub.profit || 0) < 0 ||
           (sub.satisfaction || 0) < 40 ||
           (sub.reputation || 0) < 40;
  }

  /**
   * 检查协同效应条件是否满足
   */
  function checkCondition(condition, sourceSub) {
    if (!condition) return true;
    switch (condition) {
      case 'finance_healthy':
        return getSubsidiaryTypeId(sourceSub) === SUBSIDIARY_TYPES.FINANCE && isSubsidiaryHealthy(sourceSub);
      case 'tech_healthy':
        return getSubsidiaryTypeId(sourceSub) === SUBSIDIARY_TYPES.TECH && isSubsidiaryHealthy(sourceSub);
      case 'realestate_healthy':
        return getSubsidiaryTypeId(sourceSub) === SUBSIDIARY_TYPES.REALESTATE && isSubsidiaryHealthy(sourceSub);
      case 'luxury_healthy':
        return getSubsidiaryTypeId(sourceSub) === SUBSIDIARY_TYPES.LUXURY && isSubsidiaryHealthy(sourceSub);
      case 'charity_active':
        return getSubsidiaryTypeId(sourceSub) === SUBSIDIARY_TYPES.CHARITY;
      case 'incubation_success':
        return getSubsidiaryTypeId(sourceSub) === SUBSIDIARY_TYPES.INCUBATION && isSubsidiaryHealthy(sourceSub);
      default:
        return true;
    }
  }

  // ═══════════════════════════════════════════════
  // 核心计算函数
  // ═══════════════════════════════════════════════

  /**
   * 计算某个子公司受到的所有协同效应影响
   * @param {Object} targetSub - 目标子公司
   * @param {Array} allSubsidiaries - 所有子公司
   * @returns {Object} 协同效应修正值 { revenue, profit, satisfaction, reputation, risk }
   */
  function calculateSynergyEffects(targetSub, allSubsidiaries) {
    const effects = { revenue: 0, profit: 0, satisfaction: 0, reputation: 0, risk: 0 };
    const targetTypeId = getSubsidiaryTypeId(targetSub);
    if (!targetTypeId) return effects;

    for (const synergy of SYNERGY_MATRIX) {
      // 找到源子公司
      const sourceSub = allSubsidiaries.find(s => getSubsidiaryTypeId(s) === synergy.source);
      if (!sourceSub) continue;
      // 源子公司和目标子公司不能是同一个
      if (sourceSub.id === targetSub.id) continue;
      // 检查目标是否匹配
      if (synergy.target !== 'all' && synergy.target !== targetTypeId) continue;
      // 检查条件
      for (const effect of synergy.effects) {
        if (checkCondition(effect.condition, sourceSub)) {
          if (effects[effect.type] !== undefined) {
            effects[effect.type] += effect.value;
          }
        }
      }
    }

    return effects;
  }

  /**
   * 计算某个子公司受到的风险传染影响
   * @param {Object} targetSub - 目标子公司
   * @param {Array} allSubsidiaries - 所有子公司
   * @returns {Object} 风险传染修正值 { revenue, profit, satisfaction, reputation, risk }
   */
  function calculateRiskContagion(targetSub, allSubsidiaries) {
    const effects = { revenue: 0, profit: 0, satisfaction: 0, reputation: 0, risk: 0 };
    const targetTypeId = getSubsidiaryTypeId(targetSub);
    if (!targetTypeId) return effects;

    for (const contagion of RISK_CONTAGION) {
      // 找到源子公司（处于危机中的）
      const sourceSub = allSubsidiaries.find(s =>
        getSubsidiaryTypeId(s) === contagion.source && isSubsidiaryInCrisis(s)
      );
      if (!sourceSub) continue;
      // 源子公司和目标子公司不能是同一个
      if (sourceSub.id === targetSub.id) continue;
      // 检查目标是否匹配
      if (contagion.target !== 'all' && contagion.target !== targetTypeId) continue;
      // 应用影响
      for (const effect of contagion.effects) {
        if (effects[effect.type] !== undefined) {
          effects[effect.type] += effect.value;
        }
      }
    }

    return effects;
  }

  /**
   * 计算子公司受到的总联动影响（协同效应 + 风险传染）
   * @param {Object} targetSub - 目标子公司
   * @param {Array} allSubsidiaries - 所有子公司
   * @returns {Object} 总修正值 { revenue, profit, satisfaction, reputation, risk, synergyDetail, contagionDetail }
   */
  function calculateTotalSynergy(targetSub, allSubsidiaries) {
    const synergy = calculateSynergyEffects(targetSub, allSubsidiaries);
    const contagion = calculateRiskContagion(targetSub, allSubsidiaries);

    return {
      revenue: synergy.revenue + contagion.revenue,
      profit: synergy.profit + contagion.profit,
      satisfaction: synergy.satisfaction + contagion.satisfaction,
      reputation: synergy.reputation + contagion.reputation,
      risk: synergy.risk + contagion.risk,
      synergyDetail: synergy,
      contagionDetail: contagion
    };
  }

  /**
   * 计算集团整体协同效应指标
   * @param {Array} subsidiaries - 所有子公司
   * @returns {Object} 集团协同效应概览
   */
  function calculateGroupSynergyOverview(subsidiaries) {
    if (!subsidiaries || subsidiaries.length === 0) {
      return {
        totalSynergyRevenue: 0,
        totalSynergyProfit: 0,
        healthyCount: 0,
        crisisCount: 0,
        activeSynergies: [],
        activeContagions: [],
        synergyScore: 0
      };
    }

    let totalSynergyRevenue = 0;
    let totalSynergyProfit = 0;
    let healthyCount = 0;
    let crisisCount = 0;
    const activeSynergies = [];
    const activeContagions = [];

    // 统计健康/危机子公司
    for (const sub of subsidiaries) {
      if (isSubsidiaryHealthy(sub)) healthyCount++;
      if (isSubsidiaryInCrisis(sub)) crisisCount++;
    }

    // 计算每个子公司受到的协同效应
    for (const targetSub of subsidiaries) {
      const synergy = calculateTotalSynergy(targetSub, subsidiaries);
      totalSynergyRevenue += synergy.revenue;
      totalSynergyProfit += synergy.profit;

      // 记录活跃的协同效应
      if (synergy.synergyDetail.revenue > 0 || synergy.synergyDetail.profit > 0) {
        activeSynergies.push({
          target: targetSub.name,
          revenueBoost: synergy.synergyDetail.revenue,
          profitBoost: synergy.synergyDetail.profit
        });
      }

      // 记录活跃的风险传染
      if (synergy.contagionDetail.revenue < 0 || synergy.contagionDetail.profit < 0) {
        activeContagions.push({
          target: targetSub.name,
          revenueLoss: synergy.contagionDetail.revenue,
          profitLoss: synergy.contagionDetail.profit
        });
      }
    }

    // 协同效应评分（0-100）：健康子公司越多，协同效应越强
    const healthRatio = healthyCount / subsidiaries.length;
    const crisisPenalty = crisisCount * 10;
    const synergyScore = Math.max(0, Math.min(100,
      Math.round(healthRatio * 70 + totalSynergyRevenue * 5 - crisisPenalty)
    ));

    return {
      totalSynergyRevenue: parseFloat(totalSynergyRevenue.toFixed(2)),
      totalSynergyProfit: parseFloat(totalSynergyProfit.toFixed(2)),
      healthyCount,
      crisisCount,
      activeSynergies,
      activeContagions,
      synergyScore
    };
  }

  /**
   * 获取子公司关联关系描述（用于UI展示）
   * @param {Object} sub - 子公司
   * @returns {Array} 关联关系描述列表
   */
  function getSubsidiaryRelations(sub) {
    const typeId = getSubsidiaryTypeId(sub);
    if (!typeId) return [];

    const relations = [];

    // 查找该子公司作为源的关联
    for (const synergy of SYNERGY_MATRIX) {
      if (synergy.source === typeId) {
        const targetName = synergy.target === 'all' ? '全集团' :
          Object.values(SUBSIDIARY_TYPES).find(t => t === synergy.target) || synergy.target;
        for (const effect of synergy.effects) {
          relations.push({
            direction: 'output',
            target: targetName,
            effect: effect.description,
            value: effect.value
          });
        }
      }
    }

    // 查找该子公司作为目标的关联
    for (const synergy of SYNERGY_MATRIX) {
      if (synergy.target === typeId || synergy.target === 'all') {
        const sourceName = Object.values(SUBSIDIARY_TYPES).find(t => t === synergy.source) || synergy.source;
        for (const effect of synergy.effects) {
          relations.push({
            direction: 'input',
            source: sourceName,
            effect: effect.description,
            value: effect.value
          });
        }
      }
    }

    return relations;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    SUBSIDIARY_TYPES,
    getSubsidiaryTypeId,
    isSubsidiaryHealthy,
    isSubsidiaryInCrisis,
    calculateSynergyEffects,
    calculateRiskContagion,
    calculateTotalSynergy,
    calculateGroupSynergyOverview,
    getSubsidiaryRelations
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongSynergy = SongSynergy;
}

  // ═══════════════════════════════════════════════

  // ═══════════════════════════════════════════════

  const EVENT_TYPES = {

  const PRIORITY = {

  };

  // ═══════════════════════════════════════════════
  // 事件模板库
  // ═══════════════════════════════════════════════

  const EVENT_TEMPLATES = [
    // ─── 财务审批类 ───
    {
      type: EVENT_TYPES.BUDGET_APPROVAL,
      category: EVENT_CATEGORIES.FINANCE,
      priority: PRIORITY.MEDIUM,
      titleTemplate: '{department}部门预算审批',
      descriptionTemplate: '{department}部门提交了下一季度预算申请，申请金额为 {amount}，较上季度增长 {growth}%。',
      departments: ['金融投资部', '科技产业部', '地产酒店部', '艺术奢侈品部', '慈善基金部', '新兴企业孵化部', '市场部', '人力资源部', '法务合规部'],
      options: [
        {
          label: '批准预算',

          effects: {
            cashFlow: -1,
            employeeTrust: 2,
            department: 'positive',
            subsidiaryEffects: [
              { type: 'subsidiary_revenue', target: 'all', value: 1.5, duration: 60, delay: 7, description: '预算充足，部门运营效率提升，营收增长1.5%（持续60天）' },
              { type: 'subsidiary_satisfaction', target: 'all', value: 2, duration: 30, delay: 0, description: '预算获批，员工满意度提升2点（持续30天）' }
            ]
          }
        },
        {
          label: '削减10%',
          description: '在申请基础上削减10%',
          effects: {
            cashFlow: 0.5,
            employeeTrust: -3,
            department: 'neutral',
            subsidiaryEffects: [
              { type: 'subsidiary_satisfaction', target: 'all', value: -3, duration: 45, delay: 0, description: '预算削减，员工满意度下降3点（持续45天）' }
            ]
          }
        },
        {
          label: '要求重新提交',
          description: '要求部门细化预算明细后重新提交',

  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function randomChoice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function randomFloat(min, max, decimals = 2) {
    return parseFloat((Math.random() * (max - min) + min).toFixed(decimals));
  }

  function formatMoney(amount) {
    if (amount >= 100000000) return (amount / 100000000).toFixed(2) + '亿';
    if (amount >= 10000) return (amount / 10000).toFixed(2) + '万';
    return amount.toLocaleString();
  }

  function generateId() {
    return 'event_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  // ═══════════════════════════════════════════════
  // 事件生成器
  // ═══════════════════════════════════════════════

  /**
   * 生成每日事件
   * @param {Object} gameState - 当前游戏状态
   * @param {number} count - 生成事件数量
   * @returns {Array} 事件列表
   */
  function generateDailyEvents(gameState, count = 3) {
    const events = [];
    const usedTypes = new Set();

    for (let i = 0; i < count; i++) {
      // 根据游戏状态调整事件权重
      const template = selectTemplate(gameState, usedTypes);
      if (!template) continue;

      usedTypes.add(template.type);
      const event = instantiateEvent(template, gameState);
      events.push(event);
    }

    // 按优先级排序：high > medium > low
    const priorityOrder = { high: 0, medium: 1, low: 2 };
    events.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);

    return events;
  }

  /**
   * 根据游戏状态选择事件模板
   */
  function selectTemplate(gameState, usedTypes) {
    // 过滤掉已使用的类型
    let candidates = EVENT_TEMPLATES.filter(t => !usedTypes.has(t.type));

    if (candidates.length === 0) {
      candidates = EVENT_TEMPLATES; // 允许重复类型
    }

    // 根据游戏状态调整权重
    const weighted = candidates.map(template => {
      let weight = 1;

      // 现金流低时，增加财务相关事件
      if (gameState.company && gameState.company.cashFlow < 500000000) {
        if (template.category === EVENT_CATEGORIES.FINANCE || template.type === EVENT_TYPES.CASHFLOW_SHORTAGE) {
          weight *= 2;
        }
      }

      // 高风险时增加风险事件
      if (gameState.heir && gameState.heir.abilities && gameState.heir.abilities.riskJudgment < 40) {
        if (template.category === EVENT_CATEGORIES.RISK) {
          weight *= 1.5;
        }
      }

      // 重大事件概率较低
      if (template.category === EVENT_CATEGORIES.MAJOR) {
        weight *= 0.3;
      }

      return { template, weight };
    });

    // 加权随机选择
    const totalWeight = weighted.reduce((sum, w) => sum + w.weight, 0);
    let random = Math.random() * totalWeight;

    for (const w of weighted) {
      random -= w.weight;
      if (random <= 0) return w.template;
    }

    return weighted[0]?.template;
  }

  /**
   * 实例化事件（填充模板变量）
   */
  function instantiateEvent(template, gameState) {
    const now = new Date();
    const gameDate = gameState.gameDate?.current || formatDate(now);

    // 生成随机数据
    const department = template.departments ? randomChoice(template.departments) : '';
    const amount = formatMoney(randomInt(500000, 50000000));
    const growth = randomInt(5, 30);
    const project = template.projects ? randomChoice(template.projects) : (template.type === EVENT_TYPES.NEW_PROJECT ? randomChoice(['AI医疗平台', '碳中和技术', '元宇宙社交', '生物科技', '新能源材料']) : '');
    const founder = template.founders ? randomChoice(template.founders) : '';
    const stage = template.stages ? randomChoice(template.stages) : '';
    const subsidiary = gameState.subsidiaries?.length > 0 ? randomChoice(gameState.subsidiaries).name : randomChoice(['松氏金融投资', '松氏科技产业', '松氏地产酒店', '松氏艺术奢侈品']);
    const position = template.positions ? randomChoice(template.positions) : '';
    const name = generateChineseName();
    const years = randomInt(3, 15);
    const industry = randomChoice(['科技', '地产', '金融', '消费', '医疗', '新能源']);
    const target = randomChoice(['某科技独角兽', '某连锁酒店集团', '某奢侈品品牌', '某生物科技公司', '某新能源企业']);

    // 填充标题
    let title = template.titleTemplate
      .replace('{department}', department)
      .replace('{project}', project)
      .replace('{subsidiary}', subsidiary)
      .replace('{name}', name)
      .replace('{industry}', industry)
      .replace('{target}', target)
      .replace('{title}', generateNewsTitle());

    // 填充描述
    let description = template.descriptionTemplate
      .replace(/{department}/g, department)
      .replace(/{amount}/g, amount)
      .replace(/{growth}/g, growth)
      .replace(/{project}/g, project)
      .replace(/{returnRate}/g, randomFloat(8, 25))
      .replace(/{riskLevel}/g, randomChoice(['低', '中', '高']))
      .replace(/{count}/g, randomInt(10, 200))
      .replace(/{performance}/g, randomChoice(['超出预期', '符合预期', '低于预期']))
      .replace(/{purpose}/g, template.purposes ? randomChoice(template.purposes) : '')
      .replace(/{deviation}/g, randomInt(20, 80))
      .replace(/{expense}/g, formatMoney(randomInt(10000000, 100000000)))
      .replace(/{income}/g, formatMoney(randomInt(5000000, 50000000)))
      .replace(/{direction}/g, randomChoice(['大幅上涨', '稳步增长', '不及预期', '出现下滑']))
      .replace(/{revenue}/g, formatMoney(randomInt(50000000, 500000000)))
      .replace(/{profit}/g, formatMoney(randomInt(5000000, 100000000)))
      .replace(/{reason}/g, randomChoice(['市场需求旺盛', '成本控制得当', '行业竞争加剧', '新项目尚未盈利']))
      .replace(/{founder}/g, founder)
      .replace(/{equity}/g, randomInt(10, 30))
      .replace(/{stage}/g, stage)
      .replace(/{forecast}/g, randomChoice(['3年内盈亏平衡', '5年内IPO', '快速占领市场', '需要持续投入']))
      .replace(/{position}/g, position)
      .replace(/{name}/g, name)
      .replace(/{reason}/g, template.reasons ? randomChoice(template.reasons) : '')
      .replace(/{years}/g, years)
      .replace(/{spread}/g, randomChoice(['较快', '一般', '正在发酵', '已登上热搜']))
      .replace(/{impact}/g, randomChoice(['集团声誉', '子公司估值', '投资者信心', '合作伙伴关系']))
      .replace(/{valuation}/g, formatMoney(randomInt(500000000, 5000000000)))
      .replace(/{status}/g, randomChoice(['寻求买家', '财务困难', '创始人退休', '股东内讧']))
      .replace(/{synergy}/g, randomChoice(['与现有业务形成协同', '进入新市场领域', '获得关键技术', '整合行业资源']))
      .replace(/{cause}/g, randomChoice(['政策突变', '需求骤降', '技术颠覆', '资金链断裂']))
      .replace(/{exposure}/g, formatMoney(randomInt(100000000, 1000000000)))
      .replace(/{impact}/g, randomChoice(['中等', '较大', '重大', '可能波及全集团']));

    return {
      id: generateId(),
      type: template.type,
      category: template.category,
      priority: template.priority,
      title,
      description,
      department,
      date: gameDate,
      createdAt: now.toISOString(),
      status: 'pending',
      options: template.options.map(opt => ({ ...opt })),
      selectedOption: null,
      processedDate: null,
      effects: null
    };
  }

  /**
   * 生成中文名字
   */
  function generateChineseName() {
    const surnames = ['陈', '林', '黄', '张', '李', '王', '刘', '吴', '周', '郑', '何', '罗', '梁', '宋', '唐'];
    const givenNames = ['志明', '丽华', '建国', '淑芬', '伟强', '美玲', '俊杰', '雅婷', '文豪', '思琪', '明辉', '婉君', '志强', '慧敏', '家豪'];
    return randomChoice(surnames) + randomChoice(givenNames);
  }

  /**
   * 生成新闻标题
   */
  function generateNewsTitle() {
    const titles = [
      '传松氏集团内部出现人事变动',
      '松氏投资项目被曝存在合规问题',
      '松氏旗下子公司业绩引发市场质疑',
      '松氏家族继承人能力受到外界关注',
      '松氏集团被指在某项目中存在利益输送'
    ];
    return randomChoice(titles);
  }

  /**
   * 格式化日期
   */
  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // ═══════════════════════════════════════════════
  // 事件处理
  // ═══════════════════════════════════════════════

  /**
   * 处理事件（用户做出决策）
   * @param {string} eventId - 事件ID
   * @param {number} optionIndex - 选择的方案索引
   * @param {Object} gameState - 当前游戏状态
   * @returns {Object} 处理结果
   */
  function processEvent(eventId, optionIndex, gameState) {
    const events = gameState.events?.pending || [];
    const eventIndex = events.findIndex(e => e.id === eventId);

    if (eventIndex === -1) {
      return { success: false, error: '事件不存在' };
    }

    const event = events[eventIndex];
    const option = event.options[optionIndex];

    if (!option) {
      return { success: false, error: '无效的选项' };
    }

    const currentDate = gameState.gameDate?.current || formatDate(new Date());

    // 更新事件状态
    event.status = 'processed';
    event.selectedOption = optionIndex;
    event.processedDate = currentDate;
    event.effects = option.effects;

    // 从待办移到历史
    const newPending = events.filter(e => e.id !== eventId);
    const newHistory = [event, ...(gameState.events?.history || [])];

    // 使用新的效果系统创建效果（支持延迟效果、子公司影响、连锁反应）
    const newEffects = SongEffects.createEffectsFromOption(
      option.effects,
      event.id,
      option.label,
      currentDate,
      gameState
    );

    // 合并到现有效果队列
    const existingEffects = gameState.events?.activeEffects || [];
    const updatedEffects = [...existingEffects, ...newEffects];

    // 应用即时效果（保持向后兼容，即时效果立即生效）
    const stateChanges = applyImmediateEffects(option.effects, gameState);

    return {
      success: true,
      event,
      option,
      stateChanges,
      newPending,
      newHistory,
      newEffects: updatedEffects,
      createdEffects: newEffects
    };
  }

  /**
   * 应用即时影响
   */
  function applyImmediateEffects(effects, gameState) {
    const changes = {};

    if (!effects) return changes;

    // 现金流影响
    if (effects.cashFlow) {
      const currentCash = gameState.company?.cashFlow || 0;
      const change = effects.cashFlow * 10000000; // 每单位=1000万
      changes['company.cashFlow'] = Math.max(0, currentCash + change);
      changes['company.dailyNet'] = (gameState.company?.dailyNet || 0) + change;
    }

    // 能力影响
    if (effects.business) {
      const current = gameState.heir?.abilities?.business || 50;
      changes['heir.abilities.business'] = Math.min(100, Math.max(0, current + effects.business));
    }
    if (effects.decision) {
      const current = gameState.heir?.abilities?.decision || 50;
      changes['heir.abilities.decision'] = Math.min(100, Math.max(0, current + effects.decision));
    }
    if (effects.influence) {
      const current = gameState.heir?.abilities?.influence || 30;
      changes['heir.abilities.influence'] = Math.min(100, Math.max(0, current + effects.influence));
    }
    if (effects.reputation) {
      const current = gameState.heir?.abilities?.reputation || 40;
      changes['heir.abilities.reputation'] = Math.min(100, Math.max(0, current + effects.reputation));
    }
    if (effects.familyTrust) {
      const current = gameState.heir?.abilities?.familyTrust || 60;
      changes['heir.abilities.familyTrust'] = Math.min(100, Math.max(0, current + effects.familyTrust));
    }
    if (effects.employeeTrust) {
      const current = gameState.heir?.abilities?.employeeTrust || 50;
      changes['heir.abilities.employeeTrust'] = Math.min(100, Math.max(0, current + effects.employeeTrust));
    }
    if (effects.riskJudgment) {
      const current = gameState.heir?.abilities?.riskJudgment || 45;
      changes['heir.abilities.riskJudgment'] = Math.min(100, Math.max(0, current + effects.riskJudgment));
    }

    return changes;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    EVENT_TYPES,
    EVENT_CATEGORIES,
    PRIORITY,
    generateDailyEvents,
    processEvent,
    applyImmediateEffects,
    formatMoney
  };
})();
