  border-radius: var(--radius-sm);
}

.skill-info {
  flex: 1;
  min-width: 0;
}

.skill-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.skill-cost {
  font-size: 11px;
  color: var(--color-accent-gold);
  background: rgba(184, 150, 90, 0.15);
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 500;
}

.skill-desc {
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.5;
  margin-bottom: 8px;
}

.skill-unlock-btn {
  font-size: 11px;
  padding: 4px 12px;
}

.skills-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  margin: var(--spacing-md) 0 var(--spacing-sm);
  padding-top: var(--spacing-md);
  border-top: 1px solid var(--color-border);
}

.empty-state-small {
  text-align: center;
  padding: var(--spacing-lg);
  color: var(--color-text-muted);
  font-size: 13px;
}

/* 长期目标 */
.goals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--spacing-md);
}

.goal-card {
  display: flex;
  gap: 12px;
  padding: var(--spacing-md);
  background: var(--color-bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  position: relative;
  transition: all 0.2s;
}

.goal-card.completed {
  border-color: rgba(39, 174, 96, 0.4);
  background: rgba(39, 174, 96, 0.05);
}

.goal-icon {
  font-size: 24px;
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-bg-secondary);
  border-radius: var(--radius-sm);
}

.goal-info {
  flex: 1;
  min-width: 0;
}

.goal-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
  margin-bottom: 4px;
}

.goal-desc {
  font-size: 12px;
  color: var(--color-text-secondary);
  margin-bottom: 8px;
  line-height: 1.4;
}

.goal-progress-bar {
  height: 6px;
  background: var(--color-bg-secondary);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 4px;
}

.goal-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #b8965a, #d4af37);
  border-radius: 3px;
  transition: width 0.5s ease;
}

.goal-card.completed .goal-progress-fill {
  background: linear-gradient(90deg, #27ae60, #2ecc71);
}

.goal-progress-text {
  font-size: 11px;
  color: var(--color-text-muted);
}

.goal-difficulty {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 10px;
}

@media (max-width: 768px) {
  .skills-grid,
  .goals-grid {
    grid-template-columns: 1fr;
  }
}

/* ═══════════════════════════════════════════════
   SVG线性图标样式（方案A）
   ═══════════════════════════════════════════════ */

.goal-icon-svg {
  background: rgba(184, 150, 90, 0.08);
  border: 1px solid rgba(184, 150, 90, 0.2);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.goal-icon-svg svg {
  width: 20px;
  height: 20px;
  stroke: #b8965a;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.goal-card.completed .goal-icon-svg {
  background: rgba(39, 174, 96, 0.1);
  border-color: rgba(39, 174, 96, 0.3);
}

.goal-card.completed .goal-icon-svg svg {
  stroke: #27ae60;
}

.milestone-icon-svg {
  width: 48px;
  height: 48px;
  margin: 0 auto 10px;
  background: rgba(184, 150, 90, 0.08);
  border: 1px solid rgba(184, 150, 90, 0.2);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.milestone-icon-svg svg {
  width: 24px;
  height: 24px;
  stroke: #b8965a;
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.milestone-card.unlocked .milestone-icon-svg {
  background: rgba(184, 150, 90, 0.15);
  border-color: rgba(184, 150, 90, 0.4);
}

.milestone-card.locked .milestone-icon-svg {
  opacity: 0.4;
  background: rgba(255, 255, 255, 0.03);
  border-color: rgba(255, 255, 255, 0.1);
}

.milestone-card.locked .milestone-icon-svg svg {
  stroke: #666;
}

.record-right {
  text-align: right;
}

.record-amount {
  font-size: 14px;
  font-weight: 600;
}

.record-profit {
  font-size: 11px;
  margin-top: 2px;
}

.record-fees {
  font-size: 10px;
  color: var(--color-text-muted);
  margin-top: 2px;
}

/* 交易弹窗中的 warning 文字 */
.trade-value.warning {
  color: #f39c12;
}

.trade-value.warning small {
  font-size: 10px;
  opacity: 0.8;
}

.crisis-action-item.dangerous {
  border-left: 3px solid #e74c3c;
}

.crisis-action-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  gap: 8px;
}

/* 同比环比标签 */
.yoy-tag, .qoq-tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  font-weight: 500;
  vertical-align: middle;
}

.yoy-tag {
  background: rgba(184, 150, 90, 0.15);
  color: #b8965a;
  border: 1px solid rgba(184, 150, 90, 0.3);
}

.qoq-tag {
  background: rgba(107, 117, 136, 0.15);
  color: #8b95a8;
  border: 1px solid rgba(107, 117, 136, 0.3);
}

.yoy-tag.positive, .qoq-tag.positive {
  color: #4a9d7a;
  border-color: rgba(74, 157, 122, 0.3);
  background: rgba(74, 157, 122, 0.1);
}

.yoy-tag.negative, .qoq-tag.negative {
  color: #c75c5c;
  border-color: rgba(199, 92, 92, 0.3);
  background: rgba(199, 92, 92, 0.1);
}

/* 图表图例 */
.chart-legend {
  display: flex;
  gap: 12px;
  padding: 6px 0;
  font-size: 11px;
  color: #8b95a8;
  flex-wrap: wrap;
}

.chart-legend .legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.chart-legend .legend-line {
  width: 12px;
  height: 2px;
  border-radius: 1px;
}

.chart-legend .legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.crisis-action-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
  font-family: var(--font-serif);
}

.crisis-action-desc {
  font-size: 12px;
  color: var(--color-text-secondary);
  font-family: var(--font-serif);
  line-height: 1.5;
  margin-bottom: 8px;
}

.crisis-action-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

.crisis-cost {
  font-size: 11px;
  color: #e67e22;
  font-family: var(--font-serif);
}

.crisis-effect {
  font-size: 11px;
  color: #2ecc71;
  font-family: var(--font-serif);
}

.crisis-action-btn {
  width: 100%;
}

.btn-danger {
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: white;
  border: none;
}

.btn-danger:hover:not(:disabled) {
  background: linear-gradient(135deg, #c0392b, #a93226);
}

.btn-warning {
  background: linear-gradient(135deg, #f1c40f, #d4ac0d);
  color: var(--color-bg-primary);
  border: none;
}

.btn-warning:hover:not(:disabled) {
  background: linear-gradient(135deg, #d4ac0d, #b7950b);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
}

/* 危机处理成功提示动画 */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

@keyframes scaleIn {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* 加载旋转动画 */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.ai-error {
  color: var(--color-danger);
  font-size: 13px;
  padding: var(--spacing-md);
  text-align: center;
  font-family: var(--font-serif);
}

/* 设置页面表单 */
.settings-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-lg);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-xs);
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-primary);
  font-family: var(--font-serif);
  letter-spacing: 0.3px;
}

.form-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  color: var(--color-text-primary);
  font-size: 13px;
  font-family: var(--font-mono);
  transition: border-color var(--transition-fast);
  box-sizing: border-box;
}

.form-input:focus {
  outline: none;
  border-color: var(--color-accent-gold);
}

.form-input::placeholder {
  color: var(--color-text-muted);
}

.form-hint {
  font-size: 11px;
  color: var(--color-text-muted);
  line-height: 1.5;
  font-family: var(--font-serif);
  margin: 0;
}

/* 开关 */
.form-toggle {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
}

.form-toggle input[type="checkbox"] {
  display: none;
}

.toggle-switch {
  width: 44px;
  height: 24px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-light);
  border-radius: 12px;
  position: relative;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.toggle-switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  background: var(--color-text-muted);
  border-radius: 50%;
  transition: all var(--transition-fast);
}

.form-toggle input[type="checkbox"]:checked + .toggle-switch {
  background: var(--color-accent-gold);
  border-color: var(--color-accent-gold);
}

.form-toggle input[type="checkbox"]:checked + .toggle-switch::after {
  left: 22px;
  background: var(--color-bg-primary);
}

.toggle-label {
  font-size: 12px;
  color: var(--color-text-secondary);
  font-family: var(--font-serif);
}

/* 表单按钮 */
.form-actions {
  display: flex;
  gap: var(--spacing-sm);
  flex-wrap: wrap;
}

.btn {
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-family: var(--font-serif);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  border: none;
  letter-spacing: 0.3px;
}

.btn-primary {
  background: var(--color-accent-gold-gradient);
  color: var(--color-bg-primary);
}

.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--color-bg-elevated);
  color: var(--color-text-primary);
  border: 1px solid var(--color-border-light);
}

.btn-secondary:hover {
  border-color: var(--color-accent-gold);
  color: var(--color-accent-gold);
}

.btn-danger {
  background: transparent;
  color: var(--color-danger);
  border: 1px solid var(--color-danger);
}

.btn-danger:hover {
  background: var(--color-danger);
  color: var(--color-bg-primary);
}

/* 表单结果 */
.form-result {
  padding: var(--spacing-sm) var(--spacing-md);
  border-radius: var(--radius-md);
  font-size: 12px;
  font-family: var(--font-serif);
  line-height: 1.6;
}

.form-result-info {
  background: rgba(91, 142, 185, 0.1);
  color: var(--color-info);
  border: 1px solid var(--color-info);
}

.form-result-success {
  background: rgba(76, 175, 125, 0.1);
  color: var(--color-success);
  border: 1px solid var(--color-success);
}

.form-result-error {
  background: rgba(200, 85, 85, 0.1);
  color: var(--color-danger);
  border: 1px solid var(--color-danger);
}

/* 数据信息 */
.data-info {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--spacing-sm);
  margin-top: var(--spacing-sm);
}

.data-info-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--spacing-sm);
  background: var(--color-bg-elevated);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-light);
}

.data-info-label {
  font-size: 11px;
  color: var(--color-text-muted);
  font-family: var(--font-serif);
}

.data-info-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-primary);
  font-family: var(--font-mono);
}

/* 关于 */
.about-content {
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.8;
  font-family: var(--font-serif);
}

.about-content p {
  margin: 0 0 var(--spacing-xs) 0;
}

.about-content strong {
  color: var(--color-accent-gold);
  font-size: 14px;
}

/* 响应式 */
@media (max-width: 480px) {
  .data-info {
    grid-template-columns: 1fr;
  }

  .form-actions {
    flex-direction: column;
  }

  .form-actions .btn {
    width: 100%;
  }
}

/* ═══════════════════════════════════════════════
   私人管家样式
   ═══════════════════════════════════════════════ */

.butler-entry-card {
  cursor: pointer;
  transition: all 0.2s ease;
  margin-bottom: var(--spacing-md);
  border: 1px solid rgba(212, 175, 55, 0.2);
}

.butler-entry-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(212, 175, 55, 0.15);
  border-color: rgba(212, 175, 55, 0.4);
}

.butler-entry-content {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
}

.butler-entry-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
  border-radius: var(--radius-md);
  color: var(--color-accent-gold);
}

.butler-entry-info {
  flex: 1;
}

.butler-entry-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text-primary);
  margin: 0 0 2px 0;
  font-family: var(--font-serif);
}

.butler-entry-subtitle {
  font-size: 12px;
  color: var(--color-text-muted);
  margin: 0;
}

.butler-entry-arrow {
  color: var(--color-text-muted);
}

.butler-header {
  position: relative;
  padding-left: 80px;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.butler-header .btn-back {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-family: var(--font-serif);
  white-space: nowrap;
}

.butler-header .btn-back:hover {
  color: var(--color-accent-gold);
  border-color: var(--color-accent-gold);
}

.butler-header-title {
  text-align: center;
}

.butler-tabs {
  display: flex;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-md);
  background: var(--color-bg-elevated);
  padding: 4px;
  border-radius: var(--radius-md);
}

.butler-tab-btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  background: transparent;
  color: var(--color-text-secondary);
  font-size: 14px;
  font-family: var(--font-serif);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.butler-tab-btn svg {
  flex-shrink: 0;
}

.butler-tab-btn.active {
  background: var(--color-accent-gold);
  color: var(--color-bg-primary);
  font-weight: 600;
}

.butler-tab-btn:hover:not(.active) {
  background: rgba(255, 255, 255, 0.05);
}

.manual-card {
  margin-bottom: var(--spacing-md);
}

.manual-content {
  padding: var(--spacing-md);
}

.manual-text {
  font-size: 14px;
  line-height: 1.8;
  color: var(--color-text-secondary);
  font-family: var(--font-serif);
  white-space: pre-wrap;
}

.manual-placeholder {
  text-align: center;
  padding: var(--spacing-xl) var(--spacing-md);
}

.placeholder-icon {
  font-size: 48px;
  margin-bottom: var(--spacing-md);
}

.placeholder-text {
  font-size: 16px;
  color: var(--color-text-secondary);
  font-family: var(--font-serif);
  margin: 0 0 var(--spacing-xs) 0;
}

.placeholder-hint {
  font-size: 12px;
  color: var(--color-text-muted);
  margin: 0;
}

.journal-section {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
}

.journal-input-card {
  margin-bottom: 0;
}

.journal-date {
  font-size: 12px;
  color: var(--color-text-muted);
  font-family: var(--font-mono);
}

.journal-textarea {
  width: 100%;
  min-height: 120px;
  padding: var(--spacing-md);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-text-primary);
  font-size: 15px;
  line-height: 1.8;
  font-family: var(--font-handwriting);
  resize: vertical;
  margin-bottom: var(--spacing-md);
  box-sizing: border-box;
}

.journal-textarea:focus {
  outline: none;
  border-color: var(--color-accent-gold);
}

.journal-textarea::placeholder {
  color: var(--color-text-muted);
  font-family: var(--font-sans);
}

.journal-actions {
  display: flex;
  gap: var(--spacing-sm);
  flex-wrap: wrap;
}

.journal-actions .btn {
  flex: 1;
  min-width: 120px;
}

.ai-organize-result {
  margin-top: var(--spacing-md);
  padding: var(--spacing-md);
  background: var(--color-bg-elevated);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--color-accent-gold);
}

.ai-organized-content {
  position: relative;
}

.ai-organized-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-sm);
}

.ai-organized-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--color-accent-gold);
  font-family: var(--font-serif);
}

.ai-organized-copy {
  background: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text-secondary);
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
}

.ai-organized-copy:hover {
  border-color: var(--color-accent-gold);
  color: var(--color-accent-gold);
}

.ai-organized-text {
  font-size: 14px;
  line-height: 1.8;
  color: var(--color-text-secondary);
  font-family: var(--font-serif);
  white-space: pre-wrap;
}

.ai-loading {
  text-align: center;
  padding: var(--spacing-md);
  color: var(--color-text-muted);
  font-size: 14px;
}

.ai-error {
  color: var(--color-danger);
  font-size: 14px;
  text-align: center;
  padding: var(--spacing-md);
}

.journal-history-card {
  margin-bottom: 0;
}

.journal-list {
  max-height: 500px;
  overflow-y: auto;
}

.journal-item {
  padding: var(--spacing-md);
  border-bottom: 1px solid var(--color-border);
}

.journal-item:last-child {
  border-bottom: none;
}

.journal-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-xs);
}

.journal-item-date {
  font-size: 12px;
  color: var(--color-accent-gold);
  font-family: var(--font-mono);
  font-weight: 600;
}

.journal-item-delete {
  background: transparent;
  border: none;
  color: var(--color-text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
}

.journal-item-delete:hover {
  color: var(--color-danger);
  background: rgba(231, 76, 60, 0.1);
}

.journal-item-content {
  font-size: 14px;
  line-height: 1.8;
  color: var(--color-text-secondary);
  font-family: var(--font-handwriting);
  white-space: pre-wrap;
}

.journal-empty {
  text-align: center;
  padding: var(--spacing-xl);
  color: var(--color-text-muted);
  font-size: 14px;
}

/* ═══════════════════════════════════════
   资产页面 - 二级Tab导航
   ═══════════════════════════════════════ */
.assets-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: var(--spacing-md);
  padding: 4px;
  background: var(--color-bg-secondary);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.assets-tab {
  flex: 1;
  min-width: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 12px;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.assets-tab:hover {
  background: var(--color-bg-card);
  color: var(--color-text-primary);
}

.assets-tab.active {
  background: var(--color-bg-card);
  color: var(--color-accent-gold);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.assets-tab .tab-icon {
  display: flex;
  align-items: center;
  justify-content: center;
}

.assets-tab .tab-label {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}

.assets-sub-content {
  min-height: 400px;
}

/* ═══════════════════════════════════════
   页面头部 - 带操作按钮
   ═══════════════════════════════════════ */
.page-header-with-action {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--spacing-md);
}

.page-header-with-action > div:first-child {
  flex: 1;
}

.header-action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
  margin-top: 4px;
}

.header-action-btn:hover {
  color: var(--color-accent-gold);
  border-color: var(--color-accent-gold);
  background: rgba(184, 150, 90, 0.1);
}

.header-action-btn:active {
  transform: scale(0.95);
}

/* ═══════════════════════════════════════════════
   折叠式公司卡片
   ═══════════════════════════════════════════════ */
.company-card-collapsible {
  cursor: pointer;
  transition: all 0.2s ease;
}

.company-card-collapsible:hover {
  border-color: var(--color-accent-gold);
}

.company-card-header {

  <script>

/* ===== js/storage.js ===== */
/**
 * 松氏家族办公室 - 数据存储层
 * 基于自定义 APP 宿主 API (window.AiPhone) 封装私有数据读写
 * 所有数据序列化为 JSON 存储在 KV 中
 */

const SongStorage = (function () {
  'use strict';

  // 存储键前缀
  const KEY_PREFIX = 'song_family_office_';
  const KEYS = {
    GAME_STATE: KEY_PREFIX + 'game_state',
    COMPANY_DATA: KEY_PREFIX + 'company_data',
    STOCK_MARKET: KEY_PREFIX + 'stock_market',
    INVESTMENTS: KEY_PREFIX + 'investments',
    EVENTS: KEY_PREFIX + 'events',
    HEIR_DATA: KEY_PREFIX + 'heir_data',
    SETTINGS: KEY_PREFIX + 'settings',
    META: KEY_PREFIX + 'meta'
  };

  // 内存缓存
  const cache = {};
  let initialized = false;
  let storageMode = 'memory'; // 'supabase' | 'host' | 'localStorage' | 'memory'

  // ═══════════════════════════════════════════════
  // 自动备份与数据完整性校验
  // ═══════════════════════════════════════════════

  const BACKUP_KEY_PREFIX = KEY_PREFIX + 'backup_';
  const MAX_BACKUPS = 3;
  const BACKUP_INTERVAL = 10; // 每10次写入操作自动备份一次
  let writeOperationCount = 0;
  let memoryModeWarningShown = false;

  /**
   * 创建自动备份（存储在 localStorage，作为额外保障）
   */
  function createBackup() {
    try {
      if (!hasLocalStorage()) return false;

      const backupData = {
        timestamp: new Date().toISOString(),
        storageMode: storageMode,
        data: {}
      };

      // 从缓存中复制所有数据
      for (const key of Object.values(KEYS)) {
        if (cache[key] !== undefined) {
          backupData.data[key] = deepClone(cache[key]);
        }
      }

      // 轮换备份：backup_1 → backup_2 → backup_3
      for (let i = MAX_BACKUPS; i > 1; i--) {
        const oldKey = BACKUP_KEY_PREFIX + (i - 1);
        const newKey = BACKUP_KEY_PREFIX + i;
        const oldData = localStorage.getItem(oldKey);
        if (oldData) {
          localStorage.setItem(newKey, oldData);
        }
      }

      // 写入最新备份
      localStorage.setItem(BACKUP_KEY_PREFIX + '1', JSON.stringify(backupData));
      console.log('[SongStorage] 自动备份已创建，当前缓存数据量:', Object.keys(cache).length);
      return true;
    } catch (e) {
      console.warn('[SongStorage] 自动备份失败:', e.message);
      return false;
    }
  }

  /**
   * 从最近的备份恢复数据
   * @returns {boolean} 是否恢复成功
   */
  function restoreFromBackup() {
    try {
      if (!hasLocalStorage()) return false;

      for (let i = 1; i <= MAX_BACKUPS; i++) {
        const backupKey = BACKUP_KEY_PREFIX + i;
        const raw = localStorage.getItem(backupKey);
        if (!raw) continue;

        try {
          const backupData = JSON.parse(raw);
          if (backupData && backupData.data && typeof backupData.data === 'object') {
            // 恢复缓存
            for (const [key, value] of Object.entries(backupData.data)) {
              cache[key] = deepClone(value);
            }
            console.log('[SongStorage] 从备份恢复成功，备份时间:', backupData.timestamp);
            return true;
          }
        } catch (parseError) {
          console.warn('[SongStorage] 备份解析失败，尝试下一个:', parseError.message);
        }
      }
      return false;
    } catch (e) {
      console.warn('[SongStorage] 从备份恢复失败:', e.message);
      return false;
    }
  }

  /**
   * 校验数据完整性
   * @param {*} data - 待校验的数据
   * @returns {boolean} 是否完整
   */
  function validateDataIntegrity(data) {
    if (data === null || data === undefined) return true; // 空数据视为有效（新游戏）
    if (typeof data !== 'object') return true; // 非对象数据不校验
    if (data instanceof Date) return true;
    if (Array.isArray(data)) return true;

    // 检查是否有循环引用或异常结构
    try {
      JSON.stringify(data);
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 显示内存模式数据导出提示
   */
  function showMemoryModeWarning() {
    if (memoryModeWarningShown) return;
    memoryModeWarningShown = true;

    // 延迟5秒显示，避免影响启动
    setTimeout(() => {
      if (typeof SongUIFeedback !== 'undefined' && typeof SongUIFeedback.toastWarning === 'function') {
        SongUIFeedback.toastWarning('当前使用内存模式，刷新页面数据会丢失，建议在设置中导出数据备份', 6000);
      } else if (typeof SongApp !== 'undefined' && typeof SongApp.showToast === 'function') {
        SongApp.showToast('当前使用内存模式，刷新页面数据会丢失，建议导出数据备份');
      }
      console.warn('[SongStorage] 内存模式提示：数据仅在内存中，刷新后丢失');
    }, 5000);
  }

  /**
   * 检查宿主 API 是否可用
   */
  function hasHostApi() {
    return typeof window !== 'undefined' && 
           window.AiPhone && 
           typeof window.AiPhone.app === 'object' &&
           window.AiPhone.app.data &&
           typeof window.AiPhone.app.data.get === 'function' &&
           typeof window.AiPhone.app.data.set === 'function';
  }

  /**
   * 检查 localStorage 是否可用
   */
  function hasLocalStorage() {
    try {
      const testKey = '__song_storage_test__';
      localStorage.setItem(testKey, 'test');
      localStorage.removeItem(testKey);
      return true;
    } catch (e) {
      return false;
    }
  }

  /**
   * 获取当前存储模式
   */
  function getStorageMode() {
    return storageMode;
  }

  /**
   * 初始化存储层
   * 优先级：Supabase > 宿主 API > localStorage > 内存
   */
  async function init() {
    if (initialized) return;

    // 1. 优先尝试 Supabase（云端持久化）
    try {
      if (typeof SongSupabase !== 'undefined') {
        const supabaseAvailable = await SongSupabase.init();
        if (supabaseAvailable) {
          storageMode = 'supabase';
          // 预热缓存：从云端批量读取所有数据
          const allData = await SongSupabase.getAll();
          for (const [key, value] of Object.entries(allData)) {
            cache[key] = value;
          }
          initialized = true;
          console.log('[SongStorage] 存储层初始化完成（Supabase 云端模式，数据已同步）');
          return;
        }
      }
    } catch (e) {
      console.warn('[SongStorage] Supabase 初始化失败，降级:', e.message);
    }

    // 2. 尝试宿主 API
    if (hasHostApi()) {
      storageMode = 'host';
      try {
        // 预热缓存：读取所有已知键
        const keysToLoad = Object.values(KEYS);
        for (const key of keysToLoad) {
          try {
            const data = await window.AiPhone.app.data.get(key);
            if (data !== null && data !== undefined) {
              cache[key] = typeof data === 'string' ? JSON.parse(data) : data;
            }
          } catch (e) {
            // 键不存在时忽略
          }
        }
        initialized = true;
        console.log('[SongStorage] 存储层初始化完成（宿主 API 模式）');
        return;
      } catch (e) {
        console.error('[SongStorage] 宿主 API 初始化失败，降级:', e);
      }
    }

    // 3. 尝试 localStorage
    if (hasLocalStorage()) {
      storageMode = 'localStorage';
      initialized = true;
      console.log('[SongStorage] 存储层初始化完成（localStorage 模式）');
      return;
    }

    // 4. 纯内存存储（最后降级）
    storageMode = 'memory';
    initialized = true;
    console.warn('[SongStorage] 存储层初始化完成（纯内存模式，刷新页面数据会丢失）');
    // 显示内存模式数据导出提示
    showMemoryModeWarning();
  }

  /**
   * 读取数据
   * @param {string} key - 存储键（使用 KEYS 常量）
   * @param {*} defaultValue - 默认值
   * @returns {Promise<*>} 解析后的数据
   */
  async function get(key, defaultValue = null) {
    // 先查缓存
    if (cache[key] !== undefined) {
      // 校验缓存数据完整性
      if (!validateDataIntegrity(cache[key])) {
        console.warn('[SongStorage] 缓存数据损坏，尝试从备份恢复:', key);
        delete cache[key];
        restoreFromBackup();
        if (cache[key] !== undefined) {
          return deepClone(cache[key]);
        }
      } else {
        return deepClone(cache[key]);
      }
    }

    // 纯内存模式：直接返回默认值
    if (storageMode === 'memory') {
      return defaultValue;
    }

    // Supabase 云端模式
    if (storageMode === 'supabase') {
      try {
        const data = await SongSupabase.get(key, defaultValue);
        if (data !== null && data !== undefined) {
          cache[key] = data;
          return deepClone(data);
        }
      } catch (e) {
        console.error('[SongStorage] Supabase 读取失败:', key, e.message);
      }
      return defaultValue;
    }

    // localStorage 模式
    if (storageMode === 'localStorage') {
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const data = JSON.parse(raw);
          cache[key] = data;
          return deepClone(data);
        }
      } catch (e) {
        console.error('[SongStorage] localStorage 读取失败:', e);
      }
      return defaultValue;
    }

    // 宿主 API 模式
    try {
      const data = await window.AiPhone.app.data.get(key);
      if (data === null || data === undefined) {
        return defaultValue;
      }
      const parsed = typeof data === 'string' ? JSON.parse(data) : data;
      cache[key] = parsed;
      return deepClone(parsed);
    } catch (e) {
      console.error('[SongStorage] 读取失败:', key, e);
      return defaultValue;
    }
  }

  /**
   * 写入数据
   * @param {string} key - 存储键
   * @param {*} value - 要存储的数据（会被 JSON 序列化）
   * @returns {Promise<boolean>} 是否成功
   */
  async function set(key, value) {
    // 数据完整性校验
    if (!validateDataIntegrity(value)) {
      console.warn('[SongStorage] 数据完整性校验失败，拒绝写入:', key);
      return false;
    }

    // 更新缓存
    cache[key] = deepClone(value);

    // 增加写入操作计数，达到阈值时自动备份
    writeOperationCount++;
    if (writeOperationCount >= BACKUP_INTERVAL) {
      writeOperationCount = 0;
      // 异步执行备份，不阻塞写入
      setTimeout(() => createBackup(), 0);
    }

    // 纯内存模式：只更新缓存
    if (storageMode === 'memory') {
      return true;
    }

    // Supabase 云端模式
    if (storageMode === 'supabase') {
      try {
        return await SongSupabase.set(key, value);
      } catch (e) {
        console.error('[SongStorage] Supabase 写入失败:', key, e.message);
        return false;
      }
    }

    const serialized = JSON.stringify(value);

    // localStorage 模式
    if (storageMode === 'localStorage') {
      try {
        localStorage.setItem(key, serialized);
        return true;
      } catch (e) {
        console.error('[SongStorage] localStorage 写入失败:', e);
        return false;
      }
    }

    // 宿主 API 模式
    try {
      await window.AiPhone.app.data.set(key, serialized);
      return true;
    } catch (e) {
      console.error('[SongStorage] 写入失败:', key, e);
      return false;
    }
  }

  /**
   * 删除数据
   * @param {string} key - 存储键
   * @returns {Promise<boolean>}
   */
  async function remove(key) {
    delete cache[key];

    // 纯内存模式：只删除缓存
    if (storageMode === 'memory') {
      return true;
    }

    // Supabase 云端模式
    if (storageMode === 'supabase') {
      try {
        return await SongSupabase.remove(key);
      } catch (e) {
        console.error('[SongStorage] Supabase 删除失败:', key, e.message);
        return false;
      }
    }

    // localStorage 模式
    if (storageMode === 'localStorage') {
      try {
        localStorage.removeItem(key);
        return true;
      } catch (e) {
        return false;
      }
    }

    // 宿主 API 模式
    try {
      await window.AiPhone.app.data.remove(key);
      return true;
    } catch (e) {
      console.error('[SongStorage] 删除失败:', key, e);
      return false;
    }
  }

  /**
   * 深拷贝
   */
  function deepClone(obj) {
    if (obj === null || obj === undefined) return obj;
    if (typeof obj !== 'object') return obj;
    if (obj instanceof Date) return new Date(obj.getTime());
    if (obj instanceof Array) return obj.map(item => deepClone(item));
    const cloned = {};
    for (const key in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, key)) {
        cloned[key] = deepClone(obj[key]);
      }
    }
    return cloned;
  }

  /**
   * 导出全部数据（用于备份）
   */
  async function exportAll() {
    const result = {};
    for (const key of Object.values(KEYS)) {
      result[key] = await get(key, null);
    }
    return result;
  }

  /**
   * 导入全部数据（用于恢复）
   */
  async function importAll(data) {
    if (!data || typeof data !== 'object') return false;
    for (const [key, value] of Object.entries(data)) {
      if (key.startsWith(KEY_PREFIX)) {
        await set(key, value);
      }
    }
    return true;
  }

  /**
   * 清除全部数据（重置游戏）
   */
  async function clearAll() {
    for (const key of Object.values(KEYS)) {
      await remove(key);
    }
    Object.keys(cache).forEach(key => delete cache[key]);
    return true;
  }

  // 公开 API
  return {
    KEYS,
    init,
    get,
    set,
    remove,
    exportAll,
    importAll,
    clearAll,
    getStorageMode,
    isInitialized: () => initialized,
    // 备份与恢复
    createBackup,
    restoreFromBackup,
    validateDataIntegrity
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongStorage = SongStorage;
}

  // 内存缓存
  const cache = {};
  let initialized = false;
  let available = false;

  // ═══════════════════════════════════════════════
  // 请求头
  // ═══════════════════════════════════════════════

  function getHeaders() {
    return {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    };
  }

  // ═══════════════════════════════════════════════
  // 初始化
  // ═══════════════════════════════════════════════

  async function init() {
    if (initialized) return available;

    try {
      // 添加 3 秒超时，避免在 float 壳子或网络不好时卡住
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000);

      // 测试连接：尝试读取一条不存在的数据，不报错就说明可用
      const response = await fetch(`${API_BASE}/app_data?app_id=eq.${APP_ID}&limit=1`, {
        method: 'GET',
        headers: getHeaders(),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (response.ok) {
        available = true;
        console.log('[SongSupabase] 连接成功，数据持久化已启用');
      } else {
        available = false;
        console.warn('[SongSupabase] 连接失败，状态码:', response.status);
      }
    } catch (e) {
      available = false;
      if (e.name === 'AbortError') {
        console.warn('[SongSupabase] 连接超时（3秒），降级到本地模式');
      } else {
        console.warn('[SongSupabase] 连接失败:', e.message);
      }
    }

    initialized = true;
    return available;
  }

  // ═══════════════════════════════════════════════
  // 读取数据
  // ═══════════════════════════════════════════════

  async function get(key, defaultValue = null) {
    // 先查缓存
    if (cache[key] !== undefined) {
      return deepClone(cache[key]);
    }

    if (!available) {
      return defaultValue;
    }

    try {
      const response = await fetch(
        `${API_BASE}/app_data?app_id=eq.${APP_ID}&data_key=eq.${encodeURIComponent(key)}&select=data_value`,
        {
          method: 'GET',
          headers: getHeaders()
        }
      );

      if (response.ok) {
        const data = await response.json();
        if (data && data.length > 0 && data[0].data_value !== null && data[0].data_value !== undefined) {
          cache[key] = data[0].data_value;
          return deepClone(data[0].data_value);
        }
      }
    } catch (e) {
      console.error('[SongSupabase] 读取失败:', key, e.message);
    }

    return defaultValue;
  }

  // ═══════════════════════════════════════════════
  // 写入数据（upsert）
  // ═══════════════════════════════════════════════

  async function set(key, value) {
    // 更新缓存
    cache[key] = deepClone(value);

    if (!available) {
      return false;
    }

    try {
      // 先尝试更新
      const updateResponse = await fetch(
        `${API_BASE}/app_data?app_id=eq.${APP_ID}&data_key=eq.${encodeURIComponent(key)}`,
        {
          method: 'PATCH',
          headers: {
            ...getHeaders(),
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({
            data_value: value
          })
        }
      );

      // 如果更新成功且有返回数据，说明记录存在
      if (updateResponse.ok) {
        const updated = await updateResponse.json();
        if (updated && updated.length > 0) {
          return true;
        }
      }

      // 如果没有更新到记录，说明不存在，执行插入
      const insertResponse = await fetch(`${API_BASE}/app_data`, {
        method: 'POST',
        headers: {
          ...getHeaders(),
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          app_id: APP_ID,
          data_key: key,
          data_value: value
        })
      });

      if (insertResponse.ok) {
        return true;
      } else {
        const errorText = await insertResponse.text();
        console.error('[SongSupabase] 插入失败:', key, errorText);
        return false;
      }
    } catch (e) {
      console.error('[SongSupabase] 写入失败:', key, e.message);
      return false;
    }
  }

  // ═══════════════════════════════════════════════
  // 删除数据
  // ═══════════════════════════════════════════════

  async function remove(key) {
    delete cache[key];

    if (!available) {
      return false;
    }

    try {
      const response = await fetch(
        `${API_BASE}/app_data?app_id=eq.${APP_ID}&data_key=eq.${encodeURIComponent(key)}`,
        {
          method: 'DELETE',
          headers: getHeaders()
        }
      );

      return response.ok;
    } catch (e) {
      console.error('[SongSupabase] 删除失败:', key, e.message);
      return false;
    }
  }

  // ═══════════════════════════════════════════════
  // 批量读取所有数据
  // ═══════════════════════════════════════════════

  async function getAll() {
    if (!available) {
      return {};
    }

    try {
      // 添加 5 秒超时
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      const response = await fetch(
        `${API_BASE}/app_data?app_id=eq.${APP_ID}&select=data_key,data_value`,
        {
          method: 'GET',
          headers: getHeaders(),
          signal: controller.signal
        }
      );

      clearTimeout(timeoutId);

      if (response.ok) {
        const data = await response.json();
        const result = {};
        for (const item of data) {
          if (item.data_key && item.data_value !== null && item.data_value !== undefined) {
            result[item.data_key] = item.data_value;
            cache[item.data_key] = item.data_value;
          }
        }
        return result;
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        console.warn('[SongSupabase] 批量读取超时，使用空数据启动');
      } else {
        console.error('[SongSupabase] 批量读取失败:', e.message);
      }
    }

    return {};
  }

  // ═══════════════════════════════════════════════
  // 清除所有数据
  // ═══════════════════════════════════════════════

  async function clearAll() {
    Object.keys(cache).forEach(key => delete cache[key]);

    if (!available) {
      return false;
    }

    try {
      const response = await fetch(
        `${API_BASE}/app_data?app_id=eq.${APP_ID}`,
        {
          method: 'DELETE',
          headers: getHeaders()
        }
      );

      return response.ok;
    } catch (e) {
      console.error('[SongSupabase] 清除失败:', e.message);
      return false;
    }
  }

  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function deepClone(obj) {
    if (obj === null || obj === undefined) return obj;
    if (typeof obj !== 'object') return obj;
    if (obj instanceof Date) return new Date(obj.getTime());
    if (obj instanceof Array) return obj.map(item => deepClone(item));
    const cloned = {};
    for (const key in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, key)) {
        cloned[key] = deepClone(obj[key]);
      }
    }
    return cloned;
  }

  function isAvailable() {
    return available;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    init,
    get,
    set,
    remove,
    getAll,
    clearAll,
    isAvailable,
    getConfig: () => ({
      url: SUPABASE_URL,
      appId: APP_ID
    })
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongSupabase = SongSupabase;
}

      assetsTab: 'company'        // 资产页当前激活的Tab
    }
  };

  // 订阅者列表
  const subscribers = new Set();
  let initialized = false;

  /**
   * 初始化状态：从存储加载数据
   */
  async function init() {
    if (initialized) return;

    try {
      // 从存储加载各模块数据
      const [meta, gameDate, company, subsidiaries, stockMarket, investments, events, heir, settings] = await Promise.all([

      if (state.stockMarket && state.stockMarket.stocks && state.stockMarket.stocks.length > 0) {

          } catch (e) {

      if (!state.meta.createdAt) {
        state.meta.createdAt = new Date().toISOString();

      initialized = true;
      console.log('[SongState] 状态初始化完成');

      throw e;
    }

  /**
   * 获取状态（只读副本）
   */
  function getState() {
    return JSON.parse(JSON.stringify(state));
  }

  /**
   * 获取状态的某个部分
   */
  function get(path) {
    const parts = path.split('.');
    let result = state;
    for (const part of parts) {
      if (result && typeof result === 'object' && part in result) {
        result = result[part];
      } else {
        return undefined;
      }
    }
    return JSON.parse(JSON.stringify(result));
  }

  /**
   * 更新状态
   * @param {string} path - 状态路径，如 'company.cashFlow'
   * @param {*} value - 新值
   * @param {boolean} persist - 是否持久化到存储
   */
  async function update(path, value, persist = true) {
    const parts = path.split('.');
    const lastKey = parts.pop();
    let target = state;

    for (const part of parts) {
      if (!target[part] || typeof target[part] !== 'object') {
        target[part] = {};
      }
      target = target[part];
    }

    target[lastKey] = value;

    // 通知订阅者
    notify(path, value);

    // 持久化
    if (persist) {
      await persistPath(path);
    }
  }

  /**
   * 批量更新状态
   */
  async function batchUpdate(updates, persist = true) {
    for (const [path, value] of Object.entries(updates)) {
      const parts = path.split('.');
      const lastKey = parts.pop();
      let target = state;
      for (const part of parts) {
        if (!target[part] || typeof target[part] !== 'object') {
          target[part] = {};
        }
        target = target[part];
      }
      target[lastKey] = value;
      notify(path, value);
    }

    if (persist) {
      await persistAll();
    }
  }

  /**
   * 持久化某个路径对应的数据
   */
  async function persistPath(path) {
    const topLevel = path.split('.')[0];
    const keyMap = {
      meta: SongStorage.KEYS.META,
      gameDate: SongStorage.KEYS.GAME_STATE,
      company: SongStorage.KEYS.COMPANY_DATA + '_overview',
      subsidiaries: SongStorage.KEYS.COMPANY_DATA + '_subsidiaries',
      stockMarket: SongStorage.KEYS.STOCK_MARKET,
      investments: SongStorage.KEYS.INVESTMENTS,
      events: SongStorage.KEYS.EVENTS,
      heir: SongStorage.KEYS.HEIR_DATA,
      settings: SongStorage.KEYS.SETTINGS
    };

    const key = keyMap[topLevel];
    if (key) {
      await SongStorage.set(key, state[topLevel]);
    }
  }

  /**
   * 持久化全部数据
   */
  async function persistAll() {
    await Promise.all([
      SongStorage.set(SongStorage.KEYS.META, state.meta),
      SongStorage.set(SongStorage.KEYS.GAME_STATE, state.gameDate),
      SongStorage.set(SongStorage.KEYS.COMPANY_DATA + '_overview', state.company),
      SongStorage.set(SongStorage.KEYS.COMPANY_DATA + '_subsidiaries', state.subsidiaries),
      SongStorage.set(SongStorage.KEYS.STOCK_MARKET, state.stockMarket),
      SongStorage.set(SongStorage.KEYS.INVESTMENTS, state.investments),
      SongStorage.set(SongStorage.KEYS.EVENTS, state.events),
      SongStorage.set(SongStorage.KEYS.HEIR_DATA, state.heir),
      SongStorage.set(SongStorage.KEYS.SETTINGS, state.settings)
    ]);
  }

  /**
   * 订阅状态变更
   * @param {Function} callback - 回调函数 (path, value) => void
   * @returns {Function} 取消订阅函数
   */
  function subscribe(callback) {
    subscribers.add(callback);
    return () => subscribers.delete(callback);
  }

  /**
   * 通知所有订阅者
   */
  function notify(path, value) {
    for (const callback of subscribers) {
      try {
        callback(path, value);
      } catch (e) {
        console.error('[SongState] 订阅者回调失败:', e);
      }
    }
  }

  /**
   * 重置游戏状态
   */
  async function reset() {
    const defaultState = {
      meta: { version: '0.1.0', createdAt: new Date().toISOString(), lastPlayedAt: null, totalPlayDays: 0 },
      gameDate: { current: null, dayOfWeek: null, realLastOpenAt: null },
      company: { totalAssets: 5000000000, cashFlow: 800000000, dailyRevenue: 0, dailyExpense: 0, dailyNet: 0, marketIndex: 1000 },
      subsidiaries: [],
      stockMarket: { stocks: [], marketIndex: 1000, news: [] },
      investments: { portfolio: [], funds: [], totalValue: 0, totalCost: 0, totalReturn: 0 },
      events: { pending: [], history: [], activeEffects: [] },
      heir: {
        name: '松庭', title: '松家长女 / 继承人',
        abilities: { business: 50, decision: 50, influence: 30, reputation: 40, familyTrust: 60, employeeTrust: 50, riskJudgment: 45 },
        decisions: [], milestones: []
      },
      settings: { autoAdvanceDate: true, aiDailyNewsLimit: 3, aiGeneratedToday: 0, soundEnabled: true, animationsEnabled: true }
    };

    state = JSON.parse(JSON.stringify(defaultState));
    await SongStorage.clearAll();
    await persistAll();
    notify('reset', null);
  }

  // 公开 API
  return {
    init,
    getState,
    get,
    update,
    batchUpdate,
    persistAll,
    subscribe,
    reset,
    isInitialized: () => initialized
  };
})();

  window.SongState = SongState;

/**
 * 松氏家族办公室 - 游戏日期系统
 * 负责游戏内日期的推进、星期计算、日期格式化
 * 设计：每次打开 APP 时检查真实时间，自动推进游戏日期
 *       真实 1 天 = 游戏 1 天（可配置）
 */

const SongDate = (function () {
  'use strict';

  // 星期名称
  const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const WEEKDAYS_SHORT = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  // 月份名称
  const MONTHS = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];

  // 游戏起始日期（松庭正式参与家族事务的日期）
  const DEFAULT_START_DATE = '2026-01-01';

  /**
   * 初始化日期系统
   * 检查上次打开时间，自动推进游戏日期
   * 新游戏起始日期 = 现实当前日期（北京时间）
   * 旧存档日期过旧时自动同步为现实日期
   */
  async function init() {
    const gameDate = SongState.get('gameDate');
    const now = new Date();
    const nowStr = formatDate(now);

    // 如果是新游戏，设置起始日期为现实当前日期
    if (!gameDate.current) {
      const startDate = new Date(); // 现实当前日期
      await SongState.batchUpdate({
        'gameDate.current': formatDate(startDate),
        'gameDate.dayOfWeek': WEEKDAYS[startDate.getDay()],
        'gameDate.realLastOpenAt': now.toISOString(),
        'gameDate.startDate': formatDate(startDate), // 记录游戏开始的现实日期
        'gameDate.syncedToReality': true
      });
      console.log('[SongDate] 新游戏，起始日期（同步现实）:', formatDate(startDate));
      return;
    }

    // 检查游戏日期是否过旧（与现实日期差距超过7天），自动同步
    const currentGameDate = new Date(gameDate.current);
    const daysBehind = Math.floor((now - currentGameDate) / (1000 * 60 * 60 * 24));

    if (daysBehind > 7) {
      console.log(`[SongDate] 检测到游戏日期落后现实 ${daysBehind} 天，自动同步至现实日期`);
      await syncToReality(false); // 自动同步，不显示提示
      return;
    }

    // 计算距离上次打开的真实天数
    if (gameDate.realLastOpenAt) {
      const lastOpen = new Date(gameDate.realLastOpenAt);
      const daysDiff = Math.floor((now - lastOpen) / (1000 * 60 * 60 * 24));

      if (daysDiff > 0) {
        // 推进游戏日期
        const currentGameDate = new Date(gameDate.current);
        currentGameDate.setDate(currentGameDate.getDate() + daysDiff);

        const newDateStr = formatDate(currentGameDate);
        const newDayOfWeek = WEEKDAYS[currentGameDate.getDay()];

        await SongState.batchUpdate({
          'gameDate.current': newDateStr,
          'gameDate.dayOfWeek': newDayOfWeek,
          'gameDate.realLastOpenAt': now.toISOString()
        });

        // 更新总游戏天数
        const totalPlayDays = (SongState.get('meta.totalPlayDays') || 0) + daysDiff;
        await SongState.update('meta.totalPlayDays', totalPlayDays);

        console.log(`[SongDate] 日期推进 ${daysDiff} 天，当前游戏日期: ${newDateStr}`);

        // 触发日期变更事件（后续阶段用于生成每日事件）
        triggerDateChange(daysDiff);
      } else {
        // 同一天，只更新最后打开时间
        await SongState.update('gameDate.realLastOpenAt', now.toISOString());
      }
    } else {
      // 没有记录，设置当前时间
      await SongState.update('gameDate.realLastOpenAt', now.toISOString());
    }
  }

  /**
   * 同步游戏日期至现实北京时间
   * 同步后会重新生成所有历史数据（子公司历史、股票历史、基金历史等）
   * @param {boolean} showNotification - 是否显示同步成功提示
   */
  async function syncToReality(showNotification = true) {
    const now = new Date();
    const nowStr = formatDate(now);
    const oldDate = SongState.get('gameDate.current');

    console.log(`[SongDate] 同步现实时间: ${oldDate} → ${nowStr}`);

    // 更新游戏日期为现实日期
    await SongState.batchUpdate({
      'gameDate.current': nowStr,
      'gameDate.dayOfWeek': WEEKDAYS[now.getDay()],
      'gameDate.realLastOpenAt': now.toISOString(),
      'gameDate.syncedToReality': true,
      'gameDate.lastSyncedAt': now.toISOString()
    });

    // 触发日期变更事件，让其他模块重新生成历史数据
    triggerDateChange(1);

    if (showNotification && typeof window !== 'undefined') {
      // 延迟显示提示，等待历史数据重新生成
      setTimeout(() => {
        if (window.showToast) {
          window.showToast(`✅ 日期已同步至现实时间：${formatDateChinese(nowStr, true)}`);
        }
      }, 500);
    }

    return nowStr;
  }

  /**
   * 手动推进游戏日期（用于测试或特殊事件）
   * @param {number} days - 推进天数
   */
  async function advanceDays(days) {
    if (days <= 0) return;

    const gameDate = SongState.get('gameDate');
    const currentDate = new Date(gameDate.current);
    currentDate.setDate(currentDate.getDate() + days);

    const newDateStr = formatDate(currentDate);
    const newDayOfWeek = WEEKDAYS[currentDate.getDay()];

    await SongState.batchUpdate({
      'gameDate.current': newDateStr,
      'gameDate.dayOfWeek': newDayOfWeek
    });

    const totalPlayDays = (SongState.get('meta.totalPlayDays') || 0) + days;
    await SongState.update('meta.totalPlayDays', totalPlayDays);

    console.log(`[SongDate] 手动推进 ${days} 天，当前游戏日期: ${newDateStr}`);
    triggerDateChange(days);
  }

  /**
   * 触发日期变更事件
   * 后续阶段会在这里生成每日事件、更新公司数据等
   */
  function triggerDateChange(days) {
    // 派发自定义事件，供其他模块监听
    if (typeof window !== 'undefined') {
      window.dispatchEvent(new CustomEvent('song-date-changed', {
        detail: { days, newDate: SongState.get('gameDate.current') }
      }));
    }

    // 重置每日 AI 生成计数
    SongState.update('settings.aiGeneratedToday', 0, false);
  }

  /**
   * 格式化日期为 YYYY-MM-DD
   */
  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  /**
   * 格式化日期为中文显示格式
   * @param {string} dateStr - YYYY-MM-DD
   * @param {boolean} withWeekday - 是否包含星期
   */
  function formatDateChinese(dateStr, withWeekday = true) {
    if (!dateStr) return '--';
    const date = new Date(dateStr);
    const year = date.getFullYear();
    const month = date.getMonth() + 1;
    const day = date.getDate();
    const weekday = WEEKDAYS[date.getDay()];

    if (withWeekday) {
      return `${year}年${month}月${day}日 ${weekday}`;
    }
    return `${year}年${month}月${day}日`;
  }

  /**
   * 格式化日期为简短显示
   */
  function formatDateShort(dateStr) {
    if (!dateStr) return '--';
    const date = new Date(dateStr);
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }

  /**
   * 获取当前游戏日期
   */
  function getCurrentDate() {
    return SongState.get('gameDate.current');
  }

  /**
   * 获取当前星期
   */
  function getCurrentWeekday() {
    return SongState.get('gameDate.dayOfWeek');
  }

  /**
   * 判断是否为工作日
   */
  function isWorkday() {
    const dateStr = getCurrentDate();
    if (!dateStr) return true;
    const day = new Date(dateStr).getDay();
    return day !== 0 && day !== 6;
  }

  /**
   * 计算两个日期之间的天数差
   */
  function daysBetween(dateStr1, dateStr2) {
    const d1 = new Date(dateStr1);
    const d2 = new Date(dateStr2);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  /**
   * 生成历史日期（以当前游戏日期为基准往前推 N 天）
   * 用于生成子公司历史、股票历史、基金历史等数据
   * 确保所有历史日期都以现实时间为基准
   * @param {number} daysAgo - 往前推的天数
   * @returns {string} YYYY-MM-DD 格式的日期
   */
  function getHistoryDate(daysAgo) {
    const currentStr = getCurrentDate();
    if (!currentStr) {
      // 如果没有当前日期，使用现实日期
      return formatDate(new Date());
    }
    const date = new Date(currentStr);
    date.setDate(date.getDate() - daysAgo);
    return formatDate(date);
  }

  /**
   * 生成历史日期数组（从 daysAgo 天前到今天，共 daysAgo+1 天）
   * 按时间正序排列（最早的在前，今天的在后）
   * @param {number} daysAgo - 往前推的天数
   * @returns {Array<string>} 日期数组
   */
  function getHistoryDateRange(daysAgo) {
    const dates = [];
    for (let i = daysAgo; i >= 0; i--) {
      dates.push(getHistoryDate(i));
    }
    return dates;
  }

  /**
   * 获取月份名称
   */
  function getMonthName(month) {
    return MONTHS[month - 1] || '';
  }

  // 公开 API
  return {
    init,
    advanceDays,
    syncToReality,
    formatDate,
    formatDateChinese,
    formatDateShort,
    getCurrentDate,
    getCurrentWeekday,
    isWorkday,
    daysBetween,
    getMonthName,
    getHistoryDate,
    getHistoryDateRange,
    WEEKDAYS,
    WEEKDAYS_SHORT
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongDate = SongDate;
}
