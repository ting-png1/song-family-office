  /**
   * 渲染迷你柱状图
   */
  function renderMiniBarChart(values, type) {
    if (!values || values.length === 0) return '';

    const max = Math.max(...values.map(Math.abs), 1);
    const bars = values.map((value, index) => {
      const height = Math.max(5, (Math.abs(value) / max) * 100);
      const isPositive = value >= 0;
      const colorClass = type === 'profit'
        ? (isPositive ? 'bar-positive' : 'bar-negative')
        : 'bar-revenue';
      return `
        <div class="mini-bar-wrapper" title="${formatMoney(value)}">
          <div class="mini-bar ${colorClass}" style="height: ${height}%"></div>
          <div class="mini-bar-label">${index + 1}</div>
        </div>
      `;
    }).join('');

    return `<div class="mini-chart-bars">${bars}</div>`;
  }

  /**
   * 获取风险评估描述
   */
  function getRiskAssessment(subsidiary) {
    const assessments = [];

    if (subsidiary.risk === 'high') {
      assessments.push('该子公司处于高风险状态，建议密切关注经营动态，必要时调整战略或更换管理团队。');
    } else if (subsidiary.risk === 'medium') {
      assessments.push('该子公司风险适中，经营整体稳定，但需关注潜在风险点。');
    } else {
      assessments.push('该子公司风险较低，经营稳健，可作为集团稳定的收入来源。');
    }

    if (subsidiary.potential === 'high') {
      assessments.push('发展潜力较高，建议加大资源投入，把握增长机遇。');
    } else if (subsidiary.potential === 'low') {
      assessments.push('发展潜力有限，建议维持现状或考虑战略转型。');
    }

    if (subsidiary.satisfaction < 60) {
      assessments.push('员工满意度偏低，可能存在管理问题，建议关注团队稳定性。');
    }

    if (subsidiary.reputation < 60) {
      assessments.push('市场声誉有待提升，建议加强品牌建设和公关投入。');
    }

    return assessments.join(' ');
  }

  /**
   * 显示子公司详情
   */
  function showDetail(id) {
    currentDetailId = id;
    render(document.getElementById('app-content'));
    // 滚动到顶部
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;
  }

  /**
   * 返回列表
   */
  function backToList() {
    currentDetailId = null;
    render(document.getElementById('app-content'));
  }

  /**
   * 格式化金额
   */
  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();
  }

  // 公开 API
  return {
    render,
    showDetail,
    backToList
  };
})();

if (typeof window !== 'undefined') {
  window.PageCompany = PageCompany;
}

    const state = SongState.getState();

    let news = stockMarket.news || [];

      news = initData.news;

    const closeBtn = document.getElementById('ai-news-close');

    if (!aiBtn || !aiContent) return;

    aiBtn.addEventListener('click', async () => {
      if (!SongAI.isEnabled()) {
        alert('请先在设置中配置 AI API Key');
        return;
      }

      aiBtn.disabled = true;
      aiBtn.textContent = '生成中...';
      aiContent.style.display = 'block';
      aiBody.innerHTML = '<div class="ai-loading">正在生成财经简报，请稍候...</div>';

        const state = SongState.getState();
        const news = await SongAI.generateFinancialNews(state);

      ? (isUp ? 'rgba(199, 92, 92, 0.1)' : 'rgba(74, 157, 122, 0.1)')
      : (isUp ? 'rgba(74, 157, 122, 0.1)' : 'rgba(199, 92, 92, 0.1)');

    const currencySymbol = stock.market === 'A股' ? '¥' : stock.market === '港股' ? 'HK$' : '$';

          </div>
        </div>
      </div>
    `;
  }

  /**
   * 渲染迷你走势图（sparkline）
   */
  function renderMiniSparkline(history, color, fillColor) {
    if (!history || history.length < 2) return '<div class="sparkline-placeholder"></div>';

    const closes = history.map(h => h.close);
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;

    const points = closes.map((close, i) => {
      const x = (i / (closes.length - 1)) * 100;
      const y = 100 - ((close - min) / range) * 100;
      return `${x},${y}`;
    }).join(' ');

    return `
      <svg class="sparkline" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon points="0,100 ${points} 100,100" fill="${fillColor}"/>
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    `;
  }

  /**
   * 渲染价格走势图（SVG）
   */
  function renderPriceChart(history, stock) {
    if (!history || history.length < 2) {
      return '<div class="empty-state-mini"><p>暂无足够数据</p></div>';
    }

    const closes = history.map(h => h.close);
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const padding = 10;
    const width = 100;
    const height = 100;

    const points = closes.map((close, i) => {
      const x = padding + (i / (closes.length - 1)) * (width - 2 * padding);
      const y = padding + (1 - (close - min) / range) * (height - 2 * padding);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const isPositive = stock.change >= 0;
    const color = isPositive ? '#4a9d7a' : '#c75c5c';
    const fillColor = isPositive ? 'rgba(74, 157, 122, 0.15)' : 'rgba(199, 92, 92, 0.15)';

    // 生成网格线
    const gridLines = [0.25, 0.5, 0.75].map(ratio => {
      const y = padding + ratio * (height - 2 * padding);
      const price = (max - ratio * range).toFixed(2);
      return `
        <line x1="${padding}" y1="${y}" x2="${width - padding}" y2="${y}" stroke="rgba(184,150,90,0.1)" stroke-width="0.5"/>
        <text x="${width - padding + 2}" y="${y + 2}" fill="rgba(107,117,136,0.6)" font-size="3" text-anchor="start">${price}</text>
      `;
    }).join('');

    return `
      <div class="price-chart-wrapper">
        <svg class="price-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          ${gridLines}
          <polygon points="${padding},${height - padding} ${points} ${width - padding},${height - padding}" fill="${fillColor}"/>
          <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div class="chart-dates">
          ${history.map((h, i) => (i % Math.ceil(history.length / 5) === 0 || i === history.length - 1) ? `<span class="chart-date">${h.date?.slice(5) || ''}</span>` : '').join('')}
        </div>
      </div>
    `;
  }

  /**
   * 渲染交易弹窗
   */
  function renderTradeModal(modal) {
    const state = SongState.getState();
    const stock = state.stockMarket?.stocks?.find(s => s.id === modal.stockId);
    const position = state.portfolio?.find(p => p.stockId === modal.stockId);
    const cashFlow = state.company?.cashFlow || 0;

    if (!stock) return '';

    const shares = modal.shares || 100;
    const estimatedCost = stock.price * shares;
    const commission = Math.max(estimatedCost * 0.001, 5);
    const totalAmount = modal.type === 'buy' ? estimatedCost + commission : estimatedCost - commission - (estimatedCost * 0.001);

    return `
      <div class="modal-overlay" onclick="PageMarket.closeTradeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h3 class="modal-title">${modal.type === 'buy' ? '买入' : '卖出'} ${stock.name}</h3>
            <button class="modal-close" onclick="PageMarket.closeTradeModal()">×</button>
          </div>
          <div class="modal-body">
            <div class="trade-info">
              <div class="trade-row">
                <span class="trade-label">当前价格</span>
                <span class="trade-value">HK$ ${stock.price.toFixed(2)}</span>
              </div>
              <div class="trade-row">
                <span class="trade-label">可用资金</span>
                <span class="trade-value">HK$ ${cashFlow.toLocaleString()}</span>
              </div>
              ${position ? `
                <div class="trade-row">
                  <span class="trade-label">当前持仓</span>
                  <span class="trade-value">${position.shares} 股</span>
                </div>
              ` : ''}
            </div>

            <div class="trade-input-section">
              <label class="trade-input-label">交易数量（股）</label>
              <div class="trade-input-wrapper">
                <button class="trade-quick-btn" onclick="PageMarket.adjustShares(-100)">-100</button>
                <input type="number" class="trade-input" id="trade-shares-input" value="${shares}" min="1" onchange="PageMarket.updateShares(this.value)">
                <button class="trade-quick-btn" onclick="PageMarket.adjustShares(100)">+100</button>
              </div>
              <div class="trade-quick-options">
                <button class="quick-option" onclick="PageMarket.setShares(100)">100</button>
                <button class="quick-option" onclick="PageMarket.setShares(500)">500</button>
                <button class="quick-option" onclick="PageMarket.setShares(1000)">1000</button>
                <button class="quick-option" onclick="PageMarket.setShares(5000)">5000</button>
              </div>
            </div>

            <div class="trade-summary">
              <div class="trade-row">
                <span class="trade-label">预估金额</span>
                <span class="trade-value">HK$ ${estimatedCost.toFixed(2)}</span>
              </div>
              <div class="trade-row">
                <span class="trade-label">佣金</span>
                <span class="trade-value">HK$ ${commission.toFixed(2)}</span>
              </div>
              ${modal.type === 'sell' ? `
                <div class="trade-row">
                  <span class="trade-label">印花税</span>
                  <span class="trade-value">HK$ ${(estimatedCost * 0.001).toFixed(2)}</span>
                </div>
              ` : ''}
              <div class="trade-row total">
                <span class="trade-label">${modal.type === 'buy' ? '预计支出' : '预计收入'}</span>
                <span class="trade-value ${modal.type === 'buy' ? 'negative' : 'positive'}">HK$ ${totalAmount.toFixed(2)}</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="PageMarket.closeTradeModal()">取消</button>
            <button class="btn ${modal.type === 'buy' ? 'btn-primary' : 'btn-danger'}" onclick="PageMarket.confirmTrade()">
              确认${modal.type === 'buy' ? '买入' : '卖出'}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  // ═══════════════════════════════════════════════
  // 交互方法
  // ═══════════════════════════════════════════════

  /**
   * 显示股票详情
   */
  function showStockDetail(id) {
    currentStockId = id;
    render(document.getElementById('app-content'));
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;
  }

  /**
   * 返回列表
   */
  function backToList() {
    currentStockId = null;
    render(document.getElementById('app-content'));
  }

  /**
   * 切换走势图周期
   */
  function switchChart(period) {
    const state = SongState.getState();
    const stock = state.stockMarket?.stocks?.find(s => s.id === currentStockId);
    if (!stock) return;

    const days = period === '30d' ? 30 : 7;
    const trend = SongStockMarket.getStockTrend(stock, days);
    const container = document.getElementById('chart-container');
    if (container) {
      container.innerHTML = renderPriceChart(trend, stock);
    }

    // 更新 tab 状态
    document.querySelectorAll('.chart-tab').forEach(tab => {
      tab.classList.remove('active');
    });
    event.target.classList.add('active');
  }

  /**
   * 打开交易弹窗
   */
  function openTradeModal(stockId, type) {
    tradeModal = { stockId, type, shares: 100 };
    render(document.getElementById('app-content'));
  }

  /**
   * 关闭交易弹窗
   */
  function closeTradeModal() {
    tradeModal = null;
    render(document.getElementById('app-content'));
  }

  /**
   * 调整交易数量
   */
  function adjustShares(delta) {
    if (!tradeModal) return;
    tradeModal.shares = Math.max(1, (tradeModal.shares || 100) + delta);
    const input = document.getElementById('trade-shares-input');
    if (input) input.value = tradeModal.shares;
    render(document.getElementById('app-content'));
  }

  /**
   * 设置交易数量
   */
  function setShares(shares) {
    if (!tradeModal) return;
    tradeModal.shares = shares;
    render(document.getElementById('app-content'));
  }

  /**
   * 更新交易数量（输入框）
   */
  function updateShares(value) {
    if (!tradeModal) return;
    tradeModal.shares = Math.max(1, parseInt(value) || 1);
    render(document.getElementById('app-content'));
  }

  /**
   * 确认交易
   */
  async function confirmTrade() {
    if (!tradeModal) return;

    const state = SongState.getState();
    const stock = state.stockMarket?.stocks?.find(s => s.id === tradeModal.stockId);
    const portfolio = state.portfolio || [];
    const company = state.company || {};

    if (!stock) {
      SongApp.showToast('股票信息不存在');
      return;
    }

    let result;
    if (tradeModal.type === 'buy') {
      result = SongStockMarket.buyStock(stock, tradeModal.shares, portfolio, company);
    } else {
      result = SongStockMarket.sellStock(stock, tradeModal.shares, portfolio, company);
    }

    if (!result.success) {
      SongApp.showToast(`交易失败：${result.error}`);
      return;
    }

    // 更新状态
    await SongState.batchUpdate({
      'portfolio': result.portfolio,
      'company.cashFlow': result.cashFlow
    });

    const action = tradeModal.type === 'buy' ? '买入' : '卖出';
    SongApp.showToast(`${action}成功！${tradeModal.shares} 股 ${stock.name}`);

    // 关闭弹窗
    tradeModal = null;
    render(document.getElementById('app-content'));
  }

  /**
   * 格式化金额
   */
  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();
  }

  /**
   * 跳转到基金市场
   */
  function goToFundMarket() {
    // 切换到投资页面并激活基金市场 tab
    if (typeof PageInvestment !== 'undefined' && PageInvestment.switchTab) {
      PageInvestment.switchTab('fundMarket');
    }
    SongApp.navigateTo('investment');
  }

  // 公开 API
  return {
    render,
    showStockDetail,
    backToList,
    switchChart,
    openTradeModal,
    closeTradeModal,
    adjustShares,
    setShares,
    updateShares,
    confirmTrade,
    goToFundMarket
  };
})();

if (typeof window !== 'undefined') {
  window.PageMarket = PageMarket;
}

  /**
   * 绑定 AI 建议按钮
   */
  function bindAIAdviceButton() {
    const aiBtn = document.getElementById('ai-advice-btn');
    const aiContent = document.getElementById('ai-advice-content');

    if (!aiBtn || !aiContent) return;

    aiBtn.addEventListener('click', async () => {
      if (!SongAI.isEnabled()) {
        alert('请先在设置中配置 AI API Key');
        return;
      }

      aiBtn.disabled = true;
      aiBtn.textContent = '生成中...';
      aiContent.innerHTML = '<div class="ai-loading">AI 投资分析师正在分析您的投资组合，请稍候...</div>';

      try {
        const state = SongState.getState();
        const advice = await SongAI.generateInvestmentAdvice(state);
        aiContent.innerHTML = `<div class="ai-generated-text">${advice.replace(/\n/g, '<br>')}</div>`;
      } catch (error) {
        aiContent.innerHTML = `<div class="ai-error">❌ 生成失败：${error.message}</div>`;
      } finally {
        aiBtn.disabled = false;
        aiBtn.textContent = '✨ 重新生成';
      }
    });
  }

  /**
   * 渲染基金净值走势图
   */
  function renderFundNavChart(history, fund) {
    if (!history || history.length < 2) {
      return '<div class="empty-state-mini"><p>暂无足够数据</p></div>';
    }

    const navs = history.map(h => h.nav);
    const min = Math.min(...navs);
    const max = Math.max(...navs);
    const range = max - min || 1;
    const padding = 10;
    const width = 100;
    const height = 100;

    const points = navs.map((nav, i) => {
      const x = padding + (i / (navs.length - 1)) * (width - 2 * padding);
      const y = padding + (1 - (nav - min) / range) * (height - 2 * padding);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const isPositive = fund.return1d >= 0;
    const color = isPositive ? '#4a9d7a' : '#c75c5c';
    const fillColor = isPositive ? 'rgba(74, 157, 122, 0.15)' : 'rgba(199, 92, 92, 0.15)';

    return `
      <div class="price-chart-wrapper">
        <svg class="price-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <polygon points="${padding},${height - padding} ${points} ${width - padding},${height - padding}" fill="${fillColor}"/>
          <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div class="chart-dates">
          ${history.map((h, i) => (i % Math.ceil(history.length / 5) === 0 || i === history.length - 1) ? `<span class="chart-date">${h.date?.slice(5) || ''}</span>` : '').join('')}
        </div>
      </div>
    `;
  }

            ${modal.type === 'buy' ? `

                </div>
                <div class="trade-quick-options">
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(1000)">1千</button>
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(10000)">1万</button>
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(50000)">5万</button>
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(100000)">10万</button>
                </div>
              </div>
              <div class="trade-summary">
                <div class="trade-row">
                  <span class="trade-label">申购费</span>
                  <span class="trade-value">${formatMoney(purchaseFee)}</span>
                </div>
                <div class="trade-row">
                  <span class="trade-label">预计份额</span>
                  <span class="trade-value">${shares.toFixed(2)} 份</span>
                </div>
                <div class="trade-row total">
                  <span class="trade-label">预计支出</span>
                  <span class="trade-value negative">${formatMoney(amount)}</span>

                  <button class="trade-quick-btn" onclick="PageInvestment.adjustFundShares(-100)">-100</button>

  // ═══════════════════════════════════════════════
  // 交互方法
  // ═══════════════════════════════════════════════

  function switchTab(tab) {
    currentTab = tab;
    render(document.getElementById('app-content'));
  }

  function showFundDetail(id) {
    currentFundId = id;
    render(document.getElementById('app-content'));
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;
  }

  function backToList() {
    currentFundId = null;
    render(document.getElementById('app-content'));
  }

  function goToStock(stockId) {
    // 跳转到市场页面的股票详情
    currentFundId = null;
    SongApp.navigateTo('market');
    setTimeout(() => {
      if (window.PageMarket) {
        PageMarket.showStockDetail(stockId);
      }
    }, 100);
  }

  function switchFundChart(period) {
    const state = SongState.getState();
    const fund = state.funds?.find(f => f.id === currentFundId);
    if (!fund) return;

    const days = period === '90d' ? 90 : 30;
    const trend = SongFund.getFundTrend(fund, days);
    const container = document.getElementById('fund-chart-container');
    if (container) {
      container.innerHTML = renderFundNavChart(trend, fund);
    }

    document.querySelectorAll('.chart-tab').forEach(tab => {
      tab.classList.remove('active');
    });
    event.target.classList.add('active');
  }

  function openFundTradeModal(fundId, type) {
    fundTradeModal = { fundId, type, amount: 10000, shares: 1000 };
    render(document.getElementById('app-content'));
  }

  function closeFundTradeModal() {
    fundTradeModal = null;
    render(document.getElementById('app-content'));
  }

  function adjustFundAmount(delta) {
    if (!fundTradeModal) return;
    fundTradeModal.amount = Math.max(100, (fundTradeModal.amount || 10000) + delta);
    const input = document.getElementById('fund-amount-input');
    if (input) input.value = fundTradeModal.amount;
    render(document.getElementById('app-content'));
  }

  function setFundAmount(amount) {
    if (!fundTradeModal) return;
    fundTradeModal.amount = amount;
    render(document.getElementById('app-content'));
  }

  function updateFundAmount(value) {
    if (!fundTradeModal) return;
    fundTradeModal.amount = Math.max(100, parseInt(value) || 100);
    render(document.getElementById('app-content'));
  }

  function adjustFundShares(delta) {
    if (!fundTradeModal) return;
    fundTradeModal.shares = Math.max(1, (fundTradeModal.shares || 1000) + delta);
    const input = document.getElementById('fund-shares-input');
    if (input) input.value = fundTradeModal.shares;
    render(document.getElementById('app-content'));
  }

  function setFundShares(shares) {
    if (!fundTradeModal) return;
    fundTradeModal.shares = Math.max(1, Math.round(shares));
    render(document.getElementById('app-content'));
  }

  function updateFundShares(value) {
    if (!fundTradeModal) return;
    fundTradeModal.shares = Math.max(1, parseInt(value) || 1);
    render(document.getElementById('app-content'));
  }

  async function confirmFundTrade() {
    if (!fundTradeModal) return;

    const state = SongState.getState();
    const fund = state.funds?.find(f => f.id === fundTradeModal.fundId);
    const fundPortfolio = state.fundPortfolio || [];
    const company = state.company || {};

    if (!fund) {
      SongApp.showToast('基金信息不存在');
      return;
    }

    let result;
    if (fundTradeModal.type === 'buy') {
      result = SongFund.buyFund(fund, fundTradeModal.amount, fundPortfolio, company);
    } else {
      result = SongFund.sellFund(fund, fundTradeModal.shares, fundPortfolio, company);
    }

    if (!result.success) {
      SongApp.showToast(`交易失败：${result.error}`);
      return;
    }

    // 更新状态
    await SongState.batchUpdate({
      'fundPortfolio': result.portfolio,
      'company.cashFlow': result.cashFlow
    });

    const action = fundTradeModal.type === 'buy' ? '买入' : '卖出';
    SongApp.showToast(`${action}成功！${fund.name}`);

    fundTradeModal = null;
    render(document.getElementById('app-content'));
  }

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  return {
    render,
    switchTab,
    showFundDetail,
    backToList,
    goToStock,
    switchFundChart,
    openFundTradeModal,
    closeFundTradeModal,
    adjustFundAmount,
    setFundAmount,
    updateFundAmount,
    adjustFundShares,
    setFundShares,
    updateFundShares,
    confirmFundTrade
  };
})();

    const level = value >= 80 ? 'excellent' : value >= 60 ? 'good' : value >= 40 ? 'average' : 'needs-improvement';
    const levelLabel = value >= 80 ? '卓越' : value >= 70 ? '优秀' : value >= 60 ? '良好' : value >= 50 ? '合格' : '待提升';
    return `
      <div class="ability-item">
        <div class="ability-header">
          <span class="ability-name">${name}</span>
          <div class="ability-value-wrapper">
            <span class="ability-value ${level}">${value}</span>

          <div class="ability-fill-large ${level}" style="width: ${value}%"></div>
        </div>
        <div class="ability-desc">${description}</div>
      </div>
    `;
  }

  function getOverallScore(abilities) {
    const avg = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;
    return avg.toFixed(1);
  }

  function getOverallLevel(abilities) {
    const avg = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;
    if (avg >= 80) return '卓越 (S)';
    if (avg >= 70) return '优秀 (A)';
    if (avg >= 60) return '良好 (B)';
    if (avg >= 50) return '合格 (C)';
    return '待提升 (D)';
  }

  function getStrengths(abilities) {
    const sorted = Object.entries(abilities).sort((a, b) => b[1] - a[1]);
    return sorted.slice(0, 2).map(([k]) => getAbilityName(k)).join('、');
  }

  function getWeaknesses(abilities) {
    const sorted = Object.entries(abilities).sort((a, b) => a[1] - b[1]);
    return sorted.slice(0, 2).map(([k]) => getAbilityName(k)).join('、');
  }

  function getAbilityName(key) {
    const map = {
      business: '商业能力',
      decision: '决策能力',
      influence: '资本影响力',
      reputation: '市场声誉',
      familyTrust: '家族信任',
      employeeTrust: '员工信任',
      riskJudgment: '风险判断'
    };
    return map[key] || key;

          返回
        </button>

        <p class="page-subtitle">专属助理 · 记录与整理</p>
      </div>

      <!-- Tab 切换 -->
      <div class="butler-tabs">
        <button class="butler-tab-btn ${butlerTab === 'manual' ? 'active' : ''}" onclick="PageHeir.switchButlerTab('manual')">
          📖 说明书
        </button>
        <button class="butler-tab-btn ${butlerTab === 'journal' ? 'active' : ''}" onclick="PageHeir.switchButlerTab('journal')">
          ✍️ 继承人手记
        </button>
      </div>

      <!-- 说明书内容 -->
      ${butlerTab === 'manual' ? `
        <div class="card manual-card">
          <div class="card-header">
            <span class="card-title">管家说明书</span>
            <span class="tag tag-gold">待完善</span>
          </div>
          <div class="manual-content">
            ${manualContent ? `
              <div class="manual-text">${manualContent.replace(/\n/g, '<br>')}</div>
            ` : `
              <div class="manual-placeholder">
                <div class="placeholder-icon">📋</div>
                <p class="placeholder-text">说明书档案尚未建立</p>
                <p class="placeholder-hint">后续将由您告知管家需要记录的内容</p>

        <div class="journal-section">
          <!-- 新建手记 -->
          <div class="card journal-input-card">
            <div class="card-header">
              <span class="card-title">今日手记</span>
              <span class="journal-date">${new Date().toLocaleDateString('zh-CN')}</span>
            </div>
            <textarea 
              class="journal-textarea" 
              id="journal-input" 
              placeholder="记录今天的经营决策、市场观察、心得体会..."

  /**
   * 保存手记条目
   */
  async function saveJournalEntry() {
    const input = document.getElementById('journal-input');
    if (!input || !input.value.trim()) {
      SongApp.showToast('请输入手记内容');
      return;
    }

    const state = SongState.getState();
    const butlerData = state.butler || {};
    const journal = butlerData.journal || [];

    const newEntry = {
      date: new Date().toLocaleDateString('zh-CN'),
      time: new Date().toLocaleTimeString('zh-CN'),
      content: input.value.trim()
    };

    const updatedJournal = [newEntry, ...journal];
    await SongState.update('butler', { ...butlerData, journal: updatedJournal });

    input.value = '';
    SongApp.showToast('手记保存成功');
    SongApp.renderCurrentPage();
  }

  /**
   * 删除手记条目
   */
  async function deleteJournalEntry(index) {
    const state = SongState.getState();
    const butlerData = state.butler || {};
    const journal = butlerData.journal || [];

    const updatedJournal = journal.filter((_, i) => i !== index);
    await SongState.update('butler', { ...butlerData, journal: updatedJournal });

    SongApp.showToast('手记已删除');
    SongApp.renderCurrentPage();
  }

  /**
   * AI 智能整理手记
   */
  async function aiOrganizeJournal() {
    if (!SongAI.isEnabled()) {
      SongApp.showToast('请先在设置中配置 AI API Key');
      return;
    }

    const input = document.getElementById('journal-input');
    const content = input ? input.value.trim() : '';

    if (!content) {
      SongApp.showToast('请先输入需要整理的手记内容');
      return;
    }

    const btn = document.getElementById('ai-organize-btn');
    const resultDiv = document.getElementById('ai-organize-result');

    btn.disabled = true;
    btn.textContent = '整理中...';
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<div class="ai-loading">AI 正在智能整理，请稍候...</div>';

    try {
      const systemPrompt = '你是一位专业的家族办公室管家，擅长整理和总结经营记录。';
      const userPrompt = `请将以下继承人经营手记整理成结构化的要点总结，分为：1.今日决策 2.市场观察 3.心得体会 4.后续计划。保持原文的核心信息，语言简洁专业。\n\n原文：\n${content}`;

      const organized = await SongAI.callAI(systemPrompt, userPrompt);

      resultDiv.innerHTML = `
        <div class="ai-organized-content">
          <div class="ai-organized-header">
            <span class="ai-organized-label">✨ AI 智能整理结果</span>
            <button class="ai-organized-copy" onclick="PageHeir.copyOrganizedResult()">复制</button>
          </div>
          <div class="ai-organized-text">${organized.replace(/\n/g, '<br>')}</div>
        </div>
      `;

      // 保存整理结果到临时变量，供复制使用
      window._lastOrganizedResult = organized;

    } catch (e) {
      resultDiv.innerHTML = `<div class="ai-error">整理失败：${e.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ AI 智能整理';
    }
  }

  /**
   * 复制整理结果
   */
  function copyOrganizedResult() {
    if (window._lastOrganizedResult) {
      navigator.clipboard.writeText(window._lastOrganizedResult).then(() => {
        SongApp.showToast('已复制到剪贴板');
      }).catch(() => {
        SongApp.showToast('复制失败，请手动复制');
      });
    }
  }

  return {
    render,
    openButler,
    closeButler,
    switchButlerTab,
    saveJournalEntry,
    deleteJournalEntry,
    aiOrganizeJournal,
    copyOrganizedResult
  };
})();

if (typeof window !== 'undefined') {
  window.PageHeir = PageHeir;
}

  function bindEvents() {
    // 保存配置
    document.getElementById('save-ai-config')?.addEventListener('click', () => {
      const config = {
        enabled: document.getElementById('ai-enabled').checked,
        apiKey: document.getElementById('ai-api-key').value.trim(),
        baseUrl: document.getElementById('ai-base-url').value.trim() || SongAI.DEFAULT_BASE_URL,
        model: document.getElementById('ai-model').value.trim() || SongAI.DEFAULT_MODEL
      };

      const success = SongAI.saveConfig(config);
      if (success) {
        showToast('✅ 配置已保存');
        setTimeout(() => location.reload(), 500);
      } else {
        showToast('❌ 保存失败');
      }
    });

    // 测试连接
    document.getElementById('test-ai-config')?.addEventListener('click', async () => {
      const resultEl = document.getElementById('ai-test-result');
      const testBtn = document.getElementById('test-ai-config');

      // 先保存当前配置
      const config = {
        enabled: true,
        apiKey: document.getElementById('ai-api-key').value.trim(),
        baseUrl: document.getElementById('ai-base-url').value.trim() || SongAI.DEFAULT_BASE_URL,
        model: document.getElementById('ai-model').value.trim() || SongAI.DEFAULT_MODEL
      };
      SongAI.saveConfig(config);

      resultEl.style.display = 'block';
      resultEl.className = 'form-result form-result-info';
      resultEl.textContent = '正在测试连接...';
      testBtn.disabled = true;

      try {
        const response = await SongAI.callAI(
          '你是一个测试助手。',
          '请回复"连接成功"四个字。',
          { temperature: 0, maxTokens: 20 }
        );

        resultEl.className = 'form-result form-result-success';
        resultEl.textContent = `✅ 连接成功！AI 回复：${response}`;
      } catch (error) {
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = `❌ 连接失败：${error.message}`;
      } finally {
        testBtn.disabled = false;
      }
    });

    // 导出存档
    document.getElementById('export-data')?.addEventListener('click', () => {
      const state = SongState.getState();
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `松氏家族办公室存档_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('✅ 存档已导出');
    });

    // 重置游戏
    document.getElementById('reset-data')?.addEventListener('click', () => {
      if (confirm('确定要重置游戏吗？所有进度将丢失，此操作不可撤销！')) {
        SongState.reset();
        showToast('✅ 游戏已重置');
        setTimeout(() => location.reload(), 1000);
      }
    });

    // 启用开关联动
    document.getElementById('ai-enabled')?.addEventListener('change', (e) => {
      const label = e.target.parentElement.querySelector('.toggle-label');
      label.textContent = e.target.checked ? '开启' : '关闭';
    });

    // 待办生成设置：滑块联动显示
    const eventsPerHourSlider = document.getElementById('events-per-hour');
    const eventsPerHourValue = document.getElementById('events-per-hour-value');
    eventsPerHourSlider?.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      eventsPerHourValue.textContent = val + ' 项/小时';
    });

    // 待办生成设置：开关联动
    document.getElementById('realtime-gen-enabled')?.addEventListener('change', (e) => {
      const label = e.target.parentElement.querySelector('.toggle-label');
      label.textContent = e.target.checked ? '开启' : '关闭';
    });

    // 保存待办生成设置
    document.getElementById('save-event-settings')?.addEventListener('click', async () => {
      const resultEl = document.getElementById('event-settings-result');
      const enabled = document.getElementById('realtime-gen-enabled').checked;
      const eventsPerHour = parseFloat(document.getElementById('events-per-hour').value);
      const quietStart = parseInt(document.getElementById('quiet-start').value);
      const quietEnd = parseInt(document.getElementById('quiet-end').value);

      // 验证输入
      if (isNaN(quietStart) || quietStart < 0 || quietStart > 23) {
        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = '❌ 静默开始时间必须是 0-23 的整数';
        return;
      }
      if (isNaN(quietEnd) || quietEnd < 0 || quietEnd > 23) {
        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = '❌ 静默结束时间必须是 0-23 的整数';
        return;
      }

      try {
        await SongState.batchUpdate({
          'settings.realtimeEventGeneration': enabled,
          'settings.eventsPerHour': eventsPerHour,
          'settings.quietHoursStart': quietStart,
          'settings.quietHoursEnd': quietEnd,
          'settings.lastEventGenerationAt': new Date().toISOString() // 重置时间戳，避免设置变更后一次性生成太多
        });

        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-success';
        resultEl.textContent = `✅ 设置已保存！每小时生成 ${eventsPerHour} 项，静默时段 ${quietStart}:00-${quietEnd}:00`;
        showToast('✅ 待办生成设置已保存');
      } catch (error) {
        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = `❌ 保存失败：${error.message}`;
      }
    });

    // 立即生成测试
    document.getElementById('trigger-gen-now')?.addEventListener('click', async () => {
      const resultEl = document.getElementById('event-settings-result');
      resultEl.style.display = 'block';
      resultEl.className = 'form-result form-result-info';
      resultEl.textContent = '正在生成待办...';

      try {
        await SongApp.checkAndGenerateRealtimeEvents();
        resultEl.className = 'form-result form-result-success';
        resultEl.textContent = '✅ 已执行待办生成检查，请查看待办列表';
        showToast('✅ 已执行待办生成检查');
        // 更新下次生成信息
        updateNextGenInfo();
      } catch (error) {
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = `❌ 生成失败：${error.message}`;
      }
    });

    // 计算并显示下次生成时间
    updateNextGenInfo();
  }

  /**
   * 更新下次生成时间信息
   */
  function updateNextGenInfo() {
    const state = SongState.getState();
    const settings = state.settings || {};
    const now = new Date();
    const lastGenAt = settings.lastEventGenerationAt ? new Date(settings.lastEventGenerationAt) : null;
    const eventsPerHour = settings.eventsPerHour || 1;
    const quietStart = settings.quietHoursStart ?? 19;
    const quietEnd = settings.quietHoursEnd ?? 10;

    const statusEl = document.getElementById('current-gen-status');
    const countdownEl = document.getElementById('next-gen-countdown');
    const lastGenEl = document.getElementById('last-gen-time');

    if (!statusEl || !countdownEl) return;

    // 更新上次生成时间
    if (lastGenEl) {
      lastGenEl.textContent = lastGenAt ? lastGenAt.toLocaleString('zh-CN') : '首次启动';
    }

    // 检查是否在静默时段
    const currentHour = now.getHours();
    let inQuietHours = false;
    if (quietStart < quietEnd) {
      inQuietHours = currentHour >= quietStart && currentHour < quietEnd;
    } else {
      inQuietHours = currentHour >= quietStart || currentHour < quietEnd;
    }

    if (inQuietHours) {
      statusEl.textContent = '🔕 静默时段中';
      statusEl.style.color = 'var(--color-text-muted)';
      // 计算静默时段结束时间
      let quietEndTime = new Date(now);
      quietEndTime.setHours(quietEnd, 0, 0, 0);
      if (quietEndTime <= now) quietEndTime.setDate(quietEndTime.getDate() + 1);
      const diff = quietEndTime - now;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      countdownEl.textContent = `${hours}小时${minutes}分钟后恢复`;
      countdownEl.style.color = 'var(--color-text-muted)';
      return;
    }

    // 计算距离下次生成的时间
    statusEl.textContent = '✅ 正常生成中';
    statusEl.style.color = 'var(--color-success, #4caf50)';

    if (!lastGenAt) {
      countdownEl.textContent = '首次启动，已初始化';
      countdownEl.style.color = 'var(--color-info, #2196f3)';
      return;
    }

    // 每小时生成 eventsPerHour 项，计算生成1项需要多少分钟
    const minutesPerEvent = 60 / eventsPerHour;
    // 计算从上次生成到现在经过了多少分钟
    const elapsedMinutes = (now - lastGenAt) / (1000 * 60);
    // 计算距离下次生成还有多少分钟
    const nextEventIn = minutesPerEvent - (elapsedMinutes % minutesPerEvent);

    if (nextEventIn <= 0) {
      countdownEl.textContent = '即将生成（刷新页面触发）';
      countdownEl.style.color = 'var(--color-accent-gold, #d4af37)';
    } else {
      const hours = Math.floor(nextEventIn / 60);
      const minutes = Math.floor(nextEventIn % 60);
      if (hours > 0) {
        countdownEl.textContent = `约 ${hours}小时${minutes}分钟后`;
      } else {
        countdownEl.textContent = `约 ${minutes}分钟后`;
      }
      countdownEl.style.color = 'var(--color-info, #2196f3)';
    }
  }

  function showToast(message) {
    // 简单的 toast 提示
    const toast = document.createElement('div');
    toast.style.cssText = `
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-bg-elevated, #1a1a2e);
      color: var(--color-text-primary, #fff);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid var(--color-border-gold, #b8965a);
      z-index: 9999;
      font-size: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  return {
    render
  };
})();

if (typeof window !== 'undefined') {
  window.PageSettings = PageSettings;

/**
 * 松氏家族办公室 - 主应用入口
 * 负责初始化、路由、页面切换、事件绑定
 */

const SongApp = (function () {
  'use strict';

  // 当前页面
  let currentPage = 'dashboard';
  let initialized = false;

  // 页面映射
  const pages = {
    dashboard: PageDashboard,
    tasks: PageTasks,
    company: PageCompany,
    market: PageMarket,
    investment: PageInvestment,
    heir: PageHeir,
    settings: PageSettings
  };

  /**
   * 初始化应用
   */
  async function init() {
    if (initialized) return;

    console.log('[SongApp] 松氏家族办公室启动中...');

    try {
      // 0. 先绑定导航事件（确保即使后续初始化出错，导航也能工作）
      bindNavigation();

      // 1. 初始化存储层
      await SongStorage.init();

      // 2. 初始化状态管理
      await SongState.init();

      // 3. 初始化日期系统（会自动推进游戏日期）
      await SongDate.init();

      // 3.5 初始化子公司数据（如果为空）
      await initSubsidiariesIfEmpty();

      // 3.6 初始化股票市场数据（如果为空）
      await initStockMarketIfEmpty();

      // 3.7 初始化基金数据（如果为空）
      await initFundsIfEmpty();

      // 3.8 如果是新的一天，执行每日结算
      await checkAndRunDailySettlement();

      // 3.9 基于现实时间检查并生成待办事项
      await checkAndGenerateRealtimeEvents();

      // 4. 绑定状态变更监听（刷新当前页面）
      SongState.subscribe(() => {
        // 状态变更时刷新当前页面（防抖）
        if (window._songRefreshTimer) clearTimeout(window._songRefreshTimer);
        window._songRefreshTimer = setTimeout(() => {
          renderCurrentPage();
          updateHeader();
        }, 100);
      });

      // 6. 监听日期变更事件
      window.addEventListener('song-date-changed', async (e) => {
        console.log('[SongApp] 日期变更:', e.detail);
        // 执行每日结算：更新子公司数据、生成新事件
        await runDailySettlement();
        showToast(`游戏日期已推进至 ${SongDate.formatDateChinese(e.detail.newDate, false)}，已生成今日事务`);
      });

      // 7. 渲染初始页面
      renderCurrentPage();
      updateHeader();
      updateNavigation();

      initialized = true;
      console.log('[SongApp] 松氏家族办公室启动完成');

      // 欢迎提示
      setTimeout(() => {
        showToast('欢迎回到松氏家族办公室，松庭');
      }, 500);

    } catch (e) {
      console.error('[SongApp] 初始化失败:', e);
      showError('应用初始化失败，请刷新页面重试');
    }
  }

  /**
   * 绑定底部导航事件
   */
  function bindNavigation() {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const page = item.dataset.page;
        if (page && pages[page]) {
          navigateTo(page);
        }
      });
    });

    // 设置按钮
    const settingsBtn = document.getElementById('settings-btn');
    if (settingsBtn) {
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        console.log('[SongApp] 设置按钮被点击');
        // 点击反馈
        settingsBtn.style.transform = 'scale(0.9)';
        setTimeout(() => { settingsBtn.style.transform = ''; }, 150);
        navigateTo('settings');
      });
      console.log('[SongApp] 设置按钮事件绑定成功');
    } else {
      console.warn('[SongApp] 未找到设置按钮');
    }
  }

  /**
   * 导航到指定页面
   */
  function navigateTo(page) {
    if (!pages[page]) {
      console.error('[SongApp] 未知页面:', page);
      return;
    }

    currentPage = page;
    renderCurrentPage();
    updateNavigation();

    // 滚动到顶部
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;
  }

  /**
   * 渲染当前页面
   */
  function renderCurrentPage() {
    const container = document.getElementById('app-content');
    if (!container) return;

    const page = pages[currentPage];
    if (page && typeof page.render === 'function') {
      try {
        page.render(container);
      } catch (e) {
        console.error('[SongApp] 页面渲染失败:', currentPage, e);
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">
              <p>页面渲染出错</p>
              <p style="font-size: 11px; margin-top: 8px; opacity: 0.7;">${e.message || '未知错误'}</p>
            </div>
          </div>
        `;
      }
    }
  }

  /**
   * 更新顶部状态栏
   */
  function updateHeader() {
    const dateEl = document.getElementById('game-date');
    if (dateEl) {
      const currentDate = SongDate.getCurrentDate();
      const weekday = SongDate.getCurrentWeekday();
      dateEl.textContent = currentDate ? `${SongDate.formatDateShort(currentDate)} ${weekday || ''}` : '--';
    }
  }

  /**
   * 更新导航栏激活状态
   */
  function updateNavigation() {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      if (item.dataset.page === currentPage) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  }

  /**
   * 显示提示消息
   */
  function showToast(message, duration = 2000) {
    // 优先使用宿主 API
    if (typeof window !== 'undefined' && window.AiPhone && window.AiPhone.ui && typeof window.AiPhone.ui.toast === 'function') {
      window.AiPhone.ui.toast(message);
      return;
    }

    // 降级：简单的 toast
    let toast = document.getElementById('song-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'song-toast';
      toast.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        max-width: 80%;
        text-align: center;
      `;
      document.body.appendChild(toast);
    }

    toast.textContent = message;
    toast.style.opacity = '1';

    if (toast._timer) clearTimeout(toast._timer);
    toast._timer = setTimeout(() => {
      toast.style.opacity = '0';
    }, duration);
  }

  /**
   * 如果子公司数据为空，初始化
   */
  async function initSubsidiariesIfEmpty() {
    const state = SongState.getState();
    if (!state.subsidiaries || state.subsidiaries.length === 0) {
      console.log('[SongApp] 初始化子公司数据');
      const subsidiaries = SongFinance.initSubsidiaries();
      await SongState.update('subsidiaries', subsidiaries);

      // 同时初始化公司财务数据
      const financials = SongFinance.calculateGroupFinancials(subsidiaries, {});
      await SongState.update('company', financials);
    }
  }

  /**
   * 如果股票市场数据为空，初始化
   */
  async function initStockMarketIfEmpty() {
    const state = SongState.getState();
    if (!state.stockMarket || !state.stockMarket.stocks || state.stockMarket.stocks.length === 0) {
      console.log('[SongApp] 初始化股票市场数据');
      const stockMarket = SongStockMarket.initStockMarket();
      await SongState.update('stockMarket', stockMarket);
    }
  }

  /**
   * 如果基金数据为空，初始化
   */
  async function initFundsIfEmpty() {
    const state = SongState.getState();
    if (!state.funds || state.funds.length === 0) {
      console.log('[SongApp] 初始化基金数据');
      const funds = SongFund.initFunds();
      await SongState.update('funds', funds);
    }
    // 初始化基金持仓（如果为空）
    if (!state.fundPortfolio) {
      await SongState.update('fundPortfolio', []);
    }
    // 初始化股票持仓（如果为空）
    if (!state.portfolio) {
      await SongState.update('portfolio', []);
    }
  }

  /**
   * 检查并执行每日结算（如果上次结算日期不是今天）
   */
  async function checkAndRunDailySettlement() {
    const state = SongState.getState();
    const currentDate = SongDate.getCurrentDate();
    const lastSettlementDate = state.lastSettlementDate;

    if (!lastSettlementDate || lastSettlementDate !== currentDate) {
      console.log('[SongApp] 执行每日结算，当前日期:', currentDate);
      await runDailySettlement();
    }
  }

  /**
   * 检查是否在静默时段内
   * @param {Date} date - 要检查的时间
   * @param {number} startHour - 静默开始小时
   * @param {number} endHour - 静默结束小时
   * @returns {boolean}
   */
  function isInQuietHours(date, startHour, endHour) {
    const hour = date.getHours();
    if (startHour === endHour) return false; // 开始和结束相同表示不静默
    if (startHour < endHour) {
      // 同一天内的静默时段，如 10:00-19:00
      return hour >= startHour && hour < endHour;
    } else {
      // 跨天的静默时段，如 19:00-次日10:00
      return hour >= startHour || hour < endHour;
    }
  }

  /**
   * 计算两个时间点之间的有效小时数（排除静默时段）
   * @param {Date} start - 开始时间
   * @param {Date} end - 结束时间
   * @param {number} quietStart - 静默开始小时
   * @param {number} quietEnd - 静默结束小时
   * @returns {number} 有效小时数
   */
  function calculateEffectiveHours(start, end, quietStart, quietEnd) {
    if (end <= start) return 0;
    let effectiveHours = 0;
    const current = new Date(start);
    // 按小时遍历计算
    while (current < end) {
      const nextHour = new Date(current);
      nextHour.setHours(current.getHours() + 1, 0, 0, 0);
      const segmentEnd = nextHour < end ? nextHour : end;
      const segmentDuration = (segmentEnd - current) / (1000 * 60 * 60);
      // 检查这个小时是否在静默时段
      if (!isInQuietHours(current, quietStart, quietEnd)) {
        effectiveHours += segmentDuration;
      }
      current.setTime(nextHour.getTime());
    }
    return effectiveHours;
  }

  /**
   * 基于现实时间检查并生成待办事项
   * 根据用户设置的频率和静默时段，随时间流逝生成新待办
   */
  async function checkAndGenerateRealtimeEvents() {
    const state = SongState.getState();
    const settings = state.settings || {};

    // 如果未启用现实时间生成，直接返回
    if (!settings.realtimeEventGeneration) {
      console.log('[SongApp] 现实时间生成待办已关闭');
      return;
    }

    const now = new Date();
    const lastGenAt = settings.lastEventGenerationAt ? new Date(settings.lastEventGenerationAt) : null;
    const eventsPerHour = settings.eventsPerHour || 1;
    const quietStart = settings.quietHoursStart ?? 19;
    const quietEnd = settings.quietHoursEnd ?? 10;

    // 如果是第一次生成，初始化时间戳，不生成事件
    if (!lastGenAt) {
      console.log('[SongApp] 首次启动，初始化待办生成时间戳');
      await SongState.update('settings.lastEventGenerationAt', now.toISOString());
      return;
    }

    // 计算有效小时数（排除静默时段）
    const effectiveHours = calculateEffectiveHours(lastGenAt, now, quietStart, quietEnd);

    // 计算应该生成的事件数量
    const shouldGenerate = Math.floor(effectiveHours * eventsPerHour);

    if (shouldGenerate <= 0) {
      console.log(`[SongApp] 待办生成检查：有效小时 ${effectiveHours.toFixed(2)}，无需生成新待办`);
      // 更新时间戳（即使没生成，也更新，避免静默时段结束后一次性生成太多）
      await SongState.update('settings.lastEventGenerationAt', now.toISOString());
      return;
    }

    console.log(`[SongApp] 待办生成：有效小时 ${effectiveHours.toFixed(2)}，生成 ${shouldGenerate} 条新待办`);

    // 生成新事件
    const newEvents = SongEvents.generateDailyEvents(state, shouldGenerate);

    // 合并到现有待办
    const existingPending = state.events?.pending || [];
    const updatedPending = [...newEvents, ...existingPending];

    // 更新状态
    await SongState.batchUpdate({
      'events.pending': updatedPending,
      'settings.lastEventGenerationAt': now.toISOString()
    });

    // 提示用户
    showToast(`📋 新增 ${shouldGenerate} 条待处理事务`);
  }

  /**
   * 执行每日结算
   * 1. 更新子公司经营数据
   * 2. 计算集团财务
   * 3. 更新股票市场
   * 4. 更新基金净值
   * 注意：事件生成已改为基于现实时间，由 checkAndGenerateRealtimeEvents 负责
   */
  async function runDailySettlement() {
    const state = SongState.getState();
    const currentDate = SongDate.getCurrentDate();

    // 1. 更新子公司数据 + 计算集团财务
    const settlementResult = SongFinance.dailySettlement(state);

    // 2. 更新股票市场
    const updatedStockMarket = SongStockMarket.dailyUpdate(state.stockMarket, {
      ...state,
      ...settlementResult
    });

    // 4. 更新基金净值（加保护，旧存档兼容）
    let updatedFunds = state.funds || [];
    try {
      if (updatedFunds.length > 0) {
        updatedFunds = SongFund.dailyUpdate(updatedFunds, {
          ...state,
          ...settlementResult
        });
      }
    } catch (e) {
      console.warn('[SongApp] 基金净值更新失败:', e);
    }

    // 5. 检查里程碑解锁（加保护）
    let milestoneResult = { newMilestones: [], abilityRewards: {}, allMilestones: state.heir?.milestones || [] };
    try {
      milestoneResult = SongGrowth.checkMilestones({
        ...state,
        ...settlementResult,
        funds: updatedFunds
      });
    } catch (e) {
      console.warn('[SongApp] 里程碑检查失败:', e);
    }

    // 应用里程碑能力奖励
    let updatedAbilities = { ...(state.heir?.abilities || {}) };
    if (milestoneResult.abilityRewards) {
      for (const [key, value] of Object.entries(milestoneResult.abilityRewards)) {
        updatedAbilities[key] = Math.min(100, (updatedAbilities[key] || 50) + value);
      }
    }

    // 6. 更新状态
    await SongState.batchUpdate({
      'subsidiaries': settlementResult.subsidiaries,
      'company': settlementResult.company,
      'stockMarket': updatedStockMarket,
      'funds': updatedFunds,
      'heir.milestones': milestoneResult.allMilestones,
      'heir.abilities': updatedAbilities,
      'lastSettlementDate': currentDate
    });

    // 提示新解锁的里程碑
    if (milestoneResult.newMilestones.length > 0) {
      milestoneResult.newMilestones.forEach((m, i) => {
        setTimeout(() => {
          showToast(`🎉 解锁里程碑：${m.title}`);
        }, i * 1500);
      });
    }

    console.log(`[SongApp] 每日结算完成：子公司数据已更新，股票市场已更新，基金净值已更新，里程碑检查完成（新解锁 ${milestoneResult.newMilestones.length} 个）`);
  }

  /**
   * 显示错误
   */
  function showError(message) {
    const container = document.getElementById('app-content');
    if (container) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">❌</div>
          <div class="empty-state-text">
            <p>${message}</p>
          </div>
        </div>
      `;
    }
  }

  /**
   * 获取当前页面
   */
  function getCurrentPage() {
    return currentPage;
  }

  /**
   * 是否初始化完成
   */
  function isInitialized() {
    return initialized;
  }

  // 公开 API
  return {
    init,
    navigateTo,
    getCurrentPage,
    isInitialized,
    showToast,
    renderCurrentPage,
    checkAndGenerateRealtimeEvents
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongApp = SongApp;
}

// DOM 加载完成后自动初始化
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => SongApp.init());
  } else {
    SongApp.init();
  }
}


</script>
