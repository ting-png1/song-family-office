事件标题：${event.title}
事件类型：${event.category || '普通事件'}
原始描述：${event.description || ''}

当前游戏日期：${state.gameDate?.current || ''}
松氏集团总资产：${formatMoney(state.company?.totalAssets || 0)}

请以第三人称视角，像商业小说一样描述这个事件，让松庭（松家长女）有身临其境的感觉。`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.9, maxTokens: 500 });
  }

  // ═══════════════════════════════════════════════
  // 市场舆论生成
  // ═══════════════════════════════════════════════

  async function generateMarketSentiment(state) {
    const reputation = state.heir?.abilities?.reputation || 50;
    const influence = state.heir?.abilities?.influence || 50;
    const company = state.company || {};

    const systemPrompt = `你是香港财经媒体的评论员，撰写关于松氏集团和松家长女松庭的市场舆论评论。
风格：像财经专栏，有观点、有八卦、有深度。
只输出评论内容。`;

    const userPrompt = `请撰写一段 150-250 字的市场舆论评论，关于松氏集团和松家长女松庭：

松氏集团总资产：${formatMoney(company.totalAssets || 0)}
松庭市场声誉：${reputation}/100
松庭资本影响力：${influence}/100

请根据声誉和影响力数值，撰写相应的市场舆论：
- 声誉高：正面评价，市场看好
- 声誉低：负面传闻，市场质疑
- 影响力高：市场关注，一举一动都有影响
- 影响力低：市场忽视，没有存在感

风格像香港财经报纸的专栏评论。`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.85, maxTokens: 600 });
  }

  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    getConfig,
    saveConfig,
    isEnabled,
    callAI,
    generateFinancialNews,
    generateInvestmentAdvice,
    generateExecutiveReport,
    generateAnnualReport,
    polishEventDescription,
    generateMarketSentiment,
    DEFAULT_BASE_URL,
    DEFAULT_MODEL
  };
})();

/* ===== js/pages/dashboard.js ===== */
/**
 * 松氏家族办公室 - 首页 / 控制中心（驾驶舱版）
 * 核心指标 + 今日重点 + 风险预警 + 子公司概览 + 投资概览 + 待办 + 市场 + 继承人
 */

const PageDashboard = (function () {
  'use strict';

  // ═══════════════════════════════════════════════
  // 数据计算函数
  // ═══════════════════════════════════════════════

  /**
   * 计算风险预警
   */
  function calculateRiskAlerts(state) {
    const alerts = [];
    const company = state.company || {};
    const subsidiaries = state.subsidiaries || [];
    const heir = state.heir || {};
    const abilities = heir.abilities || {};

    // 现金流预警
    if (company.cashFlow < 300000000) {
      alerts.push({
        level: 'high',
        title: '现金流紧张',
        description: `当前现金流仅 ${formatMoney(company.cashFlow)}，低于安全线 3 亿`,
        action: '去投资页面减持',
        actionPage: 'investment',
        icon: 'alert'
      });
    } else if (company.cashFlow < 500000000) {
      alerts.push({
        level: 'medium',
        title: '现金流偏低',
        description: `当前现金流 ${formatMoney(company.cashFlow)}，建议关注资金流动性`,
        action: '查看财务详情',
        actionPage: 'company',
        icon: 'alert'
      });
    }

    // 子公司预警
    subsidiaries.forEach(sub => {
      if (sub.type === '公益') return;
      // 连续亏损
      if (sub.profit < 0) {
        alerts.push({
          level: 'high',
          title: `${sub.name} 亏损`,
          description: `当前利润 ${formatMoney(sub.profit)}，需要关注经营状况`,
          action: '查看详情',
          actionPage: 'company',
          subsidiaryId: sub.id,
          icon: 'trending-down'
        });
      }
      // 员工满意度低
      if (sub.satisfaction < 55) {
        alerts.push({
          level: 'medium',
          title: `${sub.name} 员工满意度低`,
          description: `满意度仅 ${sub.satisfaction}%，可能影响运营效率`,
          action: '查看详情',
          actionPage: 'company',
          subsidiaryId: sub.id,
          icon: 'users'
        });
      }
      // 声誉低
      if (sub.reputation < 55) {
        alerts.push({
          level: 'medium',
          title: `${sub.name} 市场声誉下滑`,
          description: `声誉值 ${sub.reputation}，建议关注品牌形象`,
          action: '查看详情',
          actionPage: 'company',
          subsidiaryId: sub.id,
          icon: 'star'
        });
      }
    });

    // 继承人能力预警
    if (abilities.familyTrust < 40) {
      alerts.push({
        level: 'high',
        title: '家族信任度不足',
        description: `家族信任度仅 ${abilities.familyTrust}，重大决策可能受到限制`,
        action: '查看档案',
        actionPage: 'heir',
        icon: 'shield'
      });
    }

    // 待办过多
    const pendingCount = state.events?.pending?.length || 0;
    if (pendingCount > 8) {
      alerts.push({
        level: 'medium',
        title: '待办事务积压',
        description: `当前有 ${pendingCount} 项待处理事务，建议及时处理`,
        action: '去处理',
        actionPage: 'tasks',
        icon: 'list'
      });
    }

    return alerts.slice(0, 5); // 最多显示5条
  }

  /**
   * 计算今日重点建议
   */
  function calculateTodayFocus(state, alerts) {
    const focus = [];
    const pending = state.events?.pending || [];

    // 1. 紧急待办优先
    const highPriority = pending.filter(e => e.priority === 'high');
    if (highPriority.length > 0) {
      focus.push({
        priority: 1,
        title: `处理紧急事务：${highPriority[0].title}`,
        description: '该事务优先级为紧急，建议优先处理',
        action: '立即处理',
        actionPage: 'tasks',
        icon: 'alert'
      });
    }

    // 2. 风险预警
    if (alerts.length > 0) {
      const highAlert = alerts.find(a => a.level === 'high');
      if (highAlert) {
        focus.push({
          priority: 2,
          title: highAlert.title,
          description: highAlert.description,
          action: highAlert.action,
          actionPage: highAlert.actionPage,
          subsidiaryId: highAlert.subsidiaryId, // 保留子公司ID，用于直接打开子公司详情
          icon: highAlert.icon
        });
      }
    }

    // 3. 普通待办
    const mediumPriority = pending.filter(e => e.priority === 'medium');
    if (focus.length < 3 && mediumPriority.length > 0) {
      focus.push({
        priority: 3,
        title: `处理重要事务：${mediumPriority[0].title}`,
        description: '该事务优先级为重要',
        action: '去处理',
        actionPage: 'tasks',
        icon: 'list'
      });
    }

    // 4. 如果没有待办，建议查看市场
    if (focus.length === 0) {
      focus.push({
        priority: 1,
        title: '今日暂无紧急事务',
        description: '可以查看市场动态，或审视子公司经营状况',
        action: '查看市场',
        actionPage: 'market',
        icon: 'trending-up'
      });
    }

    return focus.slice(0, 3);
  }

  /**
   * 计算子公司概览数据
   */
  function calculateSubsidiaryOverview(subsidiaries) {
    return (subsidiaries || []).map(sub => {
      const profitPositive = sub.profit >= 0;
      const satisfactionLevel = sub.satisfaction >= 75 ? 'high' : sub.satisfaction >= 55 ? 'medium' : 'low';
      const isRisk = sub.profit < 0 || sub.satisfaction < 55 || sub.reputation < 55;

      return {
        id: sub.id,
        name: sub.name,
        type: sub.type,
        revenue: sub.revenue,
        profit: sub.profit,
        profitMargin: sub.profitMargin,
        satisfaction: sub.satisfaction,
        reputation: sub.reputation,
        growthRate: sub.growthRate,
        profitPositive,
        satisfactionLevel,
        isRisk,
        employees: sub.employees
      };
    });
  }

  /**
   * 计算投资组合概览
   */
  function calculateInvestmentOverview(state) {
    const stockPortfolio = state.portfolio || [];
    const fundPortfolio = state.fundPortfolio || [];
    const stocks = state.stockMarket?.stocks || [];
    const funds = state.funds || [];

    // 股票市值
    const stockValue = stockPortfolio.reduce((sum, p) => {
      const stock = stocks.find(s => s.id === p.stockId);
      return sum + (stock ? stock.price * p.shares : 0);
    }, 0);

    // 股票成本
    const stockCost = stockPortfolio.reduce((sum, p) => {
      return sum + (p.avgCost * p.shares);
    }, 0);

    // 基金市值
    const fundValue = fundPortfolio.reduce((sum, p) => {
      const fund = funds.find(f => f.id === p.fundId);
      return sum + (fund ? fund.nav * p.shares : 0);
    }, 0);

    // 基金成本
    const fundCost = fundPortfolio.reduce((sum, p) => {
      return sum + (p.avgCost * p.shares);
    }, 0);

    const totalValue = stockValue + fundValue;
    const totalCost = stockCost + fundCost;
    const totalProfit = totalValue - totalCost;
    const profitPercent = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;

    // 持仓分布
    const cash = state.company?.cashFlow || 0;
    const totalAssets = state.company?.totalAssets || 0;
    const stockPercent = totalAssets > 0 ? (stockValue / totalAssets) * 100 : 0;
    const fundPercent = totalAssets > 0 ? (fundValue / totalAssets) * 100 : 0;
    const cashPercent = totalAssets > 0 ? (cash / totalAssets) * 100 : 0;
    const otherPercent = Math.max(0, 100 - stockPercent - fundPercent - cashPercent);

    return {
      totalValue,
      totalCost,
      totalProfit,
      profitPercent,
      stockValue,
      fundValue,
      stockCount: stockPortfolio.length,
      fundCount: fundPortfolio.length,
      allocation: {
        stock: stockPercent,
        fund: fundPercent,
        cash: cashPercent,
        other: otherPercent
      }
    };
  }

  /**
   * 生成迷你趋势图 SVG（简单折线）
   */
  function generateMiniSparkline(data, color = '#d4af37', width = 80, height = 24) {
    if (!data || data.length < 2) return '';
    const values = data.map(d => typeof d === 'number' ? d : (d.value || d.revenue || 0));
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const stepX = width / (values.length - 1);

    const points = values.map((v, i) => {
      const x = i * stepX;
      const y = height - ((v - min) / range) * (height - 4) - 2;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" class="mini-sparkline">
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  // ═══════════════════════════════════════════════

  // ═══════════════════════════════════════════════

  function formatMoney(amount) {
    if (amount >= 100000000) {
      return (amount / 100000000).toFixed(2) + ' 亿';
    } else if (amount >= 10000) {
      return (amount / 10000).toFixed(2) + ' 万';
    }
    return amount.toLocaleString();
  }

  // 公开 API
  return {
    render,
    calculateRiskAlerts,
    calculateTodayFocus,
    calculateSubsidiaryOverview,
    calculateInvestmentOverview
  };
})();

    // 根据筛选条件过滤待办
    const filteredPending = currentFilter === 'all' 
      ? pending 
      : pending.filter(e => e.priority === currentFilter);

    container.innerHTML = `
      <div class="page-header">
        <h1 class="page-title">待办事务</h1>

        <div class="stats-grid">

            <div class="stat-label">紧急</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" style="color: var(--color-warning);">${pending.filter(e => e.priority === 'medium').length}</div>
            <div class="stat-label">重要</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" style="color: var(--color-info);">${pending.filter(e => e.priority === 'low').length}</div>
            <div class="stat-label">常规</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" style="color: var(--color-text-muted);">${history.length}</div>
            <div class="stat-label">已处理</div>
          </div>
        </div>
      </div>

      <!-- 筛选和操作栏 -->
      <div class="section">
        <div class="section-header" style="flex-wrap: wrap; gap: 8px;">
          <span class="section-title">待处理 (${filteredPending.length}/${pending.length})</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button class="btn ${currentFilter === 'all' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('all')">全部</button>
            <button class="btn ${currentFilter === 'high' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('high')">紧急</button>
            <button class="btn ${currentFilter === 'medium' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('medium')">重要</button>
            <button class="btn ${currentFilter === 'low' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('low')">常规</button>
            ${pending.length > 0 ? `<button class="btn btn-danger btn-small" onclick="PageTasks.clearExpired()">清理过期(7天+)</button>` : ''}
          </div>
        </div>

        ${filteredPending.length > 0 ? `
          <div class="task-list">
            ${filteredPending.map((event, index) => renderTaskCard(event, pending.indexOf(event))).join('')}
          </div>
        ` : `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-text">
              <p>${pending.length === 0 ? '暂无待处理事务' : '当前筛选条件下暂无事务'}</p>
              <p style="font-size: 11px; margin-top: 8px; opacity: 0.7;">事务会随现实时间流逝自动生成</p>
            </div>
          </div>
        `}
      </div>

      <!-- 已处理历史 -->
      ${history.length > 0 ? `
        <div class="section">
          <div class="section-header">
            <span class="section-title">已处理 (${history.length})</span>
          </div>
          <div class="task-list history-list">
            ${history.slice(0, 10).map(event => renderHistoryCard(event)).join('')}
          </div>
        </div>
      ` : ''}
    `;
  }

  /**
   * 渲染事务卡片
   */
  function renderTaskCard(event, index) {
    const priorityConfig = {
      high: { label: '紧急', class: 'danger' },
      medium: { label: '重要', class: 'warning' },
      low: { label: '常规', class: 'info' }
    };
    const priority = priorityConfig[event.priority] || priorityConfig.low;

    const categoryLabels = {
      finance: '财务',
      hr: '人事',
      operation: '经营',
      risk: '风险',
      major: '重大'
    };

    return `
      <div class="task-card" data-index="${index}">
        <div class="task-header">
          <div class="task-tags">
            <span class="tag tag-${priority.class}">${priority.label}</span>
            <span class="tag tag-gold">${categoryLabels[event.category] || event.category}</span>
          </div>
          <span class="task-date">${event.date || ''}</span>
        </div>
        <h3 class="task-title">${event.title}</h3>
        <p class="task-summary">${event.description?.slice(0, 80)}${event.description?.length > 80 ? '...' : ''}</p>
        <div class="task-meta">
          <span class="task-department">${event.department || '综合事务'}</span>
          <span class="task-options-count">${event.options?.length || 0} 个方案</span>
        </div>
        <button class="btn btn-primary task-action" onclick="SongApp.openDetail('tasks', '${event.id}', 'task')">
          查看详情并处理
        </button>
      </div>
    `;
  }

  /**
   * 渲染历史卡片
   */
  function renderHistoryCard(event) {
    const selectedOption = event.options?.[event.selectedOption];
    return `
      <div class="task-card history-card">
        <div class="task-header">
          <span class="tag tag-success">已处理</span>
          <span class="task-date">${event.processedDate || ''}</span>
        </div>
        <h3 class="task-title">${event.title}</h3>
        <p class="task-summary">处理方案：${selectedOption?.label || '未知'}</p>
      </div>
    `;
  }

  /**
   * 渲染事务详情页
   */
  function renderEventDetail(container, event) {
    const priorityConfig = {
      high: { label: '紧急', class: 'danger' },
      medium: { label: '重要', class: 'warning' },
      low: { label: '常规', class: 'info' }
    };
    const priority = priorityConfig[event.priority] || priorityConfig.low;

    const categoryLabels = {
      finance: '财务',
      hr: '人事',
      operation: '经营',
      risk: '风险',
      major: '重大'
    };

    container.innerHTML = `
      <div class="page-header">
        <button class="btn-icon back-btn-icon" onclick="PageTasks.backToList()" title="返回列表">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h1 class="page-title" style="margin-top: var(--spacing-md);">事务详情</h1>
      </div>

      <!-- 事务信息卡片 -->
      <div class="card detail-card">
        <div class="detail-header">
          <div class="detail-tags">
            <span class="tag tag-${priority.class}">${priority.label}</span>
            <span class="tag tag-gold">${categoryLabels[event.category] || event.category}</span>
            <span class="tag tag-info">${event.department || '综合事务'}</span>
          </div>
          <span class="detail-date">${event.date || ''}</span>
        </div>

        <h2 class="detail-title">${event.title}</h2>
        <p class="detail-description">${event.description}</p>

        <div class="detail-meta">
          <div class="meta-row">
            <span class="meta-label">事务类型</span>
            <span class="meta-value">${event.type}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">提交时间</span>
            <span class="meta-value">${event.createdAt ? new Date(event.createdAt).toLocaleString('zh-CN') : '-'}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">可选方案</span>
            <span class="meta-value">${event.options?.length || 0} 个</span>
          </div>
        </div>
      </div>

      <!-- 处理方案 -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">请选择处理方案</span>
        </div>

        <div class="options-list">
          ${event.options?.map((option, index) => `
            <div class="option-card" data-index="${index}" onclick="PageTasks.selectOption(${index})">
              <div class="option-header">
                <span class="option-number">${index + 1}</span>
                <span class="option-label">${option.label}</span>
              </div>
              <p class="option-description">${option.description}</p>
              ${option.effects ? renderEffectsPreview(option.effects) : ''}
            </div>
          `).join('')}
        </div>
      </div>

      <!-- 确认按钮 -->
      <div class="action-bar">
        <button class="btn btn-secondary" onclick="PageTasks.backToList()">取消</button>
        <button class="btn btn-primary" id="confirm-decision-btn" disabled onclick="PageTasks.confirmDecision()">
          确认决策
        </button>
      </div>
    `;

    // 重置选中状态
    currentDetailEvent.selectedIndex = null;
  }

  /**
   * 渲染影响预览
   */
  function renderEffectsPreview(effects) {
    const effectLabels = {
      cashFlow: '现金流',
      employeeTrust: '员工信任',
      reputation: '市场声誉',
      familyTrust: '家族信任',
      business: '商业能力',
      decision: '决策能力',
      influence: '资本影响力',
      riskJudgment: '风险判断',
      potential: '发展潜力',
      risk: '风险等级'
    };

    const effectsHtml = Object.entries(effects)
      .filter(([key]) => effectLabels[key])
      .map(([key, value]) => {
        const isPositive = typeof value === 'number' && value > 0;
        const isNegative = typeof value === 'number' && value < 0;
        const colorClass = isPositive ? 'positive' : isNegative ? 'negative' : '';
        const sign = isPositive ? '+' : '';
        return `<span class="effect-tag ${colorClass}">${effectLabels[key]} ${sign}${value}</span>`;
      })
      .join('');

    return effectsHtml ? `<div class="effects-preview">${effectsHtml}</div>` : '';
  }

  /**
   * 显示事务详情
   */
  function showDetail(eventId) {
    const state = SongState.getState();
    const event = state.events?.pending?.find(e => e.id === eventId);
    if (event) {
      currentDetailEvent = { ...event };
      if (lastContainer) render(lastContainer);
    }
  }

  /**
   * 返回列表
   */
  function backToList() {
    // 优先使用全局导航历史栈返回（从哪来回哪去）
    if (typeof SongApp !== 'undefined' && typeof SongApp.goBack === 'function') {
      if (SongApp.goBack()) {
        return;
      }
    }
    // 回退：历史栈为空时，重置详情并重新渲染
    currentDetailEvent = null;
    if (lastContainer) render(lastContainer);
  }

  /**
   * 选择方案
   */
  function selectOption(index) {
    if (!currentDetailEvent) return;

    currentDetailEvent.selectedIndex = index;

    // 更新 UI
    document.querySelectorAll('.option-card').forEach((card, i) => {
      if (i === index) {
        card.classList.add('selected');
      } else {
        card.classList.remove('selected');
      }
    });

    // 启用确认按钮
    const confirmBtn = document.getElementById('confirm-decision-btn');
    if (confirmBtn) confirmBtn.disabled = false;
  }

  /**
   * 显示处理中提示
   */
  function showProcessing(message) {
    // 移除已存在的提示
    const existing = document.getElementById('task-processing-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'task-processing-overlay';
    overlay.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99998;
      backdrop-filter: blur(4px);
    `;
    overlay.innerHTML = `
      <div style="
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border: 1px solid rgba(212, 175, 55, 0.5);
        border-radius: 16px;
        padding: 32px 48px;
        text-align: center;
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
      ">
        <div style="
          width: 40px;
          height: 40px;
          border: 3px solid rgba(212, 175, 55, 0.2);
          border-top-color: #d4af37;
          border-radius: 50%;
          margin: 0 auto 16px;
          animation: spin 0.8s linear infinite;
        "></div>
        <div style="font-size: 16px; color: #d4af37; font-weight: 500; margin-bottom: 8px; font-family: 'Noto Serif SC', serif;">${message || '正在处理...'}</div>
        <div style="font-size: 12px; color: #888; font-family: 'Noto Serif SC', serif;">请稍候，正在计算决策影响</div>
      </div>
    `;
    document.body.appendChild(overlay);
  }

  /**
   * 隐藏处理中提示
   */
  function hideProcessing() {
    const overlay = document.getElementById('task-processing-overlay');
    if (overlay) {
      overlay.style.animation = 'fadeOut 0.3s ease';
      setTimeout(() => overlay.remove(), 300);
    }
  }

  /**
   * 确认决策
   */
  async function confirmDecision() {
    if (!currentDetailEvent || currentDetailEvent.selectedIndex === null) return;

    // 显示处理中提示
    showProcessing('正在执行决策...');

    // 延迟一帧让提示显示出来
    await new Promise(resolve => setTimeout(resolve, 50));

    try {
      const state = SongState.getState();
      const result = SongEvents.processEvent(
        currentDetailEvent.id,
        currentDetailEvent.selectedIndex,
        state
      );

      if (result.success) {
        // 更新状态（包含效果队列）
        const updates = {
          'events.pending': result.newPending,
          'events.history': result.newHistory,
          'events.activeEffects': result.newEffects,
          ...result.stateChanges
        };

        await SongState.batchUpdate(updates);

        // 隐藏处理中提示
        hideProcessing();

        // 显示结果提示（包含创建的效果数量）
        const option = result.option;
        const effectCount = result.createdEffects ? result.createdEffects.length : 0;
        if (effectCount > 0) {
          SongApp.showToast(`决策已执行：${option.label}（产生 ${effectCount} 项影响）`);
        } else {
          SongApp.showToast(`决策已执行：${option.label}`);
        }

        // 返回列表
        currentDetailEvent = null;
        setTimeout(() => {
          if (lastContainer) render(lastContainer);
        }, 300);
      } else {
        hideProcessing();
        SongApp.showToast(`处理失败：${result.error}`);
      }
    } catch (e) {
      console.error('[Tasks] 决策处理失败:', e);
      hideProcessing();
      SongApp.showToast('处理出错，请重试');
    }
  }

  /**
   * 生成更多事务（测试用）
   */
  async function generateMore() {
    const state = SongState.getState();
    const newEvents = SongEvents.generateDailyEvents(state, 2);
    const currentPending = state.events?.pending || [];
    const updatedPending = [...newEvents, ...currentPending];

    await SongState.update('events.pending', updatedPending);
    SongApp.showToast('已生成 2 条新事务');
    if (lastContainer) render(lastContainer);
  }

  /**
   * 设置筛选优先级
   */
  function setFilter(filter) {
    currentFilter = filter;
    if (lastContainer) render(lastContainer);
  }

  /**
   * 清理超过7天未处理的过期事务
   */
  async function clearExpired() {
    const state = SongState.getState();
    const pending = state.events?.pending || [];
    const now = new Date();
    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    // 分离过期和未过期的事务
    const expired = [];
    const active = [];
    pending.forEach(event => {
      const createdAt = event.createdAt ? new Date(event.createdAt) : null;
      if (createdAt && createdAt < sevenDaysAgo) {
        expired.push(event);
      } else {
        active.push(event);
      }
    });

    if (expired.length === 0) {
      SongApp.showToast('没有超过7天的过期事务');
      return;
    }

    if (!confirm(`确定要清理 ${expired.length} 条超过7天未处理的事务吗？此操作不可撤销！`)) {
      return;
    }

    // 将过期事务标记为已过期并移到历史
    const expiredHistory = expired.map(event => ({
      ...event,
      status: 'expired',
      processedDate: now.toISOString(),
      selectedOption: -1,
      effects: { note: '超时未处理，自动清理' }
    }));

    const history = state.events?.history || [];
    const updatedHistory = [...expiredHistory, ...history];

    await SongState.batchUpdate({
      'events.pending': active,
      'events.history': updatedHistory
    });

    SongApp.showToast(`✅ 已清理 ${expired.length} 条过期事务`);
    if (lastContainer) render(lastContainer);
  }

  // 公开 API
  return {
    render,
    showDetail,
    backToList,
    selectOption,
    confirmDecision,
    generateMore,
    setFilter,
    clearExpired
  };
})();

if (typeof window !== 'undefined') {
  window.PageTasks = PageTasks;
}

/**

const PageCompany = (function () {
  'use strict';

  // 当前查看的子公司详情
  let currentDetailId = null;

  // 危机处理冷却状态（防止反复点击）

  function getExpandedCompanyIds() {

  }

  function saveExpandedCompanyIds(set) {

  }

  /**
   * 显示危机处理成功提示（全屏模态弹窗，2秒后自动消失）
   */
  function showCrisisSuccess(message) {

    const modal = document.createElement('div');

      position: fixed;
      top: 0;
      left: 0;

      align-items: center;

    modal.innerHTML = `
      <div style="

        border: 2px solid #d4af37;
        border-radius: 16px;
        padding: 40px 60px;
        text-align: center;
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        animation: scaleIn 0.3s ease;
      ">
        <div style="font-size: 48px; margin-bottom: 16px;">✓</div>
        <div style="font-size: 20px; font-weight: 600; color: #d4af37; margin-bottom: 8px; font-family: 'Noto Serif SC', serif;">操作成功</div>
        <div style="font-size: 14px; color: #a0a0a0; font-family: 'Noto Serif SC', serif;">${message}</div>
      </div>

    // 2秒后自动消失
    setTimeout(() => {
      modal.style.animation = 'fadeOut 0.3s ease';

  /**
   * 渲染公司管理页面
   */
  function render(container) {
    // 记录当前渲染容器（支持资产页Tab容器和独立页面）
    lastContainer = container;
    const state = SongState.getState();
    let subsidiaries = state.subsidiaries || [];

    // 如果没有子公司数据，初始化
    if (subsidiaries.length === 0) {
      subsidiaries = SongFinance.initSubsidiaries();
      SongState.update('subsidiaries', subsidiaries);
    }

    // 如果正在查看子公司详情，渲染详情页
    if (currentDetailId) {
      const subsidiary = subsidiaries.find(s => s.id === currentDetailId);
      if (subsidiary) {
        renderDetail(container, subsidiary);
        return;
      } else {
        currentDetailId = null;
      }
    }

    // 渲染列表页
    renderList(container, subsidiaries, state);
  }

  /**
   * 渲染子公司列表页
   */
  function renderList(container, subsidiaries, state) {
    const company = state.company || {};

    // 第四阶段：如果没有财务三表数据，即时生成
    if (!company.financialStatements && subsidiaries.length > 0) {
      try {
        const fs = SongFinance.generateGroupFinancials(subsidiaries, company);
        const aa = SongFinance.analyzeAssetAllocation(
          subsidiaries, company,
          state.investments?.portfolio || [],
          state.investments?.fundPortfolio || [],
          state.stockMarket?.stocks || [],
          state.funds || []
        );
        SongState.update('company', { ...company, financialStatements: fs, assetAllocation: aa });
        company.financialStatements = fs;
        company.assetAllocation = aa;
      } catch (e) {
        console.warn('生成财务三表失败:', e);
      }
    }

    const totalRevenue = subsidiaries.reduce((sum, s) => sum + (s.revenue || 0), 0);
    const totalProfit = subsidiaries.reduce((sum, s) => sum + (s.profit || 0), 0);
    const totalEmployees = subsidiaries.reduce((sum, s) => sum + (s.employees || 0), 0);
    const avgSatisfaction = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.satisfaction || 0), 0) / subsidiaries.length)
      : 0;
    const avgReputation = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.reputation || 0), 0) / subsidiaries.length)
      : 0;
    const totalAssets = company.totalAssets || 0;

    // 风险预警统计
    const highRiskCount = subsidiaries.filter(s => s.risk === 'high').length;
    const lowSatisfactionCount = subsidiaries.filter(s => (s.satisfaction || 0) < 60).length;

    container.innerHTML = `
      <div class="page-header">
        <h1 class="page-title">公司管理</h1>
        <p class="page-subtitle">松氏集团旗下业务板块与子公司</p>
      </div>

      <!-- 集团概览 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">集团概览</span>
          <span class="tag tag-gold">6 个核心指标</span>
        </div>
        <div class="overview-grid overview-grid-3">
          <div class="overview-item clickable" onclick="PageCompany.showMetricDetail('revenue')">
            <div class="overview-value">${formatMoney(totalRevenue)}</div>
            <div class="overview-label">年营收</div>

  /**

   */

    const profitMargin = company.revenue > 0 ? ((company.profit / company.revenue) * 100).toFixed(1) : '0';
    const growthRate = company.growthRate || 0;
    const isExpanded = getExpandedCompanyIds().has(company.id);

    return `
      <div class="company-card company-card-collapsible ${isExpanded ? 'expanded' : ''}" data-id="${company.id}">
        <!-- 折叠头部（始终显示） -->
        <div class="company-card-header" onclick="PageCompany.toggleCompanyExpand('${company.id}')">
          <div class="company-header-info">
            <h3 class="company-name">${company.name}</h3>
            <span class="company-type">${company.type}</span>
          </div>
          <div class="company-header-right">
            <div class="company-badges">
              <span class="tag tag-${company.risk === 'high' ? 'danger' : company.risk === 'medium' ? 'warning' : 'success'}">
                风险${company.risk === 'high' ? '高' : company.risk === 'medium' ? '中' : '低'}
              </span>
              <span class="tag tag-${company.potential === 'high' ? 'gold' : company.potential === 'medium' ? 'info' : 'muted'}">
                潜力${company.potential === 'high' ? '高' : company.potential === 'medium' ? '中' : '低'}

            </div>
            <span class="expand-arrow ${isExpanded ? 'expanded' : ''}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </div>
        </div>

        <!-- 展开内容（折叠时隐藏） -->
        <div class="company-card-content" style="display: ${isExpanded ? 'block' : 'none'}">
          ${company.description ? `<p class="company-desc">${company.description}</p>` : ''}

          <div class="company-stats">
            <div class="stat-item">
              <span class="stat-label">年营收</span>
              <span class="stat-value">${formatMoney(company.revenue || 0)}</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">年利润</span>
              <span class="stat-value ${(company.profit || 0) >= 0 ? 'positive' : 'negative'}">${formatMoney(company.profit || 0)}</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">利润率</span>
              <span class="stat-value">${profitMargin}%</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">增长率</span>
              <span class="stat-value ${growthRate >= 0 ? 'positive' : 'negative'}">${growthRate >= 0 ? '+' : ''}${growthRate}%</span>
            </div>
          </div>

          <div class="company-progress">
            <div class="progress-item">
              <span class="progress-label">员工满意度</span>
              <div class="progress-bar"><div class="progress-fill" style="width: ${company.satisfaction || 0}%"></div></div>
              <span class="progress-value">${company.satisfaction || 0}%</span>
            </div>
            <div class="progress-item">
              <span class="progress-label">市场声誉</span>
              <div class="progress-bar"><div class="progress-fill" style="width: ${company.reputation || 0}%"></div></div>
              <span class="progress-value">${company.reputation || 0}%</span>

          <div class="company-meta">
            <span class="meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              ${company.employees || 0} 人

            <span class="meta-item">

  /**
   * 切换子公司卡片展开/折叠状态
   */
  function toggleCompanyExpand(companyId) {
    const expanded = getExpandedCompanyIds();
    if (expanded.has(companyId)) {
      expanded.delete(companyId);
    } else {
      expanded.add(companyId);
    }
    saveExpandedCompanyIds(expanded);
    // 重新渲染当前页面（使用记录的渲染容器，支持资产页Tab容器）
    if (lastContainer) {
      render(lastContainer);
    }
  }

  /**
   * 渲染子公司详情页
   */
  function renderDetail(container, subsidiary) {
    const history = subsidiary.history || [];
    const recentHistory = history.slice(0, 7).reverse();
    const profitMargin = subsidiary.revenue > 0 ? ((subsidiary.profit / subsidiary.revenue) * 100).toFixed(1) : '0';

    // 计算同比环比（基于历史数据）
    const historyLen = history.length;
    const yoyRevenue = historyLen >= 30 ? ((subsidiary.revenue - (history[29]?.revenue || subsidiary.revenue)) / (history[29]?.revenue || 1)) * 100 : null;
    const yoyProfit = historyLen >= 30 ? ((subsidiary.profit - (history[29]?.profit || subsidiary.profit)) / (Math.abs(history[29]?.profit) || 1)) * 100 : null;
    const qoqRevenue = historyLen >= 7 ? ((subsidiary.revenue - (history[6]?.revenue || subsidiary.revenue)) / (history[6]?.revenue || 1)) * 100 : null;
    const qoqProfit = historyLen >= 7 ? ((subsidiary.profit - (history[6]?.profit || subsidiary.profit)) / (Math.abs(history[6]?.profit) || 1)) * 100 : null;

    const formatYoY = (val) => val === null ? '' : `<span class="yoy-tag ${val >= 0 ? 'positive' : 'negative'}">同比 ${val >= 0 ? '+' : ''}${val.toFixed(1)}%</span>`;
    const formatQoQ = (val) => val === null ? '' : `<span class="qoq-tag ${val >= 0 ? 'positive' : 'negative'}">环比 ${val >= 0 ? '+' : ''}${val.toFixed(1)}%</span>`;

    container.innerHTML = `
      <div class="page-header">
        <button class="btn-icon back-btn-icon" onclick="PageCompany.backToList()" title="返回列表">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h1 class="page-title" style="margin-top: var(--spacing-md);">${subsidiary.name}</h1>
        <p class="page-subtitle">${subsidiary.type} · ${subsidiary.description || ''}</p>
      </div>

      <!-- 核心数据卡片 -->
      <div class="card metric-card">
        <div class="metric-large">
          <div class="metric-value">${formatMoney(subsidiary.revenue || 0)}</div>
          <div class="metric-label">年营收 ${formatYoY(yoyRevenue)} ${formatQoQ(qoqRevenue)}</div>
        </div>
        <div class="data-row">
          <span class="data-label">年利润 ${formatYoY(yoyProfit)} ${formatQoQ(qoqProfit)}</span>
          <span class="data-value ${(subsidiary.profit || 0) >= 0 ? 'positive' : 'negative'}">${formatMoney(subsidiary.profit || 0)}</span>
        </div>
        <div class="data-row">
          <span class="data-label">利润率</span>
          <span class="data-value gold">${profitMargin}%</span>
        </div>
        <div class="data-row">
          <span class="data-label">增长率</span>
          <span class="data-value ${(subsidiary.growthRate || 0) >= 0 ? 'positive' : 'negative'}">${subsidiary.growthRate || 0}%</span>
        </div>
      </div>

      <!-- 经营指标 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">经营指标</span>
        </div>
        <div class="detail-stats-grid">
          <div class="detail-stat-item">
            <div class="detail-stat-value">${subsidiary.employees || 0}</div>
            <div class="detail-stat-label">员工人数</div>
          </div>
          <div class="detail-stat-item">
            <div class="detail-stat-value">${subsidiary.marketShare || 0}%</div>
            <div class="detail-stat-label">市场占比</div>
          </div>
          <div class="detail-stat-item">
            <div class="detail-stat-value ${subsidiary.satisfaction >= 70 ? 'positive' : subsidiary.satisfaction >= 50 ? 'warning' : 'negative'}">${subsidiary.satisfaction || 0}%</div>
            <div class="detail-stat-label">员工满意度</div>
          </div>
          <div class="detail-stat-item">
            <div class="detail-stat-value ${subsidiary.reputation >= 70 ? 'positive' : subsidiary.reputation >= 50 ? 'warning' : 'negative'}">${subsidiary.reputation || 0}%</div>
            <div class="detail-stat-label">市场声誉</div>
          </div>
        </div>

        <div class="detail-progress-section">
          <div class="progress-item">
            <span class="progress-label">员工满意度</span>
            <div class="progress-bar ability-bar-large"><div class="progress-fill ability-fill-large" style="width: ${subsidiary.satisfaction || 0}%"></div></div>
            <span class="progress-value">${subsidiary.satisfaction || 0}%</span>
          </div>
          <div class="progress-item">
            <span class="progress-label">市场声誉</span>
            <div class="progress-bar ability-bar-large"><div class="progress-fill ability-fill-large" style="width: ${subsidiary.reputation || 0}%"></div></div>
            <span class="progress-value">${subsidiary.reputation || 0}%</span>
          </div>
        </div>
      </div>

      <!-- 风险与潜力评估 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">风险与潜力评估</span>
        </div>
        <div class="assessment-grid">
          <div class="assessment-item">
            <span class="assessment-label">风险等级</span>
            <span class="tag tag-${subsidiary.risk === 'high' ? 'danger' : subsidiary.risk === 'medium' ? 'warning' : 'success'}">
              ${subsidiary.risk === 'high' ? '高风险' : subsidiary.risk === 'medium' ? '中风险' : '低风险'}
            </span>
          </div>
          <div class="assessment-item">
            <span class="assessment-label">发展潜力</span>
            <span class="tag tag-${subsidiary.potential === 'high' ? 'gold' : subsidiary.potential === 'medium' ? 'info' : 'muted'}">
              ${subsidiary.potential === 'high' ? '高潜力' : subsidiary.potential === 'medium' ? '中潜力' : '低潜力'}
            </span>

          <p>${getRiskAssessment(subsidiary)}</p>

        return `
          <div class="card">
            <div class="card-header">
              <span class="card-title">高管薪酬与股权激励</span>
              <span class="tag tag-gold">薪酬占营收 ${comp.compensationRatio}%</span>
            </div>
            <div class="compensation-grid">
              <div class="comp-item">
                <div class="comp-value">${formatMoney(comp.baseSalary)}</div>
                <div class="comp-label">基本工资</div>
              </div>
              <div class="comp-item">
                <div class="comp-value ${comp.performanceBonus > 0 ? 'positive' : ''}">${formatMoney(comp.performanceBonus)}</div>
                <div class="comp-label">绩效奖金</div>
              </div>
              <div class="comp-item">
                <div class="comp-value ${comp.equityIncentive > 0 ? 'gold' : ''}">${formatMoney(comp.equityIncentive)}</div>

              </div>
              <div class="comp-item">
                <div class="comp-value">${formatMoney(comp.totalCompensation)}</div>
                <div class="comp-label">薪酬总额</div>
              </div>
            </div>
            <div class="compensation-desc">
              <p>基本工资为营收的0.1%，绩效奖金为利润的2%，高增长企业额外授予股权激励。</p>
            </div>
          </div>
        `;
      })()}

      <!-- 危机处理区域 -->
      ${isInCrisis(subsidiary) ? `
        <div class="card crisis-card">
          <div class="card-header">
            <span class="card-title crisis-title">⚠️ 危机处理</span>
            <span class="tag tag-danger">需要干预</span>
          </div>
          <div class="crisis-actions-list">
            ${getCrisisActions(subsidiary).map(action => `
              <div class="crisis-action-item ${action.disabled ? 'disabled' : ''} ${action.risky ? 'risky' : ''} ${action.dangerous ? 'dangerous' : ''}">
                <div class="crisis-action-header">
                  <span class="crisis-action-name">${action.name}</span>
                  ${action.delayed ? '<span class="tag tag-info">延迟生效</span>' : ''}
                  ${action.risky ? '<span class="tag tag-warning">高风险</span>' : ''}
                  ${action.dangerous ? '<span class="tag tag-danger">不可逆</span>' : ''}
                </div>
                <div class="crisis-action-desc">${action.desc}</div>
                <div class="crisis-action-meta">
                  <span class="crisis-cost">${action.costLabel}</span>
                  <span class="crisis-effect">${action.effect}</span>
                </div>
                <button class="btn ${action.dangerous ? 'btn-danger' : action.risky ? 'btn-warning' : 'btn-primary'} btn-sm crisis-action-btn"
                        onclick="PageCompany.handleCrisisAction('${subsidiary.id}', '${action.id}')"
                        ${action.disabled || crisisActionCooldown ? 'disabled' : ''}>
                  ${crisisActionCooldown ? '操作冷却中...' : (action.disabled ? action.disabledReason : '执行')}
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}

      <!-- 第四阶段：子公司财务三表 -->
      ${renderSubsidiaryFinancials(subsidiary)}

      <!-- 历史趋势 -->
      ${recentHistory.length > 1 ? `
        <div class="card">
          <div class="card-header">
            <span class="card-title">近期经营趋势</span>
            <span class="tag tag-info">最近 ${recentHistory.length} 天</span>
          </div>

          <!-- 营收趋势迷你图 -->
          <div class="trend-section">
            <div class="trend-label">营收趋势</div>
            <div class="mini-chart">
              ${renderMiniBarChart(recentHistory.map(h => h.revenue), 'revenue')}
            </div>
          </div>

          <!-- 利润趋势迷你图 -->
          <div class="trend-section">
            <div class="trend-label">利润趋势</div>
            <div class="mini-chart">
              ${renderMiniBarChart(recentHistory.map(h => h.profit), 'profit')}

          <!-- 历史数据表 -->

          </div>

      <!-- 操作按钮 -->

        <button class="btn btn-secondary" onclick="PageCompany.backToList()">返回列表</button>
      </div>

    // 协同效应评分颜色

      <div class="card synergy-card">

  /**
   * 渲染财务总览卡片
   */
  function renderFinancialOverview(company) {
    const fs = company?.financialStatements;
    const ratios = fs?.ratios;
    const allocation = company?.assetAllocation;

    if (!fs || !ratios) {
      return `
        <div class="card">
          <div class="card-header">
            <span class="card-title">财务总览</span>
            <span class="tag tag-muted">数据生成中</span>
          </div>
          <p style="color: var(--text-secondary); font-size: 13px;">财务三表数据将在首次每日结算后生成，请推进游戏日期。</p>
        </div>
      `;
    }

    const income = fs.incomeStatement;
    const balance = fs.balanceSheet;
    const cashFlow = fs.cashFlowStatement;

    // 比率颜色
    const roeColor = ratios.roe >= 15 ? 'positive' : ratios.roe >= 8 ? 'warning' : 'negative';
    const debtColor = ratios.debtRatio <= 50 ? 'positive' : ratios.debtRatio <= 70 ? 'warning' : 'negative';
    const currentColor = ratios.currentRatio >= 2 ? 'positive' : ratios.currentRatio >= 1 ? 'warning' : 'negative';

    return `
      <div class="card financial-overview-card">
        <div class="card-header">
          <span class="card-title">财务总览</span>
          <button class="btn btn-gold btn-small" onclick="PageCompany.showFinancialStatements()" style="background: transparent !important; border: 1px solid #b8965a !important; color: #b8965a !important; font-size: 12px !important; padding: 6px 14px !important; border-radius: 20px !important; font-weight: 500 !important;">
            查看完整三表 →
          </button>
        </div>

        <!-- 关键财务比率 -->
        <div class="financial-ratios-grid">
          <div class="ratio-item">
            <div class="ratio-value ${roeColor}">${ratios.roe}%</div>
            <div class="ratio-label">净资产收益率 ROE</div>
          </div>
          <div class="ratio-item">
            <div class="ratio-value">${ratios.roa}%</div>
            <div class="ratio-label">总资产收益率 ROA</div>
          </div>
          <div class="ratio-item">
            <div class="ratio-value ${debtColor}">${ratios.debtRatio}%</div>
            <div class="ratio-label">资产负债率</div>
          </div>
          <div class="ratio-item">
            <div class="ratio-value ${currentColor}">${ratios.currentRatio}</div>
            <div class="ratio-label">流动比率</div>
          </div>
          <div class="ratio-item">
            <div class="ratio-value">${ratios.grossMargin}%</div>
            <div class="ratio-label">毛利率</div>
          </div>
          <div class="ratio-item">
            <div class="ratio-value">${ratios.netMargin}%</div>
            <div class="ratio-label">净利率</div>
          </div>
        </div>

        <!-- 三表摘要 -->
        <div class="financial-summary-grid">
          <div class="summary-section">
            <div class="summary-title">利润表摘要</div>
            <div class="summary-row"><span>营业收入</span><span class="gold">${formatMoney(income.revenue)}</span></div>
            <div class="summary-row"><span>毛利润</span><span>${formatMoney(income.grossProfit)}</span></div>
            <div class="summary-row"><span>营业利润</span><span>${formatMoney(income.operatingProfit)}</span></div>
            <div class="summary-row"><span>净利润</span><span class="${income.netProfit >= 0 ? 'positive' : 'negative'}">${formatMoney(income.netProfit)}</span></div>
          </div>
          <div class="summary-section">
            <div class="summary-title">资产负债表摘要</div>
            <div class="summary-row"><span>总资产</span><span class="gold">${formatMoney(balance.totalAssets)}</span></div>
            <div class="summary-row"><span>流动资产</span><span>${formatMoney(balance.currentAssets)}</span></div>
            <div class="summary-row"><span>总负债</span><span class="negative">${formatMoney(balance.totalLiabilities)}</span></div>
            <div class="summary-row"><span>所有者权益</span><span class="positive">${formatMoney(balance.totalEquity)}</span></div>
          </div>
          <div class="summary-section">
            <div class="summary-title">现金流量表摘要</div>
            <div class="summary-row"><span>经营现金流</span><span class="${cashFlow.operatingCashFlow >= 0 ? 'positive' : 'negative'}">${formatMoney(cashFlow.operatingCashFlow)}</span></div>
            <div class="summary-row"><span>投资现金流</span><span class="${cashFlow.investingCashFlow >= 0 ? 'positive' : 'negative'}">${formatMoney(cashFlow.investingCashFlow)}</span></div>
            <div class="summary-row"><span>筹资现金流</span><span class="${cashFlow.financingCashFlow >= 0 ? 'positive' : 'negative'}">${formatMoney(cashFlow.financingCashFlow)}</span></div>
            <div class="summary-row"><span>现金净变动</span><span class="${cashFlow.netCashChange >= 0 ? 'positive' : 'negative'}">${formatMoney(cashFlow.netCashChange)}</span></div>
          </div>
        </div>

        ${allocation && allocation.suggestions && allocation.suggestions.length > 0 ? `
          <div class="financial-suggestions">
            <div class="suggestions-title">资产配置建议</div>
            ${allocation.suggestions.map(s => `
              <div class="suggestion-item suggestion-${s.type}">
                <span class="suggestion-icon">${s.type === 'danger' ? '⚠️' : s.type === 'warning' ? '⚡' : s.type === 'success' ? '✅' : '💡'}</span>
                <span class="suggestion-text">${s.text}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  /**
   * 显示完整财务三表弹窗
   */
  function showFinancialStatements() {
    const state = SongState.getState();
    const fs = state.company?.financialStatements;
    if (!fs) {
      alert('财务三表数据尚未生成，请推进游戏日期后再试。');
      return;
    }

    const income = fs.incomeStatement;
    const balance = fs.balanceSheet;
    const cashFlow = fs.cashFlowStatement;
    const ratios = fs.ratios;

    const modal = document.createElement('div');
    modal.className = 'financial-modal-overlay';
    modal.innerHTML = `
      <div class="financial-modal">
        <div class="financial-modal-header">
          <h2>松氏集团 · 财务三表</h2>
          <button class="financial-modal-close" onclick="this.closest('.financial-modal-overlay').remove()">×</button>
        </div>
        <div class="financial-modal-tabs">
          <button class="fin-tab active" data-tab="income" onclick="PageCompany.switchFinTab(this, 'income')">利润表</button>
          <button class="fin-tab" data-tab="balance" onclick="PageCompany.switchFinTab(this, 'balance')">资产负债表</button>
          <button class="fin-tab" data-tab="cashflow" onclick="PageCompany.switchFinTab(this, 'cashflow')">现金流量表</button>
          <button class="fin-tab" data-tab="ratios" onclick="PageCompany.switchFinTab(this, 'ratios')">财务比率</button>
        </div>
        <div class="financial-modal-content">
          <div class="fin-panel active" id="fin-panel-income">
            ${renderIncomeStatementTable(income)}
          </div>
          <div class="fin-panel" id="fin-panel-balance">
            ${renderBalanceSheetTable(balance)}
          </div>
          <div class="fin-panel" id="fin-panel-cashflow">
            ${renderCashFlowTable(cashFlow)}
          </div>
          <div class="fin-panel" id="fin-panel-ratios">
            ${renderRatiosTable(ratios)}
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.remove();
    });
  }

  function switchFinTab(btn, tabName) {
    const modal = btn.closest('.financial-modal');
    modal.querySelectorAll('.fin-tab').forEach(t => t.classList.remove('active'));
    modal.querySelectorAll('.fin-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('fin-panel-' + tabName).classList.add('active');
  }

          <div class="ratio-card-item"><span>净资产收益率 ROE</span><span class="gold">${ratios.roe}%</span><span class="ratio-rating">${getRating(ratios.roe, 15, 8)}</span></div>

          <div class="ratio-card-item"><span>毛利率</span><span class="gold">${ratios.grossMargin}%</span><span class="ratio-rating">${getRating(ratios.grossMargin, 40, 20)}</span></div>

  /**
   * 渲染迷你柱状图
   */
  function renderMiniBarChart(values, type) {
    if (!values || values.length === 0) return '';

    const max = Math.max(...values.map(Math.abs), 1);
    const bars = values.map((value, index) => {
      const height = Math.max(5, (Math.abs(value) / max) * 100);
      const isPositive = value >= 0;
      const colorClass = type === 'profit'
        ? (isPositive ? 'bar-positive' : 'bar-negative')
        : 'bar-revenue';
      return `
        <div class="mini-bar-wrapper" title="${formatMoney(value)}">
          <div class="mini-bar ${colorClass}" style="height: ${height}%"></div>
          <div class="mini-bar-label">${index + 1}</div>
        </div>
      `;
    }).join('');

    return `<div class="mini-chart-bars">${bars}</div>`;
  }

  /**
   * 获取风险评估描述
   */
  function getRiskAssessment(subsidiary) {
    const assessments = [];

    if (subsidiary.risk === 'high') {
      assessments.push('该子公司处于高风险状态，建议密切关注经营动态，必要时调整战略或更换管理团队。');
    } else if (subsidiary.risk === 'medium') {
      assessments.push('该子公司风险适中，经营整体稳定，但需关注潜在风险点。');
    } else {
      assessments.push('该子公司风险较低，经营稳健，可作为集团稳定的收入来源。');
    }

    if (subsidiary.potential === 'high') {
      assessments.push('发展潜力较高，建议加大资源投入，把握增长机遇。');
    } else if (subsidiary.potential === 'low') {
      assessments.push('发展潜力有限，建议维持现状或考虑战略转型。');
    }

    if (subsidiary.satisfaction < 60) {
      assessments.push('员工满意度偏低，可能存在管理问题，建议关注团队稳定性。');
    }

    if (subsidiary.reputation < 60) {
      assessments.push('市场声誉有待提升，建议加强品牌建设和公关投入。');
    }

    return assessments.join(' ');
  }

  /**
   * 判断子公司是否处于危机状态
   */
  function isInCrisis(subsidiary) {
    return subsidiary.profit < 0 ||
           subsidiary.satisfaction < 55 ||
           subsidiary.reputation < 55 ||
           subsidiary.risk === 'high';
  }

  /**
   * 获取危机处理选项
   */
  function getCrisisActions(subsidiary) {
    const actions = [];
    const state = SongState.getState();
    const cash = state.company?.cash || 0;

    // 1. 注入紧急资金（亏损或现金流紧张时）
    if (subsidiary.profit < 0) {
      const amount = Math.min(200000000, Math.max(50000000, Math.abs(subsidiary.profit) * 2));
      actions.push({
        id: 'inject_capital',
        name: '注入紧急资金',
        icon: '💰',
        desc: `向${subsidiary.name}注入 ${formatMoney(amount)} 资金，立即改善财务状况`,
        cost: amount,
        costLabel: `消耗现金流 ${formatMoney(amount)}`,
        effect: '利润 +15%，声誉 +5，风险等级降低',
        disabled: cash < amount,
        disabledReason: '现金流不足'
      });
    }

    // 2. 更换管理层（满意度低或风险高时）
    if (subsidiary.satisfaction < 65 || subsidiary.risk === 'high') {
      actions.push({
        id: 'change_management',
        name: '更换管理团队',
        icon: '👔',
        desc: '撤换现任管理层，引入新的经营团队',
        cost: 0,
        costLabel: '家族信任度 -8',
        effect: '3天后：利润 +20%，满意度 +15，风险等级降低',
        delayed: true,
        disabled: false
      });
    }

    // 3. 裁员降本（亏损或满意度高时）
    if (subsidiary.profit < 0 || subsidiary.employees > 500) {
      const layoffCount = Math.round(subsidiary.employees * 0.1);
      actions.push({
        id: 'layoff_cost_cutting',
        name: '裁员降本',
        icon: '📉',
        desc: `裁减 ${layoffCount} 名员工，降低运营成本`,
        cost: 0,
        costLabel: `员工满意度 -15，裁员 ${layoffCount} 人`,
        effect: '立即：利润 +25%，员工数 -10%',
        disabled: false
      });
    }

    // 4. 增加营销投入（声誉低时）
    if (subsidiary.reputation < 65) {
      const amount = Math.min(100000000, Math.max(30000000, subsidiary.revenue * 0.02));
      actions.push({
        id: 'marketing_investment',
        name: '增加营销投入',
        icon: '📢',
        desc: `投入 ${formatMoney(amount)} 用于品牌建设和市场推广`,
        cost: amount,
        costLabel: `消耗现金流 ${formatMoney(amount)}`,
        effect: '声誉 +12，7天后营收 +15%',
        delayed: true,
        disabled: cash < amount,
        disabledReason: '现金流不足'
      });
    }

    // 5. 业务重组（高风险或持续亏损时）
    if (subsidiary.risk === 'high' || (subsidiary.profit < 0 && subsidiary.history && subsidiary.history.length > 5)) {
      const recentLosses = subsidiary.history.slice(0, 5).filter(h => h.profit < 0).length;
      if (recentLosses >= 3 || subsidiary.risk === 'high') {
        actions.push({
          id: 'business_restructuring',
          name: '业务重组',
          icon: '🔄',
          desc: '对业务进行深度重组，高风险高回报',
          cost: 100000000,
          costLabel: '消耗现金流 1.00亿，家族信任度 -5',
          effect: '50%概率：利润 +40%，满意度 +20，风险降低；50%概率：利润 -25%，满意度 -10',
          risky: true,
          disabled: cash < 100000000,
          disabledReason: '现金流不足'
        });
      }
    }

    // 6. 出售剥离（持续亏损时）
    if (subsidiary.profit < 0 && subsidiary.history && subsidiary.history.length > 3) {
      const recentLosses = subsidiary.history.slice(0, 3).filter(h => h.profit < 0).length;
      if (recentLosses >= 2) {
        const salePrice = Math.max(50000000, (subsidiary.revenue || 100000000) * 2);
        actions.push({
          id: 'sell_divest',
          name: '出售剥离',
          icon: '🏷️',
          desc: `将${subsidiary.name}出售，获得 ${formatMoney(salePrice)} 一次性收入`,
          cost: 0,
          costLabel: `获得现金流 ${formatMoney(salePrice)}，失去该子公司`,
          effect: '立即获得资金，但不再拥有该子公司',
          dangerous: true,
          disabled: false
        });
      }
    }

    return actions;
  }

  /**
   * 应用利润变化（正确处理亏损公司：利润提升=亏损减少）
   * @param {number} profit - 当前利润（可为负）
   * @param {number} bonus - 变化比例（0.15 = 15%）
   * @returns {number} 变化后的利润
   */
  function applyProfitBonus(profit, bonus) {
    if (profit >= 0) {
      // 盈利公司：利润增加
      return profit * (1 + bonus);
    } else {
      // 亏损公司：亏损减少（利润向0靠近）
      return profit * (1 - bonus);
    }
  }

  /**
   * 处理危机处理动作
   */
  async function handleCrisisAction(subsidiaryId, actionId) {
    // 冷却检查（防止反复点击）
    if (crisisActionCooldown) {
      console.log('[Crisis] 冷却中，忽略点击');
      return;
    }

    try {
      console.log('[Crisis] 执行危机处理:', subsidiaryId, actionId);

      // 设置3秒冷却
      crisisActionCooldown = true;
      setTimeout(() => {
        crisisActionCooldown = false;
        console.log('[Crisis] 冷却结束');
      }, 3000);

      const state = SongState.getState();
      const subsidiaries = state.subsidiaries || [];
      const subsidiaryIndex = subsidiaries.findIndex(s => s.id === subsidiaryId);
      if (subsidiaryIndex === -1) {
        console.warn('[Crisis] 子公司不存在:', subsidiaryId);
        crisisActionCooldown = false;
        return;
      }

      const subsidiary = subsidiaries[subsidiaryIndex];
      const actions = getCrisisActions(subsidiary);
      const action = actions.find(a => a.id === actionId);
      if (!action) {
        console.warn('[Crisis] 操作不存在:', actionId);
        crisisActionCooldown = false;
        return;
      }
      if (action.disabled) {
        console.warn('[Crisis] 操作已禁用:', actionId, action.disabledReason);
        if (window.showToast) window.showToast(action.disabledReason || '无法执行此操作');
        crisisActionCooldown = false;
        return;
      }

      // 注意：不使用原生 confirm，因为在 webview/iframe 中可能不工作
      // 危险操作（出售剥离）直接执行，靠冷却时间和成功提示防止误操作

      // 确保 company 和 heir 对象存在且结构正确
      const company = state.company ? { ...state.company } : { cash: 0 };
      const heir = state.heir ? { ...state.heir } : {};
      heir.abilities = heir.abilities ? { ...heir.abilities } : {};
      // 确保 familyTrust 存在
      if (typeof heir.abilities.familyTrust !== 'number') {
        heir.abilities.familyTrust = 50;
      }
      // 确保 cash 存在
      if (typeof company.cash !== 'number') {
        company.cash = 0;
      }

      let newSubsidiary = { ...subsidiary };

      switch (actionId) {
        case 'inject_capital':
          company.cash -= action.cost;
          newSubsidiary.profit = Math.round(applyProfitBonus(newSubsidiary.profit, 0.15));
          newSubsidiary.reputation = Math.min(100, newSubsidiary.reputation + 5);
          newSubsidiary.risk = newSubsidiary.risk === 'high' ? 'medium' : newSubsidiary.risk;
          break;

        case 'change_management':
          heir.abilities.familyTrust = Math.max(0, heir.abilities.familyTrust - 8);
          // 延迟效果通过 effects 系统处理
          if (window.SongEffects && window.SongEffects.addEffect) {
            window.SongEffects.addEffect({
              type: 'subsidiary_management_change',
              targetId: subsidiaryId,
              startDay: (state.gameDate?.dayCount || 0) + 3,
              duration: 1,
              data: { profitBonus: 0.20, satisfactionBonus: 15, riskReduce: true }
            });
          } else {
            // 降级：立即生效一半效果
            newSubsidiary.profit = Math.round(applyProfitBonus(newSubsidiary.profit, 0.10));
            newSubsidiary.satisfaction = Math.min(100, newSubsidiary.satisfaction + 8);
          }
          break;

        case 'layoff_cost_cutting':
          const layoffCount = Math.round(newSubsidiary.employees * 0.1);
          newSubsidiary.employees = Math.max(1, newSubsidiary.employees - layoffCount);
          newSubsidiary.satisfaction = Math.max(0, newSubsidiary.satisfaction - 15);
          newSubsidiary.profit = Math.round(applyProfitBonus(newSubsidiary.profit, 0.25));
          break;

        case 'marketing_investment':
          company.cash -= action.cost;
          newSubsidiary.reputation = Math.min(100, newSubsidiary.reputation + 12);
          // 延迟效果
          if (window.SongEffects && window.SongEffects.addEffect) {
            window.SongEffects.addEffect({
              type: 'subsidiary_marketing',
              targetId: subsidiaryId,
              startDay: (state.gameDate?.dayCount || 0) + 7,
              duration: 30,
              data: { revenueBonus: 0.15 }
            });
          }
          break;

        case 'business_restructuring':
          company.cash -= 100000000;
          heir.abilities.familyTrust = Math.max(0, heir.abilities.familyTrust - 5);
          const success = Math.random() > 0.5;
          if (success) {
            newSubsidiary.profit = Math.round(applyProfitBonus(newSubsidiary.profit, 0.40));
            newSubsidiary.satisfaction = Math.min(100, newSubsidiary.satisfaction + 20);
            newSubsidiary.risk = 'low';
            newSubsidiary.reputation = Math.min(100, newSubsidiary.reputation + 10);
            if (window.showToast) window.showToast(`业务重组成功！${subsidiary.name}经营状况大幅改善！`);
          } else {
            newSubsidiary.profit = Math.round(applyProfitBonus(newSubsidiary.profit, -0.25));
            newSubsidiary.satisfaction = Math.max(0, newSubsidiary.satisfaction - 10);
            newSubsidiary.risk = 'high';
            if (window.showToast) window.showToast(`业务重组失败！${subsidiary.name}经营状况进一步恶化...`);
          }
          break;

        case 'sell_divest':
          const salePrice = Math.max(50000000, (subsidiary.revenue || 100000000) * 2);
          company.cash += salePrice;
          // 从子公司列表中移除
          subsidiaries.splice(subsidiaryIndex, 1);
          await SongState.batchUpdate({
            'subsidiaries': subsidiaries,
            'company': company,
            'heir': heir
          });
          // 清除全局状态监听的定时器，避免重复渲染闪烁
          if (window._songRefreshTimer) {
            clearTimeout(window._songRefreshTimer);
            window._songRefreshTimer = null;
          }
          console.log('[Crisis] 出售剥离完成:', subsidiary.name, salePrice);
          showCrisisSuccess(`已成功出售${subsidiary.name}，获得 ${formatMoney(salePrice)}`);
          backToList();
          return;
      }

      // 更新子公司
      subsidiaries[subsidiaryIndex] = newSubsidiary;
      await SongState.batchUpdate({
        'subsidiaries': subsidiaries,
        'company': company,
        'heir': heir
      });

      // 清除全局状态监听的定时器，避免重复渲染闪烁
      if (window._songRefreshTimer) {
        clearTimeout(window._songRefreshTimer);
        window._songRefreshTimer = null;
      }

      // 手动渲染当前页面（确保数据更新后立即刷新）
      const appContent = document.getElementById('app-content');
      if (appContent) {
        render(appContent);
      }

      console.log('[Crisis] 危机处理完成:', actionId);
      showCrisisSuccess(`${action.name}执行成功，数据已更新`);
    } catch (e) {
      console.error('[Crisis] 危机处理失败:', e);
      crisisActionCooldown = false; // 失败时清除冷却
      if (window.showToast) window.showToast('操作失败，请重试');
    }
  }

      <!-- 空白框架：后续填充内容 -->

  /**
   * 格式化金额
   */
  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();

   */
  function showMADetail(targetId) {

          </button>

        </div>
      </div>
    `;
    
    if (container) container.scrollTop = 0;
  }

  /**
   * 执行并购
   */
  function executeMA(targetId) {
    const targets = getMATargets();
    const target = targets.find(t => t.id === targetId);
    if (!target || target.status === 'acquired') return;
    
    const state = SongState.getState();
    const company = state.company || {};
    
    // 检查现金流
    if ((company.cashFlow || 0) < target.valuation) {
      alert('现金流不足，无法完成收购');
      return;
    }
    
    // 扣除现金流
    company.cashFlow = (company.cashFlow || 0) - target.valuation;
    
    // 记录已收购
    const acquiredTargets = state.acquiredTargets || [];
    acquiredTargets.push(targetId);
    
    // 添加为子公司
    const subsidiaries = state.subsidiaries || [];
    const newSubsidiary = {
      id: 'sub_' + Date.now(),
      name: target.name,
      type: target.sector,
      description: target.description,
      revenue: target.valuation * 0.15,
      profit: target.valuation * 0.08,
      employees: Math.round(target.valuation / 500000),
      satisfaction: 75,
      reputation: 70,
      risk: 'medium',
      potential: 'high',
      growthRate: 15,
      marketShare: 5,
      history: []
    };
    subsidiaries.push(newSubsidiary);
    
    SongState.batchUpdate({
      'company': company,
      'acquiredTargets': acquiredTargets,
      'subsidiaries': subsidiaries
    });
    
    alert(`收购成功！${target.name}已成为松氏子公司`);
    backToList();
  }

  // 公开 API
  return {
    render,
    showDetail,
    backToList,
    resetDetail,
    toggleCompanyExpand,
    showMetricDetail,
    backToOverview,
    handleCrisisAction,
    // 并购重组
    showMADetail,
    executeMA,
    // 第四阶段新API
    showFinancialStatements,
    switchFinTab,
    renderFinancialOverview,
    renderSubsidiaryFinancials
  };
})();

if (typeof window !== 'undefined') {
  window.PageCompany = PageCompany;
}

    aiBtn.addEventListener('click', async () => {
      if (!SongAI.isEnabled()) {
        alert('请先在设置中配置 AI API Key');
        return;

      aiBtn.disabled = true;
      aiBtn.textContent = '生成中...';
      aiContent.style.display = 'block';
      aiBody.innerHTML = '<div class="ai-loading">正在生成财经简报，请稍候...</div>';

      try {
        const state = SongState.getState();
        const news = await SongAI.generateFinancialNews(state);
        aiBody.innerHTML = `<div class="ai-generated-text">${news.replace(/\n/g, '<br>')}</div>`;

        aiBody.innerHTML = `<div class="ai-error">❌ 生成失败：${error.message}</div>`;

        aiBtn.disabled = false;

        aiContent.style.display = 'none';

  function renderStockCard(stock) {
    const miniTrend = stock.priceHistory?.slice(-7) || [];

    // 根据市场类型决定涨跌颜色和货币符号
    // A股：红涨绿跌；港股/美股：红跌绿涨（国际惯例）
    const isAStock = stock.market === 'A股';
    const isUp = stock.change >= 0;
    const priceColorClass = isAStock
      ? (isUp ? 'stock-up-cn' : 'stock-down-cn')
      : (isUp ? 'stock-up-global' : 'stock-down-global');
    const sparklineColor = isAStock
      ? (isUp ? '#c75c5c' : '#4a9d7a')
      : (isUp ? '#4a9d7a' : '#c75c5c');
    const sparklineFill = isAStock
      ? (isUp ? 'rgba(199, 92, 92, 0.1)' : 'rgba(74, 157, 122, 0.1)')
      : (isUp ? 'rgba(74, 157, 122, 0.1)' : 'rgba(199, 92, 92, 0.1)');

    // 货币符号
    const currencySymbol = stock.market === 'A股' ? '¥' : stock.market === '港股' ? 'HK$' : '$';

    // 市场标签
    const marketTag = stock.market || '';

              ${stock.risk === 'high' ? '高风险' : stock.risk === 'medium' ? '中风险' : '低风险'}
            </span>
          </div>
        </div>
        <div class="stock-mini-chart">
          ${renderMiniSparkline(miniTrend, sparklineColor, sparklineFill)}
        </div>
        <div class="stock-price">

  /**
   * 渲染迷你走势图（sparkline）
   */
  function renderMiniSparkline(history, color, fillColor) {
    if (!history || history.length < 2) return '<div class="sparkline-placeholder"></div>';

    const closes = history.map(h => h.close);
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;

    const points = closes.map((close, i) => {
      const x = (i / (closes.length - 1)) * 100;
      const y = 100 - ((close - min) / range) * 100;
      return `${x},${y}`;
    }).join(' ');

    return `
      <svg class="sparkline" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon points="0,100 ${points} 100,100" fill="${fillColor}"/>
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    `;
  }
