  /**
   * 渲染价格走势图（SVG）
   */
  function renderPriceChart(history, stock) {
    if (!history || history.length < 2) {
      return '<div class="empty-state-mini"><p>暂无足够数据</p></div>';
    }

    const closes = history.map(h => h.close);
    const volumes = history.map(h => h.volume || 0);
    const min = Math.min(...closes);
    const max = Math.max(...closes);
    const range = max - min || 1;
    const padding = 10;
    const width = 100;
    const priceHeight = 75; // 价格走势占75%高度
    const volumeHeight = 20; // 成交量占20%高度
    const gap = 5;

    // 计算5日均线
    const ma5 = closes.map((_, i) => {
      if (i < 4) return null;
      const sum = closes.slice(i - 4, i + 1).reduce((a, b) => a + b, 0);
      return sum / 5;
    });

    const points = closes.map((close, i) => {
      const x = padding + (i / (closes.length - 1)) * (width - 2 * padding);
      const y = padding + (1 - (close - min) / range) * (priceHeight - 2 * padding);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    // 5日均线点
    const ma5Points = ma5.map((v, i) => {
      if (v === null) return null;
      const x = padding + (i / (closes.length - 1)) * (width - 2 * padding);
      const y = padding + (1 - (v - min) / range) * (priceHeight - 2 * padding);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).filter(p => p !== null).join(' ');

    // 成交量柱状图
    const maxVolume = Math.max(...volumes) || 1;
    const volumeBars = volumes.map((vol, i) => {
      const x = padding + (i / (volumes.length - 1)) * (width - 2 * padding);
      const barHeight = (vol / maxVolume) * volumeHeight;
      const y = priceHeight + gap + (volumeHeight - barHeight);
      const barWidth = Math.max(1, (width - 2 * padding) / volumes.length * 0.6);
      const isUp = i > 0 ? closes[i] >= closes[i - 1] : true;
      const color = isUp ? 'rgba(199, 92, 92, 0.5)' : 'rgba(74, 157, 122, 0.5)';
      return `<rect x="${(x - barWidth / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barHeight.toFixed(1)}" fill="${color}"/>`;
    }).join('');

    const isPositive = stock.change >= 0;
    const isA = SongStockMarket.isAStock(stock.market);
    const color = isA
      ? (isPositive ? '#c75c5c' : '#4a9d7a')
      : (isPositive ? '#4a9d7a' : '#c75c5c');
    const fillColor = isA
      ? (isPositive ? 'rgba(199, 92, 92, 0.15)' : 'rgba(74, 157, 122, 0.15)')
      : (isPositive ? 'rgba(74, 157, 122, 0.15)' : 'rgba(199, 92, 92, 0.15)');

    // 生成网格线
    const gridLines = [0.25, 0.5, 0.75].map(ratio => {
      const y = padding + ratio * (priceHeight - 2 * padding);
      const price = (max - ratio * range).toFixed(2);
      return `
        <line x1="${padding}" y1="${y}" x2="${width - padding}" y2="${y}" stroke="rgba(184,150,90,0.1)" stroke-width="0.5"/>
        <text x="${width - padding + 2}" y="${y + 2}" fill="rgba(107,117,136,0.6)" font-size="3" text-anchor="start">${price}</text>
      `;
    }).join('');

    return `
      <div class="price-chart-wrapper">
        <svg class="price-chart" viewBox="0 0 ${width} ${priceHeight + gap + volumeHeight + 5}" preserveAspectRatio="none">
          ${gridLines}
          <polygon points="${padding},${priceHeight - padding} ${points} ${width - padding},${priceHeight - padding}" fill="${fillColor}"/>
          <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
          ${ma5Points ? `<polyline points="${ma5Points}" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,1" opacity="0.8"/>` : ''}
          <!-- 成交量分隔线 -->
          <line x1="${padding}" y1="${priceHeight + gap / 2}" x2="${width - padding}" y2="${priceHeight + gap / 2}" stroke="rgba(184,150,90,0.2)" stroke-width="0.5"/>
          ${volumeBars}
        </svg>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-line" style="background:${color}"></span>收盘价</span>
          <span class="legend-item"><span class="legend-line" style="background:#d4af37"></span>MA5</span>
          <span class="legend-item"><span class="legend-dot" style="background:rgba(199,92,92,0.5)"></span>放量</span>
        </div>
        <div class="chart-dates">
          ${history.map((h, i) => (i % Math.ceil(history.length / 5) === 0 || i === history.length - 1) ? `<span class="chart-date">${h.date?.slice(5) || ''}</span>` : '').join('')}
        </div>
      </div>
    `;
  }

  /**
   * 渲染交易弹窗
   */
  function renderTradeModal(modal) {
    const state = SongState.getState();
    const stock = state.stockMarket?.stocks?.find(s => s.id === modal.stockId);
    const position = state.portfolio?.find(p => p.stockId === modal.stockId);
    const cashFlow = state.company?.cashFlow || 0;
    const today = state.gameDate?.current || new Date().toISOString().split('T')[0];

    if (!stock) return '';

    const currency = SongStockMarket.getCurrencySymbol(stock.market);
    const shares = modal.shares || 100;

    // 计算滑点和实际成交价
    const slippage = SongStockMarket.calculateSlippage(stock, shares, modal.type);
    const actualPrice = slippage.actualPrice;
    const tradeAmount = actualPrice * shares;

    // 计算费用
    const fees = SongStockMarket.calculateFees(stock, tradeAmount, modal.type);
    const totalAmount = modal.type === 'buy' ? tradeAmount + fees.totalFee : tradeAmount - fees.totalFee;

    // 涨跌停价格
    const limits = SongStockMarket.getLimitPrices(stock);

    // 可卖数量（T+1）
    const sellableShares = position ? SongStockMarket.getSellableShares(position, today) : 0;
    const isT1Restricted = position && sellableShares < position.shares;

    // 涨跌停状态
    const isLimitUp = limits.hasLimit && stock.price >= limits.limitUp;
    const isLimitDown = limits.hasLimit && stock.price <= limits.limitDown;

    return `
      <div class="modal-overlay" onclick="PageMarket.closeTradeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h3 class="modal-title">${modal.type === 'buy' ? '买入' : '卖出'} ${stock.name}</h3>
            <button class="modal-close" onclick="PageMarket.closeTradeModal()">×</button>
          </div>
          <div class="modal-body">
            <div class="trade-info">
              <div class="trade-row">
                <span class="trade-label">当前价格</span>
                <span class="trade-value">${currency} ${stock.price.toFixed(2)}</span>
              </div>
              ${slippage.hasSlippage ? `
                <div class="trade-row">
                  <span class="trade-label">预估成交价</span>
                  <span class="trade-value warning">${currency} ${actualPrice.toFixed(2)} <small>(滑点${slippage.slippageRate}%)</small></span>
                </div>
              ` : ''}
              <div class="trade-row">
                <span class="trade-label">可用资金</span>
                <span class="trade-value">${formatMoney(cashFlow)}</span>
              </div>
              ${position ? `
                <div class="trade-row">
                  <span class="trade-label">当前持仓</span>
                  <span class="trade-value">${position.shares.toLocaleString()} 股</span>
                </div>
                ${modal.type === 'sell' ? `
                  <div class="trade-row">
                    <span class="trade-label">可卖数量</span>
                    <span class="trade-value ${isT1Restricted ? 'warning' : ''}">${sellableShares.toLocaleString()} 股${isT1Restricted ? ' <small>(T+1限制)</small>' : ''}</span>
                  </div>
                ` : ''}
              ` : ''}
              ${limits.hasLimit ? `
                <div class="trade-row">
                  <span class="trade-label">涨跌停</span>
                  <span class="trade-value"><small>${limits.limitPercent}% 涨停 ${currency}${limits.limitUp.toFixed(2)} / 跌停 ${currency}${limits.limitDown.toFixed(2)}</small></span>
                </div>
              ` : ''}
            </div>

            ${isLimitUp && modal.type === 'buy' ? '<div class="trade-warning">股票已涨停，可能无法买入</div>' : ''}
            ${isLimitDown && modal.type === 'sell' ? '<div class="trade-warning">股票已跌停，可能无法卖出</div>' : ''}

            <div class="trade-input-section">
              <label class="trade-input-label">交易数量（股）</label>
              <div class="trade-input-wrapper">
                <button class="trade-quick-btn" onclick="PageMarket.adjustShares(-100)">-100</button>
                <input type="number" class="trade-input" id="trade-shares-input" value="${shares}" min="1" onchange="PageMarket.updateShares(this.value)">
                <button class="trade-quick-btn" onclick="PageMarket.adjustShares(100)">+100</button>
              </div>
              <div class="trade-quick-options">
                <button class="quick-option" onclick="PageMarket.setShares(100)">100</button>
                <button class="quick-option" onclick="PageMarket.setShares(500)">500</button>
                <button class="quick-option" onclick="PageMarket.setShares(1000)">1000</button>
                <button class="quick-option" onclick="PageMarket.setShares(5000)">5000</button>
                ${modal.type === 'sell' && position ? `<button class="quick-option" onclick="PageMarket.setShares(${sellableShares})">全仓</button>` : ''}
              </div>
            </div>

            <div class="trade-summary">
              <div class="trade-row">
                <span class="trade-label">预估金额</span>
                <span class="trade-value">${currency} ${tradeAmount.toFixed(2)}</span>
              </div>
              <div class="trade-row">
                <span class="trade-label">佣金</span>
                <span class="trade-value">${currency} ${fees.commission.toFixed(2)}</span>
              </div>
              ${fees.stampTax > 0 ? `
                <div class="trade-row">
                  <span class="trade-label">印花税</span>
                  <span class="trade-value">${currency} ${fees.stampTax.toFixed(2)}</span>
                </div>
              ` : ''}
              ${fees.transferFee > 0 ? `
                <div class="trade-row">
                  <span class="trade-label">过户费</span>
                  <span class="trade-value">${currency} ${fees.transferFee.toFixed(2)}</span>
                </div>
              ` : ''}
              <div class="trade-row total">
                <span class="trade-label">${modal.type === 'buy' ? '预计支出' : '预计收入'}</span>
                <span class="trade-value ${modal.type === 'buy' ? 'negative' : 'positive'}">${currency} ${totalAmount.toFixed(2)}</span>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="PageMarket.closeTradeModal()">取消</button>
            <button class="btn ${modal.type === 'buy' ? 'btn-primary' : 'btn-danger'}" onclick="PageMarket.confirmTrade()">
              确认${modal.type === 'buy' ? '买入' : '卖出'}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  /**

   */
  function switchChart(period) {
    const state = SongState.getState();
    const stock = state.stockMarket?.stocks?.find(s => s.id === currentStockId);
    if (!stock) return;

    const days = period === '30d' ? 30 : 7;
    const trend = SongStockMarket.getStockTrend(stock, days);
    const container = document.getElementById('chart-container');
    if (container) {
      container.innerHTML = renderPriceChart(trend, stock);
    }

    // 更新 tab 状态
    document.querySelectorAll('.chart-tab').forEach(tab => {
      tab.classList.remove('active');
    });
    event.target.classList.add('active');
  }

  /**
   * 打开交易弹窗
   */
  function openTradeModal(stockId, type) {
    tradeModal = { stockId, type, shares: 100 };
    if (lastContainer) render(lastContainer);
  }

  /**
   * 关闭交易弹窗
   */
  function closeTradeModal() {
    tradeModal = null;
    if (lastContainer) render(lastContainer);
  }

  /**
   * 只更新交易弹窗内的数字显示（不重新渲染整个页面，避免闪屏）
   */
  function updateTradeModalDisplay() {
    if (!tradeModal) return;

    const state = SongState.getState();
    const stock = state.stockMarket?.stocks?.find(s => s.id === tradeModal.stockId);
    if (!stock) return;

    const currency = SongStockMarket.getCurrencySymbol(stock.market);
    const shares = tradeModal.shares || 100;
    const cashFlow = state.company?.cashFlow || 0;

    // 计算滑点和实际成交价
    const slippage = SongStockMarket.calculateSlippage(stock, shares, tradeModal.type);
    const actualPrice = slippage.actualPrice;
    const tradeAmount = actualPrice * shares;

    // 计算费用
    const fees = SongStockMarket.calculateFees(stock, tradeAmount, tradeModal.type);
    const totalAmount = tradeModal.type === 'buy' ? tradeAmount + fees.totalFee : tradeAmount - fees.totalFee;

    // 更新输入框
    const input = document.getElementById('trade-shares-input');
    if (input) input.value = shares;

    // 更新预估金额
    const amountEl = document.querySelector('.trade-summary .trade-row:not(.total) .trade-value');
    if (amountEl) amountEl.textContent = `${currency} ${tradeAmount.toFixed(2)}`;

    // 更新佣金
    const commissionEl = document.querySelectorAll('.trade-summary .trade-row')[1]?.querySelector('.trade-value');
    if (commissionEl) commissionEl.textContent = `${currency} ${fees.commission.toFixed(2)}`;

    // 更新印花税（如果存在）
    const stampTaxRow = Array.from(document.querySelectorAll('.trade-summary .trade-row')).find(r => r.textContent.includes('印花税'));
    if (stampTaxRow && fees.stampTax > 0) {
      stampTaxRow.querySelector('.trade-value').textContent = `${currency} ${fees.stampTax.toFixed(2)}`;
    }

    // 更新过户费（如果存在）
    const transferFeeRow = Array.from(document.querySelectorAll('.trade-summary .trade-row')).find(r => r.textContent.includes('过户费'));
    if (transferFeeRow && fees.transferFee > 0) {
      transferFeeRow.querySelector('.trade-value').textContent = `${currency} ${fees.transferFee.toFixed(2)}`;
    }

    // 更新预计支出/收入
    const totalEl = document.querySelector('.trade-summary .trade-row.total .trade-value');
    if (totalEl) {
      totalEl.textContent = `${currency} ${totalAmount.toFixed(2)}`;
      totalEl.className = `trade-value ${tradeModal.type === 'buy' ? 'negative' : 'positive'}`;
    }

    // 更新滑点显示（如果存在）
    if (slippage.hasSlippage) {
      const slippageEl = Array.from(document.querySelectorAll('.trade-info .trade-row')).find(r => r.textContent.includes('预估成交价'));
      if (slippageEl) {
        slippageEl.querySelector('.trade-value').innerHTML = `${currency} ${actualPrice.toFixed(2)} <small>(滑点${slippage.slippageRate}%)</small>`;
      }
    }
  }

  /**
   * 调整交易数量
   */
  function adjustShares(delta) {
    if (!tradeModal) return;
    tradeModal.shares = Math.max(1, (tradeModal.shares || 100) + delta);
    updateTradeModalDisplay();
  }

  /**
   * 设置交易数量
   */
  function setShares(shares) {
    if (!tradeModal) return;
    tradeModal.shares = shares;
    updateTradeModalDisplay();
  }

  /**
   * 更新交易数量（输入框）
   */
  function updateShares(value) {
    if (!tradeModal) return;
    tradeModal.shares = Math.max(1, parseInt(value) || 1);
    updateTradeModalDisplay();
  }

  /**
   * 确认交易
   */
  async function confirmTrade() {
    if (!tradeModal) return;

    // 禁用按钮，显示处理中，防止重复点击
    const confirmBtn = document.querySelector('.modal-footer .btn-primary, .modal-footer .btn-danger');
    const cancelBtn = document.querySelector('.modal-footer .btn-secondary');
    const originalText = confirmBtn?.textContent;
    if (confirmBtn) {
      confirmBtn.disabled = true;
      confirmBtn.textContent = '处理中...';
      confirmBtn.style.opacity = '0.6';
      confirmBtn.style.cursor = 'not-allowed';
    }
    if (cancelBtn) {
      cancelBtn.disabled = true;
      cancelBtn.style.opacity = '0.6';
    }

    // 显示全局处理中状态
    if (typeof SongUIFeedback !== 'undefined') {
      SongUIFeedback.showLoading('交易处理中...');
    }

    try {
      const state = SongState.getState();
      const stock = state.stockMarket?.stocks?.find(s => s.id === tradeModal.stockId);
      const portfolio = state.portfolio || [];
      const company = state.company || {};
      const today = state.gameDate?.current || new Date().toISOString().split('T')[0];

      if (!stock) {
        if (typeof SongUIFeedback !== 'undefined') SongUIFeedback.toastError('股票信息不存在');
        return;
      }

      let result;
      if (tradeModal.type === 'buy') {
        result = SongStockMarket.buyStock(stock, tradeModal.shares, portfolio, company, today);
      } else {
        result = SongStockMarket.sellStock(stock, tradeModal.shares, portfolio, company, today);
      }

      if (!result.success) {
        if (typeof SongUIFeedback !== 'undefined') SongUIFeedback.toastError(`交易失败：${result.error}`);
        return;
      }

      // 保存交易记录
      const tradeRecords = state.stockMarket?.tradeRecords || [];
      const updatedTradeRecords = result.tradeRecord ? [result.tradeRecord, ...tradeRecords].slice(0, 100) : tradeRecords;

      // 更新状态
      const updates = {
        'portfolio': result.portfolio,
        'company.cashFlow': result.cashFlow,
        'stockMarket.tradeRecords': updatedTradeRecords
      };

      // 卖出时，已实现盈亏计入总资产
      if (tradeModal.type === 'sell' && result.profit !== undefined) {
        const currentTotalAssets = company.totalAssets || 0;
        updates['company.totalAssets'] = currentTotalAssets + result.profit;
      }

      await SongState.batchUpdate(updates);

      const action = tradeModal.type === 'buy' ? '买入' : '卖出';
      const currency = SongStockMarket.getCurrencySymbol(stock.market);
      let toastMsg = `${action}成功！${tradeModal.shares} 股 ${stock.name} @ ${currency}${result.actualPrice.toFixed(2)}`;
      if (tradeModal.type === 'sell' && result.profit !== undefined) {
        const profitText = result.profit >= 0 ? `盈利 ${formatMoney(result.profit)}` : `亏损 ${formatMoney(Math.abs(result.profit))}`;
        toastMsg += `（${profitText}）`;
      }
      if (result.slippage && result.slippage.hasSlippage) {
        toastMsg += ` 滑点${result.slippage.slippageRate}%`;
      }
      if (typeof SongUIFeedback !== 'undefined') {
        SongUIFeedback.toastSuccess(toastMsg);
      } else {
        SongApp.showToast(toastMsg);
      }

      // 关闭弹窗
      tradeModal = null;
      if (lastContainer) render(lastContainer);
    } catch (e) {
      console.error('[Market] 交易异常:', e);
      if (typeof SongUIFeedback !== 'undefined') {
        SongUIFeedback.toastError('交易异常，请重试');
      } else {
        SongApp.showToast('交易异常，请重试');
      }
    } finally {
      // 隐藏 loading 并恢复按钮
      if (typeof SongUIFeedback !== 'undefined') {
        SongUIFeedback.hideLoading();
      }
      if (confirmBtn) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = originalText;
        confirmBtn.style.opacity = '';
        confirmBtn.style.cursor = '';
      }
      if (cancelBtn) {
        cancelBtn.disabled = false;
        cancelBtn.style.opacity = '';
      }
    }
  }

  /**
   * 格式化金额
   */
  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();
  }

  /**
   * 渲染基金市场视图（带返回按钮，按类型分组折叠）
   */
  function renderFundMarketView(container, funds, state) {
    const fundAvgReturn = funds.length > 0
      ? (funds.reduce((sum, f) => sum + (f.return1y || f.annualReturn || 0), 0) / funds.length).toFixed(2)
      : 0;
    const fundUpCount = funds.filter(f => (f.return1d || f.todayChange || 0) >= 0).length;

    // 按类型分组
    const fundTypes = ['股票型', '债券型', '混合型', '货币型', '指数型'];
    const fundsByType = {};
    fundTypes.forEach(type => { fundsByType[type] = []; });
    funds.forEach(fund => {
      const type = fund.type || '混合型';
      if (!fundsByType[type]) fundsByType[type] = [];
      fundsByType[type].push(fund);
    });

    container.innerHTML = `
      <div class="page-header">
        <button class="back-btn-gold-icon" onclick="PageMarket.backFromFundMarket()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <div>
          <h1 class="page-title">基金市场</h1>
          <p class="page-subtitle">${funds.length} 只基金 · 股票型/债券型/混合型/货币型</p>
        </div>
      </div>

      <!-- 基金市场概览 -->
      <div class="card market-index-card">
        <div class="market-index-main">
          <div class="index-value-large ${fundAvgReturn >= 0 ? 'positive' : 'negative'}">${fundAvgReturn >= 0 ? '+' : ''}${fundAvgReturn}%</div>
          <div class="index-label">平均近一年收益</div>
        </div>
        <div class="market-index-stats">
          <div class="index-stat">
            <span class="index-stat-value positive">${fundUpCount}</span>
            <span class="index-stat-label">上涨</span>
          </div>
          <div class="index-stat">
            <span class="index-stat-value negative">${funds.length - fundUpCount}</span>
            <span class="index-stat-label">下跌</span>
          </div>
          <div class="index-stat">
            <span class="index-stat-value">${funds.length}</span>
            <span class="index-stat-label">基金数</span>
          </div>
        </div>
      </div>

      <!-- 基金列表（按类型分组折叠） -->
      ${fundTypes.map(type => {
        const typeFunds = fundsByType[type] || [];
        if (typeFunds.length === 0) return '';
        const isExpanded = getExpandedFundTypes().has(type);
        return `
          <div class="collapsible-section">
            <div class="collapsible-section-header" onclick="PageMarket.toggleFundType('${type}')">
              <div class="collapsible-section-title">
                <span>${type}</span>
                <span class="collapsible-section-count">${typeFunds.length} 只</span>
              </div>
              <span class="expand-arrow ${isExpanded ? 'expanded' : ''}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </div>
            ${isExpanded ? `
            <div class="collapsible-section-content">
              <div class="fund-list">
                ${typeFunds.map(fund => renderFundCardMarket(fund)).join('')}
              </div>
            </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    `;
  }

  /**
   * 渲染基金卡片（市场页面用，复用投资页面的 fund-card 样式）
   */
  function renderFundCardMarket(fund) {
    const return1d = fund.return1d || fund.todayChange || 0;
    const return1m = fund.return1m || 0;
    const return3m = fund.return3m || 0;
    const return1y = fund.return1y || fund.annualReturn || 0;
    const nav = fund.nav || 1;
    const assets = fund.assets || 0;
    const fundManager = fund.fundManager || '未知';
    const risk = fund.risk || 'medium';

    return `
      <div class="fund-card" data-id="${fund.id}" onclick="SongApp.openDetail('investment', '${fund.id}', 'fund')">
        <div class="fund-header">
          <div class="fund-info">
            <h3 class="fund-name">${fund.name}</h3>
            <div class="fund-meta">
              <span class="fund-type tag tag-info">${fund.type || '混合型'}</span>
              <span class="fund-risk tag tag-${risk === 'high' ? 'danger' : risk === 'medium' ? 'warning' : 'success'}">
                ${risk === 'high' ? '高风险' : risk === 'medium' ? '中风险' : '低风险'}
              </span>
            </div>
          </div>
          <div class="fund-return-main">
            <div class="fund-return-value ${return1y >= 0 ? 'positive' : 'negative'}">
              ${return1y >= 0 ? '+' : ''}${return1y.toFixed(2)}%
            </div>
            <div class="fund-return-label">近一年</div>
          </div>
        </div>
        <div class="fund-returns-row">
          <div class="return-item">
            <span class="return-label">日涨跌</span>
            <span class="return-value ${return1d >= 0 ? 'positive' : 'negative'}">${return1d >= 0 ? '+' : ''}${return1d.toFixed(2)}%</span>
          </div>
          <div class="return-item">
            <span class="return-label">近1月</span>
            <span class="return-value ${return1m >= 0 ? 'positive' : 'negative'}">${return1m >= 0 ? '+' : ''}${return1m.toFixed(2)}%</span>
          </div>
          <div class="return-item">
            <span class="return-label">近3月</span>
            <span class="return-value ${return3m >= 0 ? 'positive' : 'negative'}">${return3m >= 0 ? '+' : ''}${return3m.toFixed(2)}%</span>
          </div>
          <div class="return-item">
            <span class="return-label">基金规模</span>
            <span class="return-value">${formatMoney(assets)}</span>
          </div>
        </div>
        <div class="fund-manager-row">
          <span class="manager-label">基金经理</span>
          <span class="manager-name">${fundManager}</span>
          <span class="fund-nav">净值 ${nav.toFixed(4)}</span>
        </div>
      </div>
    `;
  }

  /**
   * 切换基金类型展开/折叠
   */
  function toggleFundType(type) {
    console.log('[Market] toggleFundType 被调用:', type);
    try {
      const expanded = getExpandedFundTypes();
      if (expanded.has(type)) {
        expanded.delete(type);
      } else {
        expanded.add(type);
      }
      saveExpandedFundTypes(expanded);
      
      // 直接修改DOM，不重新渲染整个页面
      const sections = document.querySelectorAll('.collapsible-section');
      for (const section of sections) {
        const header = section.querySelector('.collapsible-section-header');
        if (!header) continue;
        const titleSpan = header.querySelector('.collapsible-section-title span');
        if (!titleSpan || titleSpan.textContent.trim() !== type) continue;
        
        const arrow = header.querySelector('.expand-arrow');
        let content = section.querySelector('.collapsible-section-content');
        
        if (expanded.has(type)) {
          // 展开
          if (arrow) arrow.classList.add('expanded');
          if (!content) {
            // 需要动态生成内容
            const state = SongState.getState();
            const funds = state.funds || [];
            const typeFunds = funds.filter(f => (f.type || '混合型') === type);
            content = document.createElement('div');
            content.className = 'collapsible-section-content';
            content.innerHTML = `<div class="fund-list">${typeFunds.map(fund => renderFundCardMarket(fund)).join('')}</div>`;
            section.appendChild(content);
          } else {
            content.style.display = 'block';
          }
        } else {
          // 折叠
          if (arrow) arrow.classList.remove('expanded');
          if (content) content.style.display = 'none';
        }
        break;
      }
      console.log('[Market] toggleFundType 完成，展开状态:', Array.from(expanded));
    } catch (e) {
      console.error('[Market] toggleFundType 错误:', e);
    }
  }

  /**
   * 切换折叠区域展开/折叠状态
   */
  function toggleSection(sectionId) {
    const expanded = getExpandedSections();
    if (expanded.has(sectionId)) {
      expanded.delete(sectionId);
    } else {
      expanded.add(sectionId);
    }
    saveExpandedSections(expanded);
    // 重新渲染当前页面（使用记录的渲染容器，支持资产页Tab容器）
    if (lastContainer) {
      render(lastContainer);
    }
  }

  /**
   * 从基金市场视图返回
   */
  function backFromFundMarket() {
    showFundMarketView = false;
    const container = document.getElementById('app-content');
    if (container) {
      // 检查当前是否在资产页中
      const currentPage = typeof SongApp !== 'undefined' ? SongApp.getCurrentPage() : '';
      if (currentPage === 'assets' && typeof PageAssets !== 'undefined') {
        // 在资产页中，重新导航到资产页并激活市场行情Tab
        SongApp.navigateTo('assets');
        setTimeout(() => {
          const tabs = document.querySelectorAll('.assets-tab');
          for (let tab of tabs) {
            const label = tab.querySelector('.tab-label')?.textContent;
            if (label === '市场行情') {
              tab.click();
              break;
            }
          }
        }, 100);
      } else {
        // 独立页面，直接渲染市场页面
        render(container);
      }
    }
  }

  /**
   * 跳转到基金市场
   */
  function goToFundMarket() {
    // 在市场页面内部显示基金市场视图，不跳转到投资页面
    showFundMarketView = true;
    if (lastContainer) render(lastContainer);
  }

  // 公开 API
  return {
    render,
    showStockDetail,
    backToList,
    resetDetail,
    switchChart,
    openTradeModal,
    closeTradeModal,
    adjustShares,
    setShares,
    updateShares,
    updateTradeModalDisplay,
    confirmTrade,
    goToFundMarket,
    backFromFundMarket,
    toggleSection,
    toggleFundType
  };
})();

if (typeof window !== 'undefined') {
  window.PageMarket = PageMarket;
}

  /**
   * 绑定 AI 建议按钮
   */
  function bindAIAdviceButton() {
    const aiBtn = document.getElementById('ai-advice-btn');
    const aiContent = document.getElementById('ai-advice-content');

    if (!aiBtn || !aiContent) return;

    aiBtn.addEventListener('click', async () => {
      if (!SongAI.isEnabled()) {
        alert('请先在设置中配置 AI API Key');
        return;
      }

      aiBtn.disabled = true;
      aiBtn.textContent = '生成中...';
      aiContent.innerHTML = '<div class="ai-loading">AI 投资分析师正在分析您的投资组合，请稍候...</div>';

      try {
        const state = SongState.getState();
        const advice = await SongAI.generateInvestmentAdvice(state);
        aiContent.innerHTML = `<div class="ai-generated-text">${advice.replace(/\n/g, '<br>')}</div>`;
      } catch (error) {
        aiContent.innerHTML = `<div class="ai-error">❌ 生成失败：${error.message}</div>`;
      } finally {
        aiBtn.disabled = false;
        aiBtn.textContent = '✨ 重新生成';
      }
    });
  }

  /**
   * 渲染基金净值走势图
   */
  function renderFundNavChart(history, fund) {
    if (!history || history.length < 2) {
      return '<div class="empty-state-mini"><p>暂无足够数据</p></div>';
    }

    const navs = history.map(h => h.nav);
    const min = Math.min(...navs);
    const max = Math.max(...navs);
    const range = max - min || 1;
    const padding = 10;
    const width = 100;
    const height = 100;

    const points = navs.map((nav, i) => {
      const x = padding + (i / (navs.length - 1)) * (width - 2 * padding);
      const y = padding + (1 - (nav - min) / range) * (height - 2 * padding);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    // 模拟同类平均净值（在基金净值基础上小幅波动）
    const peerAvgPoints = navs.map((nav, i) => {
      const x = padding + (i / (navs.length - 1)) * (width - 2 * padding);
      // 同类平均比基金略低或略高，根据基金表现
      const peerOffset = fund.return1y >= 0 ? 0.98 : 1.02;
      const peerNav = nav * peerOffset + (Math.sin(i * 0.5) * range * 0.02);
      const y = padding + (1 - (peerNav - min) / range) * (height - 2 * padding);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    // 模拟沪深300指数走势（更大波动）
    const hs300Points = navs.map((nav, i) => {
      const x = padding + (i / (navs.length - 1)) * (width - 2 * padding);
      const hsOffset = 1 + Math.sin(i * 0.3) * 0.05 + (i / navs.length) * 0.03;
      const hsNav = (min + range * 0.5) * hsOffset;
      const y = padding + (1 - (hsNav - min) / range) * (height - 2 * padding);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const isPositive = fund.return1d >= 0;
    const color = isPositive ? '#4a9d7a' : '#c75c5c';
    const fillColor = isPositive ? 'rgba(74, 157, 122, 0.15)' : 'rgba(199, 92, 92, 0.15)';

    return `
      <div class="price-chart-wrapper">
        <svg class="price-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <polygon points="${padding},${height - padding} ${points} ${width - padding},${height - padding}" fill="${fillColor}"/>
          <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
          <polyline points="${peerAvgPoints}" fill="none" stroke="#8b8b8b" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
          <polyline points="${hs300Points}" fill="none" stroke="#5b8def" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
        </svg>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-line" style="background:${color}"></span>本基金</span>
          <span class="legend-item"><span class="legend-line" style="background:#8b8b8b"></span>同类平均</span>
          <span class="legend-item"><span class="legend-line" style="background:#5b8def"></span>沪深300</span>
        </div>
        <div class="chart-dates">
          ${history.map((h, i) => (i % Math.ceil(history.length / 5) === 0 || i === history.length - 1) ? `<span class="chart-date">${h.date?.slice(5) || ''}</span>` : '').join('')}
        </div>
      </div>
    `;
  }

  /**
   * 渲染基金交易弹窗
   */
  function renderFundTradeModal(modal, state) {
    const fund = state.funds?.find(f => f.id === modal.fundId);
    const position = state.fundPortfolio?.find(p => p.fundId === modal.fundId);
    const cashFlow = state.company?.cashFlow || 0;

    if (!fund) return '';

    const amount = modal.amount || 10000;
    const purchaseFee = fund.type === '货币型' ? 0 : Math.max(amount * 0.0015, 10);
    const shares = fund.type === '货币型' ? amount - purchaseFee : (amount - purchaseFee) / fund.nav;
    const sellShares = modal.shares || (position ? position.shares : 1000);
    const sellAmount = fund.type === '货币型' ? sellShares : sellShares * fund.nav;
    const redemptionFee = fund.type === '货币型' ? 0 : Math.max(sellAmount * 0.005, 10);
    const netSellAmount = sellAmount - redemptionFee;

    return `
      <div class="modal-overlay" onclick="PageInvestment.closeFundTradeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
          <div class="modal-header">
            <h3 class="modal-title">${modal.type === 'buy' ? '买入' : '卖出'} ${fund.name}</h3>
            <button class="modal-close" onclick="PageInvestment.closeFundTradeModal()">×</button>
          </div>
          <div class="modal-body">
            <div class="trade-info">
              <div class="trade-row">
                <span class="trade-label">当前净值</span>
                <span class="trade-value">${fund.nav.toFixed(4)}</span>
              </div>
              <div class="trade-row">
                <span class="trade-label">可用资金</span>
                <span class="trade-value">${formatMoney(cashFlow)}</span>
              </div>
              ${position ? `
                <div class="trade-row">
                  <span class="trade-label">当前持仓</span>
                  <span class="trade-value">${position.shares.toFixed(2)} 份</span>
                </div>
              ` : ''}
            </div>

            ${modal.type === 'buy' ? `
              <div class="trade-input-section">
                <label class="trade-input-label">买入金额（元）</label>
                <div class="trade-input-wrapper">
                  <button class="trade-quick-btn" onclick="PageInvestment.adjustFundAmount(-1000)">-1000</button>
                  <input type="number" class="trade-input" id="fund-amount-input" value="${amount}" min="100" onchange="PageInvestment.updateFundAmount(this.value)">
                  <button class="trade-quick-btn" onclick="PageInvestment.adjustFundAmount(1000)">+1000</button>
                </div>
                <div class="trade-quick-options">
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(1000)">1千</button>
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(10000)">1万</button>
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(50000)">5万</button>
                  <button class="quick-option" onclick="PageInvestment.setFundAmount(100000)">10万</button>
                </div>
              </div>
              <div class="trade-summary">
                <div class="trade-row">
                  <span class="trade-label">申购费</span>
                  <span class="trade-value">${formatMoney(purchaseFee)}</span>
                </div>
                <div class="trade-row">
                  <span class="trade-label">预计份额</span>
                  <span class="trade-value">${shares.toFixed(2)} 份</span>
                </div>
                <div class="trade-row total">
                  <span class="trade-label">预计支出</span>
                  <span class="trade-value negative">${formatMoney(amount)}</span>
                </div>
              </div>
            ` : `
              <div class="trade-input-section">
                <label class="trade-input-label">卖出份额（份）</label>
                <div class="trade-input-wrapper">
                  <button class="trade-quick-btn" onclick="PageInvestment.adjustFundShares(-100)">-100</button>
                  <input type="number" class="trade-input" id="fund-shares-input" value="${sellShares}" min="1" max="${position?.shares || 0}" onchange="PageInvestment.updateFundShares(this.value)">
                  <button class="trade-quick-btn" onclick="PageInvestment.adjustFundShares(100)">+100</button>
                </div>
                <div class="trade-quick-options">
                  <button class="quick-option" onclick="PageInvestment.setFundShares(${position ? position.shares * 0.25 : 0})">25%</button>
                  <button class="quick-option" onclick="PageInvestment.setFundShares(${position ? position.shares * 0.5 : 0})">50%</button>
                  <button class="quick-option" onclick="PageInvestment.setFundShares(${position ? position.shares * 0.75 : 0})">75%</button>
                  <button class="quick-option" onclick="PageInvestment.setFundShares(${position ? position.shares : 0})">全部</button>
                </div>
              </div>
              <div class="trade-summary">
                <div class="trade-row">
                  <span class="trade-label">卖出金额</span>
                  <span class="trade-value">${formatMoney(sellAmount)}</span>
                </div>
                <div class="trade-row">
                  <span class="trade-label">赎回费</span>
                  <span class="trade-value">${formatMoney(redemptionFee)}</span>
                </div>
                <div class="trade-row total">
                  <span class="trade-label">预计到账</span>
                  <span class="trade-value positive">${formatMoney(netSellAmount)}</span>
                </div>
              </div>
            `}
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="PageInvestment.closeFundTradeModal()">取消</button>
            <button class="btn ${modal.type === 'buy' ? 'btn-primary' : 'btn-danger'}" onclick="PageInvestment.confirmFundTrade()">
              确认${modal.type === 'buy' ? '买入' : '卖出'}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  // ═══════════════════════════════════════════════
  // 交互方法
  // ═══════════════════════════════════════════════

  function switchTab(tab) {
    currentTab = tab;
    // 使用记录的渲染容器（支持资产页Tab容器和独立页面）
    if (lastContainer) {
      render(lastContainer);
    }
  }

  function showFundDetail(id) {
    currentFundId = id;
    // 使用记录的渲染容器（支持资产页Tab容器和独立页面）
    if (lastContainer) {
      render(lastContainer);
      lastContainer.scrollTop = 0;
    }
  }

  /**
   * 重置详情状态（不重新渲染，用于外部容器切换Tab时调用）
   */
  function resetDetail() {
    currentFundId = null;
  }

  function backToList() {
    // 优先使用全局导航历史栈返回（从哪来回哪去）
    if (typeof SongApp !== 'undefined' && typeof SongApp.goBack === 'function') {
      if (SongApp.goBack()) {
        return;
      }
    }
    // 回退：历史栈为空时，重置详情并重新渲染
    currentFundId = null;
    render(document.getElementById('app-content'));
  }

  function goToStock(stockId) {
    // 跳转到市场页面的股票详情
    currentFundId = null;
    SongApp.navigateTo('market');
    setTimeout(() => {
      if (window.PageMarket) {
        PageMarket.showStockDetail(stockId);
      }
    }, 100);
  }

  function switchFundChart(period) {
    const state = SongState.getState();
    const fund = state.funds?.find(f => f.id === currentFundId);
    if (!fund) return;

    const days = period === '90d' ? 90 : 30;
    const trend = SongFund.getFundTrend(fund, days);
    const container = document.getElementById('fund-chart-container');
    if (container) {
      container.innerHTML = renderFundNavChart(trend, fund);
    }

    document.querySelectorAll('.chart-tab').forEach(tab => {
      tab.classList.remove('active');
    });
    event.target.classList.add('active');
  }

  function openFundTradeModal(fundId, type) {
    fundTradeModal = { fundId, type, amount: 10000, shares: 1000 };
    render(document.getElementById('app-content'));
  }

  function closeFundTradeModal() {
    fundTradeModal = null;
    render(document.getElementById('app-content'));
  }

  function adjustFundAmount(delta) {
    if (!fundTradeModal) return;
    fundTradeModal.amount = Math.max(100, (fundTradeModal.amount || 10000) + delta);
    const input = document.getElementById('fund-amount-input');
    if (input) input.value = fundTradeModal.amount;
    render(document.getElementById('app-content'));
  }

  function setFundAmount(amount) {
    if (!fundTradeModal) return;
    fundTradeModal.amount = amount;
    render(document.getElementById('app-content'));
  }

  function updateFundAmount(value) {
    if (!fundTradeModal) return;
    fundTradeModal.amount = Math.max(100, parseInt(value) || 100);
    render(document.getElementById('app-content'));
  }

  function adjustFundShares(delta) {
    if (!fundTradeModal) return;
    fundTradeModal.shares = Math.max(1, (fundTradeModal.shares || 1000) + delta);
    const input = document.getElementById('fund-shares-input');
    if (input) input.value = fundTradeModal.shares;
    render(document.getElementById('app-content'));
  }

  function setFundShares(shares) {
    if (!fundTradeModal) return;
    fundTradeModal.shares = Math.max(1, Math.round(shares));
    render(document.getElementById('app-content'));
  }

  function updateFundShares(value) {
    if (!fundTradeModal) return;
    fundTradeModal.shares = Math.max(1, parseInt(value) || 1);
    render(document.getElementById('app-content'));
  }

  async function confirmFundTrade() {
    if (!fundTradeModal) return;

    const state = SongState.getState();
    const fund = state.funds?.find(f => f.id === fundTradeModal.fundId);
    const fundPortfolio = state.fundPortfolio || [];
    const company = state.company || {};

    if (!fund) {
      SongApp.showToast('基金信息不存在');
      return;
    }

    let result;
    if (fundTradeModal.type === 'buy') {
      result = SongFund.buyFund(fund, fundTradeModal.amount, fundPortfolio, company);
    } else {
      result = SongFund.sellFund(fund, fundTradeModal.shares, fundPortfolio, company);
    }

    if (!result.success) {
      SongApp.showToast(`交易失败：${result.error}`);
      return;
    }

    // 更新状态（投资收益计入总资产）
    const updates = {
      'fundPortfolio': result.portfolio,
      'company.cashFlow': result.cashFlow
    };

    // 卖出时，已实现盈亏计入总资产
    if (fundTradeModal.type === 'sell' && result.profit !== undefined) {
      const currentTotalAssets = company.totalAssets || 0;
      updates['company.totalAssets'] = currentTotalAssets + result.profit;
    }

    await SongState.batchUpdate(updates);

    const action = fundTradeModal.type === 'buy' ? '买入' : '卖出';
    let toastMsg = `${action}成功！${fund.name}`;
    if (fundTradeModal.type === 'sell' && result.profit !== undefined) {
      const profitText = result.profit >= 0 ? `盈利 ${formatMoney(result.profit)}` : `亏损 ${formatMoney(Math.abs(result.profit))}`;
      toastMsg += `（${profitText}）`;
    }
    SongApp.showToast(toastMsg);

    fundTradeModal = null;
    render(document.getElementById('app-content'));
  }

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  return {
    render,
    switchTab,
    showFundDetail,
    backToList,
    resetDetail,
    goToStock,
    switchFundChart,
    openFundTradeModal,
    closeFundTradeModal,
    adjustFundAmount,
    setFundAmount,
    updateFundAmount,
    adjustFundShares,
    setFundShares,
    updateFundShares,
    confirmFundTrade
  };
})();

if (typeof window !== 'undefined') {
  window.PageInvestment = PageInvestment;
}

/**
 * 松氏家族办公室 - 资产页面
 * 统一入口：公司经营 / 投资组合 / 市场行情
 * 作为二级导航容器，内部调用现有 PageCompany / PageInvestment / PageMarket
 */

const PageAssets = (function () {
  'use strict';

  // 当前选中的二级Tab
  let currentTab = 'company'; // company / investment / market

  // 子容器引用
  let subContainer = null;

  /**
   * 渲染资产页面
   */
  function render(container) {
    container.innerHTML = `
      <div class="assets-page">
        <!-- 页面标题 -->
        <div class="page-header">
          <h1 class="page-title">资产</h1>
          <p class="page-subtitle">松氏集团商业资产统一管理</p>
        </div>

        <!-- 二级Tab导航 -->
        <div class="assets-tabs">
          <button class="assets-tab ${currentTab === 'company' ? 'active' : ''}" data-tab="company">
            <span class="tab-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18"/>
                <path d="M5 21V7l8-4v18"/>
                <path d="M19 21V11l-6-4"/>
              </svg>
            </span>
            <span class="tab-label">公司经营</span>
          </button>
          <button class="assets-tab ${currentTab === 'investment' ? 'active' : ''}" data-tab="investment">
            <span class="tab-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
                <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
              </svg>
            </span>
            <span class="tab-label">投资组合</span>
          </button>
          <button class="assets-tab ${currentTab === 'market' ? 'active' : ''}" data-tab="market">
            <span class="tab-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
                <polyline points="16 7 22 7 22 13"/>
              </svg>
            </span>
            <span class="tab-label">市场行情</span>
          </button>
        </div>

        <!-- 子页面内容容器 -->
        <div class="assets-sub-content" id="assets-sub-content"></div>
      </div>
    `;

    // 绑定Tab点击事件
    const tabs = container.querySelectorAll('.assets-tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const tabName = tab.dataset.tab;
        switchTab(tabName);
      });
    });

    // 获取子容器并渲染当前Tab
    subContainer = document.getElementById('assets-sub-content');
    renderCurrentTab();
  }

  /**
   * 切换Tab
   */
  function switchTab(tabName) {
    if (currentTab === tabName) return;

    currentTab = tabName;

    // 更新Tab高亮状态
    const tabs = document.querySelectorAll('.assets-tab');
    tabs.forEach(tab => {
      if (tab.dataset.tab === tabName) {
        tab.classList.add('active');
      } else {
        tab.classList.remove('active');
      }
    });

    // 渲染新Tab内容
    renderCurrentTab();
  }

  /**
   * 渲染当前Tab对应的子页面
   */
  function renderCurrentTab() {
    if (!subContainer) return;

    // 清空子容器
    subContainer.innerHTML = '';

    // 根据当前Tab调用对应页面的render函数
    switch (currentTab) {
      case 'company':
        if (typeof PageCompany !== 'undefined' && PageCompany.render) {
          // 重置公司页面的详情状态，确保从列表开始
          if (PageCompany.resetDetail) {
            PageCompany.resetDetail();
          }
          PageCompany.render(subContainer);
        }
        break;
      case 'investment':
        if (typeof PageInvestment !== 'undefined' && PageInvestment.render) {
          // 重置投资页面的详情状态
          if (PageInvestment.resetDetail) {
            PageInvestment.resetDetail();
          }
          PageInvestment.render(subContainer);
        }
        break;
      case 'market':
        if (typeof PageMarket !== 'undefined' && PageMarket.render) {
          // 重置市场页面的详情状态
          if (PageMarket.resetDetail) {
            PageMarket.resetDetail();
          }
          PageMarket.render(subContainer);
        }
        break;
    }
  }

  /**
   * 获取当前Tab名称
   */
  function getCurrentTab() {
    return currentTab;
  }

  /**
   * 设置当前Tab（用于外部调用，比如从首页跳转后直接打开某个Tab）
   */
  function setCurrentTab(tabName) {
    if (['company', 'investment', 'market'].includes(tabName)) {
      currentTab = tabName;
    }
  }

  return {
    render,
    switchTab,
    getCurrentTab,
    setCurrentTab
  };
})();

/**
 * 松氏家族办公室 - 继承人档案页面
 * 展示松庭的能力数值、商业声誉、影响力、里程碑、结局预测、历史决策
 */

const PageHeir = (function () {
  'use strict';

  // 私人管家状态
  let showButler = false;

        if (!file) return;

        // 验证文件类型
        if (!file.type.startsWith('image/')) {
          if (window.showToast) window.showToast('❌ 请选择图片文件');
          return;
        }

        // 验证文件大小（最大2MB）
        if (file.size > 2 * 1024 * 1024) {
          if (window.showToast) window.showToast('❌ 图片大小不能超过2MB');
          return;
        }

        // 显示加载提示
        if (window.showToast) window.showToast('📷 正在上传头像...');

        try {
          // 读取图片为 base64
          const reader = new FileReader();
          reader.onload = async (event) => {
            const base64 = event.target.result;

            // 压缩图片（使用 canvas）
            const img = new Image();
            img.onload = async () => {
              const canvas = document.createElement('canvas');
              const maxSize = 256; // 最大尺寸256x256
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > maxSize) {
                  height = height * (maxSize / width);
                  width = maxSize;
                }
              } else {
                if (height > maxSize) {
                  width = width * (maxSize / height);
                  height = maxSize;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              // 转换为 JPEG base64（质量0.8）
              const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);

              // 保存到 state
              await SongState.update('heir.avatar', compressedBase64);

              if (window.showToast) window.showToast('✅ 头像更新成功');

              // 重新渲染页面
              SongApp.renderCurrentPage();
            };
            img.onerror = () => {
              if (window.showToast) window.showToast('❌ 图片处理失败，请重试');
            };
            img.src = base64;
          };
          reader.onerror = () => {
            if (window.showToast) window.showToast('❌ 图片读取失败');
          };
          reader.readAsDataURL(file);
        } catch (error) {
          console.error('[Heir] 头像上传失败:', error);
          if (window.showToast) window.showToast('❌ 头像上传失败，请重试');
        }

        // 清空 input，允许重复选择同一文件
        avatarInput.value = '';
      });

        }
      });
    }

  function renderAbility(name, value, description) {
    const level = value >= 80 ? 'excellent' : value >= 60 ? 'good' : value >= 40 ? 'average' : 'needs-improvement';
    const levelLabel = value >= 80 ? '卓越' : value >= 70 ? '优秀' : value >= 60 ? '良好' : value >= 50 ? '合格' : '待提升';
    return `
      <div class="ability-item">
        <div class="ability-header">
          <span class="ability-name">${name}</span>
          <div class="ability-value-wrapper">
            <span class="ability-value ${level}">${value}</span>
            <span class="ability-level">${levelLabel}</span>
          </div>
        </div>
        <div class="ability-bar-large">
          <div class="ability-fill-large ${level}" style="width: ${value}%"></div>
        </div>
        <div class="ability-desc">${description}</div>
      </div>
    `;
  }

  function getOverallScore(abilities) {
    const avg = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;
    return avg.toFixed(1);
  }

  function getOverallLevel(abilities) {
    const avg = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;
    if (avg >= 80) return '卓越 (S)';
    if (avg >= 70) return '优秀 (A)';
    if (avg >= 60) return '良好 (B)';
    if (avg >= 50) return '合格 (C)';
    return '待提升 (D)';
  }

  function getStrengths(abilities) {
    const sorted = Object.entries(abilities).sort((a, b) => b[1] - a[1]);
    return sorted.slice(0, 2).map(([k]) => getAbilityName(k)).join('、');
  }

  function getWeaknesses(abilities) {
    const sorted = Object.entries(abilities).sort((a, b) => a[1] - b[1]);
    return sorted.slice(0, 2).map(([k]) => getAbilityName(k)).join('、');
  }

  function getAbilityName(key) {
    const map = {
      business: '商业能力',
      decision: '决策能力',
      influence: '资本影响力',
      reputation: '市场声誉',
      familyTrust: '家族信任',
      employeeTrust: '员工信任',
      riskJudgment: '风险判断'
    };
    return map[key] || key;
  }

              <button class="btn btn-primary" onclick="PageHeir.saveJournalEntry()">
                💾 保存手记
              </button>
              <button class="btn btn-ai" id="ai-organize-btn" ${SongAI.isEnabled() ? '' : 'disabled title="请先在设置中配置 AI"'} onclick="PageHeir.aiOrganizeJournal()">

              </button>

                    <button class="journal-item-delete" onclick="PageHeir.deleteJournalEntry(${index})" title="删除">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>

      ` : ''}
    `;
  }

  /**
   * 保存手记条目
   */
  async function saveJournalEntry() {
    const input = document.getElementById('journal-input');
    if (!input || !input.value.trim()) {
      SongApp.showToast('请输入手记内容');
      return;
    }

    const state = SongState.getState();
    const butlerData = state.butler || {};
    const journal = butlerData.journal || [];

    const newEntry = {
      date: new Date().toLocaleDateString('zh-CN'),
      time: new Date().toLocaleTimeString('zh-CN'),
      content: input.value.trim()
    };

    const updatedJournal = [newEntry, ...journal];
    await SongState.update('butler', { ...butlerData, journal: updatedJournal });

    input.value = '';
    SongApp.showToast('手记保存成功');
    SongApp.renderCurrentPage();
  }

  /**
   * 删除手记条目
   */
  async function deleteJournalEntry(index) {
    const state = SongState.getState();
    const butlerData = state.butler || {};
    const journal = butlerData.journal || [];

    const updatedJournal = journal.filter((_, i) => i !== index);
    await SongState.update('butler', { ...butlerData, journal: updatedJournal });

    SongApp.showToast('手记已删除');
    SongApp.renderCurrentPage();
  }

  /**
   * AI 智能整理手记
   */
  async function aiOrganizeJournal() {
    if (!SongAI.isEnabled()) {
      SongApp.showToast('请先在设置中配置 AI API Key');
      return;
    }

    const input = document.getElementById('journal-input');
    const content = input ? input.value.trim() : '';

    if (!content) {
      SongApp.showToast('请先输入需要整理的手记内容');
      return;
    }

    const btn = document.getElementById('ai-organize-btn');
    const resultDiv = document.getElementById('ai-organize-result');

    btn.disabled = true;
    btn.textContent = '整理中...';
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<div class="ai-loading">AI 正在智能整理，请稍候...</div>';

    try {
      const systemPrompt = '你是一位专业的家族办公室管家，擅长整理和总结经营记录。';
      const userPrompt = `请将以下继承人经营手记整理成结构化的要点总结，分为：1.今日决策 2.市场观察 3.心得体会 4.后续计划。保持原文的核心信息，语言简洁专业。\n\n原文：\n${content}`;

      const organized = await SongAI.callAI(systemPrompt, userPrompt);

      resultDiv.innerHTML = `
        <div class="ai-organized-content">
          <div class="ai-organized-header">
            <span class="ai-organized-label">✨ AI 智能整理结果</span>
            <button class="ai-organized-copy" onclick="PageHeir.copyOrganizedResult()">复制</button>
          </div>
          <div class="ai-organized-text">${organized.replace(/\n/g, '<br>')}</div>
        </div>
      `;

      // 保存整理结果到临时变量，供复制使用
      window._lastOrganizedResult = organized;

    } catch (e) {
      resultDiv.innerHTML = `<div class="ai-error">整理失败：${e.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ AI 智能整理';
    }
  }

  /**
   * 复制整理结果
   */
  function copyOrganizedResult() {
    if (window._lastOrganizedResult) {
      navigator.clipboard.writeText(window._lastOrganizedResult).then(() => {
        SongApp.showToast('已复制到剪贴板');
      }).catch(() => {
        SongApp.showToast('复制失败，请手动复制');
      });
    }
  }

  // ═══════════════════════════════════════════════
  // 第五阶段：技能解锁
  // ═══════════════════════════════════════════════

  async function unlockSkill(skillId) {
    const state = SongState.getState();
    const heir = state.heir || {};
    const skillPoints = heir.skillPoints || 0;
    const unlockedSkills = heir.unlockedSkills || [];

    const skill = SongGrowth.SKILLS.find(s => s.id === skillId);
    if (!skill) return;

    if (skillPoints < skill.cost) {
      SongApp.showToast('技能点不足');
      return;
    }

    if (unlockedSkills.includes(skillId)) {
      SongApp.showToast('该技能已解锁');
      return;
    }

    const newUnlocked = [...unlockedSkills, skillId];
    const newSkillPoints = skillPoints - skill.cost;

    await SongState.update('heir', {
      ...heir,
      unlockedSkills: newUnlocked,
      skillPoints: newSkillPoints
    });

    SongApp.showToast(`🎉 技能「${skill.name}」解锁成功！`);
    SongApp.renderCurrentPage();
  }

  function formatGoalNumber(value) {
    if (typeof value !== 'number') return value;
    if (Math.abs(value) >= 100000000) return (value / 100000000).toFixed(1) + '亿';
    if (Math.abs(value) >= 10000) return (value / 10000).toFixed(1) + '万';
    return Math.round(value).toString();
  }

  return {
    render,
    openButler,
    closeButler,
    switchButlerTab,
    saveJournalEntry,
    deleteJournalEntry,
    aiOrganizeJournal,
    copyOrganizedResult,
    // 第五阶段新API
    unlockSkill
  };
})();

if (typeof window !== 'undefined') {
  window.PageHeir = PageHeir;
}

          // 显示成功提示
          overlay.innerHTML = `
            <div style="
              background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
              border: 1px solid rgba(212, 175, 55, 0.5);
              border-radius: 16px; padding: 32px 48px; text-align: center;
              box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            ">
              <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
              <div style="font-size: 16px; color: #d4af37; font-weight: 500; margin-bottom: 8px; font-family: 'Noto Serif SC', serif;">游戏已重置</div>
              <div style="font-size: 12px; color: #888; font-family: 'Noto Serif SC', serif;">页面即将刷新...</div>
            </div>
          `;

          // 1秒后刷新页面
          setTimeout(() => location.reload(), 1000);
        } catch (e) {
          console.error('[Settings] 重置失败:', e);
          overlay.remove();
          if (window.showToast) window.showToast('❌ 重置失败，请重试');
          // 恢复按钮状态
          resetBtn.dataset.confirming = 'false';
          resetBtn.textContent = '重置游戏';
          resetBtn.classList.remove('btn-danger');
        }
        return;
      }

      // 第一次点击：进入确认状态
      resetBtn.dataset.confirming = 'true';
      resetBtn.textContent = '⚠️ 再次点击确认重置（不可撤销）';
      resetBtn.classList.add('btn-danger');

      // 3秒后自动恢复
      resetConfirmTimer = setTimeout(() => {
        resetBtn.dataset.confirming = 'false';
        resetBtn.textContent = '重置游戏';
        resetBtn.classList.remove('btn-danger');
        resetConfirmTimer = null;
      }, 3000);
    });

    // 启用开关联动
    document.getElementById('ai-enabled')?.addEventListener('change', (e) => {
      const label = e.target.parentElement.querySelector('.toggle-label');
      label.textContent = e.target.checked ? '开启' : '关闭';
    });

    // 待办生成设置：滑块联动显示
    const eventsPerHourSlider = document.getElementById('events-per-hour');
    const eventsPerHourValue = document.getElementById('events-per-hour-value');
    eventsPerHourSlider?.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      eventsPerHourValue.textContent = val + ' 项/小时';
    });

    // 待办生成设置：开关联动
    document.getElementById('realtime-gen-enabled')?.addEventListener('change', (e) => {
      const label = e.target.parentElement.querySelector('.toggle-label');
      label.textContent = e.target.checked ? '开启' : '关闭';
    });

    // 保存待办生成设置
    document.getElementById('save-event-settings')?.addEventListener('click', async () => {
      const resultEl = document.getElementById('event-settings-result');
      const enabled = document.getElementById('realtime-gen-enabled').checked;
      const eventsPerHour = parseFloat(document.getElementById('events-per-hour').value);
      const quietStart = parseInt(document.getElementById('quiet-start').value);
      const quietEnd = parseInt(document.getElementById('quiet-end').value);

      // 验证输入
      if (isNaN(quietStart) || quietStart < 0 || quietStart > 23) {
        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = '❌ 静默开始时间必须是 0-23 的整数';
        return;
      }
      if (isNaN(quietEnd) || quietEnd < 0 || quietEnd > 23) {
        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = '❌ 静默结束时间必须是 0-23 的整数';
        return;
      }

      try {
        await SongState.batchUpdate({
          'settings.realtimeEventGeneration': enabled,
          'settings.eventsPerHour': eventsPerHour,
          'settings.quietHoursStart': quietStart,
          'settings.quietHoursEnd': quietEnd,
          'settings.lastEventGenerationAt': new Date().toISOString() // 重置时间戳，避免设置变更后一次性生成太多
        });

        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-success';
        resultEl.textContent = `✅ 设置已保存！每小时生成 ${eventsPerHour} 项，静默时段 ${quietStart}:00-${quietEnd}:00`;
        showToast('✅ 待办生成设置已保存');
      } catch (error) {
        resultEl.style.display = 'block';
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = `❌ 保存失败：${error.message}`;
      }
    });

    // 立即生成测试
    document.getElementById('trigger-gen-now')?.addEventListener('click', async () => {
      const resultEl = document.getElementById('event-settings-result');
      resultEl.style.display = 'block';
      resultEl.className = 'form-result form-result-info';
      resultEl.textContent = '正在生成待办...';

      try {
        await SongApp.checkAndGenerateRealtimeEvents();
        resultEl.className = 'form-result form-result-success';
        resultEl.textContent = '✅ 已执行待办生成检查，请查看待办列表';
        showToast('✅ 已执行待办生成检查');
        // 更新下次生成信息
        updateNextGenInfo();
      } catch (error) {
        resultEl.className = 'form-result form-result-error';
        resultEl.textContent = `❌ 生成失败：${error.message}`;
      }
    });

    // 计算并显示下次生成时间
    updateNextGenInfo();
  }

  /**
   * 更新下次生成时间信息
   */
  function updateNextGenInfo() {
    const state = SongState.getState();
    const settings = state.settings || {};
    const now = new Date();
    const lastGenAt = settings.lastEventGenerationAt ? new Date(settings.lastEventGenerationAt) : null;
    const eventsPerHour = settings.eventsPerHour || 1;
    const quietStart = settings.quietHoursStart ?? 19;
    const quietEnd = settings.quietHoursEnd ?? 10;

    const statusEl = document.getElementById('current-gen-status');
    const countdownEl = document.getElementById('next-gen-countdown');
    const lastGenEl = document.getElementById('last-gen-time');

    if (!statusEl || !countdownEl) return;

    // 更新上次生成时间
    if (lastGenEl) {
      lastGenEl.textContent = lastGenAt ? lastGenAt.toLocaleString('zh-CN') : '首次启动';
    }

    // 检查是否在静默时段
    const currentHour = now.getHours();
    let inQuietHours = false;
    if (quietStart < quietEnd) {
      inQuietHours = currentHour >= quietStart && currentHour < quietEnd;
    } else {
      inQuietHours = currentHour >= quietStart || currentHour < quietEnd;
    }

    if (inQuietHours) {
      statusEl.textContent = '🔕 静默时段中';
      statusEl.style.color = 'var(--color-text-muted)';
      // 计算静默时段结束时间
      let quietEndTime = new Date(now);
      quietEndTime.setHours(quietEnd, 0, 0, 0);
      if (quietEndTime <= now) quietEndTime.setDate(quietEndTime.getDate() + 1);
      const diff = quietEndTime - now;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      countdownEl.textContent = `${hours}小时${minutes}分钟后恢复`;
      countdownEl.style.color = 'var(--color-text-muted)';
      return;
    }

    // 计算距离下次生成的时间
    statusEl.textContent = '✅ 正常生成中';
    statusEl.style.color = 'var(--color-success, #4caf50)';

    if (!lastGenAt) {
      countdownEl.textContent = '首次启动，已初始化';
      countdownEl.style.color = 'var(--color-info, #2196f3)';
      return;
    }

    // 每小时生成 eventsPerHour 项，计算生成1项需要多少分钟
    const minutesPerEvent = 60 / eventsPerHour;
    // 计算从上次生成到现在经过了多少分钟
    const elapsedMinutes = (now - lastGenAt) / (1000 * 60);
    // 计算距离下次生成还有多少分钟
    const nextEventIn = minutesPerEvent - (elapsedMinutes % minutesPerEvent);

    if (nextEventIn <= 0) {
      countdownEl.textContent = '即将生成（刷新页面触发）';
      countdownEl.style.color = 'var(--color-accent-gold, #d4af37)';
    } else {
      const hours = Math.floor(nextEventIn / 60);
      const minutes = Math.floor(nextEventIn % 60);
      if (hours > 0) {
        countdownEl.textContent = `约 ${hours}小时${minutes}分钟后`;
      } else {
        countdownEl.textContent = `约 ${minutes}分钟后`;
      }
      countdownEl.style.color = 'var(--color-info, #2196f3)';
    }
  }

  function showToast(message) {
    // 简单的 toast 提示
    const toast = document.createElement('div');
    toast.style.cssText = `
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-bg-elevated, #1a1a2e);
      color: var(--color-text-primary, #fff);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid var(--color-border-gold, #b8965a);
      z-index: 9999;
      font-size: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  return {
    render
  };
})();

if (typeof window !== 'undefined') {
  window.PageSettings = PageSettings;
}
