  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function randomFloat(min, max, decimals = 2) {
    return parseFloat((Math.random() * (max - min) + min).toFixed(decimals));
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();
  }

  function formatDate(date) {
    const d = new Date(date);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function formatNewsTime(date) {
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    if (minutes <= 0) return '刚刚';
    if (minutes < 60) return `${minutes} 分钟前`;
    if (hours < 24) return `${hours} 小时前`;
    const month = date.getMonth() + 1;
    const day = date.getDate();
    return `${month}月${day}日`;
  }

  // 获取股票的标准行业ID
  function getIndustryId(stock) {
    if (stock.industryId) return stock.industryId;
    return INDUSTRY_MAP[stock.industry] || 'consumer';
  }

  // 获取货币符号
  function getCurrencySymbol(market) {
    if (market === 'A股') return '¥';
    if (market === '港股') return 'HK$';
    if (market === '美股') return '$';
    return '¥';
  }

  // 判断是否A股（红涨绿跌）
  function isAStock(market) {
    return market === 'A股';
  }

  // ═══════════════════════════════════════════════
  // 行业周期系统
  // ═══════════════════════════════════════════════

  /**
   * 初始化行业周期数据
   */
  function initIndustries() {
    const states = ['boom', 'recovery', 'recession', 'depression'];
    return INDUSTRIES.map(ind => {
      const initialState = states[randomInt(0, 3)];
      const cycle = CYCLE_STATES[initialState];
      return {
        id: ind.id,
        name: ind.name,
        cycle: initialState,
        cycleName: cycle.name,
        cycleDays: randomInt(1, cycle.maxDays),
        trend: cycle.trend,
        baseVolatility: ind.baseVolatility,
        dailyChange: 0
      };
    });
  }

  /**
   * 更新行业周期（每日调用）
   */
  function updateIndustries(industries) {
    return industries.map(ind => {
      const currentCycle = CYCLE_STATES[ind.cycle];
      let newCycle = ind.cycle;
      let newDays = ind.cycleDays + 1;

      // 检查是否需要转换周期
      if (newDays >= currentCycle.minDays) {
        const transition = CYCLE_TRANSITION[ind.cycle];
        const rand = Math.random();
        let cumulative = 0;
        for (const [state, prob] of Object.entries(transition)) {
          cumulative += prob;
          if (rand <= cumulative) {
            newCycle = state;
            break;
          }
        }
        if (newCycle !== ind.cycle) {
          newDays = 0;
        }
      }

      const cycleConfig = CYCLE_STATES[newCycle];
      // 行业日涨跌幅 = 周期趋势 + 随机波动
      const dailyChange = cycleConfig.trend + randomFloat(-1.5, 1.5) * cycleConfig.volatility;

      return {
        ...ind,
        cycle: newCycle,
        cycleName: cycleConfig.name,
        cycleDays: newDays,
        trend: cycleConfig.trend,
        dailyChange: parseFloat(dailyChange.toFixed(2))
      };
    });
  }

  /**
   * 获取某行业的周期趋势影响
   */
  function getIndustryCycleImpact(industries, industryId) {
    const ind = industries.find(i => i.id === industryId);
    if (!ind) return 0;
    return ind.dailyChange;
  }

  // ═══════════════════════════════════════════════
  // 大盘指数
  // ═══════════════════════════════════════════════

  /**
   * 初始化大盘指数
   */
  function initMarketIndex(stocks) {
    // 以所有股票总市值加权计算初始指数
    const totalMarketCap = stocks.reduce((sum, s) => sum + s.marketCap, 0);
    return {
      value: 1000,
      previousClose: 1000,
      change: 0,
      changePercent: 0,
      high: 1000,
      low: 1000,
      volume: 0,
      history: [],
      baseMarketCap: totalMarketCap
    };
  }

  /**
   * 更新大盘指数
   */
  function updateMarketIndex(marketIndex, stocks, today) {
    // 以市值加权计算涨跌幅
    const totalMarketCap = stocks.reduce((sum, s) => sum + s.marketCap, 0);
    const prevTotalMarketCap = stocks.reduce((sum, s) => sum + s.previousClose * (s.marketCap / s.price), 0);

    const changePercent = prevTotalMarketCap > 0
      ? ((totalMarketCap - prevTotalMarketCap) / prevTotalMarketCap) * 100
      : 0;

    const newValue = parseFloat((marketIndex.value * (1 + changePercent / 100)).toFixed(2));
    const totalVolume = stocks.reduce((sum, s) => sum + s.volume, 0);

    const historyEntry = {
      date: today,
      open: marketIndex.value,
      high: Math.max(marketIndex.value, newValue),
      low: Math.min(marketIndex.value, newValue),
      close: newValue,
      volume: totalVolume
    };

    return {
      ...marketIndex,
      value: newValue,
      previousClose: marketIndex.value,
      change: parseFloat((newValue - marketIndex.value).toFixed(2)),
      changePercent: parseFloat(changePercent.toFixed(2)),
      high: Math.max(marketIndex.high, newValue),
      low: Math.min(marketIndex.low, newValue),
      volume: totalVolume,
      history: [...(marketIndex.history || []), historyEntry].slice(-60)
    };
  }

  // ═══════════════════════════════════════════════
  // 数据迁移
  // ═══════════════════════════════════════════════

  /**
   * 迁移旧版股票市场数据到新结构
   */
  function migrateStockMarket(oldData) {
    if (!oldData) return null;

    // 确保每只股票有新字段
    const migratedStocks = (oldData.stocks || []).map(stock => {
      const industryId = getIndustryId(stock);
      return {
        ...stock,
        industryId: stock.industryId || industryId,
        pbRatio: stock.pbRatio || stock.peRatio ? parseFloat((stock.price / (stock.peRatio * 2)).toFixed(2)) : 1.0,
        eps: stock.eps || parseFloat((stock.price / (stock.peRatio || 20)).toFixed(2)),
        dividendYield: stock.dividendYield || stock.dividend ? parseFloat(((stock.dividend / stock.price) * 100).toFixed(2)) : 0,
        liquidity: stock.liquidity || 'high',
        canSellToday: stock.canSellToday !== undefined ? stock.canSellToday : true
      };
    });

    // 确保有行业周期数据
    const industries = oldData.industries && oldData.industries.length > 0
      ? oldData.industries
      : initIndustries();

    // 确保有大盘指数
    const marketIndex = oldData.marketIndex || initMarketIndex(migratedStocks);

    // 确保有交易记录
    const tradeRecords = oldData.tradeRecords || [];

    return {
      ...oldData,
      stocks: migratedStocks,
      industries,
      marketIndex,
      tradeRecords
    };
  }

  // ═══════════════════════════════════════════════
  // 初始化
  // ═══════════════════════════════════════════════

  /**
   * 初始化股票市场数据
   */
  function initStockMarket(startDate) {
    const baseDate = startDate || new Date().toISOString().split('T')[0];
    const stocks = DEFAULT_STOCKS.map(stock => {
      const priceHistory = generatePriceHistory(stock.price, 30, stock.beta, baseDate);
      return {
        ...stock,
        priceHistory,
        change: parseFloat((((stock.price - stock.previousClose) / stock.previousClose) * 100).toFixed(2)),
        canSellToday: true,
        lastUpdated: new Date().toISOString()
      };
    });

    const industries = initIndustries();
    const marketIndex = initMarketIndex(stocks);
    const news = generateNews(5, baseDate);
    const tradeRecords = [];

    return {
      stocks,
      industries,
      marketIndex,
      news,
      tradeRecords,
      lastUpdate: new Date().toISOString()
    };
  }

  /**
   * 生成历史价格数据
   */
  function generatePriceHistory(currentPrice, days, beta = 1, endDate) {
    const history = [];
    const baseEndDate = endDate || new Date().toISOString().split('T')[0];
    let price = currentPrice * randomFloat(0.85, 0.95);

    for (let i = days; i >= 0; i--) {
      const date = new Date(baseEndDate);
      date.setDate(date.getDate() - i);

      const dailyChange = randomFloat(-3 * beta, 3 * beta) / 100;
      price = price * (1 + dailyChange);
      const priceFloor = Math.max(0.1, currentPrice * 0.3);
      const priceCeiling = currentPrice * 5;
      price = clamp(price, priceFloor, priceCeiling);

      history.push({
        date: formatDate(date),
        open: parseFloat((price * randomFloat(0.98, 1.02)).toFixed(2)),
        high: parseFloat((price * randomFloat(1.0, 1.05)).toFixed(2)),
        low: parseFloat((price * randomFloat(0.95, 1.0)).toFixed(2)),
        close: parseFloat(price.toFixed(2)),
        volume: randomInt(5000000, 50000000)
      });
    }

    if (history.length > 0) {
      history[history.length - 1].close = currentPrice;
    }
    return history;
  }

  // ═══════════════════════════════════════════════
  // 每日价格更新（重写：趋势+波动+事件）
  // ═══════════════════════════════════════════════

  /**
   * 每日更新股票市场
   */
  function dailyUpdate(stockMarket, gameState) {
    if (!stockMarket || !stockMarket.stocks) {
      return initStockMarket();
    }

    // 数据迁移检查
    if (!stockMarket.industries || !stockMarket.marketIndex) {
      stockMarket = migrateStockMarket(stockMarket);
    }

    const today = gameState.gameDate?.current || formatDate(new Date());
    const news = stockMarket.news || [];

    // 1. 更新行业周期
    const updatedIndustries = updateIndustries(stockMarket.industries);

    // 2. 更新每只股票价格
    const updatedStocks = stockMarket.stocks.map(stock => {
      return updateStockPrice(stock, today, gameState, updatedIndustries, news);
    });

    // 3. 更新大盘指数
    const updatedMarketIndex = updateMarketIndex(stockMarket.marketIndex, updatedStocks, today);

    // 4. 生成新新闻（每天 1-3 条，小概率黑天鹅）
    const newNewsCount = randomInt(1, 3);
    const newNews = generateNews(newNewsCount);
    // 2% 概率触发黑天鹅
    if (Math.random() < 0.02) {
      const swan = BLACK_SWAN_TEMPLATES[randomInt(0, BLACK_SWAN_TEMPLATES.length - 1)];
      newNews.push({
        id: 'news_swan_' + Date.now(),
        title: swan.title,
        time: '刚刚',
        impact: swan.impact,
        industries: swan.industries || [],
        stockId: swan.stockId || null,
        magnitude: swan.magnitude,
        type: 'blackswan',
        isBlackSwan: true,
        timestamp: new Date().toISOString()
      });
    }
    const allNews = [...newNews, ...news].slice(0, 30);

    // 5. 重置T+1标记（新的一天，昨日买入的可以卖出了）
    updatedStocks.forEach(stock => {
      stock.canSellToday = true;
    });

    return {
      ...stockMarket,
      stocks: updatedStocks,
      industries: updatedIndustries,
      marketIndex: updatedMarketIndex,
      news: allNews,
      lastUpdate: new Date().toISOString()
    };
  }

  /**
   * 更新单只股票价格（核心逻辑重写）
   */
  function updateStockPrice(stock, today, gameState, industries, news) {
    const previousClose = stock.price;
    const industryId = getIndustryId(stock);

    // 1. 大盘趋势影响（beta × 大盘涨跌幅）
    const marketChange = gameState.stockMarket?.marketIndex?.changePercent || 0;
    let changePercent = marketChange * stock.beta * 0.4;

    // 2. 行业周期影响
    const industryImpact = getIndustryCycleImpact(industries, industryId);
    changePercent += industryImpact * 0.5;

    // 3. 个股基本面回归（PE偏离行业均值时回归）
    const industryPe = getIndustryAveragePe(industries, industryId, gameState.stockMarket?.stocks || []);
    if (industryPe > 0 && stock.peRatio > 0) {
      const peDeviation = (stock.peRatio - industryPe) / industryPe;
      changePercent -= peDeviation * 0.3; // PE过高则有下跌压力
    }

    // 4. 短期随机波动（基于beta和流动性）
    const volMultiplier = stock.liquidity === 'low' ? 1.5 : stock.liquidity === 'medium' ? 1.2 : 1.0;
    changePercent += randomFloat(-2.0 * stock.beta * volMultiplier, 2.0 * stock.beta * volMultiplier);

    // 5. 新闻事件影响
    const newsImpact = getNewsImpactForStock(stock, news);
    changePercent += newsImpact;

    // 6. 松氏自身决策影响（松氏系股票）
    if (stock.id.startsWith('song_')) {
      const heirAbilities = gameState.heir?.abilities || {};
      if (heirAbilities.business) changePercent += (heirAbilities.business - 50) * 0.02;
      if (heirAbilities.reputation) changePercent += (heirAbilities.reputation - 50) * 0.015;
    }

    // 7. 涨跌停限制（仅A股）
    if (isAStock(stock.market)) {
      const limitPercent = stock.code && (stock.code.startsWith('300') || stock.code.startsWith('688')) ? 20 : 10;
      changePercent = clamp(changePercent, -limitPercent, limitPercent);
    } else {
      // 港股美股无涨跌停，但限制单日极端波动（防异常）
      changePercent = clamp(changePercent, -30, 30);
    }

    // 计算新价格
    const newPrice = parseFloat((previousClose * (1 + changePercent / 100)).toFixed(2));
    const open = parseFloat((previousClose * randomFloat(0.99, 1.01)).toFixed(2));
    const high = parseFloat((Math.max(newPrice, open) * randomFloat(1.0, 1.03)).toFixed(2));
    const low = parseFloat((Math.min(newPrice, open) * randomFloat(0.97, 1.0)).toFixed(2));
    const volume = randomInt(5000000, 50000000);

    // 更新历史价格
    const newHistoryEntry = { date: today, open, high, low, close: newPrice, volume };
    const priceHistory = [...(stock.priceHistory || []), newHistoryEntry].slice(-60);

    // 更新PE（价格变动后PE同步变动）
    const newPe = stock.eps > 0 ? parseFloat((newPrice / stock.eps).toFixed(2)) : stock.peRatio;

    return {
      ...stock,
      price: newPrice,
      previousClose,
      open, high, low, volume,
      change: parseFloat(changePercent.toFixed(2)),
      peRatio: newPe,
      marketCap: Math.round(newPrice * (stock.marketCap / previousClose)),
      priceHistory,
      lastUpdated: new Date().toISOString()
    };
  }

  /**
   * 获取行业平均PE
   */
  function getIndustryAveragePe(industries, industryId, stocks) {
    const industryStocks = stocks.filter(s => getIndustryId(s) === industryId && s.peRatio > 0);
    if (industryStocks.length === 0) return 0;
    return industryStocks.reduce((sum, s) => sum + s.peRatio, 0) / industryStocks.length;
  }

  /**
   * 获取新闻对股票的影响
   */
  function getNewsImpactForStock(stock, news) {
    let impact = 0;
    const recentNews = (news || []).slice(0, 8);

    for (const item of recentNews) {
      const magnitude = item.magnitude || 1.0;
      // 个股新闻
      if (item.stockId && item.stockId === stock.id) {
        if (item.impact === 'positive') impact += randomFloat(0.5, 1.5) * magnitude;
        else if (item.impact === 'negative') impact -= randomFloat(0.5, 1.5) * magnitude;
      }
      // 行业新闻
      if (item.industries && item.industries.includes(getIndustryId(stock))) {
        if (item.impact === 'positive') impact += randomFloat(0.3, 1.0) * magnitude * 0.5;
        else if (item.impact === 'negative') impact -= randomFloat(0.3, 1.0) * magnitude * 0.5;
      }
    }
    return impact;
  }

  // ═══════════════════════════════════════════════
  // 交易规则：涨跌停价格
  // ═══════════════════════════════════════════════

  /**
   * 获取涨跌停价格
   */
  function getLimitPrices(stock) {
    if (!isAStock(stock.market)) {
      return { limitUp: Infinity, limitDown: 0, hasLimit: false };
    }
    // 创业板(300)/科创板(688) ±20%，主板 ±10%
    const limitPercent = stock.code && (stock.code.startsWith('300') || stock.code.startsWith('688')) ? 0.20 : 0.10;
    const basePrice = stock.previousClose || stock.price;
    return {
      limitUp: parseFloat((basePrice * (1 + limitPercent)).toFixed(2)),
      limitDown: parseFloat((basePrice * (1 - limitPercent)).toFixed(2)),
      hasLimit: true,
      limitPercent: limitPercent * 100
    };
  }

  // ═══════════════════════════════════════════════
  // 交易规则：T+1
  // ═══════════════════════════════════════════════

  /**
   * 判断持仓是否可以今日卖出（T+1）
   */
  function canSellToday(position, today) {
    if (!position) return false;
    // A股T+1：买入日次日才能卖
    // 港股美股T+0：随时可卖
    // 通过position.market或stockId前缀判断
    const stockId = position.stockId || '';
    if (stockId.startsWith('a_')) {
      const buyDate = position.buyDate;
      if (!buyDate) return true;
      return buyDate < today;
    }
    return true; // 港股美股T+0
  }

  /**
   * 获取可卖出数量（考虑T+1）
   */
  function getSellableShares(position, today) {
    if (!position) return 0;
    if (canSellToday(position, today)) return position.shares;
    // 当日买入的部分不可卖
    return position.shares - (position.todayBoughtShares || 0);
  }

  // ═══════════════════════════════════════════════
  // 交易规则：费用计算
  // ═══════════════════════════════════════════════

  /**
   * 计算交易费用
   * @param {object} stock - 股票对象
   * @param {number} amount - 交易金额（价格×数量）
   * @param {string} side - 'buy' | 'sell'
   * @returns {object} 费用明细
   */
  function calculateFees(stock, amount, side) {
    const market = stock.market;
    let commission = 0;
    let stampTax = 0;
    let transferFee = 0;

    if (market === 'A股') {
      // 佣金：0.025%，最低5元（双边）
      commission = Math.max(amount * 0.00025, 5);
      // 印花税：0.05%（仅卖出，2023年减半后）
      if (side === 'sell') stampTax = amount * 0.0005;
      // 过户费：0.001%（双边）
      transferFee = amount * 0.00001;
    } else if (market === '港股') {
      // 佣金：0.03%，最低3港元（双边）
      commission = Math.max(amount * 0.0003, 3);
      // 印花税：0.1%（仅卖出）
      if (side === 'sell') stampTax = amount * 0.001;
      // 交易费：0.005%（双边）
      transferFee = amount * 0.00005;
    } else if (market === '美股') {
      // 佣金：0.005美元/股，简化为0.03%（双边）
      commission = Math.max(amount * 0.0003, 1);
      // 美股无印花税
      stampTax = 0;
      // SEC费等：0.0008%（仅卖出）
      if (side === 'sell') transferFee = amount * 0.000008;
    }

    const totalFee = commission + stampTax + transferFee;
    return {
      commission: parseFloat(commission.toFixed(2)),
      stampTax: parseFloat(stampTax.toFixed(2)),
      transferFee: parseFloat(transferFee.toFixed(2)),
      totalFee: parseFloat(totalFee.toFixed(2))
    };
  }

  // ═══════════════════════════════════════════════
  // 滑点机制
  // ═══════════════════════════════════════════════

  /**
   * 计算滑点
   * @param {object} stock - 股票对象
   * @param {number} shares - 交易数量
   * @param {string} side - 'buy' | 'sell'
   * @returns {object} 滑点信息
   */
  function calculateSlippage(stock, shares, side) {
    const amount = stock.price * shares;
    const avgDailyVolume = stock.volume || 10000000;
    const volumeRatio = shares / avgDailyVolume;

    // 基础滑点率
    let slippageRate = 0;
    if (volumeRatio > 0.01) {
      // 超过日均成交量1%开始有滑点
      slippageRate = volumeRatio * 0.5;
    }

    // 流动性调整
    if (stock.liquidity === 'low') slippageRate *= 2.5;
    else if (stock.liquidity === 'medium') slippageRate *= 1.5;

    // 涨跌停时滑点放大
    const limits = getLimitPrices(stock);
    if (limits.hasLimit) {
      if (side === 'buy' && stock.price >= limits.limitUp * 0.99) slippageRate *= 3;
      if (side === 'sell' && stock.price <= limits.limitDown * 1.01) slippageRate *= 3;
    }

    slippageRate = Math.min(slippageRate, 0.05); // 最大滑点5%

    // 买入滑点：实际成交价更高；卖出滑点：实际成交价更低
    const slippageAmount = amount * slippageRate;
    const actualPrice = side === 'buy'
      ? parseFloat((stock.price * (1 + slippageRate)).toFixed(2))
      : parseFloat((stock.price * (1 - slippageRate)).toFixed(2));

    return {
      slippageRate: parseFloat((slippageRate * 100).toFixed(3)),
      slippageAmount: parseFloat(slippageAmount.toFixed(2)),
      actualPrice,
      hasSlippage: slippageRate > 0.001
    };
  }

  // ═══════════════════════════════════════════════
  // 买卖交易（升级：T+1/涨跌停/费用/滑点/记录）
  // ═══════════════════════════════════════════════

  /**
   * 买入股票
   */
  function buyStock(stock, shares, portfolio, company, today) {
    const currentDate = today || new Date().toISOString().split('T')[0];

    // 涨跌停检查：涨停时可能买不进
    const limits = getLimitPrices(stock);
    if (limits.hasLimit && stock.price >= limits.limitUp) {
      return { success: false, error: '股票已涨停，无法买入' };
    }

    // 计算滑点
    const slippage = calculateSlippage(stock, shares, 'buy');
    const actualPrice = slippage.actualPrice;

    // 计算费用
    const tradeAmount = actualPrice * shares;
    const fees = calculateFees(stock, tradeAmount, 'buy');
    const totalAmount = tradeAmount + fees.totalFee;

    // 检查现金流
    if ((company.cashFlow || 0) < totalAmount) {
      return { success: false, error: '现金流不足' };
    }

    // 更新投资组合
    const existingPosition = portfolio.find(p => p.stockId === stock.id);
    let updatedPortfolio;

    if (existingPosition) {
      const totalShares = existingPosition.shares + shares;
      const totalCostBasis = (existingPosition.avgCost * existingPosition.shares) + (actualPrice * shares);
      const newAvgCost = totalCostBasis / totalShares;

      updatedPortfolio = portfolio.map(p =>
        p.stockId === stock.id
          ? {
              ...p,
              shares: totalShares,
              avgCost: parseFloat(newAvgCost.toFixed(2)),
              todayBoughtShares: (p.todayBoughtShares || 0) + shares,
              market: stock.market
            }
          : p
      );
    } else {
      updatedPortfolio = [...portfolio, {
        stockId: stock.id,
        stockName: stock.name,
        shares,
        avgCost: actualPrice,
        buyDate: currentDate,
        todayBoughtShares: shares,
        market: stock.market,
        realizedProfit: 0
      }];
    }

    // 生成交易记录
    const tradeRecord = {
      id: 'trade_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      type: 'buy',
      stockId: stock.id,
      stockName: stock.name,
      market: stock.market,
      shares,
      price: actualPrice,
      amount: tradeAmount,
      fees: fees.totalFee,
      feeDetail: fees,
      slippage: slippage.slippageRate,
      totalAmount,
      date: currentDate,
      timestamp: new Date().toISOString()
    };

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) - totalAmount,
      tradeAmount,
      actualPrice,
      fees,
      slippage,
      totalAmount,
      tradeRecord
    };
  }

  /**
   * 卖出股票
   */
  function sellStock(stock, shares, portfolio, company, today) {
    const currentDate = today || new Date().toISOString().split('T')[0];
    const position = portfolio.find(p => p.stockId === stock.id);

    if (!position) {
      return { success: false, error: '未持有该股票' };
    }

    // T+1检查
    const sellable = getSellableShares(position, currentDate);
    if (sellable < shares) {
      return {
        success: false,
        error: `可卖数量不足（T+1限制），当前可卖 ${sellable} 股`,
        sellableShares: sellable
      };
    }

    // 跌停检查
    const limits = getLimitPrices(stock);
    if (limits.hasLimit && stock.price <= limits.limitDown) {
      return { success: false, error: '股票已跌停，无法卖出' };
    }

    // 计算滑点
    const slippage = calculateSlippage(stock, shares, 'sell');
    const actualPrice = slippage.actualPrice;

    // 计算费用
    const tradeAmount = actualPrice * shares;
    const fees = calculateFees(stock, tradeAmount, 'sell');
    const netRevenue = tradeAmount - fees.totalFee;

    // 计算盈亏
    const costBasis = position.avgCost * shares;
    const grossProfit = tradeAmount - costBasis;
    const profit = grossProfit - fees.totalFee;
    const profitPercent = costBasis > 0 ? parseFloat(((profit / costBasis) * 100).toFixed(2)) : 0;

    // 更新投资组合
    let updatedPortfolio;
    const remainingShares = position.shares - shares;

    if (remainingShares <= 0) {
      updatedPortfolio = portfolio.filter(p => p.stockId !== stock.id);
    } else {
      updatedPortfolio = portfolio.map(p =>
        p.stockId === stock.id
          ? {
              ...p,
              shares: remainingShares,
              realizedProfit: (p.realizedProfit || 0) + profit
            }
          : p
      );
    }

    // 生成交易记录
    const tradeRecord = {
      id: 'trade_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      type: 'sell',
      stockId: stock.id,
      stockName: stock.name,
      market: stock.market,
      shares,
      price: actualPrice,
      amount: tradeAmount,
      fees: fees.totalFee,
      feeDetail: fees,
      slippage: slippage.slippageRate,
      netRevenue,
      costBasis,
      grossProfit,
      profit,
      profitPercent,
      date: currentDate,
      timestamp: new Date().toISOString()
    };

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) + netRevenue,
      tradeAmount,
      actualPrice,
      fees,
      slippage,
      netRevenue,
      costBasis,
      profit,
      profitPercent,
      realizedProfit: profit,
      tradeRecord
    };
  }

  // ═══════════════════════════════════════════════
  // 浮盈/实盈计算
  // ═══════════════════════════════════════════════

  /**
   * 计算持仓浮盈
   */
  function calculateUnrealizedProfit(position, stock) {
    if (!position || !stock) return { profit: 0, profitPercent: 0, marketValue: 0 };
    const marketValue = stock.price * position.shares;
    const costValue = position.avgCost * position.shares;
    const profit = marketValue - costValue;
    const profitPercent = costValue > 0 ? parseFloat(((profit / costValue) * 100).toFixed(2)) : 0;
    return {
      profit: parseFloat(profit.toFixed(2)),
      profitPercent,
      marketValue: parseFloat(marketValue.toFixed(2)),
      costValue: parseFloat(costValue.toFixed(2))
    };
  }

  /**
   * 计算投资组合总览（浮盈+已实现盈亏）
   */
  function calculatePortfolioSummary(portfolio, stocks) {
    let totalMarketValue = 0;
    let totalCostValue = 0;
    let totalRealizedProfit = 0;

    portfolio.forEach(position => {
      const stock = stocks.find(s => s.id === position.stockId);
      if (stock) {
        totalMarketValue += stock.price * position.shares;
        totalCostValue += position.avgCost * position.shares;
      }
      totalRealizedProfit += position.realizedProfit || 0;
    });

    const unrealizedProfit = totalMarketValue - totalCostValue;
    const totalProfit = unrealizedProfit + totalRealizedProfit;

    return {
      totalMarketValue: parseFloat(totalMarketValue.toFixed(2)),
      totalCostValue: parseFloat(totalCostValue.toFixed(2)),
      unrealizedProfit: parseFloat(unrealizedProfit.toFixed(2)),
      unrealizedProfitPercent: totalCostValue > 0 ? parseFloat(((unrealizedProfit / totalCostValue) * 100).toFixed(2)) : 0,
      realizedProfit: parseFloat(totalRealizedProfit.toFixed(2)),
      totalProfit: parseFloat(totalProfit.toFixed(2)),
      totalProfitPercent: totalCostValue > 0 ? parseFloat(((totalProfit / totalCostValue) * 100).toFixed(2)) : 0
    };
  }

  // ═══════════════════════════════════════════════
  // 新闻生成
  // ═══════════════════════════════════════════════

  /**
   * 生成市场新闻
   */
  function generateNews(count = 3) {
    const news = [];
    const usedTitles = new Set();
    const now = new Date();

    for (let i = 0; i < count; i++) {
      let template;
      let attempts = 0;
      do {
        template = NEWS_TEMPLATES[Math.floor(Math.random() * NEWS_TEMPLATES.length)];
        attempts++;
      } while (usedTitles.has(template.title) && attempts < 10);

      usedTitles.add(template.title);

      const time = new Date(now.getTime() - i * randomInt(30, 180) * 60000);

      news.push({
        id: 'news_' + Date.now() + '_' + i,
        title: template.title,
        time: formatNewsTime(time),
        impact: template.impact,
        type: template.type || 'market',
        industries: template.industries || [],
        stockId: template.stockId || null,
        magnitude: template.magnitude || 1.0,
        timestamp: time.toISOString()
      });
    }
    return news;
  }

  // ═══════════════════════════════════════════════
  // 股票详情与技术指标
  // ═══════════════════════════════════════════════

  function getStockDetail(stocks, id) {
    return stocks.find(s => s.id === id);
  }

  function getStockTrend(stock, days = 7) {
    const history = stock.priceHistory || [];
    return history.slice(-days);
  }

  function calculateIndicators(stock) {
    const history = stock.priceHistory || [];
    if (history.length < 5) return null;

    const closes = history.map(h => h.close);
    const recent5 = closes.slice(-5);
    const recent20 = closes.slice(-20);

    const ma5 = recent5.reduce((a, b) => a + b, 0) / recent5.length;
    const ma20 = recent20.length >= 20
      ? recent20.reduce((a, b) => a + b, 0) / recent20.length
      : closes.reduce((a, b) => a + b, 0) / closes.length;

    const mean = closes.reduce((a, b) => a + b, 0) / closes.length;
    const variance = closes.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / closes.length;
    const volatility = Math.sqrt(variance);

    const change5d = ((closes[closes.length - 1] - closes[Math.max(0, closes.length - 6)]) / closes[Math.max(0, closes.length - 6)]) * 100;

    return {
      ma5: parseFloat(ma5.toFixed(2)),
      ma20: parseFloat(ma20.toFixed(2)),
      volatility: parseFloat(volatility.toFixed(2)),
      change5d: parseFloat(change5d.toFixed(2)),
      high52week: Math.max(...closes),
      low52week: Math.min(...closes)
    };
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    // 常量
    DEFAULT_STOCKS,
    INDUSTRIES,
    CYCLE_STATES,
    // 初始化与更新
    initStockMarket,
    dailyUpdate,
    migrateStockMarket,
    initIndustries,
    initMarketIndex,
    // 行业周期
    updateIndustries,
    getIndustryCycleImpact,
    getIndustryId,
    // 大盘指数
    updateMarketIndex,
    // 交易规则
    getLimitPrices,
    canSellToday,
    getSellableShares,
    calculateFees,
    calculateSlippage,
    // 买卖
    buyStock,
    sellStock,
    // 盈亏
    calculateUnrealizedProfit,
    calculatePortfolioSummary,
    // 新闻
    generateNews,
    getNewsImpactForStock,
    // 详情与指标
    getStockDetail,
    getStockTrend,
    calculateIndicators,
    // 工具
    formatMoney,
    getCurrencySymbol,
    isAStock
  };
})();

if (typeof window !== 'undefined') {
  window.SongStockMarket = SongStockMarket;
}

    return DEFAULT_FUNDS.map(fund => {
      // 生成 90 天历史净值
      const navHistory = generateNavHistory(fund.nav, 90, fund.type, baseDate);

      // 根据历史数据重新计算收益率
      const returns = calculateReturns(navHistory);

      return {
        ...fund,
        ...returns,
        navHistory,
        lastUpdated: new Date().toISOString()
      };
    });
  }

  /**
   * 生成历史净值数据
   * @param {number} currentNav - 当前净值
   * @param {number} days - 生成多少天历史
   * @param {string} fundType - 基金类型
   * @param {string} endDate - 结束日期（游戏当前日期）
   */
  function generateNavHistory(currentNav, days, fundType, endDate) {
    const history = [];
    const baseEndDate = endDate || new Date().toISOString().split('T')[0];
    let nav = currentNav * randomFloat(0.85, 0.95);

    // 不同类型基金的波动率不同
    const volatility = {
      '股票型': 0.015,
      '混合型': 0.008,
      '债券型': 0.002,
      '货币型': 0.0003,
      '指数型': 0.012
    }[fundType] || 0.01;

    for (let i = days; i >= 0; i--) {
      const date = new Date(baseEndDate);
      date.setDate(date.getDate() - i);

      // 每日波动
      const dailyChange = randomFloat(-volatility, volatility);
      nav = nav * (1 + dailyChange);
      nav = clamp(nav, 0.5, 10); // 净值范围限制

      history.push({
        date: formatDate(date),
        nav: parseFloat(nav.toFixed(4)),
        return: parseFloat((dailyChange * 100).toFixed(2))
      });
    }

    // 最后一天设为当前净值
    if (history.length > 0) {
      history[history.length - 1].nav = currentNav;
    }

    return history;
  }

  /**
   * 计算收益率
   */
  function calculateReturns(navHistory) {
    if (navHistory.length < 2) return {};

    const latest = navHistory[navHistory.length - 1].nav;

    // 1日收益率
    const return1d = navHistory.length >= 2
      ? ((latest - navHistory[navHistory.length - 2].nav) / navHistory[navHistory.length - 2].nav) * 100
      : 0;

    // 1个月收益率（约21个交易日）
    const return1m = navHistory.length >= 22
      ? ((latest - navHistory[navHistory.length - 22].nav) / navHistory[navHistory.length - 22].nav) * 100
      : return1d * 21;

    // 3个月收益率（约63个交易日）
    const return3m = navHistory.length >= 64
      ? ((latest - navHistory[navHistory.length - 64].nav) / navHistory[navHistory.length - 64].nav) * 100
      : return1m * 3;

    // 1年收益率（约252个交易日，但我们只有90天数据，用3个月*4估算）
    const return1y = return3m * 4;

    return {
      return1d: parseFloat(return1d.toFixed(2)),
      return1m: parseFloat(return1m.toFixed(2)),
      return3m: parseFloat(return3m.toFixed(2)),
      return1y: parseFloat(return1y.toFixed(2))
    };
  }

  // ═══════════════════════════════════════════════
  // 每日更新
  // ═══════════════════════════════════════════════

  /**
   * 每日更新基金净值
   */
  function dailyUpdate(funds, gameState) {
    if (!funds || funds.length === 0) {
      return initFunds();
    }

    const today = gameState.gameDate?.current || formatDate(new Date());

    const updatedFunds = funds.map(fund => {
      return updateFundNav(fund, today, gameState);
    });

    return updatedFunds;
  }

  /**
   * 更新单只基金净值
   */
  function updateFundNav(fund, today, gameState) {
    const previousNav = fund.nav;

    // 不同类型基金的波动率
    const volatility = {
      '股票型': 0.015,
      '混合型': 0.008,
      '债券型': 0.002,
      '货币型': 0.0003,
      '指数型': 0.012
    }[fund.type] || 0.01;

    // 基础波动
    let dailyChange = randomFloat(-volatility, volatility);

    // 股票型和指数型基金受市场指数影响
    if (fund.type === '股票型' || fund.type === '指数型') {
      const marketIndex = gameState.company?.marketIndex || 1000;
      const marketChange = (marketIndex - 1000) / 10000;
      dailyChange += marketChange * 0.5;
    }

    // 松氏系基金受继承人能力影响
    if (fund.id.startsWith('song_')) {
      const heirAbilities = gameState.heir?.abilities || {};
      if (heirAbilities.business) {
        dailyChange += (heirAbilities.business - 50) * 0.0001;
      }
    }

    // 货币型基金收益为正
    if (fund.type === '货币型') {
      dailyChange = Math.abs(dailyChange) * 0.5 + 0.0001;
    }

    // 计算新净值
    const newNav = parseFloat((previousNav * (1 + dailyChange)).toFixed(4));
    const return1d = parseFloat((dailyChange * 100).toFixed(2));

    // 更新历史净值
    const newHistoryEntry = {
      date: today,
      nav: newNav,
      return: return1d
    };

    const navHistory = [...(fund.navHistory || []), newHistoryEntry].slice(-120); // 保留最近 120 天

    // 重新计算收益率
    const returns = calculateReturns(navHistory);

    return {
      ...fund,
      nav: newNav,
      previousNav,
      ...returns,
      navHistory,
      lastUpdated: new Date().toISOString()
    };
  }

  // ═══════════════════════════════════════════════
  // 基金详情与分析
  // ═══════════════════════════════════════════════

  /**
   * 获取基金详情
   */
  function getFundDetail(funds, id) {
    return funds.find(f => f.id === id);
  }

  /**
   * 获取基金趋势数据
   */
  function getFundTrend(fund, days = 30) {
    const history = fund.navHistory || [];
    return history.slice(-days);
  }

  /**
   * 风险等级评估
   */
  function getRiskAssessment(fund) {
    const riskLevels = {
      'low': { label: '低风险', desc: '适合保守型投资者，本金安全度高，收益稳定但较低。' },
      'medium': { label: '中风险', desc: '适合稳健型投资者，有一定波动，长期收益较好。' },
      'high': { label: '高风险', desc: '适合积极型投资者，波动较大，可能获得较高收益也可能亏损。' }
    };
    return riskLevels[fund.risk] || riskLevels['medium'];
  }

  /**
   * 基金经理评价
   */
  function getManagerReview(fund) {
    const reviews = {
      '陈志明': '从业12年，擅长成长股投资，选股能力突出，任期内基金业绩同类排名前15%。',
      '林雅婷': '从业10年，资产配置专家，擅长股债平衡，回撤控制优秀，长期业绩稳定。',
      '黄建国': '从业18年，固收领域资深专家，信用研究能力强，基金连续5年正收益。',
      '吴晓燕': '从业8年，货币市场专家，流动性管理能力强，基金规模行业领先。',
      '郑文博': '从业9年，医药行业研究员出身，对医疗健康产业有深入理解，选股精准。',
      '指数跟踪': '被动指数化投资，紧密跟踪标的指数，跟踪误差小，费率低廉。'
    };
    return reviews[fund.fundManager] || '基金经理经验丰富，业绩稳定。';
  }

  // ═══════════════════════════════════════════════
  // 买卖基金
  // ═══════════════════════════════════════════════

  /**
   * 买入基金
   */
  function buyFund(fund, amount, fundPortfolio, company) {
    // 货币型基金按金额买入，其他按金额买入
    const purchaseFee = fund.type === '货币型' ? 0 : Math.max(amount * 0.0015, 10); // 申购费 0.15%，最低10元
    const netAmount = amount - purchaseFee;
    const shares = fund.type === '货币型' ? netAmount : netAmount / fund.nav;

    // 检查现金流
    if ((company.cashFlow || 0) < amount) {
      return { success: false, error: '现金流不足' };
    }

    // 更新基金持仓
    const existingPosition = fundPortfolio.find(p => p.fundId === fund.id);
    let updatedPortfolio;

    if (existingPosition) {
      // 加仓：计算平均成本
      const totalShares = existingPosition.shares + shares;
      const totalCost = (existingPosition.avgCost * existingPosition.shares) + (fund.nav * shares);
      const newAvgCost = fund.type === '货币型' ? 1 : totalCost / totalShares;

      updatedPortfolio = fundPortfolio.map(p =>
        p.fundId === fund.id
          ? { ...p, shares: totalShares, avgCost: parseFloat(newAvgCost.toFixed(4)) }
          : p
      );
    } else {
      // 新建持仓
      updatedPortfolio = [...fundPortfolio, {
        fundId: fund.id,
        fundName: fund.name,
        fundType: fund.type,
        shares: parseFloat(shares.toFixed(4)),
        avgCost: fund.type === '货币型' ? 1 : fund.nav,
        buyDate: new Date().toISOString().split('T')[0]
      }];
    }

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) - amount,
      shares: parseFloat(shares.toFixed(4)),
      purchaseFee,
      netAmount,
      totalAmount: amount
    };
  }

  /**
   * 卖出基金
   */
  function sellFund(fund, shares, fundPortfolio, company) {
    const position = fundPortfolio.find(p => p.fundId === fund.id);

    if (!position) {
      return { success: false, error: '未持有该基金' };
    }

    if (position.shares < shares) {
      return { success: false, error: `持仓不足，当前持有 ${position.shares.toFixed(2)} 份` };
    }

    // 货币型基金按份额=金额，其他按净值计算
    const sellAmount = fund.type === '货币型' ? shares : shares * fund.nav;
    const redemptionFee = fund.type === '货币型' ? 0 : Math.max(sellAmount * 0.005, 10); // 赎回费 0.5%，最低10元
    const netAmount = sellAmount - redemptionFee;

    // 计算盈亏
    const costBasis = position.avgCost * shares;
    const profit = sellAmount - costBasis - redemptionFee;
    const profitPercent = costBasis > 0 ? (profit / costBasis) * 100 : 0;

    // 更新持仓
    let updatedPortfolio;
    const remainingShares = position.shares - shares;

    if (remainingShares <= 0.01) {
      // 清仓
      updatedPortfolio = fundPortfolio.filter(p => p.fundId !== fund.id);
    } else {
      // 减仓
      updatedPortfolio = fundPortfolio.map(p =>
        p.fundId === fund.id
          ? { ...p, shares: parseFloat(remainingShares.toFixed(4)) }
          : p
      );
    }

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) + netAmount,
      sellAmount,
      redemptionFee,
      netAmount,
      profit,
      profitPercent: parseFloat(profitPercent.toFixed(2))
    };
  }

  // ═══════════════════════════════════════════════
  // 投资组合分析
  // ═══════════════════════════════════════════════

  /**
   * 计算投资组合总览
   */
  function calculatePortfolioSummary(stockPortfolio, fundPortfolio, stocks, funds) {
    // 股票持仓市值
    const stockValue = stockPortfolio.reduce((sum, p) => {
      const stock = stocks.find(s => s.id === p.stockId);
      return sum + (stock ? stock.price * p.shares : 0);
    }, 0);

    // 基金持仓市值
    const fundValue = fundPortfolio.reduce((sum, p) => {
      const fund = funds.find(f => f.id === p.fundId);
      return sum + (fund ? (p.fundType === '货币型' ? p.shares : fund.nav * p.shares) : 0);
    }, 0);

    const totalValue = stockValue + fundValue;

    // 股票成本
    const stockCost = stockPortfolio.reduce((sum, p) => {
      return sum + (p.avgCost * p.shares);
    }, 0);

    // 基金成本
    const fundCost = fundPortfolio.reduce((sum, p) => {
      return sum + (p.avgCost * p.shares);
    }, 0);

    const totalCost = stockCost + fundCost;
    const totalProfit = totalValue - totalCost;
    const profitPercent = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;

    // 资产配置
    const assetAllocation = {
      stocks: totalValue > 0 ? (stockValue / totalValue) * 100 : 0,
      funds: totalValue > 0 ? (fundValue / totalValue) * 100 : 0
    };

    // 基金类型分布
    const fundTypeDistribution = {};
    fundPortfolio.forEach(p => {
      const fund = funds.find(f => f.id === p.fundId);
      if (fund) {
        const value = p.fundType === '货币型' ? p.shares : fund.nav * p.shares;
        fundTypeDistribution[fund.type] = (fundTypeDistribution[fund.type] || 0) + value;
      }
    });

    return {
      totalValue,
      stockValue,
      fundValue,
      totalCost,
      stockCost,
      fundCost,
      totalProfit,
      profitPercent: parseFloat(profitPercent.toFixed(2)),
      assetAllocation,
      fundTypeDistribution,
      stockCount: stockPortfolio.length,
      fundCount: fundPortfolio.length,
      // 组合风险指标
      riskMetrics: calculateRiskMetrics(stockPortfolio, fundPortfolio, stocks, funds)
    };
  }

  /**
   * 计算组合风险指标
   * 最大回撤、夏普比率、波动率
   */
  function calculateRiskMetrics(stockPortfolio, fundPortfolio, stocks, funds) {
    // 模拟组合历史净值（基于持仓股票和基金的历史价格）
    // 实际项目中应该保存每日净值，这里用模拟数据计算
    const days = 30; // 最近30天
    const navHistory = [];
    
    // 生成模拟净值序列（基于当前收益率和波动率）
    const currentReturn = 0; // 基准收益率
    const baseVolatility = 0.015; // 基础日波动率1.5%
    
    let nav = 1.0;
    for (let i = 0; i < days; i++) {
      // 根据持仓类型调整波动率
      const stockRatio = stockPortfolio.length > 0 ? 0.6 : 0.3;
      const dailyVol = baseVolatility * (0.5 + stockRatio);
      const dailyReturn = (Math.random() - 0.48) * dailyVol; // 略微正偏
      nav = nav * (1 + dailyReturn);
      navHistory.push(nav);
    }
    
    // 计算日收益率
    const dailyReturns = [];
    for (let i = 1; i < navHistory.length; i++) {
      dailyReturns.push((navHistory[i] - navHistory[i-1]) / navHistory[i-1]);
    }
    
    // 1. 最大回撤
    let maxDrawdown = 0;
    let peak = navHistory[0];
    for (let i = 1; i < navHistory.length; i++) {
      if (navHistory[i] > peak) {
        peak = navHistory[i];
      }
      const drawdown = (peak - navHistory[i]) / peak;
      if (drawdown > maxDrawdown) {
        maxDrawdown = drawdown;
      }
    }
    
    // 2. 波动率（年化）
    const meanReturn = dailyReturns.reduce((sum, r) => sum + r, 0) / dailyReturns.length;
    const variance = dailyReturns.reduce((sum, r) => sum + Math.pow(r - meanReturn, 2), 0) / dailyReturns.length;
    const dailyVolatility = Math.sqrt(variance);
    const annualVolatility = dailyVolatility * Math.sqrt(252); // 年化
    
    // 3. 夏普比率（年化，无风险利率3%）
    const riskFreeRate = 0.03;
    const annualReturn = meanReturn * 252;
    const sharpeRatio = annualVolatility > 0 ? (annualReturn - riskFreeRate) / annualVolatility : 0;
    
    // 风险等级评估
    let riskLevel = '低';
    let riskColor = 'success';
    if (annualVolatility > 0.25 || maxDrawdown > 0.15) {
      riskLevel = '高';
      riskColor = 'danger';
    } else if (annualVolatility > 0.15 || maxDrawdown > 0.08) {
      riskLevel = '中';
      riskColor = 'warning';
    }
    
    return {
      maxDrawdown: parseFloat((maxDrawdown * 100).toFixed(2)), // 百分比
      annualVolatility: parseFloat((annualVolatility * 100).toFixed(2)), // 百分比
      sharpeRatio: parseFloat(sharpeRatio.toFixed(2)),
      riskLevel,
      riskColor,
      // 评级
      drawdownRating: maxDrawdown < 0.05 ? '优秀' : maxDrawdown < 0.1 ? '良好' : maxDrawdown < 0.15 ? '一般' : '需关注',
      volatilityRating: annualVolatility < 0.1 ? '低波动' : annualVolatility < 0.2 ? '中等波动' : annualVolatility < 0.3 ? '较高波动' : '高波动',
      sharpeRating: sharpeRatio > 1.5 ? '优秀' : sharpeRatio > 1.0 ? '良好' : sharpeRatio > 0.5 ? '一般' : '偏低'
    };
  }

  /**
   * 生成投资建议
   */
  function generateAdvice(summary) {
    const advice = [];

    if (summary.totalValue < 10000) {
      advice.push('当前投资规模较小，建议逐步增加投资金额，分散配置。');
    }

    if (summary.assetAllocation.stocks > 80) {
      advice.push('股票仓位过高，建议增加债券型或货币型基金配置，降低组合波动。');
    } else if (summary.assetAllocation.stocks < 20 && summary.totalValue > 10000) {
      advice.push('股票仓位过低，可适当增加优质股票或股票型基金配置，提升长期收益。');
    }

    if (summary.profitPercent > 20) {
      advice.push('投资收益优秀，建议部分止盈，锁定利润，再均衡配置。');
    } else if (summary.profitPercent < -10) {
      advice.push('当前浮亏较大，建议审视持仓基本面，避免盲目割肉，可考虑逢低加仓优质标的。');
    }

    if (summary.fundCount === 0 && summary.stockCount > 5) {
      advice.push('仅持有股票，建议配置部分基金，通过专业管理分散风险。');
    }

    if (advice.length === 0) {
      advice.push('投资组合配置合理，继续保持，定期审视再平衡。');
    }

    return advice;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    DEFAULT_FUNDS,
    initFunds,
    dailyUpdate,
    getFundDetail,
    getFundTrend,
    getRiskAssessment,
    getManagerReview,
    buyFund,
    sellFund,
    calculatePortfolioSummary,
    generateAdvice,
    formatMoney
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongFund = SongFund;
}


/* ===== js/modules/macroeconomy.js ===== */
/**
 * 松氏家族办公室 - 宏观经济模块
 * 核心宏观指标：GDP、CPI、PMI、利率
 * 央行货币政策：加息/降息/降准
 */

const SongMacroEconomy = (function() {
  'use strict';

  // 宏观经济数据
  let macroData = null;

  /**
   * 初始化宏观经济数据
   */
  function init() {
    const state = SongState.getState();
    if (state.macroEconomy) {
      macroData = state.macroEconomy;
    } else {
      macroData = generateInitialData();
      saveToState();
    }
    console.log('[SongMacroEconomy] 宏观经济模块初始化完成');
  }

  /**
   * 生成初始宏观经济数据
   */
  function generateInitialData() {
    return {
      // 核心经济指标
      gdp: {
        current: 5.2, // GDP同比增长率%
        previous: 5.0,
        trend: 'up', // up/down/stable
        history: generateHistory(5.0, 0.3, 12)
      },
      cpi: {
        current: 2.1, // CPI同比%
        previous: 2.3,
        trend: 'down',
        history: generateHistory(2.5, 0.2, 12)
      },
      pmi: {
        current: 51.2, // PMI指数
        previous: 50.8,
        trend: 'up',
        history: generateHistory(50.5, 0.5, 12)
      },
      interestRate: {
        current: 3.45, // 基准利率%
        previous: 3.45,
        trend: 'stable',
        history: generateHistory(3.5, 0.1, 12)
      },
      // 货币政策
      monetaryPolicy: {
        currentStance: '稳健', // 宽松/稳健/紧缩
        lastAction: null, // 最近一次政策动作
        lastActionDate: null,
        rateCutCount: 0, // 降息次数
        rateHikeCount: 0, // 加息次数
        rrrCutCount: 0, // 降准次数
        actions: [] // 政策动作历史
      },
      // 市场影响系数
      marketImpact: {
        interestRateSensitivity: 0.8, // 利率对市场影响系数
        gdpSensitivity: 0.6,
        cpiSensitivity: 0.4,
        pmiSensitivity: 0.5
      }
    };
  }

  /**
   * 生成历史数据
   */
  function generateHistory(base, volatility, months) {
    const history = [];
    let value = base;
    for (let i = 0; i < months; i++) {
      value = value + (Math.random() - 0.5) * volatility;
      history.push({
        month: `${i + 1}月`,
        value: parseFloat(value.toFixed(2))
      });
    }
    return history;
  }

  /**
   * 保存到全局状态
   */
  function saveToState() {
    SongState.update('macroEconomy', macroData);
  }

  /**
   * 获取宏观经济数据
   */
  function getMacroData() {
    // 如果还没初始化，自动初始化
    if (!macroData) {
      init();
    }
    return macroData;
  }

  /**
   * 每日更新宏观经济数据
   */
  function dailyUpdate(gameDate) {
    if (!macroData) return;

    // 每月更新一次宏观数据（模拟真实经济数据发布频率）
    const dayOfMonth = parseInt(gameDate.split('-')[2]);
    if (dayOfMonth !== 1) return;

    // 更新GDP
    updateIndicator('gdp', 0.1);
    // 更新CPI
    updateIndicator('cpi', 0.15);
    // 更新PMI
    updateIndicator('pmi', 0.3);
    // 更新利率（央行决定，不随机变动）
    // interestRate 保持不变，由货币政策动作改变

    saveToState();
    console.log('[SongMacroEconomy] 宏观经济数据已更新');
  }

  /**
   * 更新单个指标
   */
  function updateIndicator(key, volatility) {
    const indicator = macroData[key];
    indicator.previous = indicator.current;
    const change = (Math.random() - 0.5) * volatility;
    indicator.current = parseFloat((indicator.current + change).toFixed(2));
    
    // 限制合理范围
    if (key === 'gdp') indicator.current = Math.max(0, Math.min(10, indicator.current));
    if (key === 'cpi') indicator.current = Math.max(-1, Math.min(8, indicator.current));
    if (key === 'pmi') indicator.current = Math.max(40, Math.min(60, indicator.current));
    
    // 判断趋势
    if (indicator.current > indicator.previous + 0.05) {
      indicator.trend = 'up';
    } else if (indicator.current < indicator.previous - 0.05) {
      indicator.trend = 'down';
    } else {
      indicator.trend = 'stable';
    }
    
    // 更新历史
    indicator.history.push({
      month: '最新',
      value: indicator.current
    });
    if (indicator.history.length > 12) {
      indicator.history.shift();
    }
  }

  /**
   * 央行货币政策动作
   * @param {string} action - rate_cut/rate_hike/rrr_cut
   */
  function monetaryPolicyAction(action, gameDate) {
    const policy = macroData.monetaryPolicy;
    let description = '';
    let marketImpact = 0;

    switch (action) {
      case 'rate_cut':
        macroData.interestRate.previous = macroData.interestRate.current;
        macroData.interestRate.current = parseFloat((macroData.interestRate.current - 0.25).toFixed(2));
        macroData.interestRate.trend = 'down';
        policy.rateCutCount++;
        policy.currentStance = '宽松';
        description = `央行降息0.25个百分点，基准利率降至${macroData.interestRate.current}%`;
        marketImpact = 2.5; // 利好市场
        break;

      case 'rate_hike':
        macroData.interestRate.previous = macroData.interestRate.current;
        macroData.interestRate.current = parseFloat((macroData.interestRate.current + 0.25).toFixed(2));
        macroData.interestRate.trend = 'up';
        policy.rateHikeCount++;
        policy.currentStance = '紧缩';
        description = `央行加息0.25个百分点，基准利率升至${macroData.interestRate.current}%`;
        marketImpact = -2.5; // 利空市场
        break;

      case 'rrr_cut':
        policy.rrrCutCount++;
        policy.currentStance = '宽松';
        description = '央行降准0.5个百分点，释放长期资金约1万亿元';
        marketImpact = 1.5; // 利好市场
        break;
    }

    // 记录政策动作
    const actionRecord = {
      action,
      description,
      date: gameDate,
      marketImpact
    };
    policy.actions.unshift(actionRecord);
    if (policy.actions.length > 20) policy.actions.pop();

    policy.lastAction = description;
    policy.lastActionDate = gameDate;

    saveToState();

    // 触发市场影响
    applyMarketImpact(marketImpact, description);

    return actionRecord;
  }

  /**
   * 应用货币政策对市场的影响
   */
  function applyMarketImpact(impact, description) {
    // 影响股票市场
    if (window.SongStockMarket) {
      const stocks = SongStockMarket.getStocks();
      stocks.forEach(stock => {
        // 利率敏感型股票（金融、地产）波动更大
        let sensitivity = 1.0;
        if (stock.sector === '金融' || stock.sector === '地产') sensitivity = 1.5;
        if (stock.sector === '科技') sensitivity = 1.2;
        
        const change = impact * sensitivity * (0.8 + Math.random() * 0.4);
        stock.price = stock.price * (1 + change / 100);
        stock.change = parseFloat((change).toFixed(2));
        stock.changePercent = parseFloat((change).toFixed(2));
      });
      SongStockMarket.saveStocks();
    }

    // 添加市场新闻
    if (window.SongStockMarket) {
      SongStockMarket.addNews({
        title: '央行货币政策',
        content: description,
        type: impact > 0 ? 'positive' : 'negative',
        impact: Math.abs(impact)
      });
    }

    console.log('[SongMacroEconomy] 货币政策市场影响已应用:', impact);
  }

  /**
   * 获取经济周期判断
   */
  function getEconomicCycle() {
    const { gdp, cpi, pmi } = macroData;
    
    // 复苏：GDP上行，CPI低位，PMI>50
    if (gdp.trend === 'up' && cpi.current < 3 && pmi.current > 50) {
      return { phase: '复苏', description: '经济温和复苏，通胀可控，企业盈利改善', color: 'success' };
    }
    
    // 过热：GDP高位，CPI上行，PMI高位
    if (gdp.current > 6 && cpi.trend === 'up' && pmi.current > 53) {
      return { phase: '过热', description: '经济增长强劲，通胀压力上升，需关注政策收紧', color: 'warning' };
    }
    
    // 滞胀：GDP下行，CPI高位
    if (gdp.trend === 'down' && cpi.current > 3) {
      return { phase: '滞胀', description: '经济增长放缓，通胀居高不下，政策两难', color: 'danger' };
    }
    
    // 衰退：GDP下行，CPI低位，PMI<50
    if (gdp.trend === 'down' && cpi.current < 2 && pmi.current < 50) {
      return { phase: '衰退', description: '经济增长乏力，需求不足，政策有望宽松', color: 'info' };
    }
    
    // 稳健
    return { phase: '稳健', description: '经济平稳运行，各项指标处于合理区间', color: 'gold' };
  }

  // 公开API
  return {
    init,
    getMacroData,
    dailyUpdate,
    monetaryPolicyAction,
    getEconomicCycle
  };
})();


/* ===== js/modules/investmentStrategy.js ===== */
/**
 * 松氏家族办公室 - 投资策略与高级功能模块
 * 包含：定投计划、资产再平衡、止损止盈、基金评级、高管薪酬
 */

const SongInvestmentStrategy = (function() {
  'use strict';

  // 定投计划
  let sipPlans = [];
  // 止损止盈设置
  let stopSettings = {};
  // 基金评级缓存
  let fundRatings = {};

  /**
   * 初始化
   */
  function init() {
    const state = SongState.getState();
    sipPlans = state.sipPlans || [];
    stopSettings = state.stopSettings || {};
    fundRatings = state.fundRatings || {};
    console.log('[SongInvestmentStrategy] 投资策略模块初始化完成');
  }

  /**
   * 保存到状态
   */
  function saveToState() {
    SongState.update('sipPlans', sipPlans);
    SongState.update('stopSettings', stopSettings);
    SongState.update('fundRatings', fundRatings);
  }

  // ═══════════════════════════════════════════════
  // 定投计划
  // ═══════════════════════════════════════════════

  /**
   * 创建定投计划
   */
  function createSIPPlan(plan) {
    const newPlan = {
      id: 'sip_' + Date.now(),
      name: plan.name || '定投计划',
      type: plan.type || 'stock', // stock/fund
      targetId: plan.targetId,
      targetName: plan.targetName,
      amount: plan.amount, // 每期金额
      frequency: plan.frequency || 'monthly', // weekly/monthly
      dayOfPeriod: plan.dayOfPeriod || 1, // 每周几或每月几号
      startDate: plan.startDate || new Date().toISOString().split('T')[0],
      status: 'active', // active/paused/completed
      totalInvested: 0,
      totalShares: 0,
      history: []
    };
    sipPlans.push(newPlan);
    saveToState();
    return newPlan;
  }

  /**
   * 获取定投计划列表
   */
  function getSIPPlans() {
    return sipPlans;
  }

  /**
   * 暂停/恢复定投计划
   */
  function toggleSIPPlan(planId) {
    const plan = sipPlans.find(p => p.id === planId);
    if (plan) {
      plan.status = plan.status === 'active' ? 'paused' : 'active';
      saveToState();
    }
    return plan;
  }

  /**
   * 终止定投计划
   */
  function terminateSIPPlan(planId) {
    const index = sipPlans.findIndex(p => p.id === planId);
    if (index > -1) {
      sipPlans.splice(index, 1);
      saveToState();
    }
  }

  /**
   * 每日执行定投检查
   */
  function dailySIPCheck(gameDate) {
    const dayOfMonth = parseInt(gameDate.split('-')[2]);
    const dayOfWeek = new Date(gameDate).getDay();
    
    sipPlans.forEach(plan => {
      if (plan.status !== 'active') return;
      
      let shouldExecute = false;
      if (plan.frequency === 'monthly' && dayOfMonth === plan.dayOfPeriod) {
        shouldExecute = true;
      } else if (plan.frequency === 'weekly' && dayOfWeek === plan.dayOfPeriod) {
        shouldExecute = true;
      }
      
      if (shouldExecute) {
        executeSIP(plan, gameDate);
      }
    });
  }

  /**
   * 执行定投
   */
  function executeSIP(plan, gameDate) {
    const state = SongState.getState();
    
    if (plan.type === 'stock') {
      const stock = (state.stockMarket?.stocks || []).find(s => s.id === plan.targetId);
      if (!stock) return;
      
      const shares = Math.floor(plan.amount / stock.price / 100) * 100; // 整手买入
      if (shares <= 0) return;
      
      const cost = shares * stock.price;
      
      // 更新持仓
      const portfolio = state.portfolio || [];
      const existing = portfolio.find(p => p.stockId === plan.targetId);
      if (existing) {
        const totalCost = existing.avgCost * existing.shares + cost;
        existing.shares += shares;
        existing.avgCost = totalCost / existing.shares;
      } else {
        portfolio.push({
          stockId: plan.targetId,
          stockName: plan.targetName,
          shares: shares,
          avgCost: stock.price
        });
      }
      SongState.update('portfolio', portfolio);
      
      plan.totalInvested += cost;
      plan.totalShares += shares;
      plan.history.push({ date: gameDate, shares, price: stock.price, amount: cost });
    }
    
    saveToState();
    console.log('[SIP] 定投执行:', plan.name, plan.amount);
  }

  // ═══════════════════════════════════════════════
  // 止损止盈
  // ═══════════════════════════════════════════════

  /**
   * 设置止损止盈
   */
  function setStopLossTakeProfit(stockId, settings) {
    stopSettings[stockId] = {
      stopLossPercent: settings.stopLossPercent || -10, // 止损百分比
      takeProfitPercent: settings.takeProfitPercent || 20, // 止盈百分比
      enabled: settings.enabled !== false,
      lastCheck: null
    };
    saveToState();
  }

  /**
   * 获取止损止盈设置
   */
  function getStopSettings(stockId) {
    return stopSettings[stockId] || null;
  }

  /**
   * 每日检查止损止盈
   */
  function dailyStopCheck(gameDate) {
    const state = SongState.getState();
    const portfolio = state.portfolio || [];
    const stocks = state.stockMarket?.stocks || [];
    
    portfolio.forEach(position => {
      const setting = stopSettings[position.stockId];
      if (!setting || !setting.enabled) return;
      
      const stock = stocks.find(s => s.id === position.stockId);
      if (!stock) return;
      
      const profitPercent = ((stock.price - position.avgCost) / position.avgCost) * 100;
      
      // 触发止损
      if (profitPercent <= setting.stopLossPercent) {
        executeStopAction(position, stock, 'stop_loss', gameDate);
      }
      // 触发止盈
      else if (profitPercent >= setting.takeProfitPercent) {
        executeStopAction(position, stock, 'take_profit', gameDate);
      }
    });
  }

  /**
   * 执行止损止盈操作
   */
  function executeStopAction(position, stock, type, gameDate) {
    const state = SongState.getState();
    const portfolio = state.portfolio || [];
    
    // 记录交易
    const tradeRecords = state.stockMarket?.tradeRecords || [];
    tradeRecords.unshift({
      id: 'trade_' + Date.now(),
      stockId: position.stockId,
      stockName: position.stockName,
      type: 'sell',
      shares: position.shares,
      price: stock.price,
      amount: position.shares * stock.price,
      date: gameDate,
      reason: type === 'stop_loss' ? '自动止损' : '自动止盈'
    });
    
    // 移除持仓
    const index = portfolio.findIndex(p => p.stockId === position.stockId);
    if (index > -1) {
      portfolio.splice(index, 1);
    }
    
    SongState.update('portfolio', portfolio);
    SongState.update('stockMarket.tradeRecords', tradeRecords);
    
    // 禁用该股票的止损止盈
    if (stopSettings[position.stockId]) {
      stopSettings[position.stockId].enabled = false;
    }
    saveToState();
    
    console.log('[Stop]', type === 'stop_loss' ? '止损' : '止盈', '触发:', position.stockName);
  }

  // ═══════════════════════════════════════════════
  // 资产再平衡
  // ═══════════════════════════════════════════════

  /**
   * 计算资产配置偏离度
   */
  function calculateAllocationDrift() {
    const state = SongState.getState();
    const portfolio = state.portfolio || [];
    const fundPortfolio = state.fundPortfolio || [];
    const stocks = state.stockMarket?.stocks || [];
    const funds = state.funds || [];
    
    const stockValue = portfolio.reduce((sum, p) => {
      const stock = stocks.find(s => s.id === p.stockId);
      return sum + (stock ? stock.price * p.shares : 0);
    }, 0);
    
    const fundValue = fundPortfolio.reduce((sum, p) => {
      const fund = funds.find(f => f.id === p.fundId);
      return sum + (fund ? (p.fundType === '货币型' ? p.shares : fund.nav * p.shares) : 0);
    }, 0);
    
    const totalValue = stockValue + fundValue;
    const targetStockRatio = 0.6; // 目标股票占比60%
    const currentStockRatio = totalValue > 0 ? (stockValue / totalValue) * 100 : 0;
    const drift = currentStockRatio - targetStockRatio * 100;
    
    return {
      stockValue,
      fundValue,
      totalValue,
      currentStockRatio,
      targetStockRatio: targetStockRatio * 100,
      drift,
      needRebalance: Math.abs(drift) > 10 // 偏离超过10%需要再平衡
    };
  }

  // ═══════════════════════════════════════════════
  // 基金评级
  // ═══════════════════════════════════════════════

  /**
   * 计算基金评级
   */
  function calculateFundRating(fund) {
    if (fundRatings[fund.id]) return fundRatings[fund.id];
    
    // 基于历史收益、波动率、最大回撤计算星级（1-5星）
    const return1y = fund.return1y || 0;
    const return3y = fund.return3y || 0;
    const volatility = fund.volatility || 15;
    const maxDrawdown = fund.maxDrawdown || 20;
    
    let score = 0;
    // 收益评分（40%）
    score += Math.min(40, Math.max(0, (return1y + 5) * 2));
    // 波动率评分（30%）
    score += Math.min(30, Math.max(0, (30 - volatility) * 1.5));
    // 回撤评分（30%）
    score += Math.min(30, Math.max(0, (30 - maxDrawdown) * 1.5));
    
    const stars = score >= 80 ? 5 : score >= 65 ? 4 : score >= 50 ? 3 : score >= 35 ? 2 : 1;
    
    const rating = {
      stars,
      score: Math.round(score),
      riskLevel: volatility < 10 ? '低风险' : volatility < 20 ? '中风险' : '高风险',
      managerAbility: stars >= 4 ? '优秀' : stars >= 3 ? '良好' : '一般',
      recommendation: stars >= 4 ? '推荐' : stars >= 3 ? '谨慎推荐' : '不推荐'
    };
    
    fundRatings[fund.id] = rating;
    return rating;
  }

  // ═══════════════════════════════════════════════
  // 高管薪酬
  // ═══════════════════════════════════════════════

  /**
   * 计算子公司高管薪酬
   */
  function calculateExecutiveCompensation(subsidiary) {
    const baseSalary = subsidiary.revenue * 0.001; // 基本工资为营收的0.1%
    const performanceBonus = subsidiary.profit > 0 ? subsidiary.profit * 0.02 : 0; // 绩效奖金为利润的2%
    const equityIncentive = subsidiary.growthRate > 10 ? subsidiary.revenue * 0.0005 : 0; // 股权激励
    
    return {
      baseSalary: Math.round(baseSalary),
      performanceBonus: Math.round(performanceBonus),
      equityIncentive: Math.round(equityIncentive),
      totalCompensation: Math.round(baseSalary + performanceBonus + equityIncentive),
      compensationRatio: subsidiary.revenue > 0 ? ((baseSalary + performanceBonus + equityIncentive) / subsidiary.revenue * 100).toFixed(2) : '0'
    };
  }

  // 公开API
  return {
    init,
    // 定投
    createSIPPlan,
    getSIPPlans,
    toggleSIPPlan,
    terminateSIPPlan,
    dailySIPCheck,
    // 止损止盈
    setStopLossTakeProfit,
    getStopSettings,
    dailyStopCheck,
    // 资产再平衡
    calculateAllocationDrift,
    // 基金评级
    calculateFundRating,
    // 高管薪酬
    calculateExecutiveCompensation
  };
})();

  function getExpForLevel(level) {
    return Math.floor(100 * Math.pow(1.5, level - 1));
  }

  function calculateLevel(exp) {
    let level = 1;
    let accumulated = 0;
    while (accumulated + getExpForLevel(level) <= exp) {
      accumulated += getExpForLevel(level);
      level++;
    }
    return {
      level,
      currentExp: exp - accumulated,
      expToNext: getExpForLevel(level),
      progress: (exp - accumulated) / getExpForLevel(level)
    };
  }

  function getSkillEffects(unlockedSkills) {
    const effects = {};
    for (const skillId of unlockedSkills) {
      const skill = SKILLS.find(s => s.id === skillId);
      if (skill && skill.effect) {
        for (const [key, value] of Object.entries(skill.effect)) {
          effects[key] = (effects[key] || 0) + value;
        }
      }
    }
    return effects;
  }

  function getAvailableSkills(level, unlockedSkills) {
    return SKILLS.filter(s =>
      s.unlockLevel <= level && !unlockedSkills.includes(s.id)
    );
  }

  const TRUST_THRESHOLDS = {

    fullAuthority: 95,     // 完全自主权

  function checkDecisionAuthority(familyTrust, decisionType) {
    const threshold = TRUST_THRESHOLDS[decisionType] || 50;
    if (familyTrust >= threshold) {
      return { allowed: true, needApproval: false, message: '信任度充足，可自主决策' };
    } else if (familyTrust >= threshold - 20) {
      return { allowed: true, needApproval: true, message: '信任度不足，需要家族会议审批' };
    } else {
      return { allowed: false, needApproval: true, message: '信任度过低，家族会议可能否决该决策' };
    }

  function checkLongTermGoals(state) {
    const completed = state.heir?.completedGoals || [];
    const completedIds = new Set(completed);
    const newCompleted = [];
    const rewards = { abilities: {}, skillPoints: 0 };

    for (const goal of LONG_TERM_GOALS) {
      if (!completedIds.has(goal.id)) {
        const current = goal.current(state);
        const target = goal.target();
        if (current >= target) {
          newCompleted.push({
            ...goal,
            completedDate: state.gameDate?.current || new Date().toISOString().split('T')[0]
          });
          if (goal.reward) {
            if (goal.reward.skillPoints) rewards.skillPoints += goal.reward.skillPoints;
            for (const [key, value] of Object.entries(goal.reward)) {
              if (key !== 'skillPoints' && key !== 'allAbilities') {
                rewards.abilities[key] = (rewards.abilities[key] || 0) + value;
              }
            }
            if (goal.reward.allAbilities) {
              const abilityKeys = ['business', 'decision', 'influence', 'reputation', 'familyTrust', 'employeeTrust', 'riskJudgment'];
              for (const key of abilityKeys) {
                rewards.abilities[key] = (rewards.abilities[key] || 0) + goal.reward.allAbilities;
              }
            }
          }
        }
      }
    }

    return {
      newCompleted,
      rewards,
      allCompleted: [...completed, ...newCompleted.map(g => ({ id: g.id, completedDate: g.completedDate }))]
    };
  }

  function getGoalProgress(state) {
    return LONG_TERM_GOALS.map(goal => {
      const current = goal.current(state);
      const target = goal.target();
      const completed = (state.heir?.completedGoals || []).some(g => g.id === goal.id);
      return {
        ...goal,
        current,
        target,
        progress: target > 0 ? Math.min(100, (current / target) * 100) : 0,
        completed
      };
    });
  }

  function calculatePortfolioValue(state) {
    const stocks = state.stockMarket?.stocks || [];
    const funds = state.funds || [];
    const stockPortfolio = state.portfolio || [];
    const fundPortfolio = state.fundPortfolio || [];

    const stockValue = stockPortfolio.reduce((sum, p) => {
      const stock = stocks.find(s => s.id === p.stockId);
      return sum + (stock ? stock.price * p.shares : 0);
    }, 0);

    const fundValue = fundPortfolio.reduce((sum, p) => {
      const fund = funds.find(f => f.id === p.fundId);
      return sum + (fund ? (p.fundType === '货币型' ? p.shares : fund.nav * p.shares) : 0);
    }, 0);

    return stockValue + fundValue;
  }

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();
  }

  // ═══════════════════════════════════════════════
  // 里程碑检查
  // ═══════════════════════════════════════════════

  /**
   * 检查并解锁新里程碑
   */
  function checkMilestones(state) {
    const unlocked = state.heir?.milestones || [];
    const unlockedIds = new Set(unlocked.map(m => m.id));
    const newMilestones = [];
    const abilityRewards = {};

    for (const milestone of MILESTONES) {
      if (!unlockedIds.has(milestone.id) && milestone.condition(state)) {
        const unlockedMilestone = {
          ...milestone,
          unlockedDate: state.gameDate?.current || new Date().toISOString().split('T')[0]
        };
        newMilestones.push(unlockedMilestone);

        // 应用能力奖励
        if (milestone.reward) {
          for (const [key, value] of Object.entries(milestone.reward)) {
            abilityRewards[key] = (abilityRewards[key] || 0) + value;
          }
        }
      }
    }

    return {
      newMilestones,
      abilityRewards,
      allMilestones: [...unlocked, ...newMilestones]
    };
  }

  /**
   * 获取所有里程碑（含解锁状态）
   */
  function getAllMilestones(state) {
    const unlocked = state.heir?.milestones || [];
    const unlockedIds = new Set(unlocked.map(m => m.id));

    return MILESTONES.map(m => ({
      ...m,
      unlocked: unlockedIds.has(m.id),
      unlockedDate: unlocked.find(u => u.id === m.id)?.unlockedDate
    }));
  }

  // ═══════════════════════════════════════════════
  // 结局预测
  // ═══════════════════════════════════════════════

  /**
   * 预测当前最可能的结局
   */
  function predictEnding(state) {
    for (const ending of ENDINGS) {
      if (ending.condition(state)) {
        return ending;
      }
    }
    return ENDINGS[ENDINGS.length - 1]; // 默认结局
  }

  /**
   * 获取所有结局（含达成状态）
   */
  function getAllEndings(state) {
    return ENDINGS.map(ending => ({
      ...ending,
      achieved: ending.condition(state)
    }));
  }

  // ═══════════════════════════════════════════════
  // 年度总结
  // ═══════════════════════════════════════════════

  /**
   * 生成年度总结报告
   */
  function generateAnnualReport(state, year) {
    const company = state.company || {};
    const heir = state.heir || {};
    const abilities = heir.abilities || {};
    const decisions = state.events?.history || [];
    const milestones = heir.milestones || [];

    const avgAbility = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;

    // 年度关键事件
    const yearDecisions = decisions.filter(d => {
      const decisionYear = d.processedDate?.split('-')[0] || d.date?.split('-')[0];
      return decisionYear == year;
    });

    // 年度新解锁里程碑
    const yearMilestones = milestones.filter(m => {
      const milestoneYear = m.unlockedDate?.split('-')[0];
      return milestoneYear == year;
    });

    return {
      year,
      totalAssets: company.totalAssets || 0,
      totalRevenue: company.totalRevenue || 0,
      totalProfit: company.totalProfit || 0,
      cashFlow: company.cashFlow || 0,
      avgAbility: parseFloat(avgAbility.toFixed(1)),
      decisionsCount: yearDecisions.length,
      milestonesCount: yearMilestones.length,
      newMilestones: yearMilestones,
      keyDecisions: yearDecisions.slice(0, 5),
      predictedEnding: predictEnding(state),
      summary: generateSummaryText(state, year)
    };
  }

  /**
   * 生成年度总结文字
   */
  function generateSummaryText(state, year) {
    const company = state.company || {};
    const abilities = state.heir?.abilities || {};
    const avgAbility = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;

    let summary = `${year} 年度，松氏集团在松庭的带领下`;

    if ((company.totalProfit || 0) > 0) {
      summary += '取得了稳健的经营成果';
    } else {
      summary += '面临了一定的经营挑战';
    }

    summary += `。集团总资产达到 ${formatMoney(company.totalAssets || 0)}，`;
    summary += `年利润 ${formatMoney(company.totalProfit || 0)}。`;

    if (avgAbility >= 70) {
      summary += '松庭的综合能力得到了显著提升，';
    } else if (avgAbility >= 55) {
      summary += '松庭在经营中不断成长，';
    } else {
      summary += '松庭仍在学习和积累经验，';
    }

    summary += '家族事业正在稳步向前发展。';

    return summary;
  }

  // ═══════════════════════════════════════════════
  // 经营风格分析
  // ═══════════════════════════════════════════════

  /**
   * 分析经营风格
   */
  function analyzeStyle(abilities) {
    const styles = [];

    if (abilities.riskJudgment >= 70 && abilities.business >= 60) {
      styles.push({ name: '稳健经营型', desc: '注重风险控制，稳步发展' });
    }
    if (abilities.business >= 70 && abilities.influence >= 60) {
      styles.push({ name: '激进扩张型', desc: '敢于投资，积极扩张' });
    }
    if (abilities.employeeTrust >= 70 && abilities.familyTrust >= 60) {
      styles.push({ name: '人本管理型', desc: '重视人际关系，团队凝聚力强' });
    }
    if (abilities.decision >= 70 && abilities.riskJudgment >= 60) {
      styles.push({ name: '果断决策型', desc: '决策果断，判断力强' });
    }
    if (abilities.reputation >= 70 && abilities.influence >= 60) {
      styles.push({ name: '市场领袖型', desc: '在市场中具有较强影响力' });
    }

    if (styles.length === 0) {
      styles.push({ name: '均衡发展型', desc: '各方面能力均衡，稳步成长' });
    }

    return styles;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    MILESTONES,
    ENDINGS,
    SKILLS,
    LONG_TERM_GOALS,
    TRUST_THRESHOLDS,
    checkMilestones,
    getAllMilestones,
    predictEnding,
    getAllEndings,
    generateAnnualReport,
    analyzeStyle,
    calculatePortfolioValue,
    formatMoney,
    // 第五阶段新API
    getExpForLevel,
    calculateLevel,
    getSkillEffects,
    getAvailableSkills,
    checkDecisionAuthority,
    checkLongTermGoals,
    getGoalProgress,
    getIconSvg
  };
})();

/**
 * 松氏家族办公室 - AI 模块
 * 负责调用 DeepSeek API 生成财经新闻、分析师评论、高管汇报、年度总结等
 * 兼容 OpenAI API 格式
 */

const SongAI = (function () {
  'use strict';

  // ═══════════════════════════════════════════════
  // 配置
  // ═══════════════════════════════════════════════

  const STORAGE_KEY = 'song_ai_config';
  const DEFAULT_BASE_URL = 'https://api.deepseek.com/v1';
  const DEFAULT_MODEL = 'deepseek-chat';

  // ═══════════════════════════════════════════════
  // 配置管理
  // ═══════════════════════════════════════════════

  function getConfig() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (e) {
      console.warn('[SongAI] 读取配置失败', e);
    }
    return {
      apiKey: '',
      baseUrl: DEFAULT_BASE_URL,
      model: DEFAULT_MODEL,
      enabled: false
    };
  }

  function saveConfig(config) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      return true;
    } catch (e) {
      console.warn('[SongAI] 保存配置失败', e);
      return false;
    }
  }

  function isEnabled() {
    const config = getConfig();
    return config.enabled && config.apiKey && config.apiKey.length > 0;
  }

  // ═══════════════════════════════════════════════
  // API 调用
  // ═══════════════════════════════════════════════

  async function callAI(systemPrompt, userPrompt, options = {}) {
    const config = getConfig();

    if (!isEnabled()) {
      throw new Error('AI 未启用，请先在设置中配置 API Key');
    }

    const messages = [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ];

    const requestBody = {
      model: config.model || DEFAULT_MODEL,
      messages: messages,
      temperature: options.temperature || 0.7,
      max_tokens: options.maxTokens || 1000,
      stream: false
    };

    try {
      const response = await fetch(`${config.baseUrl || DEFAULT_BASE_URL}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`API 调用失败 (${response.status}): ${errorText}`);
      }

      const data = await response.json();
      return data.choices[0].message.content.trim();
    } catch (error) {
      console.error('[SongAI] API 调用错误', error);
      throw error;
    }
  }

  // ═══════════════════════════════════════════════
  // 财经新闻生成
  // ═══════════════════════════════════════════════

  async function generateFinancialNews(state) {
    const stockMarket = state.stockMarket || {};
    const stocks = stockMarket.stocks || [];
    const marketIndex = stockMarket.marketIndex || {};
    const company = state.company || {};

    const stockInfo = stocks.slice(0, 5).map(s =>
      `${s.name}(${s.code}): 现价${s.price.toFixed(2)}, 涨跌幅${(s.changePercent * 100).toFixed(2)}%`
    ).join('\n');

    const systemPrompt = `你是松氏家族办公室的首席财经分析师，负责撰写每日财经新闻简报。
风格：专业、简洁、有洞察力，像香港财经媒体的报道。
只输出新闻内容，不要输出标题或前缀。`;

    const userPrompt = `请根据以下市场数据，撰写一篇 200-300 字的今日财经新闻简报：

市场指数：${marketIndex.name || '松氏综合指数'} 当前 ${marketIndex.value?.toFixed(2) || 'N/A'}，涨跌幅 ${((marketIndex.changePercent || 0) * 100).toFixed(2)}%

重点股票：
${stockInfo}

松氏集团总资产：${formatMoney(company.totalAssets || 0)}
松氏集团今日利润：${formatMoney(company.todayProfit || 0)}

请包含：市场整体走势分析、重点股票点评、对松氏集团的影响展望。`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.8, maxTokens: 800 });
  }

  // ═══════════════════════════════════════════════
  // 投资分析师评论
  // ═══════════════════════════════════════════════

  async function generateInvestmentAdvice(state) {
    const portfolio = state.portfolio || [];
    const fundPortfolio = state.fundPortfolio || [];
    const stocks = state.stockMarket?.stocks || [];
    const funds = state.funds || [];

    }).filter(Boolean).join('\n');

    const fundHoldings = fundPortfolio.map(p => {
      const fund = funds.find(f => f.id === p.fundId);
      return fund ? `${fund.name}: ${p.shares.toFixed(2)}份, 净值${fund.nav.toFixed(4)}` : '';
    }).filter(Boolean).join('\n');

    const systemPrompt = `你是松氏投资部的资深投资分析师，为松家长女松庭提供投资建议。
风格：专业、谨慎、有数据支撑，像私人银行的投资顾问。
只输出建议内容，分点列出，不要输出标题。`;

    const userPrompt = `请根据以下投资组合情况，给出投资分析和建议：

当前现金流：${formatMoney(cashFlow)}

股票持仓：
${stockHoldings || '无'}

请分析：

  // ═══════════════════════════════════════════════

    const userPrompt = `请根据以下数据，撰写一份集团运营汇报摘要（300-500字）：

集团总资产：${formatMoney(company.totalAssets || 0)}

子公司经营情况：

近期重要决策：

请包含：

2. 各子公司表现点评
3. 需要关注的风险点
4. 下一步工作建议`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.6, maxTokens: 1000 });

  // ═══════════════════════════════════════════════
  // 年度总结报告
  // ═══════════════════════════════════════════════

  async function generateAnnualReport(state, year) {

当前能力值：

- 市场声誉：${abilities.reputation}

预测结局：${report.predictedEnding.title}

请包含：

3. 不足与反思
4. 下一年度展望与建议
5. 给松庭的寄语`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.8, maxTokens: 1500 });
  }

  // ═══════════════════════════════════════════════
  // 事件描述润色
  // ═══════════════════════════════════════════════

  async function polishEventDescription(event, state) {

只输出润色后的描述，不要输出其他内容。`;
