/* ===== js/modules/date.js ===== */
/**
 * 松氏家族办公室 - 游戏日期系统
 * 负责游戏内日期的推进、星期计算、日期格式化
 * 设计：每次打开 APP 时检查真实时间，自动推进游戏日期
 *       真实 1 天 = 游戏 1 天（可配置）
 */

const SongDate = (function () {
  'use strict';

  // 星期名称
  const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const WEEKDAYS_SHORT = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  // 月份名称
  const MONTHS = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];

  // 游戏起始日期（松庭正式参与家族事务的日期）
  const DEFAULT_START_DATE = '2026-01-01';

  /**
   * 初始化日期系统
   * 检查上次打开时间，自动推进游戏日期
   */
  async function init() {
    const gameDate = SongState.get('gameDate');
    const now = new Date();
    const nowStr = formatDate(now);

    // 如果是新游戏，设置起始日期
    if (!gameDate.current) {
      const startDate = new Date(DEFAULT_START_DATE);
      await SongState.batchUpdate({
        'gameDate.current': formatDate(startDate),
        'gameDate.dayOfWeek': WEEKDAYS[startDate.getDay()],
        'gameDate.realLastOpenAt': now.toISOString()
      });
      console.log('[SongDate] 新游戏，起始日期:', formatDate(startDate));
      return;
    }

    // 计算距离上次打开的真实天数
    if (gameDate.realLastOpenAt) {
      const lastOpen = new Date(gameDate.realLastOpenAt);
      const daysDiff = Math.floor((now - lastOpen) / (1000 * 60 * 60 * 24));

      if (daysDiff > 0) {
        // 推进游戏日期
        const currentGameDate = new Date(gameDate.current);
        currentGameDate.setDate(currentGameDate.getDate() + daysDiff);

        const newDateStr = formatDate(currentGameDate);
        const newDayOfWeek = WEEKDAYS[currentGameDate.getDay()];

        await SongState.batchUpdate({
          'gameDate.current': newDateStr,
          'gameDate.dayOfWeek': newDayOfWeek,
          'gameDate.realLastOpenAt': now.toISOString()
        });

        // 更新总游戏天数
        const totalPlayDays = (SongState.get('meta.totalPlayDays') || 0) + daysDiff;
        await SongState.update('meta.totalPlayDays', totalPlayDays);

        console.log(`[SongDate] 日期推进 ${daysDiff} 天，当前游戏日期: ${newDateStr}`);

        // 触发日期变更事件（后续阶段用于生成每日事件）
        triggerDateChange(daysDiff);
      } else {
        // 同一天，只更新最后打开时间
        await SongState.update('gameDate.realLastOpenAt', now.toISOString());
      }
    } else {
      // 没有记录，设置当前时间
      await SongState.update('gameDate.realLastOpenAt', now.toISOString());
    }
  }

  /**
   * 手动推进游戏日期（用于测试或特殊事件）
   * @param {number} days - 推进天数
   */
  async function advanceDays(days) {
    if (days <= 0) return;

    const gameDate = SongState.get('gameDate');
    const currentDate = new Date(gameDate.current);
    currentDate.setDate(currentDate.getDate() + days);

    const newDateStr = formatDate(currentDate);
    const newDayOfWeek = WEEKDAYS[currentDate.getDay()];

    await SongState.batchUpdate({
      'gameDate.current': newDateStr,
      'gameDate.dayOfWeek': newDayOfWeek
    });

    const totalPlayDays = (SongState.get('meta.totalPlayDays') || 0) + days;
    await SongState.update('meta.totalPlayDays', totalPlayDays);

    console.log(`[SongDate] 手动推进 ${days} 天，当前游戏日期: ${newDateStr}`);
    triggerDateChange(days);
  }

  /**
   * 触发日期变更事件
   * 后续阶段会在这里生成每日事件、更新公司数据等
   */
  function triggerDateChange(days) {
    // 派发自定义事件，供其他模块监听
    if (typeof window !== 'undefined') {
      window.dispatchEvent(new CustomEvent('song-date-changed', {
        detail: { days, newDate: SongState.get('gameDate.current') }
      }));
    }

    // 重置每日 AI 生成计数
    SongState.update('settings.aiGeneratedToday', 0, false);
  }

  /**
   * 格式化日期为 YYYY-MM-DD
   */
  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  /**
   * 格式化日期为中文显示格式
   * @param {string} dateStr - YYYY-MM-DD
   * @param {boolean} withWeekday - 是否包含星期
   */
  function formatDateChinese(dateStr, withWeekday = true) {
    if (!dateStr) return '--';
    const date = new Date(dateStr);
    const year = date.getFullYear();
    const month = date.getMonth() + 1;
    const day = date.getDate();
    const weekday = WEEKDAYS[date.getDay()];

    if (withWeekday) {
      return `${year}年${month}月${day}日 ${weekday}`;
    }
    return `${year}年${month}月${day}日`;
  }

  /**
   * 格式化日期为简短显示
   */
  function formatDateShort(dateStr) {
    if (!dateStr) return '--';
    const date = new Date(dateStr);
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }

  /**
   * 获取当前游戏日期
   */
  function getCurrentDate() {
    return SongState.get('gameDate.current');
  }

  /**
   * 获取当前星期
   */
  function getCurrentWeekday() {
    return SongState.get('gameDate.dayOfWeek');
  }

  /**
   * 判断是否为工作日
   */
  function isWorkday() {
    const dateStr = getCurrentDate();
    if (!dateStr) return true;
    const day = new Date(dateStr).getDay();
    return day !== 0 && day !== 6;
  }

  /**
   * 计算两个日期之间的天数差
   */
  function daysBetween(dateStr1, dateStr2) {
    const d1 = new Date(dateStr1);
    const d2 = new Date(dateStr2);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  }

  /**
   * 获取月份名称
   */
  function getMonthName(month) {
    return MONTHS[month - 1] || '';
  }

  // 公开 API
  return {
    init,
    advanceDays,
    formatDate,
    formatDateChinese,
    formatDateShort,
    getCurrentDate,
    getCurrentWeekday,
    isWorkday,
    daysBetween,
    getMonthName,
    WEEKDAYS,
    WEEKDAYS_SHORT
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongDate = SongDate;
}

  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function randomFloat(min, max, decimals = 2) {
    return parseFloat((Math.random() * (max - min) + min).toFixed(decimals));
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + '亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + '万';
    return amount.toLocaleString();
  }

  // ═══════════════════════════════════════════════
  // 初始化与每日更新
  // ═══════════════════════════════════════════════

  /**
   * 初始化子公司数据
   */
  function initSubsidiaries() {
    return DEFAULT_SUBSIDIARIES.map(s => ({
      ...s,
      lastUpdated: new Date().toISOString(),
      history: [{
        date: new Date().toISOString().split('T')[0],
        revenue: s.revenue,
        profit: s.profit,
        employees: s.employees,
        satisfaction: s.satisfaction,
        reputation: s.reputation
      }]
    }));
  }

  /**
   * 每日更新子公司经营数据
   * @param {Array} subsidiaries - 当前子公司列表
   * @param {Object} gameState - 当前游戏状态
   * @returns {Array} 更新后的子公司列表
   */
  function updateSubsidiariesDaily(subsidiaries, gameState) {
    const today = gameState.gameDate?.current || new Date().toISOString().split('T')[0];
    const heirAbilities = gameState.heir?.abilities || {};

    return subsidiaries.map(sub => {
      // 慈善基金不参与经营波动
      if (sub.type === '公益') {
        return { ...sub, lastUpdated: new Date().toISOString() };
      }

      // 基础增长率（带随机波动）
      let revenueChange = randomFloat(-3, 5);
      let profitChange = randomFloat(-5, 8);
      let satisfactionChange = randomFloat(-2, 2);
      let reputationChange = randomFloat(-1.5, 1.5);

      // 继承人能力影响
      if (heirAbilities.business) {
        revenueChange += (heirAbilities.business - 50) * 0.05;
        profitChange += (heirAbilities.business - 50) * 0.08;
      }
      if (heirAbilities.employeeTrust) {
        satisfactionChange += (heirAbilities.employeeTrust - 50) * 0.03;
      }
      if (heirAbilities.reputation) {
        reputationChange += (heirAbilities.reputation - 50) * 0.02;
      }

      // 子公司自身属性影响
      if (sub.potential === 'high') {
        revenueChange += 1;
        profitChange += 0.5;
      }
      if (sub.risk === 'high') {
        revenueChange += randomFloat(-5, 5);
        profitChange += randomFloat(-8, 8);
      }

      // 计算新值
      const newRevenue = Math.max(0, sub.revenue * (1 + revenueChange / 100));
      const newProfit = newRevenue * (sub.profitMargin / 100) * (1 + profitChange / 100);
      const newProfitMargin = newRevenue > 0 ? (newProfit / newRevenue) * 100 : 0;
      const newSatisfaction = clamp(sub.satisfaction + satisfactionChange, 0, 100);
      const newReputation = clamp(sub.reputation + reputationChange, 0, 100);

      // 员工数量小幅波动
      let employeeChange = 0;
      if (revenueChange > 2) employeeChange = randomInt(1, 10);
      else if (revenueChange < -2) employeeChange = -randomInt(1, 8);

      const newEmployees = Math.max(0, sub.employees + employeeChange);

      // 更新历史记录（保留最近30条）
      const newHistory = [
        {
          date: today,
          revenue: Math.round(newRevenue),
          profit: Math.round(newProfit),
          employees: newEmployees,
          satisfaction: Math.round(newSatisfaction),
          reputation: Math.round(newReputation)
        },
        ...(sub.history || [])
      ].slice(0, 30);

      return {
        ...sub,
        revenue: Math.round(newRevenue),
        profit: Math.round(newProfit),
        profitMargin: parseFloat(newProfitMargin.toFixed(1)),
        employees: newEmployees,
        satisfaction: Math.round(newSatisfaction),
        reputation: Math.round(newReputation),
        growthRate: parseFloat(revenueChange.toFixed(1)),
        lastUpdated: new Date().toISOString(),
        history: newHistory
      };
    });
  }

  /**
   * 计算集团整体财务数据
   * @param {Array} subsidiaries - 子公司列表
   * @param {Object} previousState - 之前的公司状态
   * @returns {Object} 集团财务数据
   */
  function calculateGroupFinancials(subsidiaries, previousState = {}) {
    const totalRevenue = subsidiaries.reduce((sum, s) => sum + (s.revenue || 0), 0);
    const totalProfit = subsidiaries.reduce((sum, s) => sum + (s.profit || 0), 0);
    const totalEmployees = subsidiaries.reduce((sum, s) => sum + (s.employees || 0), 0);
    const avgSatisfaction = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.satisfaction || 0), 0) / subsidiaries.length)
      : 0;
    const avgReputation = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.reputation || 0), 0) / subsidiaries.length)
      : 0;

    // 总资产 = 之前总资产 + 利润（简化计算）
    const previousTotalAssets = previousState.totalAssets || 5000000000;
    const previousCashFlow = previousState.cashFlow || 800000000;

    // 每日净收益 = 总利润 / 365（简化）
    const dailyNet = Math.round(totalProfit / 365);
    const dailyRevenue = Math.round(totalRevenue / 365);
    const dailyExpense = dailyRevenue - dailyNet;

    const newCashFlow = Math.max(0, previousCashFlow + dailyNet);
    const newTotalAssets = previousTotalAssets + dailyNet;

    return {
      totalAssets: Math.round(newTotalAssets),
      cashFlow: Math.round(newCashFlow),
      totalRevenue: Math.round(totalRevenue),
      totalProfit: Math.round(totalProfit),
      totalEmployees,
      avgSatisfaction,
      avgReputation,
      dailyRevenue,
      dailyExpense,
      dailyNet,
      profitMargin: totalRevenue > 0 ? parseFloat(((totalProfit / totalRevenue) * 100).toFixed(1)) : 0,
      marketIndex: calculateMarketIndex(subsidiaries, previousState)
    };
  }

  /**
   * 计算松氏市场指数
   */
  function calculateMarketIndex(subsidiaries, previousState) {
    const baseIndex = 1000;
    const previousIndex = previousState.marketIndex || baseIndex;

    // 基于子公司整体表现计算指数变化
    const avgGrowth = subsidiaries.length > 0
      ? subsidiaries.reduce((sum, s) => sum + (s.growthRate || 0), 0) / subsidiaries.length
      : 0;

    // 加入随机波动
    const randomFactor = randomFloat(-0.5, 0.5);
    const change = avgGrowth * 0.3 + randomFactor;

    return parseFloat((previousIndex + change).toFixed(2));
  }

  /**
   * 执行每日财务结算
   * @param {Object} gameState - 当前游戏状态
   * @returns {Object} 更新后的状态
   */
  function dailySettlement(gameState) {
    let subsidiaries = gameState.subsidiaries || [];

    // 如果没有子公司数据，初始化
    if (subsidiaries.length === 0) {
      subsidiaries = initSubsidiaries();
    } else {
      // 每日更新子公司数据
      subsidiaries = updateSubsidiariesDaily(subsidiaries, gameState);
    }

    // 计算集团财务
    const groupFinancials = calculateGroupFinancials(subsidiaries, gameState.company || {});

    return {
      subsidiaries,
      company: {
        ...gameState.company,
        ...groupFinancials
      }
    };
  }

  /**
   * 获取子公司详情
   */
  function getSubsidiaryDetail(subsidiaries, id) {
    return subsidiaries.find(s => s.id === id);
  }

  /**
   * 获取子公司趋势数据
   */
  function getSubsidiaryTrend(subsidiary, days = 7) {
    const history = subsidiary.history || [];
    return history.slice(0, days).reverse();
  }

  /**
   * 格式化财务数据用于展示
   */
  function formatFinancialData(data) {
    return {
      totalAssets: formatMoney(data.totalAssets),
      cashFlow: formatMoney(data.cashFlow),
      totalRevenue: formatMoney(data.totalRevenue),
      totalProfit: formatMoney(data.totalProfit),
      dailyRevenue: formatMoney(data.dailyRevenue),
      dailyExpense: formatMoney(data.dailyExpense),
      dailyNet: formatMoney(data.dailyNet),
      profitMargin: data.profitMargin + '%',
      marketIndex: data.marketIndex?.toFixed(2)
    };
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    DEFAULT_SUBSIDIARIES,
    initSubsidiaries,
    updateSubsidiariesDaily,
    calculateGroupFinancials,
    dailySettlement,
    getSubsidiaryDetail,
    getSubsidiaryTrend,
    formatFinancialData,
    formatMoney,
    clamp
  };
})();

  function randomChoice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function randomFloat(min, max, decimals = 2) {
    return parseFloat((Math.random() * (max - min) + min).toFixed(decimals));
  }

  function formatMoney(amount) {
    if (amount >= 100000000) return (amount / 100000000).toFixed(2) + '亿';
    if (amount >= 10000) return (amount / 10000).toFixed(2) + '万';
    return amount.toLocaleString();
  }

  function generateId() {
    return 'event_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  // 事件生成器
  // ═══════════════════════════════════════════════

  /**
   * 生成每日事件
   * @param {Object} gameState - 当前游戏状态
   * @param {number} count - 生成事件数量
   * @returns {Array} 事件列表
   */
  function generateDailyEvents(gameState, count = 3) {
    const events = [];
    const usedTypes = new Set();

    for (let i = 0; i < count; i++) {
      // 根据游戏状态调整事件权重
      const template = selectTemplate(gameState, usedTypes);
      if (!template) continue;

      usedTypes.add(template.type);
      const event = instantiateEvent(template, gameState);
      events.push(event);
    }

    // 按优先级排序：high > medium > low
    const priorityOrder = { high: 0, medium: 1, low: 2 };
    events.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);

    return events;
  }

  /**
   * 根据游戏状态选择事件模板
   */
  function selectTemplate(gameState, usedTypes) {
    // 过滤掉已使用的类型
    let candidates = EVENT_TEMPLATES.filter(t => !usedTypes.has(t.type));

    if (candidates.length === 0) {
      candidates = EVENT_TEMPLATES; // 允许重复类型
    }

    // 根据游戏状态调整权重
    const weighted = candidates.map(template => {
      let weight = 1;

      // 现金流低时，增加财务相关事件
      if (gameState.company && gameState.company.cashFlow < 500000000) {
        if (template.category === EVENT_CATEGORIES.FINANCE || template.type === EVENT_TYPES.CASHFLOW_SHORTAGE) {
          weight *= 2;
        }
      }

      // 高风险时增加风险事件
      if (gameState.heir && gameState.heir.abilities && gameState.heir.abilities.riskJudgment < 40) {
        if (template.category === EVENT_CATEGORIES.RISK) {
          weight *= 1.5;
        }
      }

      // 重大事件概率较低
      if (template.category === EVENT_CATEGORIES.MAJOR) {
        weight *= 0.3;
      }

      return { template, weight };
    });

    // 加权随机选择
    const totalWeight = weighted.reduce((sum, w) => sum + w.weight, 0);
    let random = Math.random() * totalWeight;

    for (const w of weighted) {
      random -= w.weight;
      if (random <= 0) return w.template;
    }

    return weighted[0]?.template;
  }

  /**
   * 实例化事件（填充模板变量）
   */
  function instantiateEvent(template, gameState) {
    const now = new Date();
    const gameDate = gameState.gameDate?.current || formatDate(now);

    // 生成随机数据
    const department = template.departments ? randomChoice(template.departments) : '';
    const amount = formatMoney(randomInt(500000, 50000000));
    const growth = randomInt(5, 30);
    const project = template.projects ? randomChoice(template.projects) : (template.type === EVENT_TYPES.NEW_PROJECT ? randomChoice(['AI医疗平台', '碳中和技术', '元宇宙社交', '生物科技', '新能源材料']) : '');
    const founder = template.founders ? randomChoice(template.founders) : '';
    const stage = template.stages ? randomChoice(template.stages) : '';
    const subsidiary = gameState.subsidiaries?.length > 0 ? randomChoice(gameState.subsidiaries).name : randomChoice(['松氏金融投资', '松氏科技产业', '松氏地产酒店', '松氏艺术奢侈品']);
    const position = template.positions ? randomChoice(template.positions) : '';
    const name = generateChineseName();
    const years = randomInt(3, 15);
    const industry = randomChoice(['科技', '地产', '金融', '消费', '医疗', '新能源']);
    const target = randomChoice(['某科技独角兽', '某连锁酒店集团', '某奢侈品品牌', '某生物科技公司', '某新能源企业']);

    // 填充标题
    let title = template.titleTemplate
      .replace('{department}', department)
      .replace('{project}', project)
      .replace('{subsidiary}', subsidiary)
      .replace('{name}', name)
      .replace('{industry}', industry)
      .replace('{target}', target)
      .replace('{title}', generateNewsTitle());

    // 填充描述
    let description = template.descriptionTemplate
      .replace(/{department}/g, department)
      .replace(/{amount}/g, amount)
      .replace(/{growth}/g, growth)
      .replace(/{project}/g, project)
      .replace(/{returnRate}/g, randomFloat(8, 25))
      .replace(/{riskLevel}/g, randomChoice(['低', '中', '高']))
      .replace(/{count}/g, randomInt(10, 200))
      .replace(/{performance}/g, randomChoice(['超出预期', '符合预期', '低于预期']))
      .replace(/{purpose}/g, template.purposes ? randomChoice(template.purposes) : '')
      .replace(/{deviation}/g, randomInt(20, 80))
      .replace(/{expense}/g, formatMoney(randomInt(10000000, 100000000)))
      .replace(/{income}/g, formatMoney(randomInt(5000000, 50000000)))
      .replace(/{direction}/g, randomChoice(['大幅上涨', '稳步增长', '不及预期', '出现下滑']))
      .replace(/{revenue}/g, formatMoney(randomInt(50000000, 500000000)))
      .replace(/{profit}/g, formatMoney(randomInt(5000000, 100000000)))
      .replace(/{reason}/g, randomChoice(['市场需求旺盛', '成本控制得当', '行业竞争加剧', '新项目尚未盈利']))
      .replace(/{founder}/g, founder)
      .replace(/{equity}/g, randomInt(10, 30))
      .replace(/{stage}/g, stage)
      .replace(/{forecast}/g, randomChoice(['3年内盈亏平衡', '5年内IPO', '快速占领市场', '需要持续投入']))
      .replace(/{position}/g, position)
      .replace(/{name}/g, name)
      .replace(/{reason}/g, template.reasons ? randomChoice(template.reasons) : '')
      .replace(/{years}/g, years)
      .replace(/{spread}/g, randomChoice(['较快', '一般', '正在发酵', '已登上热搜']))
      .replace(/{impact}/g, randomChoice(['集团声誉', '子公司估值', '投资者信心', '合作伙伴关系']))
      .replace(/{valuation}/g, formatMoney(randomInt(500000000, 5000000000)))
      .replace(/{status}/g, randomChoice(['寻求买家', '财务困难', '创始人退休', '股东内讧']))
      .replace(/{synergy}/g, randomChoice(['与现有业务形成协同', '进入新市场领域', '获得关键技术', '整合行业资源']))
      .replace(/{cause}/g, randomChoice(['政策突变', '需求骤降', '技术颠覆', '资金链断裂']))
      .replace(/{exposure}/g, formatMoney(randomInt(100000000, 1000000000)))
      .replace(/{impact}/g, randomChoice(['中等', '较大', '重大', '可能波及全集团']));

    return {
      id: generateId(),
      type: template.type,
      category: template.category,
      priority: template.priority,
      title,
      description,
      department,
      date: gameDate,
      createdAt: now.toISOString(),
      status: 'pending',
      options: template.options.map(opt => ({ ...opt })),
      selectedOption: null,
      processedDate: null,
      effects: null
    };
  }

  /**
   * 生成中文名字
   */
  function generateChineseName() {
    const surnames = ['陈', '林', '黄', '张', '李', '王', '刘', '吴', '周', '郑', '何', '罗', '梁', '宋', '唐'];
    const givenNames = ['志明', '丽华', '建国', '淑芬', '伟强', '美玲', '俊杰', '雅婷', '文豪', '思琪', '明辉', '婉君', '志强', '慧敏', '家豪'];
    return randomChoice(surnames) + randomChoice(givenNames);
  }

  /**
   * 生成新闻标题
   */
  function generateNewsTitle() {
    const titles = [
      '传松氏集团内部出现人事变动',
      '松氏投资项目被曝存在合规问题',
      '松氏旗下子公司业绩引发市场质疑',
      '松氏家族继承人能力受到外界关注',
      '松氏集团被指在某项目中存在利益输送'
    ];
    return randomChoice(titles);
  }

  /**
   * 格式化日期
   */
  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // ═══════════════════════════════════════════════
  // 事件处理
  // ═══════════════════════════════════════════════

  /**
   * 处理事件（用户做出决策）
   * @param {string} eventId - 事件ID
   * @param {number} optionIndex - 选择的方案索引
   * @param {Object} gameState - 当前游戏状态
   * @returns {Object} 处理结果
   */
  function processEvent(eventId, optionIndex, gameState) {
    const events = gameState.events?.pending || [];
    const eventIndex = events.findIndex(e => e.id === eventId);

    if (eventIndex === -1) {
      return { success: false, error: '事件不存在' };
    }

    const event = events[eventIndex];
    const option = event.options[optionIndex];

    if (!option) {
      return { success: false, error: '无效的选项' };
    }

    // 更新事件状态
    event.status = 'processed';
    event.selectedOption = optionIndex;
    event.processedDate = gameState.gameDate?.current || formatDate(new Date());
    event.effects = option.effects;

    // 从待办移到历史
    const newPending = events.filter(e => e.id !== eventId);
    const newHistory = [event, ...(gameState.events?.history || [])];

    // 应用即时影响
    const stateChanges = applyImmediateEffects(option.effects, gameState);

    return {
      success: true,
      event,
      option,
      stateChanges,
      newPending,
      newHistory
    };
  }

  /**
   * 应用即时影响
   */
  function applyImmediateEffects(effects, gameState) {
    const changes = {};

    if (!effects) return changes;

    // 现金流影响
    if (effects.cashFlow) {
      const currentCash = gameState.company?.cashFlow || 0;
      const change = effects.cashFlow * 10000000; // 每单位=1000万
      changes['company.cashFlow'] = Math.max(0, currentCash + change);
      changes['company.dailyNet'] = (gameState.company?.dailyNet || 0) + change;
    }

    // 能力影响
    if (effects.business) {
      const current = gameState.heir?.abilities?.business || 50;
      changes['heir.abilities.business'] = Math.min(100, Math.max(0, current + effects.business));
    }
    if (effects.decision) {
      const current = gameState.heir?.abilities?.decision || 50;
      changes['heir.abilities.decision'] = Math.min(100, Math.max(0, current + effects.decision));
    }
    if (effects.influence) {
      const current = gameState.heir?.abilities?.influence || 30;
      changes['heir.abilities.influence'] = Math.min(100, Math.max(0, current + effects.influence));
    }
    if (effects.reputation) {
      const current = gameState.heir?.abilities?.reputation || 40;
      changes['heir.abilities.reputation'] = Math.min(100, Math.max(0, current + effects.reputation));
    }
    if (effects.familyTrust) {
      const current = gameState.heir?.abilities?.familyTrust || 60;
      changes['heir.abilities.familyTrust'] = Math.min(100, Math.max(0, current + effects.familyTrust));
    }
    if (effects.employeeTrust) {
      const current = gameState.heir?.abilities?.employeeTrust || 50;
      changes['heir.abilities.employeeTrust'] = Math.min(100, Math.max(0, current + effects.employeeTrust));
    }
    if (effects.riskJudgment) {
      const current = gameState.heir?.abilities?.riskJudgment || 45;
      changes['heir.abilities.riskJudgment'] = Math.min(100, Math.max(0, current + effects.riskJudgment));
    }

    return changes;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    EVENT_TYPES,
    EVENT_CATEGORIES,
    PRIORITY,
    generateDailyEvents,
    processEvent,
    applyImmediateEffects,
    formatMoney
  };
})();

  function randomFloat(min, max, decimals = 2) {
    return parseFloat((Math.random() * (max - min) + min).toFixed(decimals));
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';

  // ═══════════════════════════════════════════════

  /**
   * 初始化股票市场数据
   */
  function initStockMarket() {
    const stocks = DEFAULT_STOCKS.map(stock => {
      // 生成 30 天历史价格
      const priceHistory = generatePriceHistory(stock.price, 30, stock.beta);

      return {
        ...stock,
        priceHistory,
        change: parseFloat((((stock.price - stock.previousClose) / stock.previousClose) * 100).toFixed(2)),
        lastUpdated: new Date().toISOString()
      };
    });

    // 生成初始新闻
    const news = generateNews(5);

    return {
      stocks,
      news,
      lastUpdate: new Date().toISOString()
    };
  }

  /**
   * 生成历史价格数据
   */
  function generatePriceHistory(currentPrice, days, beta = 1) {
    const history = [];
    let price = currentPrice * randomFloat(0.85, 0.95); // 从较低价格开始

    for (let i = days; i >= 0; i--) {
      const date = new Date();
      date.setDate(date.getDate() - i);

      // 每日波动（beta 越大波动越大）
      const dailyChange = randomFloat(-3 * beta, 3 * beta) / 100;
      price = price * (1 + dailyChange);
      price = clamp(price, 1, 500); // 价格范围限制

      history.push({
        date: formatDate(date),
        open: parseFloat((price * randomFloat(0.98, 1.02)).toFixed(2)),
        high: parseFloat((price * randomFloat(1.0, 1.05)).toFixed(2)),
        low: parseFloat((price * randomFloat(0.95, 1.0)).toFixed(2)),
        close: parseFloat(price.toFixed(2)),
        volume: randomInt(5000000, 50000000)
      });
    }

    // 最后一天的收盘价设为当前价格
    if (history.length > 0) {
      history[history.length - 1].close = currentPrice;
    }

    return history;
  }

  // ═══════════════════════════════════════════════
  // 每日更新
  // ═══════════════════════════════════════════════

  /**
   * 每日更新股票价格和新闻
   */
  function dailyUpdate(stockMarket, gameState) {
    if (!stockMarket || !stockMarket.stocks) {
      return initStockMarket();
    }

    const today = gameState.gameDate?.current || formatDate(new Date());
    const news = stockMarket.news || [];

    // 更新每只股票价格
    const updatedStocks = stockMarket.stocks.map(stock => {
      return updateStockPrice(stock, today, gameState);
    });

    // 生成新新闻（每天 1-3 条）
    const newNewsCount = randomInt(1, 3);
    const newNews = generateNews(newNewsCount);
    const allNews = [...newNews, ...news].slice(0, 20); // 保留最近 20 条

    return {
      stocks: updatedStocks,
      news: allNews,
      lastUpdate: new Date().toISOString()
    };
  }

  /**
   * 更新单只股票价格
   */
  function updateStockPrice(stock, today, gameState) {
    const previousClose = stock.price;

    // 基础波动（基于 beta）
    let changePercent = randomFloat(-2.5 * stock.beta, 2.5 * stock.beta);

    // 行业趋势影响
    const industryTrend = getIndustryTrend(stock.industry, gameState);
    changePercent += industryTrend;

    // 新闻影响（如果有相关新闻）
    const newsImpact = getNewsImpactForStock(stock, gameState.stockMarket?.news || []);
    changePercent += newsImpact;

    // 松氏自身决策影响（如果是松氏系股票）
    if (stock.id.startsWith('song_')) {
      const heirAbilities = gameState.heir?.abilities || {};
      if (heirAbilities.business) {
        changePercent += (heirAbilities.business - 50) * 0.02;
      }
      if (heirAbilities.reputation) {
        changePercent += (heirAbilities.reputation - 50) * 0.015;
      }
    }

    // 限制单日涨跌幅
    changePercent = clamp(changePercent, -10, 10);

    // 计算新价格
    const newPrice = parseFloat((previousClose * (1 + changePercent / 100)).toFixed(2));
    const open = parseFloat((previousClose * randomFloat(0.99, 1.01)).toFixed(2));
    const high = parseFloat((Math.max(newPrice, open) * randomFloat(1.0, 1.03)).toFixed(2));
    const low = parseFloat((Math.min(newPrice, open) * randomFloat(0.97, 1.0)).toFixed(2));
    const volume = randomInt(5000000, 50000000);

    // 更新历史价格
    const newHistoryEntry = {
      date: today,
      open,
      high,
      low,
      close: newPrice,
      volume
    };

    const priceHistory = [...(stock.priceHistory || []), newHistoryEntry].slice(-60); // 保留最近 60 天

    return {
      ...stock,
      price: newPrice,
      previousClose,
      open,
      high,
      low,
      volume,
      change: parseFloat(changePercent.toFixed(2)),
      marketCap: Math.round(newPrice * (stock.marketCap / previousClose)),
      priceHistory,
      lastUpdated: new Date().toISOString()
    };
  }

  /**
   * 获取行业趋势
   */
  function getIndustryTrend(industry, gameState) {
    // 简化：随机行业趋势，后续可以根据游戏状态动态调整
    const trends = {
      '金融': randomFloat(-0.5, 0.8),
      '科技': randomFloat(-1.0, 1.5),
      '地产': randomFloat(-0.8, 0.6),
      '奢侈品': randomFloat(-0.3, 0.7),
      '能源': randomFloat(-1.2, 1.8)
    };
    return trends[industry] || 0;
  }

  /**
   * 获取新闻对股票的影响
   */
  function getNewsImpactForStock(stock, news) {
    let impact = 0;
    const recentNews = news.slice(0, 5); // 只看最近 5 条

    for (const item of recentNews) {
      if (item.industries && item.industries.includes(stock.industry)) {
        if (item.impact === 'positive') {
          impact += randomFloat(0.5, 2.0);
        } else if (item.impact === 'negative') {
          impact -= randomFloat(0.5, 2.0);
        }
      }
    }

    return impact;
  }

  // ═══════════════════════════════════════════════
  // 新闻生成
  // ═══════════════════════════════════════════════

  /**
   * 生成市场新闻
   */
  function generateNews(count = 3) {
    const news = [];
    const usedTitles = new Set();
    const now = new Date();

    for (let i = 0; i < count; i++) {
      let template;
      let attempts = 0;
      do {
        template = NEWS_TEMPLATES[Math.floor(Math.random() * NEWS_TEMPLATES.length)];
        attempts++;
      } while (usedTitles.has(template.title) && attempts < 10);

      usedTitles.add(template.title);

      const time = new Date(now.getTime() - i * randomInt(30, 180) * 60000);
      const timeStr = formatNewsTime(time);

      news.push({
        id: 'news_' + Date.now() + '_' + i,
        title: template.title,
        time: timeStr,
        impact: template.impact,
        industries: template.industries || [],
        timestamp: time.toISOString()
      });
    }

    return news;
  }

  /**
   * 格式化新闻时间
   */
  function formatNewsTime(date) {
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);

    if (minutes <= 0) return '刚刚';
    if (minutes < 60) return `${minutes} 分钟前`;
    if (hours < 24) return `${hours} 小时前`;

    const month = date.getMonth() + 1;
    const day = date.getDate();
    return `${month}月${day}日`;
  }

  // ═══════════════════════════════════════════════
  // 股票详情与走势图
  // ═══════════════════════════════════════════════

  /**
   * 获取股票详情
   */
  function getStockDetail(stocks, id) {
    return stocks.find(s => s.id === id);
  }

  /**
   * 获取股票趋势数据
   */
  function getStockTrend(stock, days = 7) {
    const history = stock.priceHistory || [];
    return history.slice(-days);
  }

  /**
   * 计算技术指标
   */
  function calculateIndicators(stock) {
    const history = stock.priceHistory || [];
    if (history.length < 5) return null;

    const closes = history.map(h => h.close);
    const recent5 = closes.slice(-5);
    const recent20 = closes.slice(-20);

    const ma5 = recent5.reduce((a, b) => a + b, 0) / recent5.length;
    const ma20 = recent20.length >= 20
      ? recent20.reduce((a, b) => a + b, 0) / recent20.length
      : closes.reduce((a, b) => a + b, 0) / closes.length;

    // 波动率（标准差）
    const mean = closes.reduce((a, b) => a + b, 0) / closes.length;
    const variance = closes.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / closes.length;
    const volatility = Math.sqrt(variance);

    // 5日涨跌幅
    const change5d = ((closes[closes.length - 1] - closes[Math.max(0, closes.length - 6)]) / closes[Math.max(0, closes.length - 6)]) * 100;

    return {
      ma5: parseFloat(ma5.toFixed(2)),
      ma20: parseFloat(ma20.toFixed(2)),
      volatility: parseFloat(volatility.toFixed(2)),
      change5d: parseFloat(change5d.toFixed(2)),
      high52week: Math.max(...closes),
      low52week: Math.min(...closes)
    };
  }

  // ═══════════════════════════════════════════════
  // 买卖交易
  // ═══════════════════════════════════════════════

  /**
   * 买入股票
   */
  function buyStock(stock, shares, portfolio, company) {
    const totalCost = stock.price * shares;
    const commission = Math.max(totalCost * 0.001, 5); // 佣金 0.1%，最低 5 元
    const totalAmount = totalCost + commission;

    // 检查现金流
    if ((company.cashFlow || 0) < totalAmount) {
      return { success: false, error: '现金流不足' };
    }

    // 更新投资组合
    const existingPosition = portfolio.find(p => p.stockId === stock.id);
    let updatedPortfolio;

    if (existingPosition) {
      // 加仓：计算平均成本
      const totalShares = existingPosition.shares + shares;
      const totalCostBasis = (existingPosition.avgCost * existingPosition.shares) + (stock.price * shares);
      const newAvgCost = totalCostBasis / totalShares;

      updatedPortfolio = portfolio.map(p =>
        p.stockId === stock.id
          ? { ...p, shares: totalShares, avgCost: parseFloat(newAvgCost.toFixed(2)) }
          : p
      );
    } else {
      // 新建仓位
      updatedPortfolio = [...portfolio, {
        stockId: stock.id,
        stockName: stock.name,
        shares,
        avgCost: stock.price,
        buyDate: new Date().toISOString().split('T')[0]
      }];
    }

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) - totalAmount,
      totalCost,
      commission,
      totalAmount
    };
  }

  /**
   * 卖出股票
   */
  function sellStock(stock, shares, portfolio, company) {
    const position = portfolio.find(p => p.stockId === stock.id);

    if (!position) {
      return { success: false, error: '未持有该股票' };
    }

    if (position.shares < shares) {
      return { success: false, error: `持仓不足，当前持有 ${position.shares} 股` };
    }

    const totalRevenue = stock.price * shares;
    const commission = Math.max(totalRevenue * 0.001, 5); // 佣金 0.1%，最低 5 元
    const stampTax = totalRevenue * 0.001; // 印花税 0.1%（卖出时收取）
    const netRevenue = totalRevenue - commission - stampTax;

    // 计算盈亏
    const costBasis = position.avgCost * shares;
    const profit = totalRevenue - costBasis - commission - stampTax;

    // 更新投资组合
    let updatedPortfolio;
    const remainingShares = position.shares - shares;

    if (remainingShares <= 0) {
      // 清仓
      updatedPortfolio = portfolio.filter(p => p.stockId !== stock.id);
    } else {
      // 减仓
      updatedPortfolio = portfolio.map(p =>
        p.stockId === stock.id
          ? { ...p, shares: remainingShares }
          : p
      );
    }

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) + netRevenue,
      totalRevenue,
      commission,
      stampTax,
      netRevenue,
      profit,
      profitPercent: parseFloat(((profit / costBasis) * 100).toFixed(2))
    };
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    DEFAULT_STOCKS,
    initStockMarket,
    dailyUpdate,
    getStockDetail,
    getStockTrend,
    calculateIndicators,
    buyStock,
    sellStock,
    generateNews,
    formatMoney
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongStockMarket = SongStockMarket;
}

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';

  /**
   * 生成历史净值数据
   */
  function generateNavHistory(currentNav, days, fundType) {
    const history = [];
    let nav = currentNav * randomFloat(0.85, 0.95);

    // 不同类型基金的波动率不同
    const volatility = {
      '股票型': 0.015,
      '混合型': 0.008,
      '债券型': 0.002,
      '货币型': 0.0003,
      '指数型': 0.012
    }[fundType] || 0.01;

    for (let i = days; i >= 0; i--) {
      const date = new Date();
      date.setDate(date.getDate() - i);

      // 每日波动
      const dailyChange = randomFloat(-volatility, volatility);
      nav = nav * (1 + dailyChange);
      nav = clamp(nav, 0.5, 10); // 净值范围限制

      history.push({
        date: formatDate(date),
        nav: parseFloat(nav.toFixed(4)),
        return: parseFloat((dailyChange * 100).toFixed(2))
      });
    }

    // 最后一天设为当前净值
    if (history.length > 0) {
      history[history.length - 1].nav = currentNav;
    }

    return history;
  }

    const return1d = navHistory.length >= 2
      ? ((latest - navHistory[navHistory.length - 2].nav) / navHistory[navHistory.length - 2].nav) * 100

    const return1m = navHistory.length >= 22
      ? ((latest - navHistory[navHistory.length - 22].nav) / navHistory[navHistory.length - 22].nav) * 100
      : return1d * 21;

    // 3个月收益率（约63个交易日）
    const return3m = navHistory.length >= 64
      ? ((latest - navHistory[navHistory.length - 64].nav) / navHistory[navHistory.length - 64].nav) * 100
      : return1m * 3;

    // 1年收益率（约252个交易日，但我们只有90天数据，用3个月*4估算）
    const return1y = return3m * 4;

    return {
      return1d: parseFloat(return1d.toFixed(2)),
      return1m: parseFloat(return1m.toFixed(2)),
      return3m: parseFloat(return3m.toFixed(2)),
      return1y: parseFloat(return1y.toFixed(2))
    };
  }

  // ═══════════════════════════════════════════════
  // 每日更新
  // ═══════════════════════════════════════════════

  /**
   * 每日更新基金净值
   */
  function dailyUpdate(funds, gameState) {
    if (!funds || funds.length === 0) {
      return initFunds();
    }

    const today = gameState.gameDate?.current || formatDate(new Date());

    const updatedFunds = funds.map(fund => {
      return updateFundNav(fund, today, gameState);
    });

    return updatedFunds;
  }

  /**
   * 更新单只基金净值
   */
  function updateFundNav(fund, today, gameState) {
    const previousNav = fund.nav;

    // 不同类型基金的波动率
    const volatility = {
      '股票型': 0.015,
      '混合型': 0.008,
      '债券型': 0.002,
      '货币型': 0.0003,
      '指数型': 0.012
    }[fund.type] || 0.01;

    // 基础波动
    let dailyChange = randomFloat(-volatility, volatility);

    // 股票型和指数型基金受市场指数影响
    if (fund.type === '股票型' || fund.type === '指数型') {
      const marketIndex = gameState.company?.marketIndex || 1000;
      const marketChange = (marketIndex - 1000) / 10000;
      dailyChange += marketChange * 0.5;
    }

    // 松氏系基金受继承人能力影响
    if (fund.id.startsWith('song_')) {
      const heirAbilities = gameState.heir?.abilities || {};
      if (heirAbilities.business) {
        dailyChange += (heirAbilities.business - 50) * 0.0001;
      }
    }

    // 货币型基金收益为正
    if (fund.type === '货币型') {
      dailyChange = Math.abs(dailyChange) * 0.5 + 0.0001;
    }

    // 计算新净值
    const newNav = parseFloat((previousNav * (1 + dailyChange)).toFixed(4));
    const return1d = parseFloat((dailyChange * 100).toFixed(2));

    // 更新历史净值
    const newHistoryEntry = {
      date: today,
      nav: newNav,
      return: return1d
    };

    const navHistory = [...(fund.navHistory || []), newHistoryEntry].slice(-120); // 保留最近 120 天

    // 重新计算收益率
    const returns = calculateReturns(navHistory);

    return {
      ...fund,
      nav: newNav,
      previousNav,
      ...returns,
      navHistory,
      lastUpdated: new Date().toISOString()
    };
  }

  // ═══════════════════════════════════════════════
  // 基金详情与分析
  // ═══════════════════════════════════════════════

  /**
   * 获取基金详情
   */
  function getFundDetail(funds, id) {
    return funds.find(f => f.id === id);
  }

  /**
   * 获取基金趋势数据
   */
  function getFundTrend(fund, days = 30) {
    const history = fund.navHistory || [];
    return history.slice(-days);
  }

  /**
   * 风险等级评估
   */
  function getRiskAssessment(fund) {
    const riskLevels = {
      'low': { label: '低风险', desc: '适合保守型投资者，本金安全度高，收益稳定但较低。' },
      'medium': { label: '中风险', desc: '适合稳健型投资者，有一定波动，长期收益较好。' },
      'high': { label: '高风险', desc: '适合积极型投资者，波动较大，可能获得较高收益也可能亏损。' }
    };
    return riskLevels[fund.risk] || riskLevels['medium'];
  }

  /**
   * 基金经理评价
   */
  function getManagerReview(fund) {
    const reviews = {
      '陈志明': '从业12年，擅长成长股投资，选股能力突出，任期内基金业绩同类排名前15%。',
      '林雅婷': '从业10年，资产配置专家，擅长股债平衡，回撤控制优秀，长期业绩稳定。',
      '黄建国': '从业18年，固收领域资深专家，信用研究能力强，基金连续5年正收益。',
      '吴晓燕': '从业8年，货币市场专家，流动性管理能力强，基金规模行业领先。',
      '郑文博': '从业9年，医药行业研究员出身，对医疗健康产业有深入理解，选股精准。',
      '指数跟踪': '被动指数化投资，紧密跟踪标的指数，跟踪误差小，费率低廉。'
    };
    return reviews[fund.fundManager] || '基金经理经验丰富，业绩稳定。';
  }

  // ═══════════════════════════════════════════════
  // 买卖基金
  // ═══════════════════════════════════════════════

  /**
   * 买入基金
   */
  function buyFund(fund, amount, fundPortfolio, company) {
    // 货币型基金按金额买入，其他按金额买入
    const purchaseFee = fund.type === '货币型' ? 0 : Math.max(amount * 0.0015, 10); // 申购费 0.15%，最低10元
    const netAmount = amount - purchaseFee;
    const shares = fund.type === '货币型' ? netAmount : netAmount / fund.nav;

    // 检查现金流
    if ((company.cashFlow || 0) < amount) {
      return { success: false, error: '现金流不足' };
    }

    // 更新基金持仓
    const existingPosition = fundPortfolio.find(p => p.fundId === fund.id);
    let updatedPortfolio;

    if (existingPosition) {
      // 加仓：计算平均成本
      const totalShares = existingPosition.shares + shares;
      const totalCost = (existingPosition.avgCost * existingPosition.shares) + (fund.nav * shares);
      const newAvgCost = fund.type === '货币型' ? 1 : totalCost / totalShares;

      updatedPortfolio = fundPortfolio.map(p =>
        p.fundId === fund.id
          ? { ...p, shares: totalShares, avgCost: parseFloat(newAvgCost.toFixed(4)) }
          : p
      );
    } else {
      // 新建持仓
      updatedPortfolio = [...fundPortfolio, {
        fundId: fund.id,
        fundName: fund.name,
        fundType: fund.type,
        shares: parseFloat(shares.toFixed(4)),
        avgCost: fund.type === '货币型' ? 1 : fund.nav,
        buyDate: new Date().toISOString().split('T')[0]
      }];
    }

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) - amount,
      shares: parseFloat(shares.toFixed(4)),
      purchaseFee,
      netAmount,
      totalAmount: amount
    };
  }

  /**
   * 卖出基金
   */
  function sellFund(fund, shares, fundPortfolio, company) {
    const position = fundPortfolio.find(p => p.fundId === fund.id);

    if (!position) {
      return { success: false, error: '未持有该基金' };
    }

    if (position.shares < shares) {
      return { success: false, error: `持仓不足，当前持有 ${position.shares.toFixed(2)} 份` };
    }

    // 货币型基金按份额=金额，其他按净值计算
    const sellAmount = fund.type === '货币型' ? shares : shares * fund.nav;
    const redemptionFee = fund.type === '货币型' ? 0 : Math.max(sellAmount * 0.005, 10); // 赎回费 0.5%，最低10元
    const netAmount = sellAmount - redemptionFee;

    // 计算盈亏
    const costBasis = position.avgCost * shares;
    const profit = sellAmount - costBasis - redemptionFee;
    const profitPercent = costBasis > 0 ? (profit / costBasis) * 100 : 0;

    // 更新持仓
    let updatedPortfolio;
    const remainingShares = position.shares - shares;

    if (remainingShares <= 0.01) {
      // 清仓
      updatedPortfolio = fundPortfolio.filter(p => p.fundId !== fund.id);
    } else {
      // 减仓
      updatedPortfolio = fundPortfolio.map(p =>
        p.fundId === fund.id
          ? { ...p, shares: parseFloat(remainingShares.toFixed(4)) }
          : p
      );
    }

    return {
      success: true,
      portfolio: updatedPortfolio,
      cashFlow: (company.cashFlow || 0) + netAmount,
      sellAmount,
      redemptionFee,
      netAmount,
      profit,
      profitPercent: parseFloat(profitPercent.toFixed(2))
    };
  }

  // ═══════════════════════════════════════════════
  // 投资组合分析
  // ═══════════════════════════════════════════════

  /**
   * 计算投资组合总览
   */
  function calculatePortfolioSummary(stockPortfolio, fundPortfolio, stocks, funds) {
    // 股票持仓市值
    const stockValue = stockPortfolio.reduce((sum, p) => {
      const stock = stocks.find(s => s.id === p.stockId);
      return sum + (stock ? stock.price * p.shares : 0);
    }, 0);

    // 基金持仓市值
    const fundValue = fundPortfolio.reduce((sum, p) => {
      const fund = funds.find(f => f.id === p.fundId);
      return sum + (fund ? (p.fundType === '货币型' ? p.shares : fund.nav * p.shares) : 0);
    }, 0);

    const totalValue = stockValue + fundValue;

    // 股票成本
    const stockCost = stockPortfolio.reduce((sum, p) => {
      return sum + (p.avgCost * p.shares);
    }, 0);

    // 基金成本
    const fundCost = fundPortfolio.reduce((sum, p) => {
      return sum + (p.avgCost * p.shares);
    }, 0);

    const totalCost = stockCost + fundCost;
    const totalProfit = totalValue - totalCost;
    const profitPercent = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;

    // 资产配置
    const assetAllocation = {
      stocks: totalValue > 0 ? (stockValue / totalValue) * 100 : 0,
      funds: totalValue > 0 ? (fundValue / totalValue) * 100 : 0
    };

    // 基金类型分布
    const fundTypeDistribution = {};
    fundPortfolio.forEach(p => {
      const fund = funds.find(f => f.id === p.fundId);
      if (fund) {
        const value = p.fundType === '货币型' ? p.shares : fund.nav * p.shares;
        fundTypeDistribution[fund.type] = (fundTypeDistribution[fund.type] || 0) + value;
      }
    });

    return {
      totalValue,
      stockValue,
      fundValue,
      totalCost,
      stockCost,
      fundCost,
      totalProfit,
      profitPercent: parseFloat(profitPercent.toFixed(2)),
      assetAllocation,
      fundTypeDistribution,
      stockCount: stockPortfolio.length,
      fundCount: fundPortfolio.length
    };
  }

  /**
   * 生成投资建议
   */
  function generateAdvice(summary) {
    const advice = [];

    if (summary.totalValue < 10000) {
      advice.push('当前投资规模较小，建议逐步增加投资金额，分散配置。');
    }

    if (summary.assetAllocation.stocks > 80) {
      advice.push('股票仓位过高，建议增加债券型或货币型基金配置，降低组合波动。');
    } else if (summary.assetAllocation.stocks < 20 && summary.totalValue > 10000) {
      advice.push('股票仓位过低，可适当增加优质股票或股票型基金配置，提升长期收益。');
    }

    if (summary.profitPercent > 20) {
      advice.push('投资收益优秀，建议部分止盈，锁定利润，再均衡配置。');
    } else if (summary.profitPercent < -10) {
      advice.push('当前浮亏较大，建议审视持仓基本面，避免盲目割肉，可考虑逢低加仓优质标的。');
    }

    if (summary.fundCount === 0 && summary.stockCount > 5) {
      advice.push('仅持有股票，建议配置部分基金，通过专业管理分散风险。');
    }

    if (advice.length === 0) {
      advice.push('投资组合配置合理，继续保持，定期审视再平衡。');
    }

    return advice;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    DEFAULT_FUNDS,
    initFunds,
    dailyUpdate,
    getFundDetail,
    getFundTrend,
    getRiskAssessment,
    getManagerReview,
    buyFund,
    sellFund,
    calculatePortfolioSummary,
    generateAdvice,
    formatMoney
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongFund = SongFund;
}

      if (!unlockedIds.has(milestone.id) && milestone.condition(state)) {
        const unlockedMilestone = {
          ...milestone,
          unlockedDate: state.gameDate?.current || new Date().toISOString().split('T')[0]
        };
        newMilestones.push(unlockedMilestone);

        // 应用能力奖励
        if (milestone.reward) {
          for (const [key, value] of Object.entries(milestone.reward)) {
            abilityRewards[key] = (abilityRewards[key] || 0) + value;
          }
        }
      }
    }

    return {
      newMilestones,
      abilityRewards,
      allMilestones: [...unlocked, ...newMilestones]
    };
  }

  /**
   * 获取所有里程碑（含解锁状态）
   */
  function getAllMilestones(state) {
    const unlocked = state.heir?.milestones || [];
    const unlockedIds = new Set(unlocked.map(m => m.id));

    return MILESTONES.map(m => ({
      ...m,
      unlocked: unlockedIds.has(m.id),
      unlockedDate: unlocked.find(u => u.id === m.id)?.unlockedDate
    }));
  }

  // ═══════════════════════════════════════════════
  // 结局预测
  // ═══════════════════════════════════════════════

  /**
   * 预测当前最可能的结局
   */
  function predictEnding(state) {
    for (const ending of ENDINGS) {
      if (ending.condition(state)) {
        return ending;
      }
    }
    return ENDINGS[ENDINGS.length - 1]; // 默认结局
  }

  /**
   * 获取所有结局（含达成状态）
   */
  function getAllEndings(state) {
    return ENDINGS.map(ending => ({
      ...ending,
      achieved: ending.condition(state)
    }));
  }

  // ═══════════════════════════════════════════════
  // 年度总结
  // ═══════════════════════════════════════════════

  /**
   * 生成年度总结报告
   */
  function generateAnnualReport(state, year) {
    const company = state.company || {};
    const heir = state.heir || {};
    const abilities = heir.abilities || {};
    const decisions = state.events?.history || [];
    const milestones = heir.milestones || [];

    const avgAbility = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;

    // 年度关键事件
    const yearDecisions = decisions.filter(d => {
      const decisionYear = d.processedDate?.split('-')[0] || d.date?.split('-')[0];
      return decisionYear == year;
    });

    // 年度新解锁里程碑
    const yearMilestones = milestones.filter(m => {
      const milestoneYear = m.unlockedDate?.split('-')[0];
      return milestoneYear == year;
    });

    return {
      year,
      totalAssets: company.totalAssets || 0,
      totalRevenue: company.totalRevenue || 0,
      totalProfit: company.totalProfit || 0,
      cashFlow: company.cashFlow || 0,
      avgAbility: parseFloat(avgAbility.toFixed(1)),
      decisionsCount: yearDecisions.length,
      milestonesCount: yearMilestones.length,
      newMilestones: yearMilestones,
      keyDecisions: yearDecisions.slice(0, 5),
      predictedEnding: predictEnding(state),
      summary: generateSummaryText(state, year)
    };
  }

  /**
   * 生成年度总结文字
   */
  function generateSummaryText(state, year) {
    const company = state.company || {};
    const abilities = state.heir?.abilities || {};
    const avgAbility = Object.values(abilities).reduce((a, b) => a + b, 0) / Object.keys(abilities).length;

    let summary = `${year} 年度，松氏集团在松庭的带领下`;

    if ((company.totalProfit || 0) > 0) {
      summary += '取得了稳健的经营成果';
    } else {
      summary += '面临了一定的经营挑战';
    }

    summary += `。集团总资产达到 ${formatMoney(company.totalAssets || 0)}，`;
    summary += `年利润 ${formatMoney(company.totalProfit || 0)}。`;

    if (avgAbility >= 70) {
      summary += '松庭的综合能力得到了显著提升，';
    } else if (avgAbility >= 55) {
      summary += '松庭在经营中不断成长，';
    } else {
      summary += '松庭仍在学习和积累经验，';
    }

    summary += '家族事业正在稳步向前发展。';

    return summary;
  }

  // ═══════════════════════════════════════════════
  // 经营风格分析
  // ═══════════════════════════════════════════════

  /**
   * 分析经营风格
   */
  function analyzeStyle(abilities) {
    const styles = [];

    if (abilities.riskJudgment >= 70 && abilities.business >= 60) {
      styles.push({ name: '稳健经营型', desc: '注重风险控制，稳步发展' });
    }
    if (abilities.business >= 70 && abilities.influence >= 60) {
      styles.push({ name: '激进扩张型', desc: '敢于投资，积极扩张' });
    }
    if (abilities.employeeTrust >= 70 && abilities.familyTrust >= 60) {
      styles.push({ name: '人本管理型', desc: '重视人际关系，团队凝聚力强' });
    }
    if (abilities.decision >= 70 && abilities.riskJudgment >= 60) {
      styles.push({ name: '果断决策型', desc: '决策果断，判断力强' });
    }
    if (abilities.reputation >= 70 && abilities.influence >= 60) {
      styles.push({ name: '市场领袖型', desc: '在市场中具有较强影响力' });
    }

    if (styles.length === 0) {
      styles.push({ name: '均衡发展型', desc: '各方面能力均衡，稳步成长' });
    }

    return styles;
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    MILESTONES,
    ENDINGS,
    checkMilestones,
    getAllMilestones,
    predictEnding,
    getAllEndings,
    generateAnnualReport,
    analyzeStyle,
    calculatePortfolioValue,
    formatMoney
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongGrowth = SongGrowth;
}

/**
 * 松氏家族办公室 - AI 模块
 * 负责调用 DeepSeek API 生成财经新闻、分析师评论、高管汇报、年度总结等
 * 兼容 OpenAI API 格式
 */

const SongAI = (function () {
  'use strict';

  // ═══════════════════════════════════════════════
  // 配置
  // ═══════════════════════════════════════════════

  const STORAGE_KEY = 'song_ai_config';
  const DEFAULT_BASE_URL = 'https://api.deepseek.com/v1';
  const DEFAULT_MODEL = 'deepseek-chat';

  // ═══════════════════════════════════════════════
  // 配置管理
  // ═══════════════════════════════════════════════

  function getConfig() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (e) {
      console.warn('[SongAI] 读取配置失败', e);
    }
    return {
      apiKey: '',
      baseUrl: DEFAULT_BASE_URL,
      model: DEFAULT_MODEL,
      enabled: false
    };
  }

  function saveConfig(config) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      return true;
    } catch (e) {
      console.warn('[SongAI] 保存配置失败', e);
      return false;
    }
  }

  function isEnabled() {
    const config = getConfig();
    return config.enabled && config.apiKey && config.apiKey.length > 0;
  }

  // ═══════════════════════════════════════════════
  // API 调用
  // ═══════════════════════════════════════════════

  async function callAI(systemPrompt, userPrompt, options = {}) {
    const config = getConfig();

    if (!isEnabled()) {
      throw new Error('AI 未启用，请先在设置中配置 API Key');
    }

    const messages = [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ];

    const requestBody = {
      model: config.model || DEFAULT_MODEL,
      messages: messages,
      temperature: options.temperature || 0.7,
      max_tokens: options.maxTokens || 1000,
      stream: false
    };

    try {
      const response = await fetch(`${config.baseUrl || DEFAULT_BASE_URL}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`API 调用失败 (${response.status}): ${errorText}`);
      }

      const data = await response.json();
      return data.choices[0].message.content.trim();
    } catch (error) {
      console.error('[SongAI] API 调用错误', error);
      throw error;
    }
  }

  // ═══════════════════════════════════════════════
  // 财经新闻生成
  // ═══════════════════════════════════════════════

  async function generateFinancialNews(state) {
    const stockMarket = state.stockMarket || {};
    const stocks = stockMarket.stocks || [];
    const marketIndex = stockMarket.marketIndex || {};
    const company = state.company || {};

    const stockInfo = stocks.slice(0, 5).map(s =>
      `${s.name}(${s.code}): 现价${s.price.toFixed(2)}, 涨跌幅${(s.changePercent * 100).toFixed(2)}%`
    ).join('\n');

    const systemPrompt = `你是松氏家族办公室的首席财经分析师，负责撰写每日财经新闻简报。
风格：专业、简洁、有洞察力，像香港财经媒体的报道。
只输出新闻内容，不要输出标题或前缀。`;

    const userPrompt = `请根据以下市场数据，撰写一篇 200-300 字的今日财经新闻简报：

市场指数：${marketIndex.name || '松氏综合指数'} 当前 ${marketIndex.value?.toFixed(2) || 'N/A'}，涨跌幅 ${((marketIndex.changePercent || 0) * 100).toFixed(2)}%

重点股票：
${stockInfo}

松氏集团总资产：${formatMoney(company.totalAssets || 0)}
松氏集团今日利润：${formatMoney(company.todayProfit || 0)}

请包含：市场整体走势分析、重点股票点评、对松氏集团的影响展望。`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.8, maxTokens: 800 });
  }

  // ═══════════════════════════════════════════════
  // 投资分析师评论
  // ═══════════════════════════════════════════════

  async function generateInvestmentAdvice(state) {
    const portfolio = state.portfolio || [];
    const fundPortfolio = state.fundPortfolio || [];
    const stocks = state.stockMarket?.stocks || [];
    const funds = state.funds || [];
    const cashFlow = state.company?.cashFlow || 0;

    const stockHoldings = portfolio.map(p => {
      const stock = stocks.find(s => s.id === p.stockId);
      return stock ? `${stock.name}(${stock.code}): ${p.shares}股, 成本${p.avgCost.toFixed(2)}, 现价${stock.price.toFixed(2)}` : '';
    }).filter(Boolean).join('\n');

    const fundHoldings = fundPortfolio.map(p => {
      const fund = funds.find(f => f.id === p.fundId);
      return fund ? `${fund.name}: ${p.shares.toFixed(2)}份, 净值${fund.nav.toFixed(4)}` : '';
    }).filter(Boolean).join('\n');

    const systemPrompt = `你是松氏投资部的资深投资分析师，为松家长女松庭提供投资建议。
风格：专业、谨慎、有数据支撑，像私人银行的投资顾问。
只输出建议内容，分点列出，不要输出标题。`;

    const userPrompt = `请根据以下投资组合情况，给出投资分析和建议：

当前现金流：${formatMoney(cashFlow)}

股票持仓：
${stockHoldings || '无'}

基金持仓：
${fundHoldings || '无'}

请分析：
1. 当前持仓的整体风险评估
2. 各持仓的表现点评
3. 资产配置建议（是否需要调仓）
4. 短期和中期的投资策略建议

请用中文回答，分点列出，每点简洁明了。`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.6, maxTokens: 1000 });
  }

  // ═══════════════════════════════════════════════
  // 高管汇报摘要
  // ═══════════════════════════════════════════════

  async function generateExecutiveReport(state) {
    const subsidiaries = state.subsidiaries || [];
    const company = state.company || {};
    const events = state.events?.history || [];

    const subSummary = subsidiaries.slice(0, 5).map(s =>
      `${s.name}: 营收${formatMoney(s.revenue)}, 利润${formatMoney(s.profit)}, 员工满意度${s.employeeSatisfaction}%`
    ).join('\n');

    const recentEvents = events.slice(0, 3).map(e =>
      `- ${e.title}（${e.processedDate || e.date}）`
    ).join('\n');

    const systemPrompt = `你是松氏集团的首席运营官，向松家长女松庭汇报集团运营情况。
风格：正式、简洁、有重点，像家族企业的内部汇报。
只输出汇报内容，分点列出。`;

    const userPrompt = `请根据以下数据，撰写一份集团运营汇报摘要（300-500字）：

集团总资产：${formatMoney(company.totalAssets || 0)}
集团总营收：${formatMoney(company.totalRevenue || 0)}
集团总利润：${formatMoney(company.totalProfit || 0)}
现金流：${formatMoney(company.cashFlow || 0)}

子公司经营情况：
${subSummary}

近期重要决策：
${recentEvents || '无'}

请包含：
1. 整体经营概况
2. 各子公司表现点评
3. 需要关注的风险点
4. 下一步工作建议`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.6, maxTokens: 1000 });
  }

  // ═══════════════════════════════════════════════
  // 年度总结报告
  // ═══════════════════════════════════════════════

  async function generateAnnualReport(state, year) {
    const report = SongGrowth.generateAnnualReport(state, year);
    const heir = state.heir || {};
    const abilities = heir.abilities || {};

    const systemPrompt = `你是松氏家族办公室的秘书长，为松家长女松庭撰写年度总结报告。
风格：正式、有温度、有回顾和展望，像家族企业的年度家书。
只输出报告正文。`;

    const userPrompt = `请根据以下数据，撰写一份 ${year} 年度总结报告（500-800字）：

${year}年度关键数据：
- 集团总资产：${formatMoney(report.totalAssets)}
- 集团总营收：${formatMoney(report.totalRevenue)}
- 集团总利润：${formatMoney(report.totalProfit)}
- 现金流：${formatMoney(report.cashFlow)}
- 综合能力评分：${report.avgAbility}
- 年度决策次数：${report.decisionsCount}
- 年度新解锁里程碑：${report.milestonesCount}个

当前能力值：
- 商业能力：${abilities.business}
- 决策能力：${abilities.decision}
- 资本影响力：${abilities.influence}
- 市场声誉：${abilities.reputation}
- 家族信任：${abilities.familyTrust}
- 员工信任：${abilities.employeeTrust}
- 风险判断：${abilities.riskJudgment}

预测结局：${report.predictedEnding.title}

请包含：
1. 年度回顾（经营成果、重要决策）
2. 成长与收获（能力提升、里程碑解锁）
3. 不足与反思
4. 下一年度展望与建议
5. 给松庭的寄语`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.8, maxTokens: 1500 });
  }

  // ═══════════════════════════════════════════════
  // 事件描述润色
  // ═══════════════════════════════════════════════

  async function polishEventDescription(event, state) {
    const systemPrompt = `你是松氏家族办公室的文案专员，负责将商业事件描述润色得更有沉浸感。
风格：像港岛商业小说的叙事，有画面感、有张力，但不夸张。
只输出润色后的描述，不要输出其他内容。`;

    const userPrompt = `请将以下商业事件描述润色得更有沉浸感和故事性（100-200字）：

事件标题：${event.title}
事件类型：${event.category || '普通事件'}
原始描述：${event.description || ''}

当前游戏日期：${state.gameDate?.current || ''}
松氏集团总资产：${formatMoney(state.company?.totalAssets || 0)}

请以第三人称视角，像商业小说一样描述这个事件，让松庭（松家长女）有身临其境的感觉。`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.9, maxTokens: 500 });
  }

  // ═══════════════════════════════════════════════
  // 市场舆论生成
  // ═══════════════════════════════════════════════

  async function generateMarketSentiment(state) {
    const reputation = state.heir?.abilities?.reputation || 50;
    const influence = state.heir?.abilities?.influence || 50;
    const company = state.company || {};

    const systemPrompt = `你是香港财经媒体的评论员，撰写关于松氏集团和松家长女松庭的市场舆论评论。
风格：像财经专栏，有观点、有八卦、有深度。
只输出评论内容。`;

    const userPrompt = `请撰写一段 150-250 字的市场舆论评论，关于松氏集团和松家长女松庭：

松氏集团总资产：${formatMoney(company.totalAssets || 0)}
松庭市场声誉：${reputation}/100
松庭资本影响力：${influence}/100

请根据声誉和影响力数值，撰写相应的市场舆论：
- 声誉高：正面评价，市场看好
- 声誉低：负面传闻，市场质疑
- 影响力高：市场关注，一举一动都有影响
- 影响力低：市场忽视，没有存在感

风格像香港财经报纸的专栏评论。`;

    return callAI(systemPrompt, userPrompt, { temperature: 0.85, maxTokens: 600 });
  }

  // ═══════════════════════════════════════════════
  // 工具函数
  // ═══════════════════════════════════════════════

  function formatMoney(amount) {
    if (Math.abs(amount) >= 100000000) return (amount / 100000000).toFixed(2) + ' 亿';
    if (Math.abs(amount) >= 10000) return (amount / 10000).toFixed(2) + ' 万';
    return amount.toLocaleString();
  }

  // ═══════════════════════════════════════════════
  // 公开 API
  // ═══════════════════════════════════════════════

  return {
    getConfig,
    saveConfig,
    isEnabled,
    callAI,
    generateFinancialNews,
    generateInvestmentAdvice,
    generateExecutiveReport,
    generateAnnualReport,
    polishEventDescription,
    generateMarketSentiment,
    DEFAULT_BASE_URL,
    DEFAULT_MODEL
  };
})();

  window.SongAI = SongAI;

          <div class="index-label">松氏综合指数</div>
        </div>
        <div class="market-news-preview">
          ${state.stockMarket.news && state.stockMarket.news.length > 0 ? `
            <div class="news-item">
              <span class="news-dot"></span>
              <span class="news-text">${state.stockMarket.news[0].title || '暂无市场新闻'}</span>
            </div>
          ` : `
            <div class="news-item">
              <span class="news-dot"></span>
              <span class="news-text">市场平稳运行，暂无重大消息</span>
            </div>
          `}
        </div>
      </div>

      <!-- 继承人状态 -->
      <div class="card" onclick="SongApp.navigateTo('heir')">
        <div class="card-header">
          <span class="card-title">继承人状态</span>
          <span class="tag tag-gold">松庭</span>
        </div>
        <div class="heir-abilities-mini">
          <div class="ability-mini">

            <div class="ability-bar"><div class="ability-fill" style="width: ${state.heir.abilities.business}%"></div></div>
            <span class="ability-value">${state.heir.abilities.business}</span>
          </div>
          <div class="ability-mini">
            <span class="ability-label">家族信任</span>
            <div class="ability-bar"><div class="ability-fill" style="width: ${state.heir.abilities.familyTrust}%"></div></div>
            <span class="ability-value">${state.heir.abilities.familyTrust}</span>
          </div>
          <div class="ability-mini">
            <span class="ability-label">市场声誉</span>
            <div class="ability-bar"><div class="ability-fill" style="width: ${state.heir.abilities.reputation}%"></div></div>
            <span class="ability-value">${state.heir.abilities.reputation}</span>
          </div>
        </div>
      </div>
    `;
  }

  /**
   * 格式化金额
   */
  function formatMoney(amount) {
    if (amount >= 100000000) {
      return (amount / 100000000).toFixed(2) + ' 亿';
    } else if (amount >= 10000) {
      return (amount / 10000).toFixed(2) + ' 万';
    }
    return amount.toLocaleString();
  }

  // 公开 API
  return {
    render
  };
})();

/**
 * 松氏家族办公室 - 待办事务页面
 * 支持完整的事务处理流程：事务列表、详情、多方案选择、决策执行
 */

const PageTasks = (function () {
  'use strict';

  // 当前查看的事务详情
  let currentDetailEvent = null;
  // 当前筛选的优先级（all / high / medium / low）
  let currentFilter = 'all';

  /**
   * 渲染待办事务页面

  function render(container) {

    const pending = state.events?.pending || [];

          <div class="stat-item">
            <div class="stat-value" style="color: var(--color-warning);">${pending.filter(e => e.priority === 'medium').length}</div>

          </div>
        </div>
      </div>

      <!-- 筛选和操作栏 -->
      <div class="section">
        <div class="section-header" style="flex-wrap: wrap; gap: 8px;">
          <span class="section-title">待处理 (${filteredPending.length}/${pending.length})</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button class="btn ${currentFilter === 'all' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('all')">全部</button>
            <button class="btn ${currentFilter === 'high' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('high')">紧急</button>
            <button class="btn ${currentFilter === 'medium' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('medium')">重要</button>
            <button class="btn ${currentFilter === 'low' ? 'btn-primary' : 'btn-secondary'} btn-small" onclick="PageTasks.setFilter('low')">常规</button>
            ${pending.length > 0 ? `<button class="btn btn-danger btn-small" onclick="PageTasks.clearExpired()">清理过期(7天+)</button>` : ''}
          </div>
        </div>

        ${filteredPending.length > 0 ? `
          <div class="task-list">
            ${filteredPending.map((event, index) => renderTaskCard(event, pending.indexOf(event))).join('')}
          </div>
        ` : `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-text">
              <p>${pending.length === 0 ? '暂无待处理事务' : '当前筛选条件下暂无事务'}</p>
              <p style="font-size: 11px; margin-top: 8px; opacity: 0.7;">事务会随现实时间流逝自动生成</p>
            </div>
          </div>
        `}
      </div>

      <!-- 已处理历史 -->
      ${history.length > 0 ? `
        <div class="section">
          <div class="section-header">
            <span class="section-title">已处理 (${history.length})</span>
          </div>
          <div class="task-list history-list">
            ${history.slice(0, 10).map(event => renderHistoryCard(event)).join('')}
          </div>
        </div>
      ` : ''}
    `;
  }

  /**
   * 渲染事务卡片
   */
  function renderTaskCard(event, index) {
    const priorityConfig = {
      high: { label: '紧急', class: 'danger' },
      medium: { label: '重要', class: 'warning' },
      low: { label: '常规', class: 'info' }
    };
    const priority = priorityConfig[event.priority] || priorityConfig.low;

    const categoryLabels = {
      finance: '财务',
      hr: '人事',
      operation: '经营',
      risk: '风险',
      major: '重大'
    };

    return `
      <div class="task-card" data-index="${index}">
        <div class="task-header">
          <div class="task-tags">
            <span class="tag tag-${priority.class}">${priority.label}</span>
            <span class="tag tag-gold">${categoryLabels[event.category] || event.category}</span>
          </div>
          <span class="task-date">${event.date || ''}</span>
        </div>
        <h3 class="task-title">${event.title}</h3>
        <p class="task-summary">${event.description?.slice(0, 80)}${event.description?.length > 80 ? '...' : ''}</p>
        <div class="task-meta">
          <span class="task-department">${event.department || '综合事务'}</span>
          <span class="task-options-count">${event.options?.length || 0} 个方案</span>
        </div>
        <button class="btn btn-primary task-action" onclick="PageTasks.showDetail('${event.id}')">
          查看详情并处理
        </button>
      </div>
    `;
  }

  /**
   * 渲染历史卡片
   */
  function renderHistoryCard(event) {
    const selectedOption = event.options?.[event.selectedOption];
    return `
      <div class="task-card history-card">
        <div class="task-header">
          <span class="tag tag-success">已处理</span>
          <span class="task-date">${event.processedDate || ''}</span>
        </div>
        <h3 class="task-title">${event.title}</h3>
        <p class="task-summary">处理方案：${selectedOption?.label || '未知'}</p>
      </div>
    `;
  }

  /**
   * 渲染事务详情页
   */
  function renderEventDetail(container, event) {
    const priorityConfig = {
      high: { label: '紧急', class: 'danger' },
      medium: { label: '重要', class: 'warning' },
      low: { label: '常规', class: 'info' }
    };
    const priority = priorityConfig[event.priority] || priorityConfig.low;

    const categoryLabels = {
      finance: '财务',
      hr: '人事',
      operation: '经营',
      risk: '风险',
      major: '重大'
    };

    container.innerHTML = `
      <div class="page-header">
        <button class="btn btn-secondary btn-small back-btn" onclick="PageTasks.backToList()">
          ← 返回列表
        </button>
        <h1 class="page-title" style="margin-top: var(--spacing-md);">事务详情</h1>
      </div>

      <!-- 事务信息卡片 -->
      <div class="card detail-card">
        <div class="detail-header">
          <div class="detail-tags">
            <span class="tag tag-${priority.class}">${priority.label}</span>
            <span class="tag tag-gold">${categoryLabels[event.category] || event.category}</span>
            <span class="tag tag-info">${event.department || '综合事务'}</span>
          </div>
          <span class="detail-date">${event.date || ''}</span>
        </div>

        <h2 class="detail-title">${event.title}</h2>
        <p class="detail-description">${event.description}</p>

        <div class="detail-meta">
          <div class="meta-row">
            <span class="meta-label">事务类型</span>
            <span class="meta-value">${event.type}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">提交时间</span>
            <span class="meta-value">${event.createdAt ? new Date(event.createdAt).toLocaleString('zh-CN') : '-'}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">可选方案</span>
            <span class="meta-value">${event.options?.length || 0} 个</span>
          </div>
        </div>
      </div>

      <!-- 处理方案 -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">请选择处理方案</span>
        </div>

        <div class="options-list">
          ${event.options?.map((option, index) => `
            <div class="option-card" data-index="${index}" onclick="PageTasks.selectOption(${index})">
              <div class="option-header">
                <span class="option-number">${index + 1}</span>
                <span class="option-label">${option.label}</span>
              </div>
              <p class="option-description">${option.description}</p>
              ${option.effects ? renderEffectsPreview(option.effects) : ''}
            </div>
          `).join('')}
        </div>
      </div>

      <!-- 确认按钮 -->
      <div class="action-bar">
        <button class="btn btn-secondary" onclick="PageTasks.backToList()">取消</button>
        <button class="btn btn-primary" id="confirm-decision-btn" disabled onclick="PageTasks.confirmDecision()">
          确认决策
        </button>
      </div>
    `;

    // 重置选中状态
    currentDetailEvent.selectedIndex = null;
  }

  /**
   * 渲染影响预览
   */
  function renderEffectsPreview(effects) {
    const effectLabels = {
      cashFlow: '现金流',
      employeeTrust: '员工信任',
      reputation: '市场声誉',
      familyTrust: '家族信任',
      business: '商业能力',
      decision: '决策能力',
      influence: '资本影响力',
      riskJudgment: '风险判断',
      potential: '发展潜力',
      risk: '风险等级'
    };

    const effectsHtml = Object.entries(effects)
      .filter(([key]) => effectLabels[key])
      .map(([key, value]) => {
        const isPositive = typeof value === 'number' && value > 0;
        const isNegative = typeof value === 'number' && value < 0;
        const colorClass = isPositive ? 'positive' : isNegative ? 'negative' : '';
        const sign = isPositive ? '+' : '';
        return `<span class="effect-tag ${colorClass}">${effectLabels[key]} ${sign}${value}</span>`;
      })
      .join('');

    return effectsHtml ? `<div class="effects-preview">${effectsHtml}</div>` : '';
  }

  /**
   * 显示事务详情
   */
  function showDetail(eventId) {
    const state = SongState.getState();
    const event = state.events?.pending?.find(e => e.id === eventId);
    if (event) {
      currentDetailEvent = { ...event };
      render(document.getElementById('app-content'));
    }
  }

  /**
   * 返回列表
   */
  function backToList() {
    currentDetailEvent = null;
    render(document.getElementById('app-content'));
  }

  /**
   * 选择方案
   */
  function selectOption(index) {
    if (!currentDetailEvent) return;

    currentDetailEvent.selectedIndex = index;

    // 更新 UI
    document.querySelectorAll('.option-card').forEach((card, i) => {
      if (i === index) {
        card.classList.add('selected');
      } else {
        card.classList.remove('selected');
      }
    });

    // 启用确认按钮
    const confirmBtn = document.getElementById('confirm-decision-btn');
    if (confirmBtn) confirmBtn.disabled = false;
  }

  /**
   * 确认决策
   */
  async function confirmDecision() {
    if (!currentDetailEvent || currentDetailEvent.selectedIndex === null) return;

    const state = SongState.getState();
    const result = SongEvents.processEvent(
      currentDetailEvent.id,
      currentDetailEvent.selectedIndex,
      state
    );

    if (result.success) {
      // 更新状态
      const updates = {
        'events.pending': result.newPending,
        'events.history': result.newHistory,
        ...result.stateChanges
      };

      await SongState.batchUpdate(updates);

      // 显示结果提示
      const option = result.option;
      SongApp.showToast(`决策已执行：${option.label}`);

      // 返回列表
      currentDetailEvent = null;
      setTimeout(() => {
        render(document.getElementById('app-content'));
      }, 500);
    } else {
      SongApp.showToast(`处理失败：${result.error}`);
    }
  }

  /**
   * 生成更多事务（测试用）
   */
  async function generateMore() {
    const state = SongState.getState();
    const newEvents = SongEvents.generateDailyEvents(state, 2);
    const currentPending = state.events?.pending || [];
    const updatedPending = [...newEvents, ...currentPending];

    await SongState.update('events.pending', updatedPending);
    SongApp.showToast('已生成 2 条新事务');
    render(document.getElementById('app-content'));
  }

  /**
   * 设置筛选优先级
   */
  function setFilter(filter) {
    currentFilter = filter;
    render(document.getElementById('app-content'));
  }

  /**
   * 清理超过7天未处理的过期事务
   */
  async function clearExpired() {
    const state = SongState.getState();
    const pending = state.events?.pending || [];
    const now = new Date();
    const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    // 分离过期和未过期的事务
    const expired = [];
    const active = [];
    pending.forEach(event => {
      const createdAt = event.createdAt ? new Date(event.createdAt) : null;
      if (createdAt && createdAt < sevenDaysAgo) {
        expired.push(event);
      } else {
        active.push(event);
      }
    });

    if (expired.length === 0) {
      SongApp.showToast('没有超过7天的过期事务');
      return;
    }

    if (!confirm(`确定要清理 ${expired.length} 条超过7天未处理的事务吗？此操作不可撤销！`)) {
      return;
    }

    // 将过期事务标记为已过期并移到历史
    const expiredHistory = expired.map(event => ({
      ...event,
      status: 'expired',
      processedDate: now.toISOString(),
      selectedOption: -1,
      effects: { note: '超时未处理，自动清理' }
    }));

    const history = state.events?.history || [];
    const updatedHistory = [...expiredHistory, ...history];

    await SongState.batchUpdate({
      'events.pending': active,
      'events.history': updatedHistory
    });

    SongApp.showToast(`✅ 已清理 ${expired.length} 条过期事务`);
    render(document.getElementById('app-content'));
  }

  // 公开 API
  return {
    render,
    showDetail,
    backToList,
    selectOption,
    confirmDecision,
    generateMore,
    setFilter,
    clearExpired
  };
})();

if (typeof window !== 'undefined') {
  window.PageTasks = PageTasks;
}

/**
 * 松氏家族办公室 - 公司管理页面
 * 查看所有业务板块和子公司的经营数据，支持详情查看和历史趋势
 */

const PageCompany = (function () {
  'use strict';

  // 当前查看的子公司详情
  let currentDetailId = null;

  /**
   * 渲染公司管理页面
   */
  function render(container) {
    const state = SongState.getState();

    // 如果没有子公司数据，初始化
    if (subsidiaries.length === 0) {
      subsidiaries = SongFinance.initSubsidiaries();
      SongState.update('subsidiaries', subsidiaries);

    // 如果正在查看子公司详情，渲染详情页

    const avgSatisfaction = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.satisfaction || 0), 0) / subsidiaries.length)
      : 0;
    const avgReputation = subsidiaries.length > 0
      ? Math.round(subsidiaries.reduce((sum, s) => sum + (s.reputation || 0), 0) / subsidiaries.length)
      : 0;

    // 风险预警统计

    const lowSatisfactionCount = subsidiaries.filter(s => (s.satisfaction || 0) < 60).length;

          </div>

      <!-- 风险预警 -->
