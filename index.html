/**
 * 松氏家族办公室 - 主应用入口
 * 负责初始化、路由、页面切换、事件绑定
 */

const SongApp = (function () {
  'use strict';

  // 当前页面
  let currentPage = 'dashboard';
  let initialized = false;

  // 导航历史栈（用于详情页返回，保存页面状态：页面、Tab、滚动位置）
  const navigationStack = [];

  // 保存当前页面状态
  function saveCurrentPageState() {
    const content = document.getElementById('app-content');
    const state = {
      page: currentPage,
      scrollTop: content ? content.scrollTop : 0
    };
    // 如果是资产页，保存当前激活的Tab
    if (currentPage === 'assets' && typeof PageAssets !== 'undefined' && typeof PageAssets.getCurrentTab === 'function') {
      state.tab = PageAssets.getCurrentTab();
    }
    return state;
  }

  // 恢复页面状态
  function restorePageState(state) {
    if (!state) return;
    // 如果是资产页且有Tab状态，恢复Tab
    if (state.page === 'assets' && state.tab && typeof PageAssets !== 'undefined' && typeof PageAssets.switchTab === 'function') {
      PageAssets.switchTab(state.tab);
    }
    // 恢复滚动位置（延迟一帧，确保页面渲染完成）
    if (state.scrollTop) {
      requestAnimationFrame(() => {
        const content = document.getElementById('app-content');
        if (content) content.scrollTop = state.scrollTop;
      });
    }
  }

  // 页面映射（一级底部导航页面 + 内部页面）
  const pages = {
    // 一级底部导航页面
    dashboard: PageDashboard,
    tasks: PageTasks,
    assets: PageAssets,
    mine: PageHeir, // "我的"页面复用继承人档案
    // 内部页面（通过资产页Tab或其他入口进入）
    company: PageCompany,
    market: PageMarket,
    investment: PageInvestment,
    heir: PageHeir,
    settings: PageSettings
  };

  /**
   * 初始化应用
   */
  async function init() {
    if (initialized) return;

    console.log('[SongApp] 松氏家族办公室启动中...');

    // 显示加载状态（用固定颜色，不依赖CSS变量，确保任何环境下都可见）
    const appContent = document.getElementById('app-content');
    if (appContent) {
      appContent.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;">
          <div style="width:40px;height:40px;border:3px solid rgba(212,175,55,0.2);border-top-color:#d4af37;border-radius:50%;animation:spin 1s linear infinite;"></div>
          <div style="color:#a0a0a0;font-size:14px;">正在启动松氏家族办公室...</div>
          <div id="init-progress" style="color:#666;font-size:12px;">正在连接数据存储...</div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      `;
    }

    // 总超时保护：8秒后强制启动，避免任何步骤卡住导致无限加载
    const totalTimeout = setTimeout(() => {
      if (!initialized) {
        console.warn('[SongApp] 初始化超时，强制启动');
        updateInitProgress('初始化超时，使用本地模式启动...');
        initialized = true;
        try {
          renderCurrentPage();
          updateHeader();
          updateNavigation();
        } catch (e) {
          console.error('[SongApp] 强制启动渲染失败:', e);
        }
      }
    }, 8000);

    function updateInitProgress(text) {
      const el = document.getElementById('init-progress');
      if (el) el.textContent = text;
    }

    try {
      // 0. 先初始化 UI 反馈系统（确保后续错误都能被捕获和提示）
      if (typeof SongUIFeedback !== 'undefined') {
        SongUIFeedback.init();
      }

      // 0.5. 先绑定导航事件（确保即使后续初始化出错，导航也能工作）
      bindNavigation();

      // 1. 初始化存储层
      updateInitProgress('正在初始化数据存储...');
      await SongStorage.init();

      // 2. 初始化状态管理
      updateInitProgress('正在加载游戏状态...');
      await SongState.init();

      // 3. 初始化日期系统（会自动推进游戏日期）
      updateInitProgress('正在初始化日期系统...');
      await SongDate.init();

      // 3.5 初始化子公司数据（如果为空）
      updateInitProgress('正在加载公司数据...');
      await initSubsidiariesIfEmpty();

      // 3.6 初始化股票市场数据（如果为空）
      updateInitProgress('正在加载市场数据...');
      await initStockMarketIfEmpty();

      // 3.7 初始化基金数据（如果为空）
      updateInitProgress('正在加载基金数据...');
      await initFundsIfEmpty();

      // 3.72 初始化宏观经济数据
      updateInitProgress('正在加载宏观经济数据...');
      SongMacroEconomy.init();

      // 3.73 初始化投资策略模块
      updateInitProgress('正在加载投资策略...');
      SongInvestmentStrategy.init();

      // 3.75 迁移旧格式的历史数据（日期是真实日期的旧存档）
      updateInitProgress('正在检查数据格式...');
      await migrateOldHistoryData();

      // 3.8 如果是新的一天，执行每日结算
      updateInitProgress('正在执行每日结算...');
      await checkAndRunDailySettlement();

      // 3.9 基于现实时间检查并生成待办事项
      updateInitProgress('正在生成待办事项...');
      await checkAndGenerateRealtimeEvents();

      // 4. 绑定状态变更监听（刷新当前页面）
      SongState.subscribe(() => {
        // 状态变更时刷新当前页面（防抖）
        if (window._songRefreshTimer) clearTimeout(window._songRefreshTimer);
        window._songRefreshTimer = setTimeout(() => {
          renderCurrentPage();
          updateHeader();
        }, 100);
      });

      // 6. 监听日期变更事件
      window.addEventListener('song-date-changed', async (e) => {
        console.log('[SongApp] 日期变更:', e.detail);
        // 执行每日结算：更新子公司数据、生成新事件
        await runDailySettlement();
        showToast(`游戏日期已推进至 ${SongDate.formatDateChinese(e.detail.newDate, false)}，已生成今日事务`);
      });

      // 7. 渲染初始页面
      renderCurrentPage();
      updateHeader();
      updateNavigation();

      initialized = true;
      clearTimeout(totalTimeout);
      console.log('[SongApp] 家族办公室启动完成');

      // 欢迎提示
      setTimeout(() => {
        showToast('欢迎回到家族办公室，松庭');
      }, 500);

    } catch (e) {
      console.error('[SongApp] 初始化失败，尝试降级启动:', e);
      clearTimeout(totalTimeout);
      // 降级启动：即使初始化失败，也尝试渲染页面，避免空白
      try {
        initialized = true;
        renderCurrentPage();
        updateHeader();
        updateNavigation();
        showToast('部分功能初始化失败，已使用本地模式启动');
      } catch (e2) {
        console.error('[SongApp] 降级启动也失败:', e2);
        if (appContent) {
          appContent.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;padding:20px;text-align:center;">
              <div style="font-size:48px;">⚠️</div>
              <div style="color:#e74c3c;font-size:16px;font-weight:600;">应用启动失败</div>
              <div style="color:#a0a0a0;font-size:13px;">请尝试完全关闭应用后重新打开<br>如果问题持续，请清除应用缓存</div>
              <div style="color:#666;font-size:11px;margin-top:8px;word-break:break-all;">${e.message || String(e)}</div>
            </div>
          `;
        }
      }
    }
  }

  /**
   * 绑定底部导航事件
   */
  function bindNavigation() {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const page = item.dataset.page;
        if (page && pages[page]) {
          navigateTo(page);
        }
      });
    });

    // 设置按钮
    const settingsBtn = document.getElementById('settings-btn');
    if (settingsBtn) {
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        console.log('[SongApp] 设置按钮被点击');
        // 点击反馈
        settingsBtn.style.transform = 'scale(0.9)';
        setTimeout(() => { settingsBtn.style.transform = ''; }, 150);
        navigateTo('settings');
      });
      console.log('[SongApp] 设置按钮事件绑定成功');
    } else {
      console.warn('[SongApp] 未找到设置按钮');
    }
  }

  /**
   * 导航到指定页面
   */
  function navigateTo(page) {
    if (!pages[page]) {
      console.error('[SongApp] 未知页面:', page);
      return;
    }

    // 如果是一级底部导航页面，清空导航历史栈
    const primaryPages = ['dashboard', 'tasks', 'assets', 'mine'];
    if (primaryPages.includes(page)) {
      navigationStack.length = 0;
    }

    currentPage = page;
    renderCurrentPage();
    updateNavigation();

    // 滚动到顶部
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;
  }

  /**
   * 返回上一个页面（导航历史栈）
   */
  function goBack() {
    if (navigationStack.length > 0) {
      const prevState = navigationStack.pop();
      console.log('[SongApp] 返回上一页:', prevState);
      
      // 如果prevState是字符串（旧格式），转换成对象
      const state = typeof prevState === 'string' ? { page: prevState } : prevState;
      
      currentPage = state.page;
      renderCurrentPage();
      updateNavigation();
      
      // 恢复页面状态（Tab、滚动位置）
      restorePageState(state);
      
      return true;
    }
    console.log('[SongApp] 导航历史栈为空，无法返回');
    return false;
  }

  /**
   * 获取导航历史栈长度
   */
  function getNavigationStackLength() {
    return navigationStack.length;
  }

  /**
   * 统一打开详情页方法（股票、基金、事务、子公司等详情页都走这个入口）
   * @param {string} targetPage - 目标页面（market/investment/tasks/company）
   * @param {string} detailId - 详情ID
   * @param {string} detailType - 详情类型（stock/fund/task/subsidiary）
   */
  function openDetail(targetPage, detailId, detailType) {
    console.log('[SongApp] 打开详情页:', targetPage, detailId, detailType);

    // 如果当前已经在详情页状态（历史栈不为空），则不压栈，直接替换当前详情页
    // 这样从待办详情进入子公司详情，返回时直接回到待办列表，而不是待办详情
    const isAlreadyInDetail = navigationStack.length > 0;

    if (!isAlreadyInDetail) {
      // 保存当前页面完整状态（页面、Tab、滚动位置）
      const currentState = saveCurrentPageState();
      navigationStack.push(currentState);
      console.log('[SongApp] 导航历史栈:', navigationStack);
    } else {
      console.log('[SongApp] 已在详情页状态，直接替换，不压栈');
    }

    // 切换到目标页面并先渲染（确保页面存在）
    currentPage = targetPage;
    renderCurrentPage();
    updateNavigation();

    // 根据详情类型调用对应的showDetail方法
    const showDetailMethods = {
      stock: () => PageMarket && PageMarket.showStockDetail && PageMarket.showStockDetail(detailId),
      fund: () => PageInvestment && PageInvestment.showFundDetail && PageInvestment.showFundDetail(detailId),
      task: () => PageTasks && PageTasks.showDetail && PageTasks.showDetail(detailId),
      subsidiary: () => PageCompany && PageCompany.showDetail && PageCompany.showDetail(detailId)
    };

    const showDetail = showDetailMethods[detailType];
    if (showDetail) {
      // 延迟一帧执行，确保页面切换完成
      requestAnimationFrame(() => {
        showDetail();
      });
      // 兜底：如果 requestAnimationFrame 没执行，50ms后再执行一次
      setTimeout(() => {
        showDetail();
      }, 50);
    }

    // 滚动到顶部
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;
  }

  /**
   * 直接打开子公司详情页（从首页风险预警/子公司概览点击跳转）
   * 改进：先切换到资产页，再切换到公司经营tab，最后打开子公司详情
   * 这样子公司详情页在资产页结构中展示，有返回按钮可返回到公司经营列表
   * @param {string} subsidiaryId - 子公司 ID
   */
  function openSubsidiaryDetail(subsidiaryId) {
    console.log('[SongApp] openSubsidiaryDetail:', subsidiaryId);
    
    // 1. 保存当前页面状态到导航历史栈（如果还没在详情页状态）
    const isAlreadyInDetail = navigationStack.length > 0;
    if (!isAlreadyInDetail) {
      const currentState = saveCurrentPageState();
      navigationStack.push(currentState);
      console.log('[SongApp] 导航历史栈:', navigationStack);
    }
    
    // 2. 切换到底部导航的"资产"tab
    currentPage = 'assets';
    renderCurrentPage();
    updateNavigation();
    
    // 3. 延迟一帧，等资产页渲染完成后，切换到"公司经营"二级tab
    requestAnimationFrame(() => {
      if (typeof PageAssets !== 'undefined' && typeof PageAssets.switchTab === 'function') {
        PageAssets.switchTab('company');
        console.log('[SongApp] 已切换到资产页-公司经营tab');
      }
      
      // 4. 再延迟一帧，等公司经营tab渲染完成后，打开子公司详情
      requestAnimationFrame(() => {
        if (typeof PageCompany !== 'undefined' && typeof PageCompany.showDetail === 'function') {
          PageCompany.showDetail(subsidiaryId);
          console.log('[SongApp] 已打开子公司详情:', subsidiaryId);
        }
      });
    });
    
    // 兜底：50ms后再执行一次（防止 requestAnimationFrame 没执行）
    setTimeout(() => {
      if (typeof PageCompany !== 'undefined' && typeof PageCompany.showDetail === 'function') {
        // 检查是否已经打开了详情（避免重复打开）
        const detailEl = document.querySelector('.company-detail-page, .subsidiary-detail');
        if (!detailEl) {
          PageCompany.showDetail(subsidiaryId);
        }
      }
    }, 100);
    
    // 滚动到顶部
    const content = document.getElementById('app-content');
    if (content) content.scrollTop = 0;
  }

  /**
   * 渲染当前页面
   */
  function renderCurrentPage() {
    const container = document.getElementById('app-content');
    if (!container) return;

    const page = pages[currentPage];
    if (page && typeof page.render === 'function') {
      try {
        page.render(container);
      } catch (e) {
        console.error('[SongApp] 页面渲染失败:', currentPage, e);
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-text">
              <p>页面渲染出错</p>
              <p style="font-size: 11px; margin-top: 8px; opacity: 0.7;">${e.message || '未知错误'}</p>
            </div>
          </div>
        `;
      }
    }
  }

  /**
   * 更新顶部状态栏
   */
  function updateHeader() {
    const dateEl = document.getElementById('game-date');
    if (dateEl) {
      const currentDate = SongDate.getCurrentDate();
      const weekday = SongDate.getCurrentWeekday();
      dateEl.textContent = currentDate ? `${SongDate.formatDateShort(currentDate)} ${weekday || ''}` : '--';
    }
  }

  /**
   * 更新导航栏激活状态
   */
  function updateNavigation() {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      if (item.dataset.page === currentPage) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  }

  /**
   * 显示提示消息
   */
  function showToast(message, duration = 2000) {
    // 优先使用宿主 API
    if (typeof window !== 'undefined' && window.AiPhone && window.AiPhone.ui && typeof window.AiPhone.ui.toast === 'function') {
      window.AiPhone.ui.toast(message);
      return;
    }

    // 降级：简单的 toast
    let toast = document.getElementById('song-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'song-toast';
      toast.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        max-width: 80%;
        text-align: center;
      `;
      document.body.appendChild(toast);
    }

    toast.textContent = message;
    toast.style.opacity = '1';

    if (toast._timer) clearTimeout(toast._timer);
    toast._timer = setTimeout(() => {
      toast.style.opacity = '0';
    }, duration);
  }

  /**
   * 如果子公司数据为空，初始化
   */
  async function initSubsidiariesIfEmpty() {
    const state = SongState.getState();
    if (!state.subsidiaries || state.subsidiaries.length === 0) {
      console.log('[SongApp] 初始化子公司数据');
      const startDate = state.gameDate?.current || new Date().toISOString().split('T')[0];
      const subsidiaries = SongFinance.initSubsidiaries(startDate, 30);
      await SongState.update('subsidiaries', subsidiaries);

      // 同时初始化公司财务数据
      const financials = SongFinance.calculateGroupFinancials(subsidiaries, {});
      await SongState.update('company', financials);
    }
  }

  /**
   * 检测并迁移旧格式的历史数据（日期是真实日期的旧存档）
   */
  async function migrateOldHistoryData() {
    const state = SongState.getState();
    const gameDate = state.gameDate?.current || new Date().toISOString().split('T')[0];
    let migrated = false;

    // 1. 检测子公司历史数据
    if (state.subsidiaries && state.subsidiaries.length > 0) {
      let needsMigration = false;
      for (const sub of state.subsidiaries) {
        // 旧格式特征：历史数据为空、只有1条、或第一条记录日期晚于游戏当前日期
        if (!sub.history || sub.history.length <= 1) {
          needsMigration = true;
          break;
        }
        const firstDate = sub.history[0]?.date;
        const lastDate = sub.history[sub.history.length - 1]?.date;
        // 检测：历史数据日期与游戏当前日期不匹配（日期同步后需要重新生成）
        if (firstDate && firstDate > gameDate) {
          needsMigration = true;
          break;
        }
        // 检测：最后一条历史数据不是当前游戏日期（日期变更后需要重新生成）
        if (lastDate && lastDate !== gameDate) {
          needsMigration = true;
          break;
        }
      }

      if (needsMigration) {
        console.log('[SongApp] 检测到旧格式子公司历史数据，正在迁移...');
        const migratedSubs = state.subsidiaries.map(sub => {
          try {
            const history = SongFinance.generateSubsidiaryHistory(sub, gameDate, 30);
            return { ...sub, history };
          } catch (e) {
            console.warn('[SongApp] 子公司历史数据迁移失败:', sub.name, e);
            return sub;
          }
        });
        await SongState.update('subsidiaries', migratedSubs);
        migrated = true;
        console.log('[SongApp] 子公司历史数据迁移完成');
      }
    }

    // 2. 检测股票历史数据
    if (state.stockMarket && state.stockMarket.stocks && state.stockMarket.stocks.length > 0) {
      let needsMigration = false;
      for (const stock of state.stockMarket.stocks) {
        if (!stock.priceHistory || stock.priceHistory.length <= 1) {
          needsMigration = true;
          break;
        }
        const firstDate = stock.priceHistory[0]?.date;
        const lastDate = stock.priceHistory[stock.priceHistory.length - 1]?.date;
        if (firstDate && firstDate > gameDate) {
          needsMigration = true;
          break;
        }
        // 检测：最后一条历史数据不是当前游戏日期
        if (lastDate && lastDate !== gameDate) {
          needsMigration = true;
          break;
        }
      }

      if (needsMigration) {
        console.log('[SongApp] 检测到旧格式股票历史数据，重新初始化...');
        const newStockMarket = SongStockMarket.initStockMarket(gameDate);
        // 保留用户的持仓数据
        newStockMarket.portfolio = state.stockMarket.portfolio || [];
        await SongState.update('stockMarket', newStockMarket);
        migrated = true;
        console.log('[SongApp] 股票历史数据迁移完成');
      }
    }

    // 3. 检测基金历史数据
    if (state.funds && state.funds.length > 0) {
      let needsMigration = false;
      for (const fund of state.funds) {
        if (!fund.navHistory || fund.navHistory.length <= 1) {
          needsMigration = true;
          break;
        }
        const firstDate = fund.navHistory[0]?.date;
        const lastDate = fund.navHistory[fund.navHistory.length - 1]?.date;
        if (firstDate && firstDate > gameDate) {
          needsMigration = true;
          break;
        }
        // 检测：最后一条历史数据不是当前游戏日期
        if (lastDate && lastDate !== gameDate) {
          needsMigration = true;
          break;
        }
      }

      if (needsMigration) {
        console.log('[SongApp] 检测到旧格式基金历史数据，重新初始化...');
        const newFunds = SongFund.initFunds(gameDate);
        // 保留用户的基金持仓数据
        await SongState.update('funds', newFunds);
        migrated = true;
        console.log('[SongApp] 基金历史数据迁移完成');
      }
    }

    if (migrated) {
      showToast('历史数据已自动迁移至游戏日期');
    }

    return migrated;
  }

  /**
   * 检查并执行每日结算（如果上次结算日期不是今天）
   */
  async function checkAndRunDailySettlement() {
    const state = SongState.getState();
    const currentDate = SongDate.getCurrentDate();
    const lastSettlementDate = state.lastSettlementDate;

    if (!lastSettlementDate || lastSettlementDate !== currentDate) {
      console.log('[SongApp] 执行每日结算，当前日期:', currentDate);
      await runDailySettlement();
    }
  }

  /**
   * 检查是否在静默时段内
   * @param {Date} date - 要检查的时间
   * @param {number} startHour - 静默开始小时
   * @param {number} endHour - 静默结束小时
   * @returns {boolean}
   */
  function isInQuietHours(date, startHour, endHour) {
    const hour = date.getHours();
    if (startHour === endHour) return false; // 开始和结束相同表示不静默
    if (startHour < endHour) {
      // 同一天内的静默时段，如 10:00-19:00
      return hour >= startHour && hour < endHour;
    } else {
      // 跨天的静默时段，如 19:00-次日10:00
      return hour >= startHour || hour < endHour;
    }
  }

  /**
   * 计算两个时间点之间的有效小时数（排除静默时段）
   * @param {Date} start - 开始时间
   * @param {Date} end - 结束时间
   * @param {number} quietStart - 静默开始小时
   * @param {number} quietEnd - 静默结束小时
   * @returns {number} 有效小时数
   */
  function calculateEffectiveHours(start, end, quietStart, quietEnd) {
    if (end <= start) return 0;
    let effectiveHours = 0;
    const current = new Date(start);
    // 按小时遍历计算
    while (current < end) {
      const nextHour = new Date(current);
      nextHour.setHours(current.getHours() + 1, 0, 0, 0);
      const segmentEnd = nextHour < end ? nextHour : end;
      const segmentDuration = (segmentEnd - current) / (1000 * 60 * 60);
      // 检查这个小时是否在静默时段
      if (!isInQuietHours(current, quietStart, quietEnd)) {
        effectiveHours += segmentDuration;
      }
      current.setTime(nextHour.getTime());
    }
    return effectiveHours;
  }

  /**
   * 基于现实时间检查并生成待办事项
   * 根据用户设置的频率和静默时段，随时间流逝生成新待办
   */
  async function checkAndGenerateRealtimeEvents() {
    const state = SongState.getState();
    const settings = state.settings || {};

    // 如果未启用现实时间生成，直接返回
    if (!settings.realtimeEventGeneration) {
      console.log('[SongApp] 现实时间生成待办已关闭');
      return;
    }

    const now = new Date();
    const lastGenAt = settings.lastEventGenerationAt ? new Date(settings.lastEventGenerationAt) : null;
    const eventsPerHour = settings.eventsPerHour || 1;
    const quietStart = settings.quietHoursStart ?? 19;
    const quietEnd = settings.quietHoursEnd ?? 10;

    // 如果是第一次生成，初始化时间戳，不生成事件
    if (!lastGenAt) {
      console.log('[SongApp] 首次启动，初始化待办生成时间戳');
      await SongState.update('settings.lastEventGenerationAt', now.toISOString());
      return;
    }

    // 计算有效小时数（排除静默时段）
    const effectiveHours = calculateEffectiveHours(lastGenAt, now, quietStart, quietEnd);

    // 计算应该生成的事件数量
    const shouldGenerate = Math.floor(effectiveHours * eventsPerHour);

    if (shouldGenerate <= 0) {
      console.log(`[SongApp] 待办生成检查：有效小时 ${effectiveHours.toFixed(2)}，无需生成新待办`);
      // 更新时间戳（即使没生成，也更新，避免静默时段结束后一次性生成太多）
      await SongState.update('settings.lastEventGenerationAt', now.toISOString());
      return;
    }

    console.log(`[SongApp] 待办生成：有效小时 ${effectiveHours.toFixed(2)}，生成 ${shouldGenerate} 条新待办`);

    // 生成新事件
    const newEvents = SongEvents.generateDailyEvents(state, shouldGenerate);

    // 合并到现有待办
    const existingPending = state.events?.pending || [];
    const updatedPending = [...newEvents, ...existingPending];

    // 更新状态
    await SongState.batchUpdate({
      'events.pending': updatedPending,
      'settings.lastEventGenerationAt': now.toISOString()
    });

    // 提示用户
    showToast(`📋 新增 ${shouldGenerate} 条待处理事务`);
  }

  /**
   * 执行每日结算
   * 1. 更新子公司经营数据
   * 2. 计算集团财务
   * 3. 更新股票市场
   * 4. 更新基金净值
   * 注意：事件生成已改为基于现实时间，由 checkAndGenerateRealtimeEvents 负责
   */
  async function runDailySettlement() {
    const state = SongState.getState();
    const currentDate = SongDate.getCurrentDate();

    // 0. 处理效果队列（决策的延迟效果、持续效果在此生效）
    let effectResult = { effects: state.events?.activeEffects || [], stateChanges: {}, appliedToday: [] };
    try {
      if (typeof SongEffects !== 'undefined') {
        effectResult = SongEffects.processDailyEffects(state);
        console.log(`[SongApp] 效果队列处理：今日生效 ${effectResult.appliedToday.length} 个效果`);
      }
    } catch (e) {
      console.warn('[SongApp] 效果队列处理失败:', e);
    }

    // 应用效果产生的即时状态变化（现金流、能力值等）
    if (effectResult.stateChanges) {
      for (const [key, value] of Object.entries(effectResult.stateChanges)) {
        if (key.startsWith('company.')) {
          const companyKey = key.replace('company.', '');
          state.company = state.company || {};
          state.company[companyKey] = value;
        } else if (key.startsWith('heir.abilities.')) {
          const abilityKey = key.replace('heir.abilities.', '');
          state.heir = state.heir || {};
          state.heir.abilities = state.heir.abilities || {};
          state.heir.abilities[abilityKey] = value;
        }
      }
    }

    // 1. 更新子公司数据 + 计算集团财务（子公司更新会读取效果队列）
    const settlementResult = SongFinance.dailySettlement(state);

    // 2. 更新股票市场
    const updatedStockMarket = SongStockMarket.dailyUpdate(state.stockMarket, {
      ...state,
      ...settlementResult
    });

    // 4. 更新基金净值（加保护，旧存档兼容）
    let updatedFunds = state.funds || [];
    try {
      if (updatedFunds.length > 0) {
        updatedFunds = SongFund.dailyUpdate(updatedFunds, {
          ...state,
          ...settlementResult
        });
      }
    } catch (e) {
      console.warn('[SongApp] 基金净值更新失败:', e);
    }

    // 4.5 更新宏观经济数据 + 随机货币政策事件
    try {
      SongMacroEconomy.dailyUpdate(currentDate);
      
      // 每月初有一定概率触发货币政策事件
      const dayOfMonth = parseInt(currentDate.split('-')[2]);
      if (dayOfMonth === 1 && Math.random() < 0.3) {
        const macroData = SongMacroEconomy.getMacroData();
        const { gdp, cpi, interestRate } = macroData;
        
        // 根据经济状况决定货币政策方向
        let action = null;
        if (gdp.trend === 'down' && cpi.current < 2.5) {
          // 经济下行+低通胀 → 降息或降准
          action = Math.random() < 0.6 ? 'rate_cut' : 'rrr_cut';
        } else if (gdp.current > 6.5 && cpi.trend === 'up') {
          // 经济过热+通胀上行 → 加息
          action = 'rate_hike';
        } else if (Math.random() < 0.3) {
          // 其他情况小概率降准
          action = 'rrr_cut';
        }
        
        if (action) {
          const policyResult = SongMacroEconomy.monetaryPolicyAction(action, currentDate);
          console.log('[SongApp] 货币政策事件触发:', policyResult.description);
          
          // 添加到待办事件或新闻
          if (window.SongStockMarket) {
            SongStockMarket.addNews({
              title: '央行货币政策',
              content: policyResult.description,
              type: action === 'rate_hike' ? 'negative' : 'positive',
              impact: Math.abs(policyResult.marketImpact)
            });
          }
        }
      }
    } catch (e) {
      console.warn('[SongApp] 宏观经济更新失败:', e);
    }

    // 4.6 执行定投计划 + 止损止盈检查
    try {
      SongInvestmentStrategy.dailySIPCheck(currentDate);
      SongInvestmentStrategy.dailyStopCheck(currentDate);
    } catch (e) {
      console.warn('[SongApp] 投资策略执行失败:', e);
    }

    // 5. 检查里程碑解锁（加保护）
    let milestoneResult = { newMilestones: [], abilityRewards: {}, allMilestones: state.heir?.milestones || [] };
    try {
      milestoneResult = SongGrowth.checkMilestones({
        ...state,
        ...settlementResult,
        funds: updatedFunds
      });
    } catch (e) {
      console.warn('[SongApp] 里程碑检查失败:', e);
    }

    // 应用里程碑能力奖励
    let updatedAbilities = { ...(state.heir?.abilities || {}) };
    if (milestoneResult.abilityRewards) {
      for (const [key, value] of Object.entries(milestoneResult.abilityRewards)) {
        updatedAbilities[key] = Math.min(100, (updatedAbilities[key] || 50) + value);
      }
    }

    // 6. 更新状态（包含效果队列）
    await SongState.batchUpdate({
      'subsidiaries': settlementResult.subsidiaries,
      'company': settlementResult.company,
      'stockMarket': updatedStockMarket,
      'funds': updatedFunds,
      'heir.milestones': milestoneResult.allMilestones,
      'heir.abilities': updatedAbilities,
      'events.activeEffects': effectResult.effects,
      'lastSettlementDate': currentDate
    });

    // 提示新解锁的里程碑
    if (milestoneResult.newMilestones.length > 0) {
      milestoneResult.newMilestones.forEach((m, i) => {
        setTimeout(() => {
          showToast(`解锁里程碑：${m.title}`);
        }, i * 1500);
      });
    }

    console.log(`[SongApp] 每日结算完成：子公司数据已更新，股票市场已更新，基金净值已更新，效果队列已处理（今日生效 ${effectResult.appliedToday.length} 个），里程碑检查完成（新解锁 ${milestoneResult.newMilestones.length} 个）`);
  }

  /**
   * 显示错误
   */
  function showError(message) {
    const container = document.getElementById('app-content');
    if (container) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">❌</div>
          <div class="empty-state-text">
            <p>${message}</p>
          </div>
        </div>
      `;
    }
  }

  /**
   * 获取当前页面
   */
  function getCurrentPage() {
    return currentPage;
  }

  /**
   * 是否初始化完成
   */
  function isInitialized() {
    return initialized;
  }

  // 公开 API
  return {
    init,
    navigateTo,
    goBack,
    getNavigationStackLength,
    openSubsidiaryDetail,
    openDetail,
    getCurrentPage,
    isInitialized,
    showToast,
    renderCurrentPage,
    checkAndGenerateRealtimeEvents,
    migrateOldHistoryData
  };
})();

// 挂载到全局
if (typeof window !== 'undefined') {
  window.SongApp = SongApp;
}

// DOM 加载完成后自动初始化
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => SongApp.init());
  } else {
    SongApp.init();
  }
}


</script>
